# Batch 17: islands v2 exploration under the uniqueness contract, never promoted
# (docs/design/art-production-plan.md; EXPLORATION in the queue; spec:
# docs/product/archipelago-system.md section 17).
#
# Two concept paintings for each of ten wonder islands (Çağlayan, Gezgin,
# Revontuli, Çanlar, Koke, Emanet, Fanus, Çömlek, Mehtap, Leylek) and four
# Ayçiçeği hub variants (rain, winter, festival, grown). Everything here is for
# deciding. UNIQUENESS CONTRACT: the home island is attached for STYLE ONLY (the
# soft painterly finish, gentle light, low camera), NEVER as the base to copy;
# every wonder prompt states its own silhouette/landform, palette, weather and
# landmark, and the wonder islands carry no lawn oval, soil bowl, dangling
# roots, pebbles or round door. The hub jobs are the opposite: edits of the
# home island that keep its exact shape.
#
# EXPLORATION RULES (AGENTS.md): do NOT run `promote`; commit the takes (WebP
# q90), the contact sheet and review.yaml under design/art/takes/<batch>/<id>/
# and nothing else. No painted text anywhere. Boards never paint glass UI,
# chrome or buttons. Review each wonder take with the rubric of
# archipelago-system.md 1A.3 and the 60 pt black-silhouette test.
#
# PILOT (run first, in this order): x2-mehtap-a, x2-comlek-a, x2-leylek-a,
# x2-hub-grown. If a pilot job still fails after its one retry, skip the REST
# of this batch (every job below the "THE REST" line) and finish the session.
#
# Tracks: `islands` (the 20 wonder concepts) and `hub` (the 4 hub variants).

batch: batch-17-islands-v2
