# Batch 50: the gate's postcards (production; real ids, promoted on pass).
#
# The gate's landing (App/Hop, #265) shows a full-bleed painted postcard for
# the hour with Pofu standing in front. The first postcards were exploration
# takes with painted hamsters in them, so Pofu appeared twice and floated.
# These are made for the job: a portrait view across the home island's lawn,
# NO characters, an empty patch of lawn in the lower middle where Pofu stands
# (the app grounds him on it), calm sky in the upper third for one line of
# words, and quiet ground in the bottom fifth for the choices.
#
# Review: no creature anywhere; the empty patch is clearly ground at about 68
# percent of the height; the six read as one place at six moments; the
# night one is luminous, not murky (the batch-45 night key).

batch: batch-50-gate-postcards
title: The gate's postcards (six portrait scenes, no characters)
status: open

defaults:
  variants: 2

jobs:
  - {id: island-main-l-v3, kind: world, name: island-main-l-v3, external: batch-05-fixes-pilot, master: design/art/masters/island-main-l-v3/island-main-l-v3.webp}
  - {id: tea-stall-5, kind: station, name: tea-stall-5, external: batch-01-slice}
  - {id: cloud-sea, kind: world, name: cloud-sea, external: batch-04-sky}

  - id: gate-postcard-dawn
    kind: plate
    name: gate-postcard-dawn
    light: {cell: dawn, layer: subject}
    size: 1024x1536
    canvas: 1024x1536
    deliver: {scale: 0.5}
    palettes: [world-foliage, world-props]
    chat: "Pofu · Gate postcards"
    notes: "The gate's dawn postcard. Review per the header: no characters, the empty ground patch at about 68 percent height, calm sky above."
    attach:
      - ref: approved:island-main-l-v3
        role: "The home island: its lawn, flowers, stones, round door and soft painting; this is a view standing on it."
      - ref: approved:tea-stall-5
        role: "A finished prop of the game: props in the scene are this scale and finish."
      - ref: approved:cloud-sea
        role: "The sea of clouds beyond the edge of the lawn."
    prompt:
      - text: |
          A portrait painting for a cozy mobile game: standing on a small
          floating island's lawn, looking across it toward its edge and the
          sea of clouds beyond, in a soft peach and lilac dawn, the first warm light on the far edge of the lawn, mist lying low on the sea of clouds. In the lower middle, at about two
          thirds of the height, an empty soft patch of lawn with a few
          stepping stones leading to it, clearly a place where a small
          character could stand, with nothing on it. Around it, at the sides,
          a few flowers, a round stone, a small pond edge at the right, a
          wooden fence post at the left. The upper third is open sky, calm,
          for words. The bottom fifth is quiet grass and stones in soft focus.
          No characters, no animals, no creatures anywhere.
      - block: prop-style-v2
      - text: "AVOID: any character, animal, hamster, bunny, bird, frog or creature, text, letters, a border, a phone frame, busy details in the centre"

