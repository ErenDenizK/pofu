        role: "The palette card for props: use only these colors (and mixes of them)."
    prompt:
      - text: |
          A concept painting for a cozy mobile game: one quiet corner of the home
          island Ayçiçeği, dressed with a decor set, from the same low camera (about
          20 degrees) as the attached island and in its painting, softly cropped to
          a corner of lawn, a few path stones and the edge of the island over the
          clouds. Autumn corner: three carved pumpkin lanterns in a row, a small
          round chestnut stove with a pipe and a paper cone of chestnuts, a plum
          scarf on its stand, a heap of red, mustard and rust leaves, a few leaves
          drifting down; golden low light. Warm daylight, calm, uncluttered, every
          piece small and in the scale of the attached bench; no characters.
      - block: prop-style-v2
      - text: "AVOID: a border, text, letters, harsh shadows, saturated colors, outlines, characters or animals, a different island shape, photorealism, a 3D render look"

