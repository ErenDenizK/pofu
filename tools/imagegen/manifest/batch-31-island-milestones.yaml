# Batch 31: exploration, never promoted (the backlog)
#
# Concept plates of Ayçiçeği's growth from docs/product/home-progression.md
# sections 3, 5 and 9: the island at island levels 1, 4, 7 and 10 (and the
# closed hill gate of level 9), the Tam Çiçek ceremony night, the Tepe (the
# hilltop area), and the Altın Ada. Concept frames, not production plates: the
# attached island sets the shape, camera and softness, and the plates grow
# only where the plan says. Production later edits the base plate per level
# (home progression, art step 4).
#
# Tracks: `island`.
#
# BACKLOG (docs/design/art-production-plan.md#the-backlog): every job here is
# an EXPLORATION with an `x-` id. EXPLORATION RULES (AGENTS.md): do NOT run
# `promote`; commit the takes (WebP q90), the contact sheet and review.yaml
# under design/art/takes/<batch>/<id>/ and nothing else. No painted text
# anywhere. Never paint glass, UI chrome or buttons. A failed or refused job
# is recorded and skipped; the run continues with the next job. There is no
# pilot gate: run the jobs in the order written.
#
# Fresh variations: when the backlog comes round again, copy a job under a
# new id (`-v2`, `-v3`, ...) with a new angle, never the same prompt twice.

batch: batch-31-island-milestones
title: "Island milestones: levels 1, 4, 7, 10, the ceremony night, the Tepe, the Altin Ada"
status: open

refs:
  tea-stall-1: design/art/stations/tea-stall-1/tea-stall-1.png

defaults:
  variants: 2

jobs:
  - {id: island-main-s, kind: world, name: island-main-s, external: batch-01-slice}
  - {id: cloud-sea, kind: world, name: cloud-sea, external: batch-04-sky}
  - {id: pofu, kind: char, name: pofu-r1, external: r1, master: design/art/masters/pofu-hamster-base-v1/pofu-hamster-base.png}

  - id: x-island-il1
    kind: plate
    name: x-island-il1
    size: 1536x1024
    canvas: 1536x1024
    chat: "Pofu · Exploration"
    light: {cell: day, layer: subject}
    notes: "Exploration. Island level 1. Review: tiny, round, hopeful; one bed of sunflowers is the whole story. This is the baseline all later plates grow from."
    attach:
      - ref: approved:island-main-s
        role: "The home island: the same painting, the same low camera (about 20 degrees), the same softness and scale of a floating island. Do not draw a different island."
      - ref: approved:cloud-sea
        role: "The sea of clouds below every island: paint the clouds like this."
      - ref: R1
        role: "Pofu, the hamster: match his art style, lighting, level of fluff and eye language exactly (do not draw him unless asked)."
      - ref: palette:world-props
        role: "The palette card for props: use only these colors (and mixes of them)."
    prompt:
      - text: |
          A concept painting for a cozy mobile game: Ayçiçeği, Pofu's home island,
          at a stage of its growth, from the same low camera (about 20 degrees), the
          same painting and the same softness as the attached island, floating over
          a sea of clouds. The island's base shape grows only where named; what is
          already built stays in the same place. ISLAND LEVEL 1: a small round
          island with a single bed of three young sunflowers, Pofu's round door set
          into a tiny grass mound, a little twig nest beside it, a few bees, wind in
          the grass, a thin stone-less lawn and bare rock edges. No other buildings.
          Warm morning light, sparse and gentle.
      - block: prop-style-v2
      - text: "AVOID: a border, text, letters, numbers, harsh shadows, saturated or neon colors, dark moods, outlines, photorealism, a 3D render look, a different overall island character, a curl on any head except Pofu's"

