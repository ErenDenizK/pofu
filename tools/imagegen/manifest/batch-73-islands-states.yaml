# Batch 73: the four islands' state edits (exploration; x- ids, never promoted).
#
# Plate-first (ADR-0022): one painted picture per island state; the state
# table docs/state/plates.yaml lists the null cells this batch fills. Every
# job is an edit of that island's PICKED stage plate (batches 67 to 70, the
# lead's pick in each review.yaml), through an `external` job whose `master`
# is the picked take file. Per island:
#   - stage 4 at a second hour of the day, and stage 4 in soft rain;
#   - stages 0 to 3 at a second hour of the day (the stage's wound stays).
# The second hour is NIGHT for Çağlayan (a day island) and Emanet (a golden
# island). Revontuli and Mehtap are already night islands (Mehtap: dusk to
# full moon), so for them the alternate is a CALM DAYTIME version instead of
# night: stages 0 to 3 in daylight, and stage 4 at golden hour. Emanet's stage 4
# is already golden, so its stage 4 alternate is a clear DAY plate (the table
# cell `day`). Çağlayan and the other two get golden at stage 4 as the brief
# says: Çağlayan golden; Revontuli golden (a low polar sun); Mehtap golden.
#
# EXPLORATION RULES (AGENTS.md): do NOT run `promote`; commit the takes (WebP
# q90), the contact sheet and review.yaml under design/art/takes/<batch>/<id>/.
# A failed or refused job is recorded and skipped; the run continues. No
# characters, no painted text. Jobs are independent; ORDER: per island
# Çağlayan, Revontuli, Emanet, Mehtap; within an island the stage 4 jobs
# first, then stages 3, 2, 1, 0. Up to three tracks.
#
# Review for every take: the same picture as the parent stage plate (nothing
# moved, healed or added); the island keeps its rich colour, no whole-frame
# grey veil; lanterns and windows glow where the light says so.

batch: batch-73-islands-states
title: 'Islands states: stage 4 golden/alt and rain, stages 0 to 3 at night or calm day (edits of the picked plates)'
status: open
refs:
  home-night: design/art/takes/batch-66-home-flow/x-home-flow-night/plate__x-home-flow-night--t1.webp
  home-golden: design/art/takes/batch-66-home-flow/x-home-flow-golden/plate__x-home-flow-golden--t1.webp
defaults:
  variants: 2
jobs:
