    attach:
      - ref: home-night
        role: "The night target: this calm moonlit night, its blue sky, light cloud sea and small warm pools. Match the light, not the objects."
    prompt:
      - text: |
          Edit the attached painting into the same scene on a calm, clear night: a soft
          deep-blue sky (blue, never black) with a gentle glow near the clouds, a soft
          round moon and a few small stars; the cloud sea stays light and lilac-white.
          Çağlayan stays readable and fairly light under cool moonlight, its colours soft
          but still rich, its shadows blue-violet, no deep blacks, no grey veil over the
          whole frame. Warm light only from real sources already in the picture
          (windows, lanterns, lamps), each a small soft pool; nothing is added.
          The stage's state stays exactly as painted: whatever is broken, dry, dark, covered or missing at this stage stays so, nothing healed, nothing new.
          Everything stays in its place, the same shapes and sizes; only light and
          colour change.
      - block: edit-keep-v1
      - text: "AVOID: high contrast, black shadows, an indigo-purple festival night, many bright lights, a grey or blue veil over the whole frame, neon, new objects, characters, text, moving anything"

