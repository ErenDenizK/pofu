    acceptance: {exploration: true, edit_mode: recolor}
    notes: "Çağlayan stage 4, rain edit of the picked stage plate (t1). Review: nothing moved or healed; rich colour kept; no grey veil."
    prompt:
      - text: |
          Edit the attached painting into the same scene in a soft rain: a soft
          lilac-grey overcast sky, fine gentle rain streaks, the island still bright and
          keeping its rich colour (not a grey veil), small puddles and rings in the
          water, wet sheen kept matte and soft (the falls, the mill wheel, the stone spout and the pools). The far clouds fade softly into
          the rain but stay visible. Lamps and windows that exist glow a little warmer.
          Everything stays in its place, the same shapes and sizes.
      - block: edit-keep-v1
      - text: "AVOID: a dark or grey-blue gloomy scene, a storm, hard diagonal rain, a grey veil, new objects, characters, text, moving anything"

