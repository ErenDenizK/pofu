  - id: x-caglayan-flow-4-golden
    kind: plate
    name: x-caglayan-flow-4-golden
    size: 1536x1024
    canvas: 1536x1024
    deliver: {scale: 1.0}
    edit_of: x-caglayan-flow-4
    chat: "Pofu · Çağlayan states"
    light: {cell: golden, layer: subject}
    palettes: [world-props, world-sunset, world-foliage]
    acceptance: {exploration: true, edit_mode: recolor}
    notes: "Çağlayan stage 4, golden edit of the picked stage plate (t1). Review: nothing moved or healed; rich colour kept; no grey veil."
    attach:
      - ref: home-golden
        role: "The light target: this golden evening of the home island, its pink-lilac sky, peach light and lilac cloud shade. Match the light, not the objects."
    prompt:
      - text: |
          Edit the attached painting into the same scene at golden hour: a soft pink
          and lilac sky warming to peach near the clouds, low warm peach light raking
          from the side, lilac shadows, the cloud sea blushed peach with lilac shade.
          Lamps and windows that exist in the picture are just coming on, small and
          soft. Çağlayan's own colours stay rich (the falls, the mill wheel, the stone spout and the pools).
          Everything stays in its place, the same shapes and sizes; only light and
          colour change.
      - block: edit-keep-v1
      - text: "AVOID: orange or red saturation, a dark scene, healing or changing the stage, new objects, characters, text, moving anything"

