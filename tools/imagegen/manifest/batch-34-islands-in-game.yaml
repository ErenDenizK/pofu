# Batch 34: exploration, never promoted. The future islands as they look IN
# THE GAME (docs/product/home-layout.md, section 10): each main island stuck
# and healed, Gezgin in form 1 and form 2 docked at the harbor, and the home
# island at island level 5 and at Tam Çiçek, all in the home island's camera,
# scale and plate proportions, so the founder can picture them in play.
#
# Founder (2026-11-05): "I am unsure what Çağlayan will be like (the first
# concept was a bit scary); I need concepts closer to the game. And show me
# Gezgin." Batch 17's Çağlayan hung over the void (a pointed underside, a
# long fall into the clouds). Here every island is a plate like home, with its
# own top, palette and landmark, and the water never leaves it. Stuck and
# healed are the same island and layout: only the state changes.
#
# Tracks: `caglayan`, `gezgin`, `revontuli`, `emanet`, `mehtap`, `home`.
# Order is priority: Çağlayan and Gezgin answer the founder's questions.
#
# READY (docs/design/art-production-plan.md, the queue). EXPLORATION RULES
# (AGENTS.md): do NOT run `promote`; commit the takes (WebP q90), the contact
# sheet and review.yaml under design/art/takes/<batch>/<id>/ and nothing else.
# No painted text anywhere. Never paint glass UI, chrome or buttons. A failed
# or refused job is recorded and skipped; the run continues with the next
# job. There is no pilot gate: run the jobs in the order written.

batch: batch-34-islands-in-game
title: Islands in the game camera (stuck and healed, Gezgin at the harbor, home growth)
status: open

defaults:
  variants: 2

jobs:
  - {id: island-main-l-v3, kind: world, name: island-main-l-v3, external: batch-05-fixes-pilot, master: design/art/masters/island-main-l-v3/island-main-l-v3.webp}
  - {id: harbor-island-s, kind: world, name: harbor-island-s, external: batch-14-harbor, master: design/art/masters/harbor-island-s/harbor-island-s.webp}
  - {id: cloud-sea, kind: world, name: cloud-sea, external: batch-04-sky}
  - {id: mochi-v2, kind: char, name: mochi-v2, external: batch-03-home-island, master: design/art/masters/mochi-v2/mochi-v2.webp}
  - {id: tea-stall-5, kind: station, name: tea-stall-5, external: batch-01-slice}
  - {id: windmill-5, kind: station, name: windmill-5, external: batch-03-home-island}
  - {id: pier-1, kind: station, name: pier-1, external: batch-21-harbor-ladders}

  - id: x-caglayan-stuck
    kind: plate
    name: x-caglayan-stuck
    size: 1536x1024
    canvas: 1536x1024
    chat: "Pofu · Exploration"
    light: {cell: day, layer: subject}
    notes: "Exploration. Çağlayan in the game camera, stuck. Review: reads as a cozy place in the same game as home; nothing scary; the stuck state reads without words; stuck and healed share one layout."
    attach:
      - ref: approved:island-main-l-v3
        role: "The home island: copy ONLY its camera, its size in the frame, its plate proportions (shallow top, rounded banded body) and its soft painting. Do not copy its lawn, its colors, its round door or its pebbles."
      - ref: approved:tea-stall-5
        role: "A finished station of the game: buildings and props on the new island are at this scale and in this finish (do not draw this stall)."
      - ref: approved:cloud-sea
        role: "The sea of clouds below every island: paint the clouds like this."
      - ref: R1
        role: "Pofu, the hamster: draw him small at the front centre in this exact style."
      - ref: approved:mochi-v2
        role: "Mochi, the bunny: draw her small beside Pofu in this exact style."
    prompt:
      - text: |
          A concept painting for a cozy mobile game: Çağlayan, the waterfall island,
          in the game, at noon. The plate's top is warm pale cream stone (soft
          travertine) in two low, rounded terraces with moss fringes and little ferns,
          not a green lawn; its body is rounded honey and cream stone in soft bands.
          At the back centre a low, rounded rock knoll, about as tall as a windmill,
          with a short waterfall from a spout in its face into a wide round pool at
          its foot; from the pool a little stream runs to the front edge into a small
          round stone basin that sits on the lip, so the water never leaves the
          island. On the left a small stone mill hut with a round wooden waterwheel
          beside the stream and one round window with a lamp. On the right three small
          round pools step down like saucers with two leaf boats, crossed by a
          stepping-stone path. Damla, a small round brown-and-cream otter with a cream
          face, sits on the big pool's edge holding a tulip glass. STUCK STATE: the
          waterfall is paused in mid-air, a clear, still curtain of water like soft
          glass, with round droplets hanging in the air like beads that sparkle in the
          noon sun; the pools are only half full with pale dry cream rims, the stream
          is still, the waterwheel stands still, the mill lamp is unlit, the leaf
          boats rest on dry stone, and Damla holds an empty glass and looks up at the
          still fall, puzzled, not sad. It looks like a sunny picture somebody paused.
          GAME CAMERA (this is how the island looks inside the game): exactly the
          camera of the attached home island, a low front three-quarter view about 20
          degrees above the horizon, the island centered and filling about 85 % of the
          image width, a pale sky with soft far clouds above and the sea of clouds
          below rising to the island's underside. The island is a floating diorama
          plate of the same size and proportions as the home island: a shallow top
          about a fifth as deep as it is wide over a soft, rounded body with gentle
          bands, so it reads as a place in the same game. Every building and prop is
          at the scale of the attached tea stall; Pofu (the hamster) and Mochi (the
          bunny) stand small at the front centre, at the size they have at home, for
          scale. MOOD: warm, cozy, gentle and inviting, a place a child would want to
          visit; peaceful and wondrous, never dramatic, never eerie.
      - block: prop-style-v2
      - text: "AVOID: a pointed, spiky or rocky underside, a long waterfall or anything falling off the island into the void, a drop or cliff in the foreground, dark caves, fog walls, gloom, ruins, sad or empty eyes, a copy of the home island's green lawn and round door, text, letters, a border, harsh shadows, saturated or neon colors, outlines, photorealism, a 3D render look"

