    prompt:
      - text: |
          A concept painting for a cozy mobile game: Nazlı, the cloud-whale Gezgin, is
          huge, soft and rounded, grey-blue on the back fading to cream on the belly,
          with a small gentle eye, a faint smile, broad rounded flippers and a wide
          cloud-white tail fluke; she is about three times as long as the harbor islet
          is wide. FORM 1 (early, humble and tired): her body a little thin and pale,
          her head low, her eye heavy-lidded but kind. On her back a small patch of
          mossy island no bigger than a cottage lot: a short wooden bench, a single
          mooring post whose rope runs to the pier, a tuft of grass and one dark
          honey-wood lantern hook with nothing on it; beside the hook a faint pale
          scar in her skin shaped like a small unlit paper lantern (a rounded lantern
          outline, never a light bulb). She floats alongside
          the pier, her head toward the islet, as a ferry would; Pofu and Mochi stand
          at the end of the pier with a small bag, about to step onto her back. Soft
          morning light. GAME CAMERA: the camera of the attached home island, a low
          front three-quarter view about 20 degrees above the horizon; the harbor
          islet on the left third of the frame at the size it has in the game, Nazlı
          filling the right two thirds, over the sea of clouds. Peaceful and wondrous,
          never dramatic.
      - block: prop-style-v2
      - text: "AVOID: a light bulb or any modern object, a scary or monstrous whale, teeth, a big open mouth, harpoons, ropes cutting into her, water or waves, a ship's deck, text, letters, a border, harsh shadows, saturated or neon colors, outlines, photorealism, a 3D render look"

