# Batch 30: exploration, never promoted (the backlog)
#
# The decor sets of docs/product/home-progression.md section 8 that are not a
# season set: Ada hediyeleri (one gift per island: Koke's moss stool,
# Caglayan's water bell, Emanet's lost umbrella, Revontuli's light jar) and
# Liman (a fishing rod and bucket, a lantern buoy, a rope and crate, a flag
# string), each piece a separate prop on the decor guide
# (design/art/templates/decor-guide.png) so any piece fits any spot of its
# family. A composed corner per set follows, including set 1 Bahce (bench,
# paper lanterns, toy sailboat, mailbox; those four props are in batch 08) and
# set 3 Sakinler (one piece per resident, shown as a corner only). Size is
# stated in every prompt because the first bench came out twice too wide; QA
# checks it (decor_anchor).
#
# Tracks: `decor`.
#
# BACKLOG (docs/design/art-production-plan.md#the-backlog): every job here is
# an EXPLORATION with an `x-` id. EXPLORATION RULES (AGENTS.md): do NOT run
# `promote`; commit the takes (WebP q90), the contact sheet and review.yaml
# under design/art/takes/<batch>/<id>/ and nothing else. No painted text
# anywhere. Never paint glass, UI chrome or buttons. A failed or refused job
# is recorded and skipped; the run continues with the next job. There is no
# pilot gate: run the jobs in the order written.
#
# Fresh variations: when the backlog comes round again, copy a job under a
# new id (`-v2`, `-v3`, ...) with a new angle, never the same prompt twice.

batch: batch-30-decor-sets
title: "Decor sets: island gifts, harbor, and composed corners (decor guide)"
status: open

refs:
  tea-stall-1: design/art/stations/tea-stall-1/tea-stall-1.png

defaults:
  variants: 2

jobs:
  - {id: decor-bench, kind: prop, name: decor-bench, external: batch-08-decor-pilot}
  - {id: island-main-s, kind: world, name: island-main-s, external: batch-01-slice}
  - {id: cloud-sea, kind: world, name: cloud-sea, external: batch-04-sky}

  - id: x-decor-gift-moss-stool
    kind: prop
    name: x-decor-gift-moss-stool
    size: 1024x1024
    canvas: 1024x1024
    chat: "Pofu · Decor"
    light: {cell: day, layer: subject}
    notes: "Exploration. Ada hediyeleri (island gifts): Koke's moss stool. Review: a round stool grown over with moss, unmistakably from the moss island, sits on the lawn."
    attach:
      - ref: decor-guide
        role: "The decor guide: footprint ellipse, anchor cross and height bar. Follow it, then remove it."
      - ref: approved:decor-bench
        role: "The first piece of the decor family: match its painting, light, colors, finish and scale exactly (do not draw the bench unless asked)."
      - ref: palette:world-props
        role: "The palette card for props: use only these colors (and mixes of them)."
    prompt:
      - text: |
          A small round stool made of a cut tree stump of honey-pale wood, its sides
          and top softly furred with deep sage moss and a tiny cluster of cream
          mushrooms on one edge, three short root feet. Chunky and toy-like. It
          stands on the guide's ground ellipse, centered on the cross, never wider
          than the ellipse and never taller than the height bar; it is small, a
          third of the image width at most.
      - block: prop-style-v2
      - block: prop-avoid-v2

