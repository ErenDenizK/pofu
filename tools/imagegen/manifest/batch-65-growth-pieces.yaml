    name: growth-path-stone
    size: 1024x1024
    canvas: 1024x1024
    transparent: true
    palettes: [world-foliage, world-props]
    chat: "Pofu · Home growth"
    light: {cell: day, layer: subject}
    notes: "A flat rounded stone, warm cream, readable as an oval at 20 pt wide. Review: painted like the batch-57 home growth strip, at the scale of tea-stall-5 in the game camera; transparent, no ground shadow."
    attach:
      - ref: approved:tea-stall-5
        role: "A finished piece on the home lawn: match its painting, light, finish and camera exactly; the scale reference (do not draw the stall)."
    prompt:
      - text: |
          A single small lawn piece for a cozy mobile game, as a game sprite
          on a transparent background, in exactly the painting style, light
          and finish of the attached home island and tea stall. One small flat path stone: a rounded warm-cream sandstone pebble about twice as wide as tall, lying flat on the lawn, a soft lighter top and a slightly darker lower rim, a tiny tuft of grass at one edge. Seen from the home camera, about 17 degrees above, so it is a low flat oval. Thumb-sized at game scale.
          Centered, its feet or base on the bottom edge of the picture,
          lit softly from the upper left.
      - block: prop-style-v2
      - text: "AVOID: path stone, a tuft of grass, a ground shadow, a background, text, letters, a border, characters"

