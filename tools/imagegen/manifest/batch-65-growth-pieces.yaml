# Batch 65: the home's growth pieces (production; real ids, promoted on pass).
#
# The home adds a visible change at every island level (IslandGrowth). Today
# they are code-drawn stand-ins (GrowthArt.swift); `GrowthView` swaps in the
# baked sprite named `growth-<kind>` when WorldArt has one, so these ids are
# exactly the game's asset-name hooks. The painted target is the home growth
# strip, batch-57 (design/art/takes/batch-57-home-growth-strip/x-growth-il{1,3,5,7,10}/,
# selected takes): match its look exactly. Each piece is attached to
# tea-stall-5 for scale and finish: the home lawn at the game camera (about
# 17 degrees above), transparent background, no ground shadow (the app
# draws it).
#
# Animation is code: the app moves, flaps, sways and fades one sprite
# (IslandGrowth.motion and GrowthArt time), so the gull, the dragonfly and
# the steam are ONE sprite each, not frames.
#
# Terrace and hilltop are transparent bank sprites anchored by their feet
# (GrowthArt draws them in a box of 220x50 and 130x46 at the piece's
# point), not plate edits: the game stands them on the lawn, so no
# registration with island-main-l-v3 is needed. Their earth and grass are
# attached from the plate to match.
#
# The lantern string has a night edit, growth-lantern-string-lit, an edit
# of the day sprite with an emit_region over the lantern bodies (the
# emissive-by-difference pipeline, batch-36); the glow, halos and the night
# grade are code.
#
# Ground-line pieces: fit: {ground: true} is only supported for root `char`
# jobs (tools/imagegen/README.md), so props use the default fit; the game
# anchors every sprite by the bottom centre of its canvas.
#
# Review: each reads at its game size on the lawn, painted like the
# batch-57 strip (same finish, light and scale as tea-stall-5); the flag
# looks like no country's flag; nothing carries a ground shadow, text or a
# border.

batch: batch-65-growth-pieces
title: The home's growth pieces (stones, flag, gull, steam, bridge, pond, terrace, lanterns, gate, hilltop)
status: open

defaults:
  variants: 2

jobs:
  - {id: tea-stall-5, kind: station, name: tea-stall-5, external: batch-01-slice}
  - {id: island-main-l-v3, kind: world, name: island-main-l-v3, external: batch-05-fixes-pilot, master: design/art/masters/island-main-l-v3/island-main-l-v3.webp}

