# Batch 42: stickers (production; real ids, promoted on pass).
#
# The best of the batch-23 exploration stickers (x-sticker-*, never promotable)
# recreated as real assets, so the game can use them in visitor letters and
# gift cards, the residents' reaction bubbles and the week page / Today
# summary. In code: `Sticker` (PofuDesignSystem) maps each id here to the
# asset name `sticker-<id>`, with an SF Symbol stand-in until the art lands.
#
# One sticker per job, full body, centred on a transparent 1024 x 1024 canvas
# with clear space around it, so code scales it to 28 to 96 pt without a cut.
# No painted text, no speech bubbles, no floating hearts, no sticker border.
# Each is a pose of the approved character at the SAME look (R1 for Pofu,
# the approved masters for the others); never a different design.
#
# Review checks: reads at 28 pt from the face and posture alone; the
# character is unmistakable; colours and proportions are the base's; the goat
# stays indignant (its happy is a reluctant half-smile). 12 jobs.
#
# Tracks: `pofu` (6), `mochi` (3), `residents` (3: simit, findik, goat),
# `duo` (1); all independent.

batch: batch-42-stickers
title: "Stickers (Pofu x6, Mochi x3, Simit, Fındık, the goat, one duo)"
status: open

defaults:
  variants: 2
  # A sticker is centred on a square canvas (the char canvas is 1024 x 1536 and its
  # contract stands the feet on a ground line at 88 %, which skipped all 13 on the
  # first run): QA on 1024 x 1024 with the ground-line check off.
  canvas: 1024x1024
  acceptance: {ground_line: false}

jobs:
  - {id: mochi-v2, kind: char, name: mochi-v2, external: batch-03-home-island, master: design/art/masters/mochi-v2/mochi-v2.webp}
  - {id: simit-kitten, kind: char, name: simit-kitten, external: retry-2026-11-03, master: design/art/masters/simit-kitten/simit-kitten.webp}
  - {id: findik, kind: char, name: findik-base, external: batch-03-home-island, master: design/art/masters/findik-base/findik-base.webp}
  - {id: harbor-goat, kind: char, name: harbor-goat, external: batch-14-harbor, master: design/art/masters/harbor-goat/harbor-goat.webp}

  - id: sticker-pofu-happy
    kind: char
    name: sticker-pofu-happy
    size: 1024x1024
    transparent: true
    chat: "Pofu · Stickers"
    light: {cell: day, layer: subject}
    notes: "pofu-happy: reads at emoji size from the eyes and mouth alone; he is always unmistakably Pofu."
    attach:
      - ref: R1
        role: "Pofu, the hamster: his exact look, fur, colors, eyes and signature curl."
    prompt:
      - text: |
          A single full-body sticker of Pofu the hamster in the exact attached look, eyes closed in a smile, paws up, a wide content smile. Centred on a plain transparent background with wide empty space around it, drawn complete with the whole body. No text, no speech bubbles, no floating hearts, no sticker border, no ground shadow.
      - text: "AVOID: text, a white outline, a background, teeth, tears, motion lines, a different design."

