    chat: "Pofu · Residents"
    light: {cell: day, layer: subject}
    notes: "The goat surprised (a crate dropped, the ferry horn). Review: a small round \"o\", eyes wider with the catchlights kept, ears up; the rest is the base's."
    prompt:
