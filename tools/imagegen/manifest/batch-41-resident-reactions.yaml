      - text: |
          Edit the attached hedgehog, Fındık, into a proud reaction. Change only the face: the chin lifts a touch, both eyes become calm, content half-closed lids with the catchlights kept, the small mouth becomes a quietly confident closed smile, and the blush deepens a little. His spines, ears, body, paws, colors and size stay exactly as they are.
      - block: edit-keep-v1
      - text: "AVOID: a smirk, a sneer, tears, a worried look, teeth, a ground shadow, text, motion lines."

  # ------------------------------------------------------- the goat

  - id: goat-happy
    kind: char
    name: goat-happy
    size: 1024x1536
    edit_of: harbor-goat
    chat: "Pofu · Residents"
    light: {cell: day, layer: subject}
    notes: "The goat happy (a delivered crate, a level-up), still a goat of opinions. Review: closed arcs for eyes, a small reluctant smile instead of the flat indignant line; horn buds, ears, beard, tan patch and body are the base's."
    prompt:
      - text: |
          Edit the attached baby goat into a happy reaction. Change only the eyes, brows and mouth: both eyes become happy closed arcs, the classic smiling ^ shape, each a thick soft dark upward-curved arc at the height of the top of the original eye; the low indignant brows relax; the flat, pressed mouth turns into a small, slightly reluctant smile. The horn buds, floppy ears, beard tuft, tan patch, body, paws, colors and size stay exactly as they are.
      - block: edit-keep-v1
      - text: "AVOID: teeth, a wide grin, tears, a worried look, a ground shadow, text, motion lines."

  - id: goat-surprised
    kind: char
    name: goat-surprised
    size: 1024x1536
