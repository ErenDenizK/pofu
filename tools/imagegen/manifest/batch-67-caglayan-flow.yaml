# Batch 67: Çağlayan's concept flow (exploration; one coherent stage 0 -> 4).
#
# Founder (2026-11-07, Q-16): C1, the map's island (batch-34
# x-caglayan-stuck t1 / x-caglayan-healed t2: round pools, stone spout,
# mill), with C2's greener grass and flowers (lead-picks-2026-11-06-caglayan
# caglayan-island-4 t2); nothing may move between stages. Q-2: the stone
# spout is the source; at stage 4 Damla sits on top with a full glass. Stage
# 0 is the map's "havada donup kalmış bir şelale". The flow, landmarks and
# upgrade spots: docs/design/concept-flows-islands.md §2. Noon: cell day.
#
# TWO PHASES, THEN A STAR (docs/design/concept-flows-islands.md §0; shared
# rules in docs/design/concept-flows.md). Stage 4 is painted first, at the
# island camera, as the ROOT. Every other job edits that final DIRECTLY
# (parent = stage 4, never the previous stage), so nothing drifts or moves
# and the stages register for the game's crossfade: stages 3, 2, 1 and 0 take
# away, dim, dry, cover, drain or pile up; each prompt lists exactly what is
# present at that stage (cumulative), what is removed or degraded relative to
# the final, and restates the fixed anchors. Leaves: `-4-bare` and `-0-bare`
# (the plate without its movable pieces, the pair the layer cut needs; the
# stage-0 bare restates stage 0 and then strips the pieces), `-4-life` (the
# residents, the duo and the critters added, for the founder's review only;
# the game draws them as sprites) and `-4-up` (the three island upgrades in
# their reserved spots, a fit check). No plate contains a character or an
# animal except `-4-life`.
#
# Phase 1 runs ONLY `x-caglayan-flow-4` (2 takes). The lead or the founder picks a take.
# Until then every other job waits: `run.py plan` shows each as "waiting for
# approval of x-caglayan-flow-4" and `run` skips it. Phase 2 (stages 3, 2, 1, 0, the two
# bares, life and up; independent of each other, any order, up to three
# tracks) runs after the picked final is promoted.
#
# EXPLORATION (x- ids, acceptance exploration: QA is advisory). LEAD RULE,
# CONCEPT MASTER (this batch only, overriding "explorations are never
# promoted"): once the lead names the picked take of `x-caglayan-flow-4` (and only that
# job id), promote it with `promote --only x-caglayan-flow-4` (review note "concept
# master; picked by the lead"), with its harmony entry and content node as for
# any master. It is the reference truth every stage derives from, a concept
# target, not wired into the app. No other job of this batch is promoted: the
# stages and leaves are takes, contact sheet and review.yaml only. Do not run
# phase 2 before the lead names the pick. A failed job is skipped and the run
# continues (no job depends on another stage).
#
# Order (phase 2, track `all`): -3, -2, -1, -0, then -4-bare, -0-bare, -4-life,
# -4-up. Review every take against the final at the same size: if anything
# moved, grew or shrank between stages, the take fails the review.

batch: batch-67-caglayan-flow
title: "Çağlayan concept flow, stage 4 first (C1 with C2's greens), stages 3 to 0 as edits of it, bare pair, life and upgrade checks"
status: open

