    notes: "Stage 3 (DÖNÜM, Söz 1 on the mill stone): full water, no signature. Review: nothing moved; no rainbow, no mist, no smoke; the flowers in bud."
    prompt:
      - text: |
          Edit the attached island plate one stage back: it is the same
          island, less healed. NOTHING MOVES: every landmark, building, pool
          rim, post, stone, the island's outline and size, the camera and the
          composition stay exactly where they are. This edit only takes away,
          empties, dims, dries, covers, drains or piles up what is named here.
          STAGE 3: the waterfall is a strong ribbon about half the width of
          the curtain, not a full curtain; there is NO rainbow and no mist; no
          smoke from the chimney; the flower clumps are green buds, only a few
          open; every pool stays full and the leaf boats float; the mill
          window still glows. Colour a touch less rich (about 95 percent).
      - block: edit-keep-v1
      - text: "AVOID: moving, resizing or redrawing any landmark or prop, reframing or zooming, new buildings, characters or animals, text, letters, a border"

