          empties, dims, dries, covers, drains or piles up what is named here.
          STAGE 0, THE FROZEN FALL (the story map: a waterfall frozen in the
          air in the noon sun): under the spout the water hangs perfectly
          still in the air as a short glassy curtain, with a row of round
