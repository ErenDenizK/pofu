  - id: x-caglayan-flow-4
    kind: plate
    name: x-caglayan-flow-4
    size: 1536x1024
    canvas: 1536x1024
    deliver: {scale: 0.5}
    palettes: [world-foliage, world-water, world-props]
    chat: "Pofu · Çağlayan flow"
    light: {cell: day, layer: subject}
    acceptance: {exploration: true}
    notes: "ROOT, stage 4 healed: C1's layout shape for shape (x-caglayan-healed t2) with C2's grass and flowers (caglayan-island-4 t2). Review: cream stone still reads under the greens (not a meadow); the four empty spots are clear (knoll-top seat, front-right pool water, the step by the mill, the knoll's right shoulder); no characters; the falls, rainbow and green read in a 28 pt thumbnail."
    attach:
      - ref: approved:island-main-l-v3
        role: "The home island: copy ONLY its camera, its size in the frame, its plate proportions (shallow top, rounded banded body) and its soft painting. Do not copy its lawn, colours, round door or pebbles."
      - ref: c1-healed
        role: "THE LAYOUT (C1, the founder's pick): copy every place and shape of this island exactly: the knoll and its spout, the big round pool, the mill hut and wheel, the stream and front basin, the three saucer pools and the stepping stones. Do not draw its otter or the hamster and bunny."
      - ref: c2-greens
        role: "ONLY its greenery: the soft green grass, moss, ferns and the flower colours. Do not copy its cliff, its pool shape, its mill or its layout."
      - ref: approved:tea-stall-5
        role: "A finished station of the game: every building and prop is at this scale and finish (do not draw this stall)."
      - ref: approved:cloud-sea
        role: "The sea of clouds below every island: paint the clouds like this."
    prompt:
      - text: |
          A game plate for a cozy mobile game: Çağlayan, the waterfall island,
          at noon, STAGE 4, HEALED and full of life. The plate's top is warm
          pale cream stone in two low rounded terraces over a rounded
          honey-and-cream body in soft bands. At the back centre a low rounded
          cream rock knoll, about as tall as a windmill, with a plain carved
          stone spout in its face; at its foot a wide round pool. On the left
          a small stone mill hut with a terracotta roof, one round window with
          a little wall lamp, a chimney, a round stone grindstone leaning
          against its front wall, and a round wooden waterwheel beside the
          stream. From the pool a little stream runs left and forward into a
          small round stone basin on the front lip, so the water never leaves
          the island. On the right three small round saucer pools step down
          toward the front, crossed by a curving stepping-stone path. HEALED:
          one soft, full, glassy curtain of water pours from the spout into
          the full pool, with a small pastel mist rainbow at its foot; the
          pool, the stream, the basin and the saucer pools are full, clear and
          turquoise with gentle ripples; the waterwheel's paddles drip with
          spray; the mill window glows warm and a thin curl of smoke leaves
          the chimney; three leaf boats float on the saucer pools. Soft green
          grass carpets fill the terraces between the stones, moss and small
          ferns fringe every rim, and round clumps of flowers bloom (white,
          butter-yellow, blush pink, lilac) by the mill, the knoll and the
          pools; the cream stone stays visible everywhere, the island is not a
          meadow. Keep these places EMPTY for later: a small flat stone seat
          on top of the knoll just above the spout, the front-right half of
          the big pool (open water, no boats, no pads), a short flat stone
          step on the stream bank in front of the mill, and the knoll's right
          shoulder where it slopes into the pool (grass only, no rocks, no
          ferns).
      - text: |
          GAME CAMERA: exactly the camera of the attached home island, a low
          front three-quarter view about 20 degrees above the horizon; the
          island centred and filling about 88 percent of the image width; its
          plate a shallow top about a fifth as deep as it is wide over a soft,
          rounded body in gentle bands; the sea of clouds below rising to the
          underside. Every building and prop is at the scale of the attached
          tea stall. NO CHARACTERS OR ANIMALS anywhere: the game draws Pofu,
          Mochi, the resident and every critter as its own sprite, so their
          places stay empty.
      - block: prop-style-v2
      - text: "AVOID: characters, animals, text, letters, numbers, a border, harsh shadows, near-black shade, neon colours, outlines, photorealism, a 3D render look, anything falling off the island into the void, a copy of the home island's lawn and round door"

