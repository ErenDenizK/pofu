  - {id: bagel-cart-1, kind: station, name: bagel-cart-1, external: batch-01-slice}

  - id: x-hive-1
    kind: station
    name: x-hive-1
    size: 1024x1024
    canvas: 1024x1024
    chat: "Pofu · Hive"
    light: {cell: day, layer: subject}
    notes: "Exploration. The hive (gift station from Arı) level 1 concept. Review: a single straw skep reads as a beehive at 28 pt; bees are tiny soft dots, not insects with detail."
    attach:
      - ref: station-guide
        role: "The composition guide: footprint ellipse, anchor cross and height bar. Follow it, then remove it."
      - ref: approved:tea-stall-1
        role: "The approved tea stall: match its painting, finish, camera, scale and colors exactly (do not draw the stall)."
      - ref: approved:bagel-cart-1
        role: "The harbor's first station: same coral, cream and sea-blue family, same finish (do not draw the cart)."
      - ref: palette:world-props
        role: "The palette card for props: use only these colors (and mixes of them)."
    prompt:
      - text: |
          The first level of a small garden hive, the gift of a bee island: one
          plump straw skep, a rounded dome of woven honey-gold straw in broad soft
          bands, with a small dark arched doorway, sitting on a low round flat stone
          slab with a few small lavender sprigs at its foot and three tiny soft
          cream bees hovering. Nothing else. It fills the footprint's width and
          stays below the height bar's top; chunky, toy-like, few parts.
      - block: view-v2
      - block: prop-style-v2
      - block: prop-avoid-v2
      - text: "AVOID: a floor, a ground shadow, a background, clouds, water, text, letters, characters or animals, glossy shine, outlines"

