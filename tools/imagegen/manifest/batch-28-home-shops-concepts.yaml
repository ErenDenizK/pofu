# Batch 28: exploration, never promoted (the backlog)
#
# Concept frames for the home stations that have no art yet, from
# docs/product/home-progression.md: the hive (gift station from Ari, levels 1,
# 3, 5) and the three Book Two hilltop add-ons (Fanus's greenhouse, Comlek's
# kiln, Mehtap's moon telescope), which have three levels each, so they are
# drawn at levels 1, 2 and 3. Each is a station sprite on the station guide in
# the style of the approved home stations (design/art/stations). The garden,
# tea stall, pond, workshop, windmill and bagel cart already have levels 1 to
# 5; the pier and lighthouse levels 2 to 5 are queued in batch 21.
#
# Tracks: `hive`, `greenhouse`, `kiln`, `moon-telescope`.
#
# BACKLOG (docs/design/art-production-plan.md#the-backlog): every job here is
# an EXPLORATION with an `x-` id. EXPLORATION RULES (AGENTS.md): do NOT run
# `promote`; commit the takes (WebP q90), the contact sheet and review.yaml
# under design/art/takes/<batch>/<id>/ and nothing else. No painted text
# anywhere. Never paint glass, UI chrome or buttons. A failed or refused job
# is recorded and skipped; the run continues with the next job. There is no
# pilot gate: run the jobs in the order written.
#
# Fresh variations: when the backlog comes round again, copy a job under a
# new id (`-v2`, `-v3`, ...) with a new angle, never the same prompt twice.

batch: batch-28-home-shops-concepts
title: "Home shops and add-on stations, L1 L3 L5 concepts (station guide)"
status: open

refs:
  tea-stall-1: design/art/stations/tea-stall-1/tea-stall-1.png

