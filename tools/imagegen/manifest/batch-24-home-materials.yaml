# Batch 24: exploration, never promoted (the backlog)
#
# Upgrade props and materials for the home stations, each a separate prop drawn
# on the decor guide (design/art/templates/decor-guide.png) so any piece fits
# any spot. Each attaches the approved decor bench for the family look. Footprint
# width and height bar are checked by QA (decor_anchor); the size sentence is
# stated in every prompt because the first bench came out twice too wide.
#
# Tracks: `stall`, `garden`, `harbor`.
#
# BACKLOG (docs/design/art-production-plan.md#the-backlog): every job here is
# an EXPLORATION with an `x-` id. EXPLORATION RULES (AGENTS.md): do NOT run
# `promote`; commit the takes (WebP q90), the contact sheet and review.yaml
# under design/art/takes/<batch>/<id>/ and nothing else. No painted text
# anywhere. Never paint glass, UI chrome or buttons. A failed or refused job
# is recorded and skipped; the run continues with the next job. There is no
# pilot gate: run the jobs in the order written.
#
# Fresh variations: when the backlog comes round again, copy a job under a
# new id (`-v2`, `-v3`, ...) with a new angle, never the same prompt twice.

batch: batch-24-home-materials
title: Home upgrade props and materials (decor guide)
status: open

refs:
  tea-stall-1: design/art/stations/tea-stall-1/tea-stall-1.png

defaults:
  variants: 2

jobs:
  - {id: tea-stall-1, kind: station, name: tea-stall-1, external: batch-01-slice}
  - {id: island-main-s, kind: world, name: island-main-s, external: batch-01-slice}
  - {id: decor-bench, kind: prop, name: decor-bench, external: batch-08-decor-pilot}

  - id: x-decor-tea-set
    kind: prop
    name: x-decor-tea-set
    size: 1024x1024
    canvas: 1024x1024
    chat: "Pofu · Decor"
    light: {cell: day, layer: subject}
    notes: "Exploration. Tea stall cups and glasses: a small round tray with three tulip-shaped tea glasses on saucers and two plain cups. Review: the glasses read as tea at 64 px, not as flowers."
    attach:
      - ref: decor-guide
        role: "The decor guide: footprint ellipse, anchor cross and height bar. Follow it, then remove it."
      - ref: approved:decor-bench
        role: "The first piece of the decor family: match its painting, light, colors, finish and scale exactly (do not draw the bench unless asked)."
      - ref: approved:tea-stall-1
        role: "The approved tea stall: match its style, camera, light, colors and scale (do not draw the stall)."
      - ref: palette:world-props
        role: "The palette card for props: use only these colors (and mixes of them)."
    prompt:
      - text: |
          A small round tray of soft brass-cream with three tulip-shaped tea
          glasses on saucers, filled with amber tea, a small sugar bowl and
          two plain rounded clay cups of pale sage, for the tea stall
          counter. Chunky, toy-like proportions, glass as a soft tinted
          shape. It stands on the guide's ground ellipse, centered on the
          cross, never wider than the ellipse and never taller than the
          height bar; it is small, a third of the image width at most.
      - block: prop-style-v2
      - block: prop-avoid-v2

