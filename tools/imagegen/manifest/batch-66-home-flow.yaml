  - id: x-home-flow-final
    kind: plate
    name: x-home-flow-final
    size: 1024x1536
    canvas: 1024x1536
    deliver: {scale: 0.5}
    chat: "Pofu · Home flow"
    light: {cell: day, layer: subject}
    palettes: [world-foliage, world-props]
    acceptance: {exploration: true}
    notes: "ROOT. Home at Tam Çiçek (IL10), clear summer day, whole-island camera, portrait. Review: every anchor on its guide mark (concept-flows §2.1); İskele joined on the right over the bridge; the Tepe up left; four far islands and Gezgin on their marks; I1 day colour (sky L* ~84, lawn deep green, earth peach); nothing crowded; no characters."
    attach:
      - ref: home-flow-guide
        role: "The composition guide for the whole picture: the home lawn (big magenta oval), the harbor islet's lawn (small magenta oval, right), the hilltop terrace (magenta oval, upper left), the rope bridge (grey bar), magenta crosses where each building stands, small magenta rings where round doors sit in the earth, grey ovals in the sky for the four far islands and the cloud-whale, the grey line where the cloud sea begins. Follow it exactly, then remove every guide mark: no magenta, no grey lines, no ovals may remain."
      - ref: approved:island-main-l-v3
        role: "The home island plate: keep its exact outline, lawn shape, rounded earth body, round wooden door and roots, at the size the guide gives it."
      - ref: e1-tam-cicek
        role: "The chosen concept (the founder's pick): the look, the finish and what each building looks like at full bloom. Its layout is only approximate; where it differs, follow the guide."
      - ref: i1-day
        role: "The light and colour target: this exact clear summer day, its sky, lawn green, peach earth, soft shadows and white cloud sea with a faint blue-lilac shade."
      - ref: approved:harbor-island-s
        role: "The harbor islet İskele: its shape and earth, smaller than the home island, on the right."
      - ref: approved:tea-stall-5
        role: "A finished station: every building is at this scale and finish."
      - ref: gezgin-f2
        role: "Gezgin, the cloud-whale, in her grown form: small and far in the sky, gentle face, a little garden with a pool on her back."
    prompt:
      - text: |
          A concept painting for a cozy mobile game, portrait, no text: the
          home island Ayçiçeği at full bloom, on a clear summer day, seen whole
          from the game camera (about 20 degrees above the horizon). The island
          sits in the lower half of the picture over a soft sea of clouds; the
          upper half is open summer sky with a few far things in it.

          Everything stands exactly where the guide marks it. On the home lawn,
          left to right: at the far left tip a flower garden with one giant
          golden sunflower; behind it, on a low grassy knoll at the back left, a
          white plaster windmill with cream sails and small lanterns on its cap;
          at the back centre, on a low raised terrace, a workshop with a big
          gear sign over its door; a small straw beehive on the back lawn right
          of the workshop; at the far right tip a tea stall with a tiled roof,
          a red geranium and a small flag; at the front left a round lily pond
          with a little wooden dock and floating paper lanterns; a stone path
          from the garden to the tea stall with three warm path lamps; flower
          borders along the path and the front edge; a few round mossy
          stepping stones from the front centre toward the pond; a toy
          sailboat at the pond's edge and a
          small mailbox on the front edge left of the door; flowering vines in soft
          pink and lilac trailing over the lawn's rim and a little way down the
          earth. On the front lip, just above the round door, an old wooden
          hamster wheel stands still, a young sunflower growing through its
          middle and small flowers twined around it. A paper lantern string
          runs from the windmill's cap to the workshop's eave to the tea
          stall's roof. Leave a clear patch of lawn at front centre (the
          hamster stands there in the game). In the warm peach earth body,
          four small round doors in a row with tiny windows, set INTO the
          earth like the attached round door, with the same rim stones; left
          to right: the plain wooden door (the attached one), a sky-blue
          door, a rose door, a sage-green door.

          On the right, a short rope bridge leads to the small harbor islet:
          a bagel cart with a striped umbrella and a little flag at its left
          end, a white lighthouse with soft stripes at its back right, a
          wooden pier running toward us at its front right with a lantern
          post, bunting, a small bell and a little ferry moored beside it, a
          plank shed door in its earth.

          Up and behind the home island's left end floats a small grassy
          hilltop terrace, joined to the lawn's left tip by curved stone steps
          and an open little wooden gate with a carved sunflower; on top a
          bench, a small brass telescope and a round low grass stage.

          In the sky, small, soft and hazed by distance, at their guide marks:
          upper left, a round island with tiered pools and a small silver
          waterfall; above it to the right, a misty island with a tall stilted
          wooden house; high in the middle, the smallest and farthest, an
          island with a little moon-white dome; at the right, a cool pale
          island with slender ice towers. Between them, larger and nearer but
          still far, the gentle cloud-whale glides left to right with a small
          garden on her back. The far islands are clearly islands like home,
          only far: lighter, softer, less detailed, never sharper than home.

          Clear summer day light. MOOD: warm, cozy, gentle, abundant and
          tidy, every building readable at a glance; peaceful and wondrous,
          never busy.
      - block: style-anchor-v2
      - text: "AVOID: characters or animals of any kind, text, letters, numbers, a border, guide marks, a different island shape, buildings outside their marks, clutter, overlapping buildings, a dark or muddy earth body, black door holes, saturated or neon colours, harsh shadows, outlines, photorealism, a 3D render look"

