    prompt:
      - text: |
          Edit the attached painting: remove every built and planted thing
          and leave only the land, the sky and the far things. Remove the
          windmill, the workshop, the beehive, the tea stall, the garden and
          its sunflower, the pond and its dock (paint plain lawn where it
          was), the stone path, the path lamps, the lantern string, the
          flower borders, the vines, the hamster wheel, the rope bridge, the
          bagel cart, the lighthouse, the pier, and on the hilltop the bench,
          the telescope, the stage, the steps and the gate. Paint plain soft
          lawn wherever something stood, with the same grass, light and
          shading. Keep the island's outline, its earth body with all its
          small round doors, the low knolls, the harbor islet's land, the
          hilltop's land, the roots, the cloud sea, the sky, the far islands
          and the cloud-whale exactly as they are.
      - block: edit-keep-v1
      - text: "AVOID: characters, text, moving or resizing the land, holes or shadows where objects were, a different light"

