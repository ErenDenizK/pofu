# Batch 66: the home flow, final first (exploration; x- ids, never promoted).
#
# Founder (2026-11-07, decisions §10.3): home is E1 (the level stones to the
# Tam Çiçek final) with E2's IL7 charm; things keep their places from level
# to level; the background is never empty (fixed far islands and Gezgin);
# light follows I1, and night is NOT the bright, contrasty Tam Çiçek night.
# The plan is docs/design/concept-flows.md (shared rules §1, home flow §2):
# read its anchor table before judging a take.
#
# FINAL FIRST. The root paints the finished island (IL10, Tam Çiçek) at the
# game's whole-island camera, by day, with the fixed far islands and Gezgin.
# Every earlier level is an EDIT of the next later one that only removes or
# steps down (IL9 from the final, IL8 from IL9, ... IL1 from IL2), so nothing
# can shift (the one planned move, the bench, is put back on the lawn at
# il9). The bare island (Job A of docs/research/concept-match.md §6) and
# the golden, night and rain states are edits of the final. Props are later
# cut as stage minus bare, so land and props share one light.
#
# Track `all`, in this order: final; then bare, golden, night, rain (may run
# concurrently); then the chain il9 -> il8 -> ... -> il1 (strictly
# sequential).
#
# LEAD RULE, STAGED PARENTS (this batch only): explorations are never
# promoted, so an `edit_of` or `approved:` parent here is STAGED, not
# promoted. When a parent job has its auto-pick, copy that take's full-size
# PNG from the build folder to the path `prompt --job <child>` lists for it
# (design/art/masters/<parent>/<parent>.png), never `git add` it, and delete
# every staged folder before the PR's last push (`git status` shows none).
# The child's attachments are then exactly as `prompt` prints them.
#
# EXPLORATION RULES (AGENTS.md): do NOT run `promote`; commit the takes (WebP
# q90), the contact sheet and review.yaml under design/art/takes/<batch>/<id>/
# and nothing else. No characters anywhere (the app draws Pofu and the
# residents; painting them makes two Pofus, #265). No painted text. A failed
# or refused job is recorded and skipped with its true dependents (a failed
# il5 skips il4 to il1); the run continues.
#
# Review for every take: the plate keeps its outline; each anchor stands where
# the guide and the previous take put it; the far islands and Gezgin keep
# their spots; the step from the next level is obvious at a glance.

batch: batch-66-home-flow
title: Home flow, final first (Tam Çiçek root, IL9 to IL1 as edits, bare, golden, night, rain)
status: open

refs:
  home-flow-guide: design/art/templates/home-flow-guide.png
  e1-tam-cicek: design/art/takes/batch-34-islands-in-game/x-home-tam-cicek/plate__x-home-tam-cicek--t4.webp
  e2-il7: design/art/takes/batch-57-home-growth-strip/x-growth-il7/plate__x-growth-il7--t1.webp
  i1-day: design/art/takes/batch-25-seasons/x-season-summer/plate__x-season-summer--t2.webp
  i1-golden: design/art/takes/batch-25-seasons/x-season-summer-evening/plate__x-season-summer-evening--t2.webp
  i1-rain: design/art/takes/batch-25-seasons/x-season-rain/plate__x-season-rain--t2.webp
