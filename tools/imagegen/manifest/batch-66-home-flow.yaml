# Batch 66: the home flow, final first (exploration; x- ids, never promoted).
#
# Founder (2026-11-07, decisions §10.3): home is E1 (the level stones to the
# Tam Çiçek final) with E2's IL7 charm; things keep their places from level
# to level; the background is never empty (fixed far islands and Gezgin);
# light follows I1, and night is NOT the bright, contrasty Tam Çiçek night.
# The plan is docs/design/concept-flows.md (shared rules §1, home flow §2):
# read its anchor table before judging a take.
#
# FINAL FIRST, THEN A STAR. The root paints the finished island (IL10, Tam
# Cicek) at the game's whole-island camera, by day, with the fixed far islands
# and Gezgin. Every other job edits that final DIRECTLY (parent = the final,
# never the previous level), so a 9-deep chain cannot drift in colour or
# position: the bare island (Job A of docs/research/concept-match.md §6), the
# golden, night and rain states, and IL9 ... IL1 are all one edit of the
# final. Each level prompt lists exactly what is present at that level
# (cumulative), what is removed or degraded relative to the final, and
# restates the fixed anchors so no position shifts (the one planned move, the
# bench, is put back on the lawn at il9 to il7). Props are later cut as stage
# minus bare, so land and props share one light.
#
# TWO PHASES.
# Phase 1 runs ONLY the three roots (2 takes each): `x-home-flow-final` (the
# colour control, as first written: old style block, half-size delivery),
# `x-home-flow-final-clear` (block plate-style-v1) and
# `x-home-flow-final-rich` (block plate-style-rich-v1). Same picture, three
# colour levels (the ladder of ADR-0023 and docs/design/visual-system.md). The
# lead names one of the three roots as the master by eye plus
# tools/plate/colour_metrics.py. Until then every edit job waits: `run.py plan`
# shows each as "waiting for approval of x-home-flow-final" and `run` skips it.
# Phase 2 (bare, golden, night, rain, il9 ... il1, all independent of each
# other, any order, up to three tracks) starts from whichever root the lead
# names. The 13 edit jobs keep `edit_of: x-home-flow-final` as the default;
# the lead's naming PR repoints them (`edit_of`) to the named root. The edit
# jobs are delivered at full size (scale 1.0, ADR-0023).
#
# LEAD RULE, CONCEPT MASTER (this batch only, overriding "explorations are
# never promoted"): once the lead names the picked take of `x-home-flow-final`
# (and only that job id, one of the three roots), promote it with
# `promote --only <that id>` (review note "concept master; picked by the lead"). It is the reference
# truth every level and state derives from. It is a concept target, not wired
# into the app. No other job of this batch is promoted. Do not run phase 2
# before the lead names the pick.
#
#
# EXPLORATION RULES (AGENTS.md): do NOT run `promote`; commit the takes (WebP
# q90), the contact sheet and review.yaml under design/art/takes/<batch>/<id>/
# and nothing else. No characters anywhere (the app draws Pofu and the
# residents; painting them makes two Pofus, #265). No painted text. A failed
# or refused job is recorded and skipped; the run continues (no job depends on
# another level).
#
# Review for every take: the plate keeps its outline; each anchor stands where
# the guide and the final put it; the far islands and Gezgin keep their
# spots; the step from the final is obvious at a glance.

batch: batch-66-home-flow
title: Home flow, final first, three colour roots (Tam Çiçek root; then IL9 to IL1, bare, golden, night, rain as edits of the final)
status: open

refs:
  home-flow-guide: design/art/templates/home-flow-guide.png
  e1-tam-cicek: design/art/takes/batch-34-islands-in-game/x-home-tam-cicek/plate__x-home-tam-cicek--t4.webp
  e2-il7: design/art/takes/batch-57-home-growth-strip/x-growth-il7/plate__x-growth-il7--t1.webp
  i1-day: design/art/takes/batch-25-seasons/x-season-summer/plate__x-season-summer--t2.webp
  i1-golden: design/art/takes/batch-25-seasons/x-season-summer-evening/plate__x-season-summer-evening--t2.webp
  i1-rain: design/art/takes/batch-25-seasons/x-season-rain/plate__x-season-rain--t2.webp
  night-gezgin: design/art/takes/batch-22-gezgin-forms/x-gezgin-f2-night/plate__x-gezgin-f2-night--t1.webp
  night-revontuli: design/art/takes/batch-34-islands-in-game/x-revontuli-stuck/plate__x-revontuli-stuck--t1.webp
