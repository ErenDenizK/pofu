# Batch 57: home growth strip (exploration; x- ids, never promoted).
#
# The founder (2026-11-06): plan for real, with concepts if needed, how the
# island grows level by level: what stands where, how it grows, how it
# arrives. Home progression §3 and home layout already say it in words;
# this paints it: the same home island in the same camera at IL1, IL3, IL5,
# IL7 and IL10, so the lead can check that every step is a visible, living
# change and that the layout stays readable when full. The lead compares
# them side by side on one strip before any production.

batch: batch-57-home-growth-strip
title: Home growth strip (the home island at IL1, IL3, IL5, IL7, IL10)
status: open

defaults:
  variants: 2

jobs:
  - {id: island-main-l-v3, kind: world, name: island-main-l-v3, external: batch-05-fixes-pilot, master: design/art/masters/island-main-l-v3/island-main-l-v3.webp}
  - {id: tea-stall-5, kind: station, name: tea-stall-5, external: batch-01-slice}
