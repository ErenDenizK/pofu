    size: 1536x1024
    canvas: 1536x1024
    deliver: {scale: 0.5}
    palettes: [world-foliage, world-props]
    chat: "Pofu · Home growth"
    acceptance: {exploration: true}
    notes: "Home at island level 1 for the growth strip. Review: same plate, camera and size as the other levels; the step from the previous level is obvious at a glance; readable, never cluttered."
    attach:
      - ref: approved:island-main-l-v3
        role: "The home island plate: keep its exact outline, size, camera, lawn shape, earth body and round door; only what stands on and under it changes."
      - ref: approved:tea-stall-5
        role: "A finished station: every station and prop is at this scale and finish."
      - ref: approved:cloud-sea
        role: "The sea of clouds below."
    prompt:
      - text: |
          The attached home island, the same plate, outline, size and camera,
          at level 1: a small round island with only Pofu's round door in the earth, one sunflower bed and a tiny vegetable garden on the lawn, bare roots below; quiet and humble. Soft noon light, cozy, every piece at the scale of the
          attached tea stall, clearly placed so the island reads at a glance.
          No characters.
      - block: prop-style-v2
      - text: "AVOID: changing the island's outline or size, clutter, overlapping buildings, characters, text, letters, a border"

