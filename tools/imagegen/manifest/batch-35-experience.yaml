# Batch 35: experience v1 (docs/design/experience-v1.md, section 7).
#
# The rest of the experience art, gated on the pilot
# (batch-35-experience-pilot: glow-ground-pool, glow-window-spill,
# dressing-meadow, launch-sky). Every family here copies a pilot master: the
# other glows attach the pool, the dressing and critter sheets attach the
# meadow, the cloud curtain is painted over the launch sky's palette.
#
# What is in it:
#   glow-warm-halo, glow-pond-shimmer   the other two glows (additive on black)
#   calm-lantern-lit                    an edit of the calm lantern, lit
#   firefly                             four blink frames
#   cloud-curtain-1..3                  the loading curtain's three layers
#   shield-pofu-door                    Pofu at his door, three moods (180 px)
#   reward-seed-burst                   the resist payoff's six frames
#   dressing-garden, dressing-harbor    the other two dressing sheets
#   critter-butterfly, -snail, -bird, -ladybug
#   visitor-dandelion, gift-parcel, guest-letter
#
# Glows are `ui` jobs on pure black (the app adds them with plus-lighter
# blending). Sprites carry `light: {cell: day, layer: subject}`; the
# launch plates use `cell: dawn`. No painted text anywhere. Code does every
# glow, flame, flicker and shaft. A failed job is skipped after one retry;
# its dependents are skipped.
#
# Tracks: `glow` (glow-warm-halo, glow-pond-shimmer, calm-lantern-lit,
# firefly), `launch` (cloud-curtain-1..3, shield-pofu-door,
# reward-seed-burst), `dressing` (dressing-garden, dressing-harbor),
# `critters` (the four critter sheets), `visitors` (visitor-dandelion,
# gift-parcel, guest-letter). Tracks are independent.

batch: batch-35-experience
title: Experience v1 (glows, launch curtain, dressing, critters, visitors)
status: blocked
blocked_on:
  - "the lead's review of batch-35-experience-pilot (glow-ground-pool, glow-window-spill, dressing-meadow, launch-sky), in a night screenshot"

refs:
  tea-stall-1: design/art/stations/tea-stall-1/tea-stall-1.png

defaults:
  variants: 2

jobs:
  - {id: tea-stall-1, kind: station, name: tea-stall-1, external: batch-01-slice}
  - {id: cloud-sea, kind: world, name: cloud-sea, external: batch-04-sky}
  - {id: island-main-l-v3, kind: world, name: island-main-l-v3, external: batch-05-fixes-pilot, master: design/art/masters/island-main-l-v3/island-main-l-v3.webp}
  - {id: glow-ground-pool, kind: ui, name: glow-ground-pool, external: batch-35-experience-pilot}
  - {id: dressing-meadow, kind: sheet, name: dressing-meadow, external: batch-35-experience-pilot}
  - {id: ui-lantern-on, kind: ui, name: lantern-on, external: batch-11-ui-pilot}

  - id: glow-warm-halo
    kind: ui
    name: glow-warm-halo
    size: 1024x1024
    canvas: 1024x1024
    transparent: false
    blend: additive
    chat: "Pofu · Experience"
    notes: "Soft round halo for a lantern or a lit window, drawn around the source (the app places it, additive). Matches glow-ground-pool's grain and color. Review: round, soft, no ring, no hot core."
    attach:
      - ref: approved:tea-stall-1
        role: "The approved tea stall: match its painting, finish, camera, scale and colors exactly (do not draw the stall)."
      - ref: approved:glow-ground-pool
        role: "The approved ground pool: the same painterly grain, falloff and warm honey-gold color as this halo (do not draw the pool)."
    prompt:
      - text: |
          A soft round halo of warm lantern light, centered in the image, filling about 85 percent of its width: a
          gentle bright center that falls off smoothly and evenly in every direction, dying into black before the
          border. The center is bright but not white-hot, as light that has been softened by paper. Warm honey-gold
          only, a slightly irregular painterly edge.
      - block: ui-object-v1
      - text: |
          GLOW SPRITE: a painterly additive light sprite for a game: the app adds it on top of the world with
          plus-lighter blending, so black means no light at all. Painted with the same soft airbrushed grain as the
          attached art, a smooth falloff from a brighter center to nothing, a very slight painterly irregularity so
          it is never a perfect digital gradient. Color is a warm candle-light honey-gold (#FFC872 at the center
          fading through #FF9F4A to black) unless stated. Pure black (#000000) background, not transparent, no
          other colors, no objects.
      - text: "AVOID: any object, a lamp, a window, a flame, a sun, a sphere or a visible light source, stars, rays or spikes, lens flare, hard edges, outlines, text, letters, a border, a frame, grey or colored backgrounds, banding, a halo ring. Everything outside the glow is pure black (#000000)."

