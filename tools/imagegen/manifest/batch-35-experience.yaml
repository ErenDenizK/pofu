        role: "Pofu, the hamster: his exact look, fur, colors, eyes and signature curl."
      - ref: approved:island-main-l-v3
        role: "The home island: copy ONLY the round door (its shape, wood, color and size relative to the plate) and the soft painting. Do not draw the island."
