  name: cl2-atmosphere-board
  size: 1536x1024
  canvas: 1536x1024
  chat: Pofu · Exploration
  notes: 'Exploration. Nine cluster atmospheres read as nine places at thumbnail size (the light delta, not only the palette). Review: each cell nameable by its light alone with the island covered; no two cells share hour, shadow colour and haze; home''s cell is the only pastel one.'
  attach:
  - ref: approved:island-main-s
    role: 'STYLE ONLY: the soft painterly finish and the rounded chunky shapes. Do NOT copy its shape, its pastel daylight, its cream haze or its palette: this place has its own light. No lawn oval, no soil bowl, no hanging roots, no round door.'
  prompt:
  - text: |
      A concept painting for a cozy mobile game: A board of nine equal square cells in a 3x3 grid with thin dark gutters, each cell one small distant floating island under its own sky, painted at far-view detail, no characters.
      Row 1: (1) home: a round grassy island with a sunflower, soft warm pastel morning, warm brown shadows, cream haze, white cloud sea. (2) WATER: a white travertine column of round pools with a long waterfall, hard white NOON sun straight overhead, deep cerulean sky, TURQUOISE shadows, a bright white spray halo around it and nothing visible below but spray, crisp high contrast. (3) JOURNEY: a cloud-whale with a sea stack behind, low orange sun slit under a periwinkle fog bank, rim light from behind, periwinkle shadows, dark rolling cloud swell below, a passing shower.
      Row 2: (4) COLD: a snowy ice floe with spruces and a hut, aurora night, cool moonlight and one warm window, deep blue shadows, diamond-dust sparkle, dark floes below. (5) GLASS: a glass bell jar, low gold winter afternoon light refracting through the glass into caustics, violet shadows, frost breath haze, rime crust on the cloud tops. (6) CRAFT: a giant red-clay pot lying on its side, dusk lit from BELOW by a kiln glow at its mouth, plum shadows, ochre smoke haze, clouds stained dusty red, sparks.
      Row 3: (7) MOON: a pale moonstone crescent, blue hour, deep indigo starfield, silver light from above, ink-blue shadows, crystal-clear air, the cloud sea flat and glassy like a mirror. (8) EAR: a slim spire hung with bells, bright morning after rain, washed blue sky with racing cloud shadows, cool grey-blue shadows, no haze, the cloud sea torn open by wind. (9) MEMORY: an upturned umbrella over shelves, drizzly dusk, many small amber lamps and no sun, sepia-grey shadows, rain mist, rain-darkened clouds.
      UNIQUE PLACES: every cell has its own hour, key light, shadow colour, haze and floor; the board is a light test, not a style test. Simple silhouettes, readable at thumbnail size.
