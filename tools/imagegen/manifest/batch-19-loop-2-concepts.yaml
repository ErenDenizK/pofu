# Batch 19: design loop 2 concept round (12 images), EXPLORATION, never promoted
# (docs/design/art-production-plan.md; spec: docs/product/design-loop/loop-2.md
# section 5; island rules: docs/product/archipelago-system.md section 17).
#
# Loop 2's finding: landforms are now unique, but every take shares one sky,
# one cloud sea, one pastel daylight and one haze. Two causes are in the
# pipeline, not the painter: the prop-style-v2 block asks for "the same
# light, high-key values and milky pastel colors" and batch 17-18 attached
# the cloud-sea plate as "paint clouds like this". So this round uses the
# new block island-light-v1 (same finish, the place's own light) and does
# NOT attach the cloud sea; every brief states its cluster's atmosphere
# (hour, sky, key light, shadow colour, haze, floor, weather, value key) from
# content/islands/profiles.yaml. Shape refs from batches 17-18 are SHAPE ONLY.
#
# EXPLORATION RULES (AGENTS.md): do NOT run `promote`; commit the takes (WebP
# q90), the contact sheet and review.yaml under design/art/takes/<batch>/<id>/
# and nothing else. No painted text anywhere. Review wonder takes with the
# rubric of archipelago-system.md 1A.3, the 60 pt black-silhouette test and
# the light test of loop-2.md section 4 (cover the island: can you still name
# the place by its light?).
#
# PILOT (run first, in this order): cl2-atmosphere-board, cl2-caglayan-noon,
# cl2-koke-sleeper. Continue to THE REST only if at least 2 of the 3 pass
# review; otherwise skip every job below the "THE REST" line and finish the
# session. A failed job gets one retry.
#
# Track: `loop2` (all 12 jobs).

