    kind: plate
    name: x-revontuli-flow-4
    size: 1536x1024
    canvas: 1536x1024
    deliver: {scale: 1.0}
    palettes: [world-night, world-props, world-water]
    chat: "Pofu · Revontuli flow"
    light: {cell: night, layer: subject}
    acceptance: {exploration: true}
    notes: "ROOT, stage 4 healed: R1's ice island with R2's towers standing lit, the swept ice lake and the aurora tail ending at the post. Review: the aurora tail and the four gold lanterns read in a 28 pt thumbnail; the sky deep blue-violet, never black; the three empty spots clear; no characters."
    attach:
      - ref: approved:island-main-l-v3
        role: "The home island: copy ONLY its camera, its size in the frame, its plate proportions (shallow top, rounded banded body) and its soft painting. Do not copy its lawn, colours, round door or pebbles."
      - ref: r1-healed
        role: "THE ISLAND (R1): copy this ice island's plate, its snow top, its glowing ice body with icicles, the sauna cabin, the curved lamp post and the spruce. Do not draw its fox, hamster or bunny."
      - ref: r2-ruin
        role: "ONLY the lantern towers' design: a light wooden lattice frame on four legs, a little snowy roof, one lantern under it. Do not copy its earth island or its layout."
      - ref: ice-lake
        role: "ONLY the clear glassy ice lake and the long sweeping aurora tail. Do not copy its island shape."
      - ref: approved:tea-stall-5
        role: "A finished station of the game: every building and prop is at this scale and finish (do not draw this stall)."
      - ref: approved:cloud-sea
        role: "The sea of clouds below every island: paint the clouds like this."
    prompt:
      - text: |
          A game plate for a cozy mobile game: Revontuli, the northern ice
          island, at night, STAGE 4, HEALED: the aurora has risen. The island
          is a round plate topped with soft deep snow over a body of glowing
          pale blue ice with short rounded icicles. At the back left a small
          log SAUNA on short stilts with a snowy roof, a stone chimney
          breathing soft steam, a warm-lit window, three wooden steps, a
          bucket and a towel on a hanger by the door. At the back centre a
          tall curved wooden AURORA POST, about one and a half times the
          sauna's height, with a big round lantern on its hook. At the back
          right a round snowy spruce. In the middle, from the left toward the
          centre, a round frozen LAKE about a third of the island's width, its
          ice swept clear and glassy, with a small round fishing hole near its
          left end and a little wooden stool beside it. Three small wooden
          LANTERN TOWERS, each a light lattice frame on four legs with a
          little snowy roof and one lantern, about two thirds of the sauna's
          height, stand on round stone footings: tower A at the front right,
          tower B in the middle right in front of the spruce, tower C on the
          back left between the sauna and the post. HEALED AT NIGHT: a deep
          blue-violet starry sky (never black); soft green and violet aurora
          curtains fill the sky behind the island, and one long aurora TAIL
          sweeps down from them in a soft curve and ends at the aurora post's
          lantern, which glows gold; the lake mirrors the aurora in soft green
          and violet; the three tower lanterns glow honey-gold, each with a
          small amber pool on the snow; the ice body glows softly from inside
          with a faint aurora tint. Keep these places EMPTY for later: a
          trodden snow lane from the sauna steps along the lake's back and
          right edge to the front lip (clear, no props), the snow beside the
          sauna's left wall under its eave (a clear patch), and the island's
          right flank where the snow lip curves over the ice body between
          tower A and the spruce (smooth ice, no icicles there).
      - text: |
          GAME CAMERA: exactly the camera of the attached home island, a low
          front three-quarter view about 20 degrees above the horizon; the
          island centred and filling about 88 percent of the image width; its
          plate a shallow top about a fifth as deep as it is wide over a soft,
          rounded body in gentle bands; the sea of clouds below rising to the
          underside. Every building and prop is at the scale of the attached
          tea stall. NO CHARACTERS OR ANIMALS anywhere: the game draws Pofu,
          Mochi, the resident and every critter as its own sprite, so their
          places stay empty.
      - block: plate-style-rich-v1
      - text: "AVOID: characters, animals, text, letters, numbers, a border, harsh shadows, near-black shade, neon or oversaturated colours, HDR glow, washed-out pastel colour, milky haze, grey or muddy colour, outlines, photorealism, a 3D render look, anything falling off the island into the void, a copy of the home island's lawn and round door"

