# Batch 26: exploration, never promoted (the backlog)
#
# Concept portraits for the main-island residents as currently planned
# (docs/archive/island-curation.md): Damla (Çağlayan), Tuli (Revontuli), Boncuk
# (Emanet), Nane (Yıldız) and Yosun (Gezgin's postman). Each has two moments:
# "first seen small" (the resident tiny in a wide, unfinished scene, the island
# muted) and "revealed grand" (the island healed, the resident framed with
# confidence). They decide silhouette, palette and mood; model sheets come
# later. Characters keep Pofu's finish: soft fur, big glossy dark eyes with a
# catchlight each, no curl on any head.
#
# Tracks: `damla`, `tuli`, `boncuk`, `nane`, `yosun`.
#
# BACKLOG (docs/design/art-production-plan.md#the-backlog): every job here is
# an EXPLORATION with an `x-` id. EXPLORATION RULES (AGENTS.md): do NOT run
# `promote`; commit the takes (WebP q90), the contact sheet and review.yaml
# under design/art/takes/<batch>/<id>/ and nothing else. No painted text
# anywhere. Never paint glass, UI chrome or buttons. A failed or refused job
# is recorded and skipped; the run continues with the next job. There is no
# pilot gate: run the jobs in the order written.
#
# Fresh variations: when the backlog comes round again, copy a job under a
# new id (`-v2`, `-v3`, ...) with a new angle, never the same prompt twice.

batch: batch-26-residents-concepts
title: Main-island residents, concept portraits (first seen small, revealed grand)
status: open

refs:
  tea-stall-1: design/art/stations/tea-stall-1/tea-stall-1.png

defaults:
  variants: 2

jobs:
  - {id: island-main-s, kind: world, name: island-main-s, external: batch-01-slice}
  - {id: cloud-sea, kind: world, name: cloud-sea, external: batch-04-sky}
  - {id: pofu, kind: char, name: pofu-r1, external: r1, master: design/art/masters/pofu-hamster-base-v1/pofu-hamster-base.png}

  - id: x-res2-damla-small
    kind: plate
    name: x-res2-damla-small
    size: 1024x1536
    canvas: 1024x1536
    chat: "Pofu · Exploration"
    light: {cell: day, layer: subject}
    notes: "Exploration. Damla, first seen small. Review: the glass of water is the story; she is tiny and determined."
    attach:
      - ref: R1
        role: "Pofu, the hamster: match his art style, lighting, level of fluff and eye language exactly (do not draw him)."
      - ref: approved:island-main-s
        role: "The home island: the same painting and softness for the world around the resident (do not draw this island)."
      - ref: approved:cloud-sea
        role: "The sea of clouds below every island: paint the clouds like this."
    prompt:
      - text: |
          A concept painting for a cozy mobile game, a resident portrait.
          FIRST SEEN SMALL. Damla, a baby otter, a round plush ball of warm
          brown fur with a cream muzzle and belly, small round ears and a
          thick rounded tail, big glossy dark eyes, climbing a steep, dry,
          pale-grey cliff alone and tiny against it, carefully carrying one
          tall glass of water in both paws without spilling, her tongue
          between her lips in concentration. A dry empty riverbed winds down
          the cliff behind her, the cliff face towering to the top of the
          frame, muted pale colors, a small hopeful light at the top. No
          curl or swirl on top of the head (that belongs to Pofu alone).
      - block: prop-style-v2
      - text: "AVOID: Pofu, a curl on top of the head, realistic animal anatomy, sharp claws, a border, text, labels, harsh shadows, saturated or neon colors, dark moods, outlines"

