      - ref: palette:world-props
        role: "The palette card for props: use only these colors (and mixes of them)."
    prompt:
      - text: |
          A folding wooden stool with a coral cushion, a slim honey-wood fishing rod
          resting on a forked stick with a red-and-cream float on its curled line, a
