  # ------------------------------------------------------------ doors

  - id: door-findik
    kind: prop
    name: door-findik
    chat: "Pofu · Doors"
    light: {cell: day, layer: subject}
    notes: "Slot H3: Fındık's door in the earth face, revealed with the workshop at island level 6."
    attach:
      - ref: approved:door-mochi
        role: "Mochi's door, the first of this family: match its size on the canvas, front-facing angle, frame, earth ring and finish exactly (do not draw it)."
      - ref: approved:workshop-1
        role: "Fındık's workshop: borrow its sage-green and honey colors (do not draw the workshop)."
      - ref: palette:world-props
        role: "The palette card for props: use only these colors (and mixes of them)."
    prompt:
      - text: |
          A small round wooden door set into soft earth, seen straight from
          the front, same family as the attached door: soft sage-green
          painted wood in a thick honey wooden frame, a small round window
          with a cream cross bar, a round knob, a flat honey doorstep, a
          little hanging sign shaped like a round gear (a shape, no letters)
          and a tiny wrench hanging on a nail beside the frame. A thin soft
          ring of caramel earth around the frame that fades to transparent.
          Centered on an empty transparent background, the same size as the
          attached door.
      - block: prop-style-v2
      - block: prop-avoid-v2
