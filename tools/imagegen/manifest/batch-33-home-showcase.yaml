# Batch 33: the home showcase, the "now" list (docs/product/home-layout.md,
# section 9). Gated on the pilot (batch-33-home-showcase-pilot): every family
# here copies a pilot master (the hive ladder edits hive-1; the materials,
# doors and lamps attach their pilot sibling as the family reference).
#
# What is in it (slot ids from home-layout.md):
#   hive-2..hive-5       the hive ladder, S6, IL9 onward (edits of hive-1)
#   material-*           the five other materials (moss is in the pilot)
#   door-findik, door-guest   earth-face doors H3 and H4
#   hill-gate, hill-gate-open the hill path's gate T0 (IL9 closed, IL10 open)
#   guest-stall          the visiting resident's stall on the harbor, G1
#   harbor-bell          the bell post at the bridge's harbor end, L4 (IL3)
#   frog-1, frog-sing    the pond's frogs (IL4) and the dusk choir
#   goat-work            the goat at work on the pier (S8)
#
# Not here, on purpose: island-level plate edits, the Tepe, pair overlays,
# visiting residents at home, season sets and golden edits wait for a concept
# review (home-layout.md section 9, "after review"). Glow, flames, bees,
# beams, fireflies and smoke are code. Every piece is painted under the day
# cell. A failed job is skipped after one retry; its dependents are skipped.
#
# Tracks: `hive` (hive-2 -> hive-5, in order), `materials`, `doors`, `gate`
# (hill-gate -> hill-gate-open), `harbor` (guest-stall, harbor-bell,
# goat-work), `frogs` (frog-1 -> frog-sing). Tracks are independent.

batch: batch-33-home-showcase
title: Home showcase (hive, materials, doors, gate, harbor pieces, frogs)
status: blocked
blocked_on:
  - "the lead's review of batch-33-home-showcase-pilot (path-lamp, hive-1, material-moss, door-mochi)"

refs:
  tea-stall-1: design/art/stations/tea-stall-1/tea-stall-1.png

defaults:
  variants: 2

jobs:
  - {id: tea-stall-1, kind: station, name: tea-stall-1, external: batch-01-slice}
  - {id: workshop-1, kind: station, name: workshop-1, external: batch-03-home-island, master: design/art/stations/workshop-1/workshop-1.webp}
  - {id: bagel-cart-1, kind: station, name: bagel-cart-1, external: batch-01-slice}
  - {id: island-main-l-v3, kind: world, name: island-main-l-v3, external: batch-05-fixes-pilot, master: design/art/masters/island-main-l-v3/island-main-l-v3.webp}
  - {id: harbor-goat, kind: char, name: harbor-goat, external: batch-14-harbor, master: design/art/masters/harbor-goat/harbor-goat.webp}
  - {id: path-lamp, kind: prop, name: path-lamp, external: batch-33-home-showcase-pilot}
  - {id: hive-1, kind: station, name: hive-1, external: batch-33-home-showcase-pilot}
  - {id: material-moss, kind: prop, name: material-moss, external: batch-33-home-showcase-pilot}
  - {id: door-mochi, kind: prop, name: door-mochi, external: batch-33-home-showcase-pilot}

  # ------------------------------------------------------------ hive

  - id: hive-2
    kind: station
    name: hive-2
    edit_of: hive-1
    chat: "Pofu · Hive"
    light: {cell: day, layer: subject}
    notes: "Hive level 2: two skeps and lavender."
    prompt:
      - text: |
          Add a second, smaller straw skep of the same golden-honey coils on its own low stump just behind and to the right of the first, and two more small clumps of lavender at the front. The first skep, its stump and the stepping stone stay as they are.
      - block: edit-keep-v1

  - id: hive-3
    kind: station
    name: hive-3
    edit_of: hive-2
    chat: "Pofu · Hive"
    light: {cell: day, layer: subject}
    notes: "Hive level 3: a painted hive box."
    prompt:
      - text: |
          Add a small painted wooden hive box behind the two skeps, on the left: a short stack of two rounded cream boxes with a soft sunflower-yellow gabled roof and one tiny painted sunflower on the front (a simple round shape, no letters). It is no taller than the height bar. Everything else stays.
      - block: edit-keep-v1

  - id: hive-4
    kind: station
    name: hive-4
    edit_of: hive-3
    chat: "Pofu · Hive"
    light: {cell: day, layer: subject}
    notes: "Hive level 4: a landing board and a water dish (the bee path over the garden is code)."
    prompt:
      - text: |
          Add a small honey wooden landing board under the first skep's entrance and, on the ground at the front right, a shallow round clay dish of pale water with three pebbles in it (the water a flat soft shape, no reflections). Everything else stays.
      - block: edit-keep-v1

  - id: hive-5
    kind: station
    name: hive-5
    edit_of: hive-4
    chat: "Pofu · Hive"
    light: {cell: day, layer: subject}
    notes: "Hive level 5 (complete): a little honey stand. Mochi's tea gets honey (story, no art)."
    prompt:
      - text: |
          Add a low honey wooden shelf at the front left holding three plump round honey jars of warm amber with cream cloth lids tied with string, and a tiny wooden honey dipper leaning on one jar. Everything else stays.
