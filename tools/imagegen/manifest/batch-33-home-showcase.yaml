  # ------------------------------------------------------------ frogs

  - id: frog-1
    kind: char
    name: frog-1
    size: 1024x1536
    chat: "Pofu · Residents"
    light: {cell: day, layer: subject}
    notes: "The pond's frogs (island level 4). One frog; the pond shows two or three (code tint and scale). Same family as the residents, small."
    attach:
      - ref: R1
        role: "The hamster, Pofu: match his art style, lighting and finish exactly (do not draw him)."
      - ref: approved:harbor-goat
        role: "The goat, a neighbor: match his size on the canvas, his eyes and his finish (do not draw him)."
      - ref: palette:character
        role: "The character palette card."
    prompt:
      - text: |
          Draw a small frog in exactly the same art style, lighting and finish
          as the attached hamster and goat. Same canvas rules: full body,
          sitting upright, front view, centered, feet on an invisible line at
          88% of the height, about 62% of the canvas width.
          CHARACTER: a round, chubby little frog of soft sage green with a
          pale cream belly and a few faint lighter freckles on the back,
          smooth velvety matte skin (no fur, no slime, no shine), two big
          round glossy dark espresso eyes on top of the head with one
          catchlight each, a wide gentle closed smile, small rounded front
          feet resting on the belly, back legs tucked in. Calm and content.
      - block: style-anchor-v1
      - block: negative-v1
      - text: "AVOID: fur, slime, warts, realistic frog anatomy, a long tongue, a lily pad, water, text, a ground shadow."

  - id: frog-sing
    kind: char
    name: frog-sing
    size: 1024x1536
    edit_of: frog-1
    chat: "Pofu · Residents"
    light: {cell: day, layer: subject}
    notes: "The dusk choir: the frog sings (the pond plays its frog loop at dusk from island level 4)."
    prompt:
      - text: |
          Edit the attached frog so it sings: its eyes close in two soft happy curves, its mouth opens in a small round "o", and its cream throat puffs out into a round soft pale bubble. Its body, colors, feet and size stay exactly as they are.
      - block: edit-keep-v1
      - text: "AVOID: musical notes, text, a ground shadow."
