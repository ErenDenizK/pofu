# Batch 25: exploration, never promoted (the backlog)
#
# Concept frames of the home island Ayçiçeği in five seasons and two extra
# moods, to decide whether seasons are an edit, a palette grade in code, or
# new plates. These are concept frames, not production plates: the island
# shape, camera and stations stay the attached island's. Complements the
# winter edit of batch 15.
#
# Tracks: `seasons`.
#
# BACKLOG (docs/design/art-production-plan.md#the-backlog): every job here is
# an EXPLORATION with an `x-` id. EXPLORATION RULES (AGENTS.md): do NOT run
# `promote`; commit the takes (WebP q90), the contact sheet and review.yaml
# under design/art/takes/<batch>/<id>/ and nothing else. No painted text
# anywhere. Never paint glass, UI chrome or buttons. A failed or refused job
# is recorded and skipped; the run continues with the next job. There is no
# pilot gate: run the jobs in the order written.
#
# Fresh variations: when the backlog comes round again, copy a job under a
# new id (`-v2`, `-v3`, ...) with a new angle, never the same prompt twice.

batch: batch-25-seasons
title: Seasons of Ayçiçeği (concept frames)
status: open

refs:
  tea-stall-1: design/art/stations/tea-stall-1/tea-stall-1.png

defaults:
  variants: 2

jobs:
  - {id: island-main-s, kind: world, name: island-main-s, external: batch-01-slice}
  - {id: cloud-sea, kind: world, name: cloud-sea, external: batch-04-sky}
  - {id: pofu, kind: char, name: pofu-r1, external: r1, master: design/art/masters/pofu-hamster-base-v1/pofu-hamster-base.png}

  - id: x-season-spring
    kind: plate
    name: x-season-spring
    size: 1536x1024
    canvas: 1536x1024
    chat: "Pofu · Exploration"
    light: {cell: day, layer: subject}
    notes: "Exploration. Spring blossom. Review: a clear season at a glance; the island is still the same island."
    attach:
      - ref: approved:island-main-s
        role: "The home island: the same painting, the same low camera (about 20 degrees), the same softness and scale of a floating island. Do not draw this island."
      - ref: approved:cloud-sea
        role: "The sea of clouds below every island: paint the clouds like this."
      - ref: R1
        role: "Style reference only (no characters unless asked): the hamster's soft painting and pastel colors."
    prompt:
      - text: |
          A concept painting for a cozy mobile game: Ayçiçeği, the small
          home island, in a new season. SPRING: soft pale-pink blossom on a
          young tree and petals drifting down, fresh light-green lawn with
          tiny white and yellow flowers, the sunflowers only small green
          shoots, pond fresh and bright, warm morning light, pale sky. The
          same island as the attached one, with the same shape, the same
          lawn outline, the same tea stall, windmill, pond, garden and round
          door in the same places, floating over a sea of clouds, from the
          same low camera. Peaceful and wondrous, never dramatic.
      - block: prop-style-v2
      - text: "AVOID: a border, text, harsh shadows, saturated or neon colors, dark moods, outlines, photorealism, a 3D render look, a different island shape, new buildings, characters"

