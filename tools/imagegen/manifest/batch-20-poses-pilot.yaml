# Resident poses, pilot (Mochi surprised, Simit happy)
#
# Certainty list item 3 (docs/design/art-production-plan.md): the home cast's
# missing poses, used by stations and the slice whatever the island design
# becomes. Mochi and Findik already have happy (eyes-happy) and sleepy
# (eyes-closed) from batch 06; Simit has only her base, work and ears poses.
# Missing: Mochi surprised, Findik surprised, Simit happy, sleepy, surprised.
# Character names stay (Mochi, Findik, Simit).
#
# Every pose is an EDIT of the approved master (same canvas 1024 x 1536, the
# face only), painted under the day cell with the light standard
# (docs/design/light-standard.md); no baked shadow.
# Pilot: one surprised and one happy, to lock the method on a bunny and a tabby.
#
# Tracks: `poses` (both at once).
batch: batch-20-poses-pilot
title: Resident poses, pilot (Mochi surprised, Simit happy)
status: open

defaults:
  variants: 2

jobs:
  - {id: mochi-v2, kind: char, name: mochi-v2, external: batch-03-home-island}
  - {id: simit-kitten, kind: char, name: simit-kitten, external: retry-2026-11-03}

  - id: mochi-surprised
    kind: char
    name: mochi-surprised
    size: 1024x1536
    edit_of: mochi-v2
    chat: "Pofu · Residents"
    light: {cell: day, layer: subject}
    notes: "Mochi surprised (a sudden visitor, a letter). Reuses the face of mochi-v2; code adds a small jump."
    prompt:
      - text: |
          Edit the attached bunny, Mochi, into a surprised reaction. Change only the face and ears: the mouth becomes a small round soft "o", both eyes grow slightly rounder and wider with their catchlights kept, the long ears lift a little more upright. Body, paws, colors and size stay exactly as they are.
      - block: edit-keep-v1
      - text: "AVOID: tears, a worried look, a curl on the head, a ground shadow, text, motion lines."

  - id: simit-happy
    kind: char
    name: simit-happy
    size: 1024x1536
    edit_of: simit-kitten
    chat: "Pofu · Residents"
    light: {cell: day, layer: subject}
    palettes: [character-tabby]
    notes: "Simit happy (a sale, a pat)."
    prompt:
      - text: |
          Edit the attached kitten, Simit, into her happy face. Change only the eyes and mouth: both eyes become happy closed arcs, the classic smiling ^ shape, each a thick soft dark upward-curved arc at the height of the top of the original eye, with fur below it; the "w" mouth widens into a slightly bigger smile. Everything else stays exactly as it is.
      - block: edit-keep-v1
      - text: "AVOID: tears, a worried look, a curl on the head, a ground shadow, text, motion lines."
