# Batch 30b: exploration, never promoted (the backlog)
#
# A season set of docs/product/home-progression.md section 10 (one set per
# season, bought with seeds, first shown in its season but always on sale),
# four pieces each as separate props on the decor guide, plus a cozy composed
# corner per set. Season looks themselves (light, snow, leaves) are code and
# batch 25. This batch: Bahar (spring) and Yaz (summer).
#
# Tracks: `decor`, `seasons`.
#
# BACKLOG (docs/design/art-production-plan.md#the-backlog): every job here is
# an EXPLORATION with an `x-` id. EXPLORATION RULES (AGENTS.md): do NOT run
# `promote`; commit the takes (WebP q90), the contact sheet and review.yaml
# under design/art/takes/<batch>/<id>/ and nothing else. No painted text
# anywhere. Never paint glass, UI chrome or buttons. A failed or refused job
# is recorded and skipped; the run continues with the next job. There is no
# pilot gate: run the jobs in the order written.
#
# Fresh variations: when the backlog comes round again, copy a job under a
# new id (`-v2`, `-v3`, ...) with a new angle, never the same prompt twice.

batch: batch-30b-decor-seasons-1
title: "Season decor sets 1 of 2: Bahar and Yaz (decor guide)"
status: open

refs:
  tea-stall-1: design/art/stations/tea-stall-1/tea-stall-1.png

defaults:
  variants: 2

jobs:
  - {id: decor-bench, kind: prop, name: decor-bench, external: batch-08-decor-pilot}
  - {id: island-main-s, kind: world, name: island-main-s, external: batch-01-slice}
  - {id: cloud-sea, kind: world, name: cloud-sea, external: batch-04-sky}

  - id: x-decor-bahar-ribbon-tree
    kind: prop
    name: x-decor-bahar-ribbon-tree
    size: 1024x1024
    canvas: 1024x1024
    chat: "Pofu · Decor"
    light: {cell: day, layer: subject}
    notes: "Exploration. Bahar (spring): the wish-ribbon tree. Review: a small tree hung with ribbons, the Hıdırellez wish tree; reads at 64 px."
    attach:
      - ref: decor-guide
        role: "The decor guide: footprint ellipse, anchor cross and height bar. Follow it, then remove it."
      - ref: approved:decor-bench
        role: "The first piece of the decor family: match its painting, light, colors, finish and scale exactly (do not draw the bench unless asked)."
      - ref: palette:world-props
        role: "The palette card for props: use only these colors (and mixes of them)."
    prompt:
      - text: |
          A small young tree with a slim honey trunk and a round crown of soft
          fresh-green leaves with a few pale blossoms, hung all over with a dozen
          short soft ribbons in rose, mint, mustard, lilac and cream tied to its
          branches, on a small mound of earth with a ring of stones. It stands on
          the guide's ground ellipse, centered on the cross, never wider than the
          ellipse and never taller than the height bar; it is small, a third of the
          image width at most.
      - block: prop-style-v2
      - block: prop-avoid-v2

