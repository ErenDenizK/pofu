        role: "The sea of clouds below every island: paint the clouds like this."
      - ref: approved:decor-bench
        role: "The first piece of the decor family: match its painting, light, colors, finish and scale exactly (do not draw the bench unless asked)."
      - ref: palette:world-props
        role: "The palette card for props: use only these colors (and mixes of them)."
    prompt:
      - text: |
          A concept painting for a cozy mobile game: one quiet corner of the home
          island Ayçiçeği, dressed with a decor set, from the same low camera (about
          20 degrees) as the attached island and in its painting, softly cropped to
          a corner of lawn, a few path stones and the edge of the island over the
          clouds. Spring corner: a young tree hung with many soft wish ribbons in
          rose, mint, mustard and cream, two clay pots of tulips in red, rose and
          cream, a small kite with a ribbon tail staked in the grass, and a round
          twig nest with three pale speckled eggs on a stump, fresh light-green lawn
          with tiny white flowers. Warm daylight, calm, uncluttered, every piece
          small and in the scale of the attached bench; no characters.
      - block: prop-style-v2
      - text: "AVOID: a border, text, letters, harsh shadows, saturated colors, outlines, characters or animals, a different island shape, photorealism, a 3D render look"

