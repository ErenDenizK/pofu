# Batch 07: night light, painted only where the shape changes
# (docs/design/art-production-plan.md, "Day and night: code first").
#
# Lead's decision (2026-11-02), after batch-07-light-pilot: night light comes
# mostly from code (the night grade, glow sprites, halos, flicker). Painted
# lit overlays exist only for the light-carrying stations, one per station,
# at the first level that carries the light. tea-stall-1-lit was accepted; tea-stall-5-lit
# is dropped (its lit change was barely visible, and one overlay serves the
# chain). The pilot's QA failure on tea-stall-5-lit was the check, not the art:
# edits are now anchored against their parent's bounds.
#
# L1 where the station carries light at L1 (the workshop's doorway). The
# windmill's windows (window boxes) and the pond's lanterns first appear at
# L5, so their lit edit is of L5, the first level that has the light.
#
# Method as in the pilot: each job is an edit that changes only the
# light-carrying part; the lead derives the emissive overlay by difference
# against the day master. Review check: edit_stability high (above 0.9),
# nothing outside the lit part got brighter or changed color.
#
# Tracks: `light` (all three; they need only their station master).

batch: batch-07-light
title: Night light (workshop doorway, windmill windows, pond lanterns, lit)
status: open

defaults:
  variants: 2

jobs:
  - {id: workshop-1, kind: station, name: workshop-1, external: batch-03-home-island}
  - {id: windmill-5, kind: station, name: windmill-5, external: batch-03-home-island}
  - {id: pond-5, kind: station, name: pond-5, external: batch-03-home-island}

  - id: workshop-1-lit
    kind: station
    name: workshop-1-lit
    edit_of: workshop-1
    chat: "Pofu · Workshop"
    notes: "Source of the doorway's emissive overlay (difference against workshop-1)."
    prompt:
      - text: |
          Light the workshop from inside: the open, round-topped doorway now
          shows a warm honey-amber glow filling its opening, brightest low
          in the middle, painted as soft broad shapes with a hint of a
          hanging lamp's round shape inside. Only the doorway's inside
          changes: no glow, light or color change on the wood, the roof,
          the bench or anything else (the app adds the glow and the light
          pool around it).
      - block: edit-keep-v1
      - text: "AVOID: light rays, a glow outside the doorway, light on other objects, blown yellow-white highlights, text."

  - id: windmill-5-lit
    kind: station
    name: windmill-5-lit
    edit_of: windmill-5
    chat: "Pofu · Windmill"
    notes: "Source of the two windows' emissive overlay (difference against windmill-5)."
    prompt:
      - text: |
          Light the two small round windows on the tower from inside: each
          window glass becomes a soft warm honey-amber, a little brighter
          toward its center, with the window frame and the flower boxes
          unchanged. Only the two window glasses change: no glow, light or
          color change on the tower, the flowers, the cap or the sails (the
          app adds the glow around them).
      - block: edit-keep-v1
      - text: "AVOID: light rays, a glow outside the windows, lit flowers, blown yellow-white highlights, text."

  - id: pond-5-lit
    kind: station
    name: pond-5-lit
    edit_of: pond-5
    key: blue
    chat: "Pofu · Lily pond"
    notes: "Source of the three lanterns' emissive overlay (difference against pond-5)."
    prompt:
      - text: |
          Light the three floating paper lanterns from inside: each paper
          glows a warm honey-gold, brightest at its center, with its ribs
          unchanged. Light only inside each lantern's own outline: no halo,
          no glow, no reflection on the water and no light on the pads (the
          app draws the glow and the reflection).
      - block: edit-keep-v1
      - text: "AVOID: halos, rays, reflections, lit water, blown yellow-white highlights, text."
