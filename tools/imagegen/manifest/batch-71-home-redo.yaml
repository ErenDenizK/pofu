  light:
    cell: day
    layer: subject
  palettes:
  - world-foliage
  - world-props
  acceptance:
    exploration: true
    edit_mode: recolor
  notes: 'Soft summer rain as an edit of the final (I1 rain). Review: lilac-grey sky, the island stays
    bright (earth L* ~75), puddles, drooping sunflower heads, fine soft rain; far islands fade into the
    rain but stay visible. REDO v2 (lead review 2026-11-10): A gentle summer rain on the same picture:
    the island keeps its colours, only a little darker and wet-looking, with soft reflections on the paths
    and the pond; the sky a soft blue-grey; thin light rain streaks; the lanterns and windows glow warmly.'
  attach:
  - ref: i1-rain
    role: 'The rain target: this soft lilac-grey rain, the island still bright, small puddles, drooping
      sunflowers, fine soft rain streaks.'
  prompt:
  - text: |
      Edit the attached painting into the same scene in a soft summer
      rain, as in the attached rain: a soft lilac-grey overcast sky, fine
      gentle rain streaks, the island still bright and clean, small
      puddles on the path, the giant sunflower's head bowed a little,
      wet sheen kept matte and soft, rings on the pond. The far islands
      and the cloud-whale fade softly into the rain but stay visible.
      Everything stays in its place, the same shapes and sizes.
      A gentle summer rain on the same picture: the island keeps its colours, only a little darker and wet-looking, with soft reflections on the paths and the pond; the sky a soft blue-grey; thin light rain streaks; the lanterns and windows glow warmly.
  - block: edit-keep-v1
  - text: 'AVOID: a dark or grey-blue gloomy scene, a storm, hard diagonal rain, new objects, characters,
      text, moving anything, a grey veil over the whole image, a desaturated island, a heavy dark storm'
