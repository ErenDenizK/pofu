# Batch 27: exploration, never promoted (the backlog)
#
# Look-dev for the painted side of ADR-0018's hybrid UI: tileable surface
# materials (paper, linen, wood, glazed clay, frosted glass, felt) and small
# ornaments (ribbons, stamps, wax seals, tags). Glass in the final UI is native;
# the frosted-glass study here is only a reference for how painted material sits
# next to it, and never ships as UI glass. Materials are flat, opaque, seamless
# squares seen straight on; ornaments are transparent sprites.
#
# Tracks: `materials`, `ornaments`.
#
# BACKLOG (docs/design/art-production-plan.md#the-backlog): every job here is
# an EXPLORATION with an `x-` id. EXPLORATION RULES (AGENTS.md): do NOT run
# `promote`; commit the takes (WebP q90), the contact sheet and review.yaml
# under design/art/takes/<batch>/<id>/ and nothing else. No painted text
# anywhere. Never paint glass, UI chrome or buttons. A failed or refused job
# is recorded and skipped; the run continues with the next job. There is no
# pilot gate: run the jobs in the order written.
#
# Fresh variations: when the backlog comes round again, copy a job under a
# new id (`-v2`, `-v3`, ...) with a new angle, never the same prompt twice.

batch: batch-27-ui-materials
title: Tileable surface materials and small UI ornaments
status: open

refs:
  tea-stall-1: design/art/stations/tea-stall-1/tea-stall-1.png

defaults:
  variants: 2

jobs:
  - {id: island-main-s, kind: world, name: island-main-s, external: batch-01-slice}
  - {id: cloud-sea, kind: world, name: cloud-sea, external: batch-04-sky}
  - {id: pofu, kind: char, name: pofu-r1, external: r1, master: design/art/masters/pofu-hamster-base-v1/pofu-hamster-base.png}

  - id: x-mat-paper
    kind: plate
    name: x-mat-paper
    size: 1024x1024
    canvas: 1024x1024
    transparent: false
    chat: "Pofu · UI materials"
    light: {cell: day, layer: subject}
    notes: "Exploration. Warm cream paper. Review: seamless; no fibres louder than a whisper."
    attach:
      - ref: R1
        role: "Style reference only (no characters unless asked): the hamster's soft painting and pastel colors."
      - ref: approved:island-main-s
        role: "The home island: the palette and softness of the painting (do not draw it)."
    prompt:
      - text: |
          A seamless tileable surface material swatch for a cozy mobile
          game's painted UI. The material: warm cream handmade paper, with a
          few very faint broad cloudy variations in tone and the softest
          hint of paper fibres. Painted in the same soft painterly picture-
          book style as the attached hamster and island: soft airbrushed
          shading, milky pastel colors, broad low-contrast forms instead of
          fine detail, matte, no outlines, no grain, no photographic
          texture, no highlights. Seen straight on, perfectly flat, evenly
          lit with no light direction and no shadow, filling the whole
          square. It must tile seamlessly: the left edge continues into the
          right edge and the top into the bottom, with nothing that stands
          out as a repeat. The LIGHT block of this prompt sets only the
          warmth of the colors here: paint no key light direction, no
          contact shadow and no depth.
      - text: "AVOID: text, letters, numbers, logos, a border, a frame, objects, a vignette, a seam, a visible repeating motif, strong contrast, black or near-black, saturated colors, photorealism, a 3D render look"

