# Batch 40: the home ladder gaps (production; real ids, promoted on pass).
#
# AUDIT (lead's brief, 2026-11-05). Compared: docs/product/home-progression.md
# section 4.1 and 4.2 (every station L1 to L5), section 8 (decor) and
# docs/product/home-layout.md (sections 3 and 9) against the promoted masters
# (design/art/stations, design/art/masters, tools/assets/integration_map.json).
#
# Result: the eight ladders are COMPLETE. garden, tea-stall, pond, workshop,
# windmill, bagel-cart, pier and lighthouse each have masters for L1 to L5
# (40 of 40), and hive has L1 to L3 (hive-4 and hive-5 are owned by
# batch-33-home-showcase). The decor pieces the game shows have masters
# (decor-bench, decor-sailboat, decor-mailbox, path-lamp). So no L1-L5 level
# is missing a master; the visible step a player CAN still not see is the
# L3 style choice of section 4.2 ("rose stripes or Iznik blue", "red or green
# shutters", "plain or painted sails", "red or blue umbrella", "red or blue
# stripes"), where only one painted option exists for each of five stations.
# This batch paints the second option of each, at L3, L4 and L5 (a choice must
# carry through L4 and L5; home-layout.md section 9, row 21): 15 jobs.
#
# Method (the station ladder method of batch-03 and batch-21, with the
# recolor edits that row 21 recommends): each job is an EDIT of the base
# master of the same level (the option already painted), so the second option
# keeps its footprint, anchor, camera and every part, and the two options
# swap in place. A level's second option is never built on the other
# level's second option, so errors do not compound along the chain; every job
# needs only its own parent, all of which are promoted. The base master stays
# the default (option A) and the one the game shows until the player chooses.
#
# Option B per station (what changes; everything else stays exactly the same):
#   tea-stall    Iznik blue: the awning stripes and the table cloth (and the L5
#                tile roof) turn from rose to Iznik cobalt-and-white
#   workshop     green shutters: a pair of sage-green shutters is added beside
#                the arched doorway and round the tool board; DOUBT: the base
#                has no shutters at all, so "red" is not painted; A = plain, B = green
#   windmill     painted sails: the cream sail cloths carry a simple painted
#                pattern (sage and honey bands with a round sun)
#   bagel cart   blue umbrella: the coral-and-cream umbrella (and the L5 kiosk
#                roof) turn sea-blue and cream
#   lighthouse   blue stripes: the coral stripes turn sea-blue
#
# Review checks: the silhouette and every part are the base's (a shape edit is
# a fail); only the named parts changed colour or gained the named part; the
# B option reads as a different choice at 28 pt; the finish matches the base.
#
# Left out (the lead lists these in the PR): hive-4 and hive-5 (batch 33), the
# five materials (batch 33), decor-lanterns (a new prop with no parent, batch
# 08), the plate edits for island levels 2 to 9 (home-layout section 9, row 17,
# waits for x-home-il5), golden L10 masters (row 29, last), the lit overlays
# for L2 to L5 (batch 07 and batch 36 own the lit ladder), and the L6 to L10
# mastery overlays (code first).
#
# Tracks: one per station: `tea-stall`, `workshop`, `windmill`, `bagel-cart`,
# `lighthouse`; the three levels of a track are independent of each other.

batch: batch-40-home-ladder-gaps
