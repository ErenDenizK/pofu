  notes: 'Exploration. Pofu stickers 1 of 2: happy, sleepy, surprised, proud, sulky. Review: each emotion
    reads at emoji size from the mouth and eyes alone; he is always unmistakably Pofu. Fresh second-cycle
    body/head/interaction staging with exact original counts, emotions and layout; exploration only, never
    promote.'
  attach:
  - ref: R1
    role: 'Pofu, the hamster: his exact look, fur, colors, eyes and signature curl.'
  prompt:
  - text: 'A sticker sheet of five full-body poses of Pofu the hamster, in

      his exact attached look, each a different emotion: (1) happy, eyes

      closed in a smile, paws up; (2) sleepy, eyes half closed, head

      drooping, a tiny yawn; (3) surprised, eyes wide, mouth a small

      round O, fur puffed; (4) proud, chest out, chin up, eyes bright, a

      small content smile; (5) sulky, cheeks puffed, a small pout, eyes

      looking sideways, arms folded at the chest. Three on the top row,

      two on the bottom. On a plain transparent background, in a loose

      grid with wide empty space around each sticker, none touching or

      overlapping another, each drawn complete with its whole body. No

      text, no speech bubbles, no floating hearts or sparkles unless

      named.

      '
  - text: 'FRESH VARIATION: retain the five original emotions and their exact actions, in the same reading
      order and three-above/two-below layout. Give happy Pofu a tiny buoyant knee bend while both paws
      remain up and eyes smile shut. Sleepy Pofu lets his head droop gently toward one shoulder, with
      the original half-closed eyes and tiny yawn. Surprised Pofu rocks back slightly with his puffed
      fur, wide eyes and small O mouth. Proud Pofu turns his chest a little to the left while keeping
      chin up and bright eyes. Sulky Pofu angles his body slightly right while his sideways eyes look
      left, arms still folded and cheeks puffed. Keep the complete signature forehead curl on EVERY Pofu;
      no additional prop or ornament.'
  - block: style-anchor-v2
  - text: 'SHEET LAYOUT: preserve the exact count, original emotion order and source grid. Each single-character
      sticker has its whole body and natural silhouette complete; each duo group contains the named two
      characters only. Leave broad transparent cut-out gaps between separate stickers/groups and keep
      all extremities inside the canvas. Touching within the explicitly requested hug, shared sleep or
      tea clink is allowed; separate groups never touch. The grid is invisible: no boxes, lines, labels,
      numerals, emotion names, speech bubbles, white sticker borders, floor or background. The numbered
      descriptions identify positions only and must not be painted as text. No floating decoration except
      the source''s explicitly named tears.'
  - text: 'STYLE SCOPE AFTER GENERIC STYLE: use each resident''s OWN attached reference for anatomy, fur/spine
      type, colours and distinctive silhouette; R1 supplies family finish, not a hamster redesign of other
      residents. Only Pofu has his signature forehead curl, on every Pofu depiction; no bunny, kitten,
      hedgehog or goat inherits it. Fine soft fur belongs only on furry character surfaces. Keep hedgehog
      spines as soft rounded shapes, never sharp needles or replaced by a generic fur ball. Do not add
      unrequested clothing, accessories, extra limbs or background objects. Light follows the day LIGHT
      block; no baked cast ground shadows, atmospheric veil, grain, outline, UI chrome or painted text.'
  - text: 'AVOID: a white sticker border, outlines, a floor, a ground shadow, cast shadows, text, letters,
      speech bubbles, a curl on any head except Pofu''s, extra limbs, a background'
