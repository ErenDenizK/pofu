          wise. On her back is a lush floating island: a small grove of
          rounded trees, a gentle waterfall pouring off the island's edge
          into the clouds with a soft mist, flowering meadow and a stone
          path. The same lantern hook of dark honey wood now holds one small
          lantern, and the scar beside it, shaped like a switched-off light
          bulb, now glows softly in warm gold. Blue night under a huge moon,
          the lantern on the hook lit warm gold and the scar glowing softly
          in the same gold, the waterfall silver in the moonlight, fireflies
          in the grove. Seen from the same low camera as the attached
          island, floating over a sea of clouds. Peaceful and wondrous,
          never dramatic.
      - text: |
          FRESH V2 VARIATION: early winter, not the original mild-season
          study. A thin soft dusting of snow rests on the back patch,
          bench and mooring post without hiding their silhouettes; small
