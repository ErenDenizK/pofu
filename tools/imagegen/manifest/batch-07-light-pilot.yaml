# Batch 07, pilot: night light for the çay ocağı
# (docs/design/art-production-plan.md, "Day and night: code first").
#
# The split (founder, 2026-11-02: "some visuals can be fixed in code, some
# could have their own day and night versions"):
# - CODE does the night grade (WorldGrade), glow halos, bloom, flicker,
#   steam, fireflies and warm light pools on the lawn.
# - PAINT only what changes SHAPE at night: here, the fire inside the
#   çaydanlık's little burner. The lit string-light bulbs, the amber tea
#   glasses and the warm light on the counter are code (a glow sprite at
#   each bulb, a tint under a mask).
#
# Method: each job is an edit of the day master that changes only the
# burner. The lead turns it into an emissive overlay by difference against
# the master (code), registered to it pixel for pixel, and the app draws it
# above the night grade so the fire stays warm while the world goes blue.
# tea-stall-1-lit and tea-stall-5-lit test whether one overlay serves every level (the
# burner is the same region on all five); if it does, later stations get
# one lit edit, not five.
#
# The warm re-take: measured, the çay ocağı is not cold in hue (every
# pixel stays in warm hues) but its chain FADED: median chroma 31 at tea-stall-1,
# 22, 18, 14, then 11 at tea-stall-5, because each level re-drew the soft-locked
# parent and was locked again. That is a grade problem: the harmony grade
# (tools/assets/harmony.py) restores it in code. A re-take of the chain is
# in this batch's follow-up only if the restored tea-stall-5 still reads cold to
# the founder.
#
# Tracks: `cay` (both jobs; they may run at once).

batch: batch-07-light-pilot
title: Night light, pilot (the çay ocağı's burner, lit, at L1 and L5)
status: blocked
blocked_on:
  - "delivered and merged (#74); closed 2026-11-03, see the Log in docs/design/art-production-plan.md"

defaults:
  variants: 2

jobs:
  - {id: tea-stall-1, kind: station, name: tea-stall-1, external: batch-01-slice}
  - {id: tea-stall-5, kind: station, name: tea-stall-5, external: batch-01-slice}

  - id: tea-stall-1-lit
    kind: station
    name: tea-stall-1-lit
    edit_of: tea-stall-1
    chat: "Pofu · Çay ocağı"
    notes: >-
      Source of the burner's emissive overlay (the lead derives it by
      difference). Review check: only the burner changed (edit_stability
      high, above 0.9), the flame is a soft painted shape inside the
      burner's opening, and nothing outside the burner got brighter.
    prompt:
      - text: |
          Light the little round burner under the çaydanlık: inside its
          opening, a small, soft flame of warm honey and coral shapes, and
          the inside of the burner glows warm amber. Paint the flame as a
          few soft, rounded tongues with no hard edges, matte, no sparks.
          Only the burner changes: no glow, no light and no color change on
          the teapot, the counter or anything else (the app adds the glow
          and the warm light around it).
      - block: edit-keep-v1
      - text: "AVOID: a big fire, sparks, smoke, steam, a glow outside the burner, light on other objects, yellow-white blown highlights, text."

  - id: tea-stall-5-lit
    kind: station
    name: tea-stall-5-lit
    edit_of: tea-stall-5
    chat: "Pofu · Çay ocağı"
    notes: >-
      The same change on the top level, to test whether tea-stall-1-lit's overlay
      fits every level. Same review check as tea-stall-1-lit.
    prompt:
      - text: |
          Light the little round burner under the çaydanlık: inside its
          opening, a small, soft flame of warm honey and coral shapes, and
          the inside of the burner glows warm amber. Paint the flame as a
          few soft, rounded tongues with no hard edges, matte, no sparks.
          Only the burner changes: no glow, no light and no color change on
          the teapot, the counter, the roof, the bulbs or anything else (the
          app adds the glow and the warm light around it).
      - block: edit-keep-v1
      - text: "AVOID: a big fire, sparks, smoke, steam, lit bulbs, a glow outside the burner, light on other objects, yellow-white blown highlights, text."
