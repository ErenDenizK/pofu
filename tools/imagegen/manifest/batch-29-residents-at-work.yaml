# Batch 29: exploration, never promoted (the backlog)
#
# Concept frames from docs/product/home-progression.md section 6: each planned
# home resident working at their fixed favourite station (Mochi at the tea
# stall, Simit at the bagel cart, the goat at the pier, the frogs at the pond,
# Findik at the workshop, Koke's sprout at the pond), then the heart level-up
# moment (an outfit or a small gift) for five of them. They decide the working
# pose and the camera crop; the approved character and station masters are
# attached and must not be redesigned. Characters keep Pofu's finish: soft
# fur, big glossy dark eyes with a catchlight each, no curl on any head but
# Pofu's.
#
# Tracks: `residents`, `hearts`.
#
# BACKLOG (docs/design/art-production-plan.md#the-backlog): every job here is
# an EXPLORATION with an `x-` id. EXPLORATION RULES (AGENTS.md): do NOT run
# `promote`; commit the takes (WebP q90), the contact sheet and review.yaml
# under design/art/takes/<batch>/<id>/ and nothing else. No painted text
# anywhere. Never paint glass, UI chrome or buttons. A failed or refused job
# is recorded and skipped; the run continues with the next job. There is no
# pilot gate: run the jobs in the order written.
#
# Fresh variations: when the backlog comes round again, copy a job under a
# new id (`-v2`, `-v3`, ...) with a new angle, never the same prompt twice.

batch: batch-29-residents-at-work
title: "Residents at their favourite station, and the heart level-up moment"
status: open

refs:
  tea-stall-1: design/art/stations/tea-stall-1/tea-stall-1.png

defaults:
  variants: 2

jobs:
  - {id: mochi-v2, kind: char, name: mochi-v2, external: batch-03-home-island}
  - {id: simit-kitten, kind: char, name: simit-kitten, external: retry-2026-11-03}
  - {id: harbor-goat, kind: char, name: harbor-goat, external: retry-2026-11-03}
  - {id: findik, kind: char, name: findik-base, external: batch-03-home-island}
  - {id: tea-stall-5, kind: station, name: tea-stall-5, external: batch-01-slice}
  - {id: bagel-cart-5, kind: station, name: bagel-cart-5, external: batch-05-fixes}
  - {id: pond-5, kind: station, name: pond-5, external: batch-03-home-island}
  - {id: workshop-5, kind: station, name: workshop-5, external: batch-05-fixes}
  - {id: pier-1, kind: station, name: pier-1, external: batch-21-harbor-ladders}

  - id: x-work-mochi
    kind: plate
    name: x-work-mochi
    size: 1024x1024
    canvas: 1024x1024
    chat: "Pofu · Residents"
    light: {cell: day, layer: subject}
    notes: "Exploration. Mochi working at her favourite station, the tea stall. Review: she is clearly the same Mochi, busy and content; the pour and the glasses read at 64 px."
    attach:
      - ref: R1
        role: "Pofu, the hamster: match his art style, lighting, level of fluff and eye language exactly (do not draw him unless asked)."
      - ref: approved:mochi-v2
        role: "Mochi, the bunny: her exact look, fur, colors, eyes and size."
      - ref: approved:tea-stall-5
        role: "The finished tea stall (level 5): match its painting, finish, scale and colors."
      - ref: palette:world-props
        role: "The palette card for props: use only these colors (and mixes of them)."
    prompt:
      - text: |
          A concept painting for a cozy mobile game, a working-pose frame at one
          station of the home island, seen from the same low front three-quarter
          camera as the attached station, in warm daylight, the scene cropped close
          with a soft cream-and-sage ground under the station and sky behind it.
          Mochi, the bunny of the attached image, stands behind the tea stall
          counter pouring amber tea from a small rose-clay teapot in a high gentle
          arc into a tulip-shaped glass on a saucer, a second glass already full
          beside it, her ears relaxed, a small content smile, eyes on the glass, a
          wisp of soft steam. The finished tea stall of the attached image stays
          exactly as it is.
      - block: prop-style-v2
      - text: "AVOID: a border, text, letters, harsh shadows, saturated colors, outlines, a curl on any head except Pofu's, extra limbs, a different station, a changed character design, photorealism, a 3D render look"

