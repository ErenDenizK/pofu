# Batch 23: exploration, never promoted (the backlog)
#
# An emoji and sticker set for messages, widgets and marketing, on transparent
# backgrounds, in the exact style of the approved characters. Each job is a
# sheet of stickers laid out with generous clear space between them so a later
# cut-out is clean (code or the lead slices them). Stickers have no white
# sticker border (the pipeline forbids it); the characters stand alone.
#
# Tracks: `pofu`, `mochi`, `residents`, `duo`.
#
# BACKLOG (docs/design/art-production-plan.md#the-backlog): every job here is
# an EXPLORATION with an `x-` id. EXPLORATION RULES (AGENTS.md): do NOT run
# `promote`; commit the takes (WebP q90), the contact sheet and review.yaml
# under design/art/takes/<batch>/<id>/ and nothing else. No painted text
# anywhere. Never paint glass, UI chrome or buttons. A failed or refused job
# is recorded and skipped; the run continues with the next job. There is no
# pilot gate: run the jobs in the order written.
#
# Fresh variations: when the backlog comes round again, copy a job under a
# new id (`-v2`, `-v3`, ...) with a new angle, never the same prompt twice.

batch: batch-23-stickers
title: Sticker and emoji set (Pofu, Mochi, Simit, Fındık, the goat)
status: open

refs:
  tea-stall-1: design/art/stations/tea-stall-1/tea-stall-1.png

defaults:
  variants: 2

jobs:
  - {id: island-main-s, kind: world, name: island-main-s, external: batch-01-slice}
  - {id: cloud-sea, kind: world, name: cloud-sea, external: batch-04-sky}
  - {id: pofu, kind: char, name: pofu-r1, external: r1, master: design/art/masters/pofu-hamster-base-v1/pofu-hamster-base.png}
  - {id: mochi-v2, kind: char, name: mochi-v2, external: batch-03-home-island}
  - {id: findik, kind: char, name: findik-base, external: batch-03-home-island}
  - {id: simit-kitten, kind: char, name: simit-kitten, external: retry-2026-11-03}
  - {id: harbor-goat, kind: char, name: harbor-goat, external: retry-2026-11-03}

  - id: x-sticker-pofu-1
    kind: sheet
    name: x-sticker-pofu-1
    size: 1536x1024
    canvas: 1536x1024
    transparent: true
    chat: "Pofu · Stickers"
    light: {cell: day, layer: subject}
    notes: "Exploration. Pofu stickers 1 of 2: happy, sleepy, surprised, proud, sulky. Review: each emotion reads at emoji size from the mouth and eyes alone; he is always unmistakably Pofu."
    attach:
      - ref: R1
        role: "Pofu, the hamster: his exact look, fur, colors, eyes and signature curl."
    prompt:
      - text: |
          A sticker sheet of five full-body poses of Pofu the hamster, in
          his exact attached look, each a different emotion: (1) happy, eyes
          closed in a smile, paws up; (2) sleepy, eyes half closed, head
          drooping, a tiny yawn; (3) surprised, eyes wide, mouth a small
          round O, fur puffed; (4) proud, chest out, chin up, eyes bright, a
          small content smile; (5) sulky, cheeks puffed, a small pout, eyes
          looking sideways, arms folded at the chest. Three on the top row,
          two on the bottom. On a plain transparent background, in a loose
          grid with wide empty space around each sticker, none touching or
          overlapping another, each drawn complete with its whole body. No
          text, no speech bubbles, no floating hearts or sparkles unless
          named.
      - block: prop-style-v2
      - text: "AVOID: a white sticker border, outlines, a floor, a ground shadow, cast shadows, text, letters, speech bubbles, a curl on any head except Pofu's, extra limbs, a background"

