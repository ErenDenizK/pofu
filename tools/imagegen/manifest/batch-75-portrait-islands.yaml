# Batch 75: portrait sky-set masters for the four islands (exploration; x- ids, never promoted).
#
# WHY (ADR-0025): the landscape plates leave about 40% of a portrait phone screen as flat
# mist and sky. Each world screen is an island plate over a sky set (gradient sky, far and
# mid clouds, distant isles, cloud sea) split from ONE painted portrait master per island
# and light, never generated separately. This batch paints those masters: 16 jobs.
#
# WHAT:
#   Phase A (pilots, 4 jobs): per island its stage-4 portrait outpaint, x-<island>-portrait-s4-day
#     (the picked stage-4 plate keeps its own light: Emanet golden, Mehtap and Revontuli night).
#     The sky and cloud sea are painted rich, slightly more vivid than home's, still in the
#     island's colour band; the island itself is unchanged.
#   Phase B (light edits, 8 jobs): per island two light edits of its pilot, the two of
#     day/golden/night the pilot does not have: x-<island>-sky-golden|night|day.
#   Phase C (rain skies, 4 jobs): per island x-<island>-sky-rain, a soft overcast rain
#     light with colours kept. These are the TARGET of an offline colour-transfer pilot (the
#     lead fits it from each island's own painted pair); they ship only if the founder approves.
#   Order: Phase A for all four islands (up to three tracks), then each island's Phase B and C
#   as soon as its pilot exists. Day and night cells of the sets stay painted here.
# PROVISIONAL AUTO-PICK: a pilot that is not picked yet never blocks its edits; run.py stands
# in the pilot's QA auto-pick (flagged provisional in the sidecar). The lead reviews in its own
# round and, if a pilot is replaced, that island's edits are redone.
# FALLBACKS: a refused or failed job is recorded in review.yaml and skipped, the run continues.
# If the island looks moved, redrawn or healed, keep both takes, note it in review.yaml and go
# on: the ingest re-pastes the island band over the master anyway, so only the sky, the cloud
# sea and the seam matter. If a take shows a flat gradient or a haze band, keep both takes,
# note it and go on.
#
# OUTPAINT PRE-STEP (tools/imagegen/run.py, `outpaint: {anchor_y: f}`, tests in
# tools/imagegen/tests/test_outpaint.py): the pilots' edit input is the parent scaled to the
# canvas width (x 2/3), placed on a transparent 1024x1536 canvas with its vertical centre at 52%
# of the height, with a mask (white = paint, black = keep) as the second image. The ingest then
# re-pastes the original island band over the result with a feathered seam.
#
# EXPLORATION RULES (AGENTS.md): no `promote`; commit the takes (WebP q90), the contact sheet
# and review.yaml under design/art/takes/<batch>/<id>/. No characters, no text.

batch: batch-75-portrait-islands
title: 'Portrait sky-set masters: stage-4 pilots, light edits and rain skies for Çağlayan, Emanet, Mehtap and Revontuli'
status: open
