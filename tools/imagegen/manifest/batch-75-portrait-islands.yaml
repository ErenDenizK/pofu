  - id: x-caglayan-portrait-s4-day
    kind: plate
    name: x-caglayan-portrait-s4-day
    size: 1024x1536
    canvas: 1024x1536
    deliver: {scale: 1.0}
    edit_of: x-caglayan-flow-4
    outpaint: {anchor_y: 0.52}
    chat: "Pofu · Portrait islands"
    light: {cell: day, layer: subject}
    palettes: [world-props, world-sunset, world-foliage]
    acceptance: {exploration: true, edit_mode: region}
    notes: "Portrait pilot of Çağlayan: outpaint of the picked stage-4 plate (x-caglayan-flow-4). Review: the island unchanged, a painted sky and distant islands, a deep sunlit cloud sea as rich as home, no flat gradient, no haze band."
    attach:
      - ref: home-sky-guide
        role: "The treatment reference for the sky, the distant floating islands and the deep cloud sea. Match its richness and painting style, not its objects."
    prompt:
      - text: |
          Outpaint the attached plate onto a tall phone canvas. The plate stays EXACTLY as
          painted: the same island, the same size, the same pixels, centred horizontally,
          its mass at about the middle of the canvas (the transparent area above and below
          it is yours to paint; the mask is white where you paint). Do not redraw, heal,
          shift or add anything on the plate itself. Above the plate paint a tall, deep
          sky with soft layered clouds and one or two small distant floating islands far
          away, small and hazy, no larger than a thumb. Below the plate paint a deep
          cloud sea that fills the whole bottom of the canvas, sunlit and billowing,
          painted with the same richness as the attached home reference (its sky, distant
          islands and cloud sea are the treatment to match; take the treatment, not the
          objects): layered cloud masses with painted light and shade, never a flat
          gradient, never a haze band, never an empty fog. The seam where the plate meets
          the new sky and cloud sea reads as one continuous painting.
          Light of this plate: clear daylight: a bright blue sky with soft white clouds, a sunlit cloud sea. The new sky and cloud sea carry
          this light and keep the plate's own colours rich.
      - block: edit-keep-v1
      - block: plate-style-rich-v1
      - text: "AVOID: a flat gradient, a haze or mist band, a flat empty cloud sea, a plain sky, a hard seam, a changed or moved island, new objects on the island, large floating islands, characters, text"

