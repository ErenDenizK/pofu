# Batch 75: portrait outpaints of the four islands' painted plates (exploration; x- ids, never promoted).
#
# WHY: Çağlayan, Emanet, Mehtap and Revontuli are landscape paintings (1536x1024).
# On a portrait phone the island is a thin band, about 40% of the screen below it
# is flat featureless mist and the top is flat sky (lead review of PR #376, Çağlayan
# in the app). Home looks right because its plates are portrait (1024x1536 here, 2:3)
# with a painted sky, distant islands and a deep cloud sea. Fix at the source: every
# painted cell of the four islands gets a portrait 2:3 version.
#
# WHAT: each job is an outpaint of the cell's picked landscape plate onto a 1024x1536
# canvas (edit_of + `outpaint`). The plate is kept as painted; the model paints a sky
# with soft clouds and one or two small distant floating islands above, and a deep,
# sunlit cloud sea below, matching `x-home-flow-final-rich` (attached as the treatment
# guide). No flat gradient, no haze band, no new objects on the island.
#
# OUTPAINT PRE-STEP (tools/imagegen/run.py, `outpaint: {anchor_y: f}`, tested in
# tools/imagegen/tests/test_outpaint.py): the edit input is not the bare parent. run.py
# scales the 1536x1024 parent to the canvas width (x 2/3, so a 1024x683 band; a plate
# 1536 wide cannot sit on a 1024 wide canvas at 1:1, and the whole band is scaled the
# same for every cell, so all states stay registered), places it on a transparent
# 1024x1536 canvas with its vertical centre at 52% of the height, and attaches a mask
# (white = paint, black = keep) as the second image. Both land in the build folder
# (`outpaint/<job>--input.png` and `--mask.png`) and in the take's sidecar attachments.
# `post` compares each take with that same placed parent (edit stability).
#
# TODO (lead, ingest; not implemented here): after delivery, the ingest re-pastes the
# original island band (the parent at the same scale and position) over the outpaint
# with a feathered seam, so every state is pixel-registered with the others and the
# island pixels are exactly the picked plate's, whatever the model redrew.
#
# ORDER OF WORK:
#   Phase A (pilot, Çağlayan): x-caglayan-portrait-s4-day, 2 takes.
#   Phase B (the rest of Çağlayan's painted cells, 12 jobs): each takes the picked
#     Phase A take as the style reference, so the sky and cloud sea read as one place;
#     night, golden and rain cells keep their own light.
#   Phase C (Emanet, Mehtap, Revontuli): per island, its own stage-4 pilot first
#     (x-<island>-portrait-s4-day, Phase A style), then its painted cells (11, 13 and
#     14 jobs) with that pilot as the style reference.
#   Any order between islands, up to three tracks; within an island, the pilot first.
# PROVISIONAL AUTO-PICK: a pilot that is not picked yet never blocks its cells. run.py
# stands in the pilot's QA auto-pick (flagged provisional in the sidecar); the lead
# reviews in its own round and, if a pilot is replaced, the affected cells are redone.
# FALLBACKS: a refused or failed job is recorded in review.yaml and skipped, the run
# continues. If the island looks moved, redrawn or healed, keep both takes, note it in
# review.yaml and go on: the ingest re-pastes the island anyway, so only the sky, the
# cloud sea and the seam matter. If a take shows a flat gradient or a haze band, keep
# both takes, note it and go on; the lead decides.
#
# EXPLORATION RULES (AGENTS.md): no `promote`; commit the takes (WebP q90), the contact
# sheet and review.yaml under design/art/takes/<batch>/<id>/. No characters, no text.
#
# Review for every take: the plate unchanged; a painted sky with soft clouds and small
# distant islands; a deep sunlit cloud sea as rich as home's; no flat band at the top
# or the bottom; the seam invisible; the cell's own light.

