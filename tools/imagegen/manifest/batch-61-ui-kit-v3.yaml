# Batch 61: UI kit v3 (production; docs/design/ui-v3.md section 5, ADR-0020).
#
# ADR-0020: Pofu-owned surfaces are PAINTED, behaviour stays native, and every
# word and number is live text. So nothing here carries a letter, a digit or a
# symbol that means something: plaques, paper, cards, bubbles, chips, toast,
# groove and fill are blank materials the app puts live text on. The seals and
# stamps carry a small emblem (a leaf, a bow, a sun), never lettering.
#
# One material family (ui-v3 section 1): honey-stained wood, cream linen and
# felt, paper (day) and lamplit paper (night), clay. The look is the round
# door gate (the batch-48 round door take 1 (batch-58 repaints it in layers; it does not block this batch): its honey plaques are the plaque
# reference) and tea-stall-5 (finish and soft light). Every surface is lit
# from straight above or the upper left with one soft key; it has a flat,
# even middle so it can be stretched.
#
# Slices. The pipeline supports `slice: {caps: [top, left, bottom, right],
# ship_height}` on ui jobs (written to meta.json, converted to Contents.json
# by the asset step). Caps are in pt at 1x for the piece trimmed to its
# bounds and scaled to `ship_height` pt tall (3x density = three px per
# pt on device). Insets quoted in notes are px of the painted art:
#   3-slice (plaque, chip, toast, groove, fill, tag): caps [0, c, 0, c],
#     the art is a wide strip ~4:1 to 6:1 that fills the canvas width
#     (canvas 1536 x 1024; the strip sits in the middle band); c is half the
#     strip's height so the round ends are the caps.
#   9-slice (sheet, cards, bubble): caps on all four sides.
# The lead re-checks every cap against the picked take and edits the
# `slice` before promote; the numbers are the plan, not a QA fact.
#
# Night: sheet, cards, bubble, tag, toast and the clay disc have a painted
# lamplit night version (a recolor EDIT of the day piece: same shape, same
# pixels). Wood plaques, felt chips, groove and seals are warm enough to be
# dimmed by code at night (the app multiplies by the light field); the plaque
# is the only action colour and must not change hue at night.
#
# Native by design, no art (ui-v3 section 5): Toggle (system, tint moss
# #7FA36B by day, amber by night) and the text field (a paper inset the app
# draws with an inner shadow). The fill of the progress bar is drawn by the
# app per the spec; `ui-fill-honey` below is a painted option so the lead can
# compare, not a promise.
#
# Tracks (independent): plaques (honey first; its edits follow), paper,
# cards, bubbles, chips, progress, marks, disc. PILOT: ui-plaque-honey,
# ui-sheet-paper-v3, ui-card-stitched; if a pilot fails after its one retry,
# skip the rest of that track.

batch: batch-61-ui-kit-v3
title: UI kit v3 (plaques, paper, cards, bubbles, chips, toast, progress, clay disc, seals, stamps)
status: open

refs:
  tea-stall-5: design/art/stations/tea-stall-5/tea-stall-5.png

defaults:
  variants: 2

_shared:
  door: &door
    ref: design/art/takes/batch-48-gate-scenes/x-gate-round-door/ui__x-gate-round-door--t1.webp
    role: "The round door gate scene (take 1, the lead's pick; batch-58 repaints it as layers and does not block this batch): the material, light and finish of the honey wood plaques hanging on the rope at the bottom (and its warm paper-and-wood look). Take the material only; do not draw the door, the burrow, the rope or the scene."
  stall: &stall
    ref: approved:tea-stall-5
    role: "A finished prop of the game: match its soft airbrushed finish, matte materials, warm light and colors (do not draw the stall)."
  palette: &palette
    ref: palette:world-props
    role: "The palette card for props: use only these colors (and mixes of them)."
  avoid: &avoid
    text: "AVOID: text, letters, numbers, symbols, icons, glass, frosted or transparent parts, a drop shadow or cast shadow on the ground, an outline, a border around the canvas, a background, gloss or specular glints, texture that varies along the width, pure black, neon or saturated colors, a 3D render look"
  night: &night
    text: |
      NIGHT VERSION of the attached day piece: the identical shape, size and position, every edge in the same pixels; only the light and color change. It is now lit by a warm lantern from the upper left at night: the material turns a deep warm plum-brown and ink-blue shade, the highlight along the top edge becomes a soft amber, shadows are deeper warm indigo-brown (never black), the whole piece stays readable as the same object and keeps the soft milky finish.

jobs:
  - {id: tea-stall-5, kind: station, name: tea-stall-5, external: batch-01-slice}
  - {id: ui-face-disc, kind: ui, name: face-disc, external: batch-11-ui-pilot}
