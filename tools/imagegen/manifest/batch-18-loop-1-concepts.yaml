# Batch 18: design loop 1 concept round (12 images), EXPLORATION, never promoted
# (docs/design/art-production-plan.md; spec: docs/product/design-loop/loop-1.md
# section 6; island rules: docs/product/archipelago-system.md section 17).
#
# Each image tests one risky idea of loop 1: Çağlayan's pools as windows, the
# three-cluster backdrop at day, dusk and night, the Pofu and Mochi duo, Olta,
# Gezgin's night crossing and a far-view silhouette sheet. UNIQUENESS CONTRACT
# (as batch 17): the home island is attached for STYLE ONLY (soft painterly
# finish, gentle light, low camera), never as the base to copy; every prompt
# states its own silhouette/landform, palette, weather and landmark. Only the
# backdrop and delta jobs show the home island, and they keep its exact shape.
#
# EXPLORATION RULES (AGENTS.md): do NOT run `promote`; commit the takes (WebP
# q90), the contact sheet and review.yaml under design/art/takes/<batch>/<id>/
# and nothing else. No painted text anywhere. Boards never paint glass UI,
# chrome or buttons. Review wonder takes with the rubric of archipelago-system.md
# 1A.3 and the 60 pt black-silhouette test.
#
# PILOT (run first, in this order): cl1-caglayan-pools, cl1-backdrop-day,
# cl1-duo-vapur. Continue to THE REST only if at least 2 of the 3 pass review;
# otherwise skip every job below the "THE REST" line and finish the session. A
# failed job gets one retry.
#
# Track: `loop1` (all 12 jobs).

