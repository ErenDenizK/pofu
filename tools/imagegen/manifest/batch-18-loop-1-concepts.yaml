  # ------------------------------------------------------------- PILOT

  - id: cl1-caglayan-pools
    kind: plate
    name: cl1-caglayan-pools
    size: 1536x1024
    canvas: 1536x1024
    chat: "Pofu · Exploration"
    notes: "Exploration. Çağlayan's new idea reads in one image (pools as windows). Review: a unique silhouette at 60 pt black; the pools read as windows, not mirrors; not green."
    attach:
      - ref: approved:island-main-s
        role: "STYLE ONLY: the soft painterly finish, the gentle light and the low camera height. Do NOT copy its shape: no lawn oval, no sandy soil bowl, no dangling roots, no pebbles, no round door. This is a different place."
      - ref: approved:cloud-sea
        role: "The sea of clouds below; paint clouds like this (unless the sky says otherwise)."
      - ref: R1
        role: "The hamster, Pofu: match his art style, fluff and scale exactly."
    prompt:
      - text: |
          A concept painting for a cozy mobile game: Çağlayan at stage 5: a tall white travertine column like a frozen fountain, pools spiralling down in rings, the fall pouring off the lowest rim into the clouds. Each clear pool reflects a different far place instead of the sky above it: a snowy floe with aurora, a whale's back, a bell spire. An otter with a tea glass on a rim; a small hamster beside her. Late morning, mist.
          UNIQUE PLACE (this island is not the attached home island): silhouette and landform: a tall travertine column of spiralling pools with no lawn top. Palette: chalk cream, mineral teal, sunflower-gold glints (not green). Weather and sky: late morning with mist rising from the fall. Landmark: pools that read as windows onto other places, not mirrors. Scale cue: an otter with a tea glass and a small hamster on a rim. The attached home island is a style reference only: copy its soft painterly finish, gentle light and low camera, never its shape or parts.
      - block: prop-style-v2
      - text: "AVOID: a lawn oval island, a soil or sand bowl underside, roots hanging below, pebbles in the soil, a round door, sunflowers, honey-and-sage palette, text, a border, UI, phones or screens, harsh shadows, neon, dark moods"

