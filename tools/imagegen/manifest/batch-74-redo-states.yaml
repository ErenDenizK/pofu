# Batch 74: redo of the states the lead rejected in batches 71 to 73, plus two pilots (exploration; x- ids, never promoted).
#
# Lead review 2026-11-10 of batches 71, 72 and 73 (picks are recorded in their
# review.yaml files and docs/state/plates.yaml). Every job below names the exact
# failure of its first try and repeats the original request with that fix. Each
# is a direct edit of the same parent as before (the picked take of the root or
# stage plate), 2 takes each, full-size delivery, plate-style-rich-v1.
#
# ORDER OF WORK: the redo jobs first, any order, up to three tracks:
#   1. x-home-flow-bare-v3, x-home-flow-il1-v3, x-home-flow-il2-night-v2
#   2. x-caglayan-flow-0-night-v2, x-caglayan-flow-1-night-v2
#   3. x-emanet-flow-0-night-v2, x-emanet-flow-1-night-v2, x-emanet-flow-2-night-v2
#   4. x-mehtap-flow-1-day-v2
# Then the two PILOTS (one job each, 2 takes each): x-revontuli-flow-1-day-v2
# (bright snow that keeps the root's colour richness) and x-home-flow-night-sea
# (a moonlit night cloud sea). The pilots do NOT scale to other cells until the
# lead's next review round; meanwhile continue to the next READY row and the
# standing work.
# FALLBACKS: a refused or failed job is recorded in review.yaml and skipped, the
# run continues. If a take still shows the named failure, keep both takes, note
# the failure in review.yaml and go on; the lead decides in the next round.
#
# EXPLORATION RULES (AGENTS.md): no `promote`; commit the takes (WebP q90), the
# contact sheet and review.yaml under design/art/takes/<batch>/<id>/. No
# characters, no painted text.
#
# Review for every take: the same picture as the parent (nothing moved, healed
# or added); the colour stays the parent's clear, rich colour; the named failure
# of the first try does not come back.

