    prompt:
      - text: |
          Edit the attached FINAL painting (Tam Çiçek, the finished island) into its
          first morning, IL1. It is derived from the final directly, so everything not
          named stays pixel for pixel as in the final. Remove the windmill, the
          workshop, the beehive, the tea stall, the pond and its dock, the stone path,
          the path lamps, the lantern string, the flower borders, the vines, the
