          the garden is its first self (three sunflowers in a small bed, no fence);
          the old hamster wheel lies tipped on its side; the lawn is a little paler.
          KEEP EXACTLY: the island's exact silhouette and every door in the earth, the
          rope bridge, the harbour islet's outline, the sky, the cloud sea, and the
          far islands and the cloud-whale in their places AT FULL COLOUR, clear and rich
          as in the final (they are not veiled, not greyed, not dimmed).
          SOFT MIST ONLY over the locked areas: the hilltop and the harbour islet sit in
          a soft, thin, sunlit white mist. No mist anywhere else; the rest of the frame
          keeps the final's clear, rich colour.
      - block: edit-keep-v1
      - block: plate-style-rich-v1
      - text: "AVOID: a whole-frame veil, mist over the sky, mist over the far islands or the whale, greyed or dimmed far islands, a washed-out frame, a changed silhouette, a removed door, new objects, characters, text"

