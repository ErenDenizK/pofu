    attach:
      - ref: home-night
        role: "The night target: this calm moonlit night of the finished island, its blue sky, moon, light cloud sea and quiet island colour. Match the light and colour; do not copy its objects, lamps or lights."
    prompt:
      - text: |
          Edit the attached painting into the same scene on a calm, clear night: a soft
          deep-blue sky (blue, never black) with a gentle glow near the clouds, a soft
          round moon and a few small stars; the cloud sea stays light and lilac-white.
          The island stays readable and fairly light under cool moonlight, its colours soft
          but still rich, its shadows blue-violet, no deep blacks, no grey veil over the
          whole frame. Warm light comes ONLY from the windows that already exist in the attached
          picture, each a small soft pool. Do NOT add any lamp, bulb, lantern, string
          of lights or glowing object that is not in the attached picture; the day
          plate's inventory is the night plate's inventory. The far islands are dim,
          quiet shapes with a tiny warm light on each; the cloud-whale is a soft pale
          shape.
          Everything stays in its place, the same shapes and sizes; only light and
          colour change.
      - block: edit-keep-v1
      - block: plate-style-rich-v1
      - text: "AVOID: high contrast, black shadows, an indigo-purple festival night, many bright lights, a grey or blue veil over the whole frame, neon, new objects, characters, text, moving anything, new lamps, new bulbs, strings of lights, glowing everything"

