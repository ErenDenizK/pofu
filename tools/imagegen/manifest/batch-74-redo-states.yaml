  - id: x-home-flow-bare-v3
    kind: plate
    name: x-home-flow-bare-v3
    size: 1024x1536
    canvas: 1024x1536
    deliver: {scale: 1.0}
    edit_of: x-home-flow-final-rich
    chat: "Pofu · Redo states"
    light: {cell: day, layer: subject}
    palettes: [world-foliage, world-props]
    acceptance: {exploration: true, edit_mode: region}
    notes: "Redo 3 of the bare home. Failure of v2: new land appeared and the lawn went flat. Review: the exact silhouette, the cliff edge and the separate harbour islet of the root; only buildings, props and flowers gone; deep textured lawn."
    prompt:
      - text: |
          Edit the attached FINAL painting (Tam Çiçek, the finished island) into the bare
          island: the land alone, the same light. Remove ONLY the buildings, props and
          flowers: the windmill, the workshop, the beehive, the tea stall, the garden
          and its sunflowers, the pond and its dock, the stone path, the path lamps, the
          lantern string, the flower borders, the vines, the hamster wheel, the bagel
          cart, the rope bridge, the lighthouse, the pier, and on the hilltop the bench,
          the telescope, the stage, the steps and the gate. Paint plain lawn where
          something stood, with the same grass texture, the same deep green and the
          same light and shading as the lawn around it.
          KEEP EXACTLY: the island's exact silhouette and outline, the cliff edge, the
          earth body with all its small round doors, the roots, the low knolls, the
          separate harbour islet with its own lawn and earth (it stays a separate
          islet, not joined to the main island), the cloud sea, the sky, the far
          islands and the cloud-whale. NO NEW LAND: nothing extends past the root's
          outline, no new ledge, shore or islet.
      - block: edit-keep-v1
      - block: plate-style-rich-v1
      - text: "AVOID: new land, a bigger or smoother silhouette, a joined harbour islet, a flat lime-green lawn, a plain smooth fill, lost grass texture, a different light, new objects, characters, text"

