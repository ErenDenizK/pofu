# Retry 2026-11-03: the 32 jobs that batches 11 to 14 skipped (production)
#
# Why they skipped (docs/design/art-production-plan.md, "What the retry
# taught"): not bad art. Four causes, all fixed here and in qa.py:
#   - the brief named colors the drift check did not hold (violet button,
#     honey tabby, glaze recolors, a lit lantern): jobs add `palettes:`;
#   - an edit that repaints the object cannot keep its colors (glaze
#     recolors, a refilled jar, a lit lantern): jobs declare
#     `acceptance: {edit_mode: recolor | region}`, which swaps edit_stability
#     for shape and light-structure checks (qa.py, EDIT_MODES);
#   - two briefs asked for the impossible (a sheet that bleeds off a
#     transparent canvas; a ferry wider than its footprint with a flat and a
#     round hull): rewritten;
#   - a failed pilot skipped whole batches (batch 13's icons never attached
#     the sheet; batch 14's props attached the ferry). Only true dependents
#     skip now: props attach the approved tea stall and island, the goat
#     attaches Mochi.
#
# Every job here is a retry of a skipped job with the same asset name, so a
# pick promotes over the same path. Nothing that passed is repeated. No pilot
# gate: `plan` skips exactly the jobs whose edit_of or approved: master is
# missing, and nothing else. Jobs that depend on a retry job:
# ui-sheet-paper -> ui-menu-paper, ui-sheet-paper-night;
# iskele-vapur-1 -> iskele-vapur-2; simit-kitten -> simit-kitten-work, -ears.
#
# Tracks: `ui` (face-primary, jar-full, lantern-on, bloom-right, five glazes),
# `surfaces` (sheet, menu, night sheet, pressed face), `icons` (13, all at
# once), `harbor` (vapur 1 -> 2; props; Simit -> poses; goat).

