  - id: x-emanet-flow-4
    kind: plate
    name: x-emanet-flow-4
    size: 1536x1024
    canvas: 1536x1024
    deliver: {scale: 1.0}
    palettes: [world-props, world-sunset, world-foliage]
    chat: "Pofu · Emanet flow"
    light: {cell: golden, layer: subject}
    acceptance: {exploration: true}
    notes: "ROOT, stage 4 healed: EM1's plate and places with EM2's bureau on a suitcase plinth as the office. Review: the office reads as one building (bureau on suitcases), not two; tidy and warm; the three empty spots clear; no characters; the bunting and windows read in a 28 pt thumbnail."
    attach:
      - ref: approved:island-main-l-v3
        role: "The home island: copy ONLY its camera, its size in the frame, its plate proportions (shallow top, rounded banded body) and its soft painting. Do not copy its lawn, colours, round door or pebbles."
      - ref: em1-healed
        role: "THE ISLAND (EM1, the founder's pick): copy its round plate with the cream and peach hexagon tiles and the teal tiled rim, its body, and the places of the hook post, the shelves, the hand-cart and the counter. Do not copy its office; do not draw its magpie, hamster or bunny."
      - ref: em2-bureau
        role: "THE OFFICE (EM2's stilted bureau): copy this building: teal boards, scalloped teal umbrella roof, the teacup water tank, the top-hat chimney, the striped awning over the counter window and the spoon ladder. Do not draw its magpie or its raft."
      - ref: em2-suitcases
        role: "ONLY the stacked old suitcases and hat boxes tied with red ribbon, and the little round door in the bottom suitcase: they become the office's low plinth."
      - ref: approved:tea-stall-5
        role: "A finished station of the game: every building and prop is at this scale and finish (do not draw this stall)."
      - ref: approved:cloud-sea
        role: "The sea of clouds below every island: paint the clouds like this."
    prompt:
      - text: |
          A game plate for a cozy mobile game: Emanet, the lost-and-found
          office island, in warm late-afternoon gold, STAGE 4, HEALED. A wide
          round island whose flat top is paved in soft cream and peach
          hexagonal tiles, ringed by a rim of teal glazed tiles with small
          brass studs, over a warm peach-honey body in soft bands. At the back
          centre stands THE OFFICE: a crooked little cabin of teal boards with
          a scalloped teal umbrella roof, a big cream teacup as its water tank
          on a stand, a brown top-hat chimney, a striped awning over a wide
          counter window, round warm windows and a ladder whose rungs are big
          wooden spoons; it stands on short wooden stilts that rise from a
          low, wide plinth of stacked old suitcases and hat boxes tied with
          red ribbon, the bottom suitcase with a little round door and a lit
          round window (the back room). At the back right a tall brass HOOK
          POST with eight hooks: seven hold small covered things and little
          bells, the eighth hook is empty; a small paper kite on a string tied
          to it flies above. In the middle right a long low wooden SHELF unit
          of three bays, every shelf full of found things (teapots, a clock, a
          globe, a camera, hats, books, jars), each with a cream luggage tag
          on a teal string. In the middle left a wooden HAND-CART piled with
          parcels in brown paper and red ribbon. At the front right a little
          outdoor COUNTER with a brass weighing scale and a teacup on it.
          HEALED AT GOLDEN HOUR: everything is shelved, tagged and tidy; a
          small neat heap of three or four unclaimed things sits on the tiles
          at the front centre; the office windows and the suitcase door glow
          warm; a string of cream luggage tags and small pennants hangs from
          the office roof to the hook post; thin curls of steam rise from the
          teacup tank and the top-hat chimney; small lanterns glow on the
          office porch and on the hook post; long soft golden light. Keep
          these places EMPTY for later: a clear patch of tiles between the
          shelf unit and the counter (room for a fourth bay), a clear lane of
          tiles in front of the counter (where a queue will stand), and a
          clear diagonal strip of tiles from the office porch down to the
          hand-cart.
      - text: |
          GAME CAMERA: exactly the camera of the attached home island, a low
          front three-quarter view about 20 degrees above the horizon; the
          island centred and filling about 88 percent of the image width; its
          plate a shallow top about a fifth as deep as it is wide over a soft,
          rounded body in gentle bands; the sea of clouds below rising to the
          underside. Every building and prop is at the scale of the attached
          tea stall. NO CHARACTERS OR ANIMALS anywhere: the game draws Pofu,
          Mochi, the resident and every critter as its own sprite, so their
          places stay empty.
      - block: plate-style-v1
      - text: "AVOID: characters, animals, text, letters, numbers, a border, harsh shadows, near-black shade, neon or oversaturated colours, HDR glow, washed-out pastel colour, milky haze, grey or muddy colour, outlines, photorealism, a 3D render look, anything falling off the island into the void, a copy of the home island's lawn and round door"

