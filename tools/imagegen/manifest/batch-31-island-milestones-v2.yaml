  prompt:
  - text: 'A fresh independent concept plate of Ayçiçeği using the CURRENT home-layout interpretation.
      Keep the familiar approved home-island identity and painterly family, with a fixed low front
      three-quarter game camera (about 17 degrees above the horizon). The lawn outline is fixed
      across levels: growth adds the named details within existing slots, or separate harbor/Tepe
      pieces beside the home, never widens the lawn or extrudes a new rear shelf. The following
      map describes positions only, not permission to draw unopened features. Draw each place ONLY
      when the stage below explicitly includes it: garden at the left tip; tea corner at the right
      tip; pond front-left; workshop back centre-left; windmill back-left. The RIGHT bridge/harbor
      and its bagel cart open at IL3; the harbor pier front-right only from IL5, lighthouse back-right
      only from IL6; hill path up-left only from IL9 and the separate Tepe only from IL10. Earlier
      stages leave those unopened features absent, with unmarked grass and no empty plots or padlocks.
      The round home door is inset into the earth face beneath grass, never a detached lawn house.
      Retain these positions and only the stage''s explicitly named inventory and state. The four
      listed source references stay unchanged; they establish the painting/family, not a pixel-registered
      current large-plate production layout.


      ISLAND LEVEL 1: a sparse, hopeful home with one bed of exactly three young sunflowers, Pofu''s
      round door inset into the earth face beneath a small grass mound, a little twig nest beside
      it, a few bees and wind in the grass. Keep a thin stone-less lawn and bare rock edges; no
      other buildings. Leave the future slots empty within the fixed footprint, rather than shrinking
      the island. FRESH STAGING: the three flower heads and leaves lean softly together in one breeze
      while the bees trace a small loose arc toward the nest; keep generous quiet cloud space. The
      light cell remains day, with warm local morning qualities only.'
  - block: style-anchor-v2
  - text: 'MATERIAL AND LIGHT SCOPE: The generic style transfers painterly handling only. Fur belongs
      only to explicitly requested mammals; frogs have smooth skin, while moss, plants, flowers,
      wood, stone, clay, water, clouds and the whale keep smooth material-appropriate surfaces.
      No animal anatomy is transferred to props or plants. Pofu alone may have his head curl, and
      he is drawn only in the named ceremony. Preserve every stage-specific count and gate state.
      No guide is attached: do not invent guide marks or introduce a ground ellipse into these opaque
      scene plates. The appended LIGHT block alone sets hour, key/fill/rim and shadow hue; keep
      its original cell and full subject-plane value range without a global milky veil. No text,
      numbers, logos, UI, painted glass, grain, outlines or 3D-render finish. These independent
      explorations do not prove pixel-registered inter-level continuity or exact large-plate socket
      geometry with only the listed family references.'
  - text: 'AVOID: a border, text, letters, numbers, harsh shadows, saturated or neon colors, dark
      moods, outlines, photorealism, a 3D render look, a different overall island character, a curl
      on any head except Pofu''s'
