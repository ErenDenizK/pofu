# Batch 16: brand exploration, never promoted
# (docs/design/art-production-plan.md; EXPLORATION in the queue).
#
# Modelled on ChatGPT Images' guided presets (poster, illustration, logo,
# icon, infographic, app mockup, promo item, flyer): each job pastes one
# `preset-*-v1` block that fixes the structure of the brief (purpose,
# audience, text hierarchy, required legible text verbatim, layout, style,
# palette, constraints), and the job text fills those fields. Jobs here:
# the app icon set (3 directions x light, dark, tinted for iOS 26), the
# wordmark (3 directions), the icon family sheet, the loop infographic, two
# illustrations and a promo poster.
#
# EXPLORATION RULES (AGENTS.md): do NOT run `promote`; commit the takes (WebP
# q90), the contact sheet and review.yaml under design/art/takes/<batch>/<id>/
# and nothing else. UNLIKE other batches, text IS painted here, but only the
# REQUIRED TEXT of a job, spelled verbatim; review reads every letter. The
# icons never paint glass; the system masks the corners.
#
# PILOT (run first, in this order): x-b16-icon-a-light, x-b16-logo-a,
# x-b16-infographic. If a pilot job still fails after its one retry, skip
# the REST (every job below the "THE REST" line) and finish the session.
#
# Tracks (run in parallel, two sessions): `mark` (icons, logos, icon family)
# and `story` (infographic, illustrations, poster).

batch: batch-16-brand-explore
title: Brand exploration (app icon set, wordmark, icon family, infographic, illustrations, poster)
status: open

refs:
  cay-1: design/art/stations/cay-1/cay-1.png

defaults:
  variants: 2

jobs:
  - {id: island-main-s, kind: world, name: island-main-s, external: batch-01-slice}
  - {id: pofu, kind: char, name: pofu-r1, external: r1, master: design/art/masters/pofu-hamster-base-v1/pofu-hamster-base.png}
  - {id: icon-seed, kind: icon, name: seed, external: batch-11-ui-pilot}
  - {id: icon-calm, kind: icon, name: calm, external: batch-13-ui-rest}

  # ------------------------------------------------------------- PILOT

  - id: x-b16-icon-a-light
    kind: appicon
    name: x-b16-icon-a-light
    size: 1024x1024
    canvas: 1024x1024
    chat: "Pofu · Exploration"
    notes: "Exploration. App icon direction A (Pofu's face), light. Review: reads at 60 and 29 pt; light, dark and tinted are one icon."
    attach:
      - ref: approved:island-main-s
        role: "The home island: the same painting and softness."
      - ref: R1
        role: "Pofu, the hamster: his exact look, fur, colors and eyes."
    prompt:
      - block: preset-icon-v1
      - text: |
          PURPOSE: the Pofu app icon, direction A (Pofu's face), light appearance for iOS 26.
          AUDIENCE: adults who want to open social apps less; calm, not clinical.
          SUBJECT: Pofu's face and cream curl filling the lower two thirds, centered, big eyes, calm smile, on a soft warm peach-to-cream sky with one small cloud.
          LIGHT variant: soft pale sky, warm cream and peach light, the painting as described.
          LAYOUT: square, opaque, edge to edge, the focal shape inside the central 80% circle, corners calm background only.
          STYLE: the attached painting. PALETTE: milky pastel. No text.
      - block: appicon-v1
      - text: "AVOID: text, a border, rounded corners, glass, gloss, a hamster in the bottom corners, a second character"

  - id: x-b16-logo-a
    kind: plate
    name: x-b16-logo-a
    size: 1536x1024
    canvas: 1536x1024
    chat: "Pofu · Exploration"
    notes: "Exploration. Wordmark direction A (round and chunky). Review: the text reads exactly 'Pofu', legible at 120 px wide, same family as the painting."
    attach:
      - ref: approved:island-main-s
        role: "The home island: the same painting and softness."
      - ref: R1
        role: "Pofu, the hamster: his exact look, fur, colors and eyes."
    prompt:
      - block: preset-logo-v1
      - text: |
          PURPOSE: a wordmark for the app Pofu, direction A (round and chunky).
          AUDIENCE: adults and teens who open social apps by reflex; warm, humorous, never preachy.
          REQUIRED TEXT: Pofu
          (exactly four letters: capital P, lowercase o, f, u.)
          LETTERFORM: fat rounded letters like soft dough, the lowercase o a perfect circle, in warm brown. Extra mark: a small cream curl above the P as the only mark.
          COLOR: soft, muted warm brown and cream roughly like the attached painting, gentle and low-saturation, on a plain pale cream ground.
          LAYOUT: one lockup, centered, wide, with generous margin.
      - text: "AVOID: any word other than Pofu, a hamster, a border, 3D, glow, outline, a drop shadow"

  - id: x-b16-infographic
    kind: plate
    name: x-b16-infographic
    size: 1024x1536
    canvas: 1024x1536
    chat: "Pofu · Exploration"
    notes: "Exploration. Loop infographic. Review: the four labels read exactly as given (apostrophe, dotless and dotted i, ş, ı); steps read in order."
    attach:
      - ref: approved:island-main-s
        role: "The home island: the same painting and softness."
      - ref: R1
        role: "Pofu, the hamster: his exact look, fur, colors and eyes."
    prompt:
      - block: preset-infographic-v1
      - text: |
          PURPOSE: explain the whole Pofu loop in five seconds.
          AUDIENCE: a Turkish-speaking adult scrolling too much; friendly and light.
          TEXT HIERARCHY: four short labels, one per step, same size.
          REQUIRED TEXT, top to bottom, each on its own line, verbatim:
          Instagram'a uzandın
          Pofu
          boş ver
          ada büyür
          LAYOUT: a vertical path of four painted steps joined by soft painted arrows: (1) a thumb reaching toward a rounded phone with a camera-like glyph, no real logo; (2) Pofu raising a paw in a gentle wait; (3) Pofu shrugging with a relaxed smile beside a lowered phone; (4) the floating home island with a new little tree grown. Each label sits beside its picture.
          STYLE: the attached painting. PALETTE: pastel.
      - text: "AVOID: any other words, real app logos, numbers, a border, a chart"


