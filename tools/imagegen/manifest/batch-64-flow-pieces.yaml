# Batch 64: the flow game's painted pieces (production; docs/design/flow-game.md
# section 7). Çağlayan's connect game: square carved river-stone tiles, a mill
# wheel, the spring and pool, the board's surround and small water sprites.
#
# The game is built (Packages/PofuKit/Sources/PofuGames/Flow/Scene/FlowArt.swift):
# FlowTextures.artName maps tile kinds to these ids and draws a fallback, so
# every id below is used EXACTLY as the code names it:
#   flow-tile-straight, flow-tile-bend, flow-tile-split, flow-tile-gate,
#   flow-tile-source, flow-tile-mouth, flow-rock, flow-grass.
# The wheel has no hook yet (artName returns nil): flow-wheel (the rotating
# paddle sprite) and flow-tile-wheel (the housing it sits on) are the ids the
# code will load. The rest (pool, frame, splash, dribble, damla-point) are new
# hooks listed in section 7.
#
# LOOK (lead feedback on the code-drawn screenshots, 2026-11-06): the dry
# grooves were a heavy dark brown that read like bars. Here a tile is CARVED,
# MOSSY RIVER STONE in Çağlayan's palettes (world-water, world-foliage): a
# pale warm-grey stone, rounded at the edges, soft moss on the shoulders, and
# a groove that is a SHALLOW, SOFT, LIGHT channel (a gentle dip in the same
# stone, a little darker and cooler than the face, lit from above), never a
# dark slot. Water is drawn by code (a soft painted ribbon like the game's
# water), so the groove stays empty and calm. The frame is the cliff's stone
# lip with grass, as on the island plate.
#
# GEOMETRY CONTRACT (code rotates and aligns tiles; the art must be exact):
#   - Every tile is a square, FULL BLEED (stone to all four edges, no margin,
#     no outline), 1024 x 1024, shipped at 256 x 256. Tiles abut edge to edge
#     and must read as one board of stones.
#   - The channel is centred on the tile and its width is about 30 percent
#     of the tile (a 307 px groove). At the middle of each open side the
#     groove meets the tile edge exactly at the centre (x or y = 512), at full
#     width, so neighbouring tiles join without a step.
#   - Closed sides carry NO groove and an even stone shoulder. A bend curves
#     through the middle like a quarter circle (a rounded corner, not a sharp
#     mitre).
#   - Orientation as drawn (code rotates): straight = north-south; bend =
#     north to east; split = north, east and west open (a T), south closed;
#     source = one opening to the south, the spring at the top; mouth = one
#     opening to the north, the pool to the south; wheel housing = east-west;
#     gate = east-west with the sluice board across the middle.
#   - Seen from straight above with only a slight tilt (the plate's light),
#     lit from the upper left; the same light on every tile so they match.
#   - No text, letters, numbers, arrows or symbols anywhere.
#
# Tracks (independent): tiles (straight first, it is the pilot and the look
# reference for the rest), props (wheel, rock, grass, pool), frame, water fx
# (splash, dribble), damla. PILOT: flow-tile-straight; if it fails after its
# one retry, skip the tile track and report. The Çağlayan island plate
# (batch-43, caglayan-island-0) is not approved yet, so the attached look
# reference is the island concept take by path (as batch-61 attaches the door
# scene); once the plate is approved, a re-run may swap in approved:caglayan-island-0.

batch: batch-64-flow-pieces
title: The flow game's pieces (stone tiles, wheel, spring and pool, board frame, water sprites, Damla pointing)
status: open

refs:
  tea-stall-5: design/art/stations/tea-stall-5/tea-stall-5.png

defaults:
  variants: 2

_shared:
  island: &island
    ref: design/art/takes/batch-17-islands-v2/x2-caglayan-b/plate__x2-caglayan-b--t1.webp
    role: "Çağlayan's concept plate: take ONLY the look of its pale rounded cliff stone, its soft moss and grass, its soft painted water and its light. Do not draw the island, the cliff, the mill or the pool as a scene."
  stall: &stall
    ref: approved:tea-stall-5
    role: "A finished prop of the game: match its soft airbrushed finish, matte materials and warm light (do not draw the stall)."
  avoid: &avoid
    text: "AVOID: text, letters, numbers, symbols, arrows, icons, an outline, a border or margin around the tile, a drop shadow outside the tile, dark brown or black grooves, bars or slots, deep holes, harsh contrast, gloss or specular glints, glass, pure black, neon or saturated colors, a 3D render look, photorealism"
  avoid_fx: &avoid_fx
    text: "AVOID: text, letters, numbers, symbols, an outline, a background, a ground shadow, foam clumps with hard edges, gloss, glints, pure black, neon blue, a 3D render look"
  tilebase: &tilebase
    text: "A game tile for a cozy mobile puzzle, seen straight from above with a very slight tilt, lit softly from the upper left. A SQUARE of carved, mossy river stone that fills the whole canvas edge to edge (full bleed, no margin, no outline, no shadow around it): pale warm-grey stone with a faint cream and sage tint, rounded and softly worn, a little soft green moss gathered on the shoulders and corners, never on the groove. The channel is a SHALLOW, SOFT, LIGHT groove carved into the same stone: a gentle dip about 30 percent of the tile wide, centred, its floor only a little cooler and darker than the stone face (a pale grey-green, never brown, never near black), its walls softly rounded and lit, so it reads as a calm empty water-bed waiting for water, not as a slot or a bar. Matte, painted, soft, with broad smooth value changes."

