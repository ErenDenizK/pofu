          Add a second deck to the ferry: a smaller cream cabin on top of the
          first with two round windows, a rail of three cream posts around
          the upper deck, and a second small funnel beside the first. The
          hull, the first cabin and the colors stay. Keep it inside the
          height bar.
      - block: edit-keep-v1

