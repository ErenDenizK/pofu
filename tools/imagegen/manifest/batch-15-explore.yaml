# Batch 15: exploration, never promoted
# (docs/design/art-production-plan.md; EXPLORATION in the queue).
#
# Concept paintings (two per wonder island in docs/product/archipelago-system.md
# section 11, PR #64, besides the three of batch 10), resident model sheets, the
# archipelago sky map with fog, layered app icon explorations, three App Store
# key art compositions, a winter Ayçiçeği edit and onboarding illustrations.
# Everything here is for deciding: concepts decide shape, palette and the
# "whoa"; production plates are painted later from landform blockouts.
#
# EXPLORATION RULES (AGENTS.md): do NOT run `promote`; commit the takes (WebP
# q90), the contact sheet and review.yaml under design/art/takes/<batch>/<id>/
# and nothing else. No painted text anywhere. Boards never paint glass, UI
# chrome or buttons.
#
# PILOT (run first, in this order): x-koke-1, x-yildiz-1, x-store-a. If a
# pilot job still fails after its one retry, skip the REST of this batch (every
# job below the "THE REST" line) and finish the session. Every job of the rest
# (the rule applies whether or not it attaches a pilot take).
#
# Tracks: `islands` (concepts, residents), `maps` (sky map), `store` (key
# art, app icon), `edits` (winter), `onboarding`.

batch: batch-15-explore
title: Exploration (wonder island concepts, residents, sky map, app icon, key art, winter, onboarding)
status: blocked
blocked_on:
  - "delivered and merged (#100); closed 2026-11-03, see the Log in docs/design/art-production-plan.md"

refs:
  cay-1: design/art/stations/cay-1/cay-1.png

defaults:
  variants: 2

