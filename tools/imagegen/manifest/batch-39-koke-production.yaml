  - id: koke-island-4
    kind: plate
    name: koke-island-4
    size: 1536x1024
    canvas: 1536x1024
    edit_of: koke-island-0
    palettes: [world-foliage, world-day]
    chat: "Pofu · Koke island"
    light: {cell: day, layer: subject}
    notes: "Stage 4, healed: the signature image and the key art of the island. An edit of stage 0: the island's outline, the camera and the props keep their places; only Koke (it stands up where the hump was) and the blooms change. Review: Koke stands on four stubby legs, head lifted, both eyes open and warm, a soft smile, its back in flower; it stays within the hump's footprint and about a third taller than the hump, and never crosses the island's edge or the top of the canvas; full colour, warm light; soft petals and spores drifting up from the whole island (the signature); the dormouse sits on a boulder, delighted; nothing scary. This must feel like the biggest reward of the island."
