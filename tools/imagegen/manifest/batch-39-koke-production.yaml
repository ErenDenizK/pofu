# Batch 39: Koke, the first story island, playable (production; real ids, promoted on pass).
#
# Koke is a mossy creature asleep on a small island; three visits wake it
# (docs/product/game-plan.md, the story islands; the arc stages are
# docs/design/island-healing-arc.md, "The rule" and Koke's row). Two chains:
#
#   island   `koke-island-0` is the root plate in the game camera (as the
#            plates of batch-34: 1536 x 1024, the home island's camera and plate
#            proportions, the sea of clouds below). `koke-island-1` to `-4` are
#            EDITS OF koke-island-0 (never of each other), so the five stages
#            register pixel for pixel and the game can crossfade between them.
#            Each edit restates the whole stage; the composition, the island's
#            outline, the camera and every prop's place stay exactly as in stage 0.
#   koke     `koke-asleep` is the root character (fresh); `koke-one-eye`,
#            `koke-stretch` and `koke-standing` are edits of koke-asleep on the same
#            canvas with the same ground line (the rig method of batch-06 and
#            batch-37), so code swaps them in place.
#
# The healing arc, stage by stage (one wound, one cure; the wound is "the
# moss is asleep"):
#   0 stuck     a grey, sleeping moss hump, the island's flowers closed, chroma
#               about 40 percent of healed, flat cool light, no warm practical light,
#               ONE sign of life (a single bright sprout on the hump's crown);
#               sad and quiet, never dead.
#   1           the moss turns green patch by patch (about a third of the hump),
#               chroma about 55 percent, still cool and flat; the buds swell.
#   2           about two thirds green, the nearest flowers open, a small resident
#               peeks out, chroma about 70 percent, the FIRST WARM LIGHT (a soft
#               low sun on the crown and the open flowers).
#   3           the shape is whole, the soul is missing: moss nearly all green,
#               most flowers open, Koke's one eye opens a sliver, chroma about 85
#               percent, the resident is busy; still no signature (no drifting
#               petals, no glow, no sparkle).
#   4 healed    Koke stands up and the island blooms around it: full colour,
#               warm practical light, the signature image (soft petals and
#               spores drifting up from the whole island), everyone is there.
#
# Measure and record in each review (the arc rule): harmony chroma of stage 4
# at least twice that of stage 0; the lit-pixel ratio steps up from stage 2.
#
# Gentle register (founder: Koke is "the gentle start"): sleepy and sad at the
# start, warm and funny at the end. Nothing scary on Koke or on the island: no
# teeth, no claws, no glowing red eyes, no gloom, no skulls or dead things, no
# fog walls. Koke has a round, soft, sleepy face from the first frame. Do NOT
# make Koke look like a whale or a bear; it is a moss-covered round creature,
# kin to a hill. No painted text, letters or "zzz" anywhere.
#
# Reviewed by the lead: stage 0 reads sad-but-alive in one word ("asleep"),
# stage 4 reads as a reward, the stages read as one island at 28 pt, and the
# five plates and the four poses are one finish with home. The resident that
# peeks out (Sumi, a small round grey-brown dormouse with big round ears)
# has no approved design yet: keep her tiny and simple; the lead may drop her
# from a stage and let code place her.
#
# Tracks: `island` (koke-island-0 first, then the four edits in any order),
# `koke` (koke-asleep first, then the three edits in any order). The tracks
# are independent.

batch: batch-39-koke-production
title: Koke, the first story island (island plate at arc stages 0 to 4, Koke in four poses)
status: open

defaults:
  variants: 2

jobs:
  - {id: island-main-l-v3, kind: world, name: island-main-l-v3, external: batch-05-fixes-pilot, master: design/art/masters/island-main-l-v3/island-main-l-v3.webp}
  - {id: island-main-s, kind: world, name: island-main-s, external: batch-01-slice}
  - {id: tea-stall-5, kind: station, name: tea-stall-5, external: batch-01-slice}
  - {id: cloud-sea, kind: world, name: cloud-sea, external: batch-04-sky}
  - {id: mochi-v2, kind: char, name: mochi-v2, external: batch-03-home-island, master: design/art/masters/mochi-v2/mochi-v2.webp}

  # ------------------------------------------------------- island plates

  - id: koke-island-0
    kind: plate
    name: koke-island-0
    size: 1536x1024
    canvas: 1536x1024
    palettes: [world-foliage]
    chat: "Pofu · Koke island"
    light: {cell: day, layer: subject}
    notes: "ROOT of the island chain; stage 0, stuck. Review: it reads as a cozy place in the same game as home, quiet and a little sad, and can be named in one word (asleep); one single bright sprout on the hump is the only strong colour; the flowers are closed buds; the light is flat and cool with nothing glowing; same camera, plate proportions and finish as home; nothing scary. The island's layout (hump, stones, flower beds, rake, ferns) is the layout every later stage keeps, so keep it simple and clearly composed. Record the harmony chroma for the arc check."
    attach:
      - ref: approved:island-main-l-v3
        role: "The home island: copy ONLY its camera, its plate proportions (shallow top, rounded banded body) and its soft painting. Do not copy its lawn, its colors, its round door or its pebbles."
      - ref: approved:island-main-s
        role: "The small island plate: the Koke island is this size in the frame (a small plate, narrower than home). Copy the size and the earth body's proportions only."
      - ref: approved:tea-stall-5
        role: "A finished station of the game: every prop on Koke's island is at this scale and in this finish (do not draw this stall)."
      - ref: approved:cloud-sea
        role: "The sea of clouds below every island: paint the clouds like this."
    prompt:
      - text: |
          A game plate for a cozy mobile game: Koke, a small island where a big
          mossy creature sleeps, in the game, on a still overcast-bright
          noon. STAGE 0, STUCK. The island is a floating diorama plate with a
          shallow top about a fifth as deep as it is wide, over a soft rounded
          earth body with gentle bands, a small plate: about 62 percent of the
          image width, centered. The top is a low rounded lawn of moss and
          short grass. At the back centre sleeps Koke: a huge round mound of
          moss about as tall as a windmill, like a plump hill, its soft fur
          made of moss. It has a round sleepy face low on the near side, a
          small blunt snout, two tiny round ears, eyes gently closed with
          soft lids, the corners of its mouth slightly down, and four stubby
          legs tucked under its belly, one front paw curled in front of it.
          STUCK STATE: the whole creature and the whole island are faded and
          grey: the moss is a dull grey-sage, like a dusty blanket, chroma
          about 40 percent of a healthy meadow, under a flat cool light with
          soft cool shadows and no warm light anywhere. Around it, five small
          clusters of flowers stand tightly closed, each a ring of
          shut grey-lilac and grey-blue buds with drooping leaves. A few
          rounded mossy boulders, a path of four stepping stones from the
          front lip to Koke's side, two soft ferns, and a small wooden rake
          leaning on a boulder. ONE SIGN OF LIFE only: on the crown of the
          hump a single tiny bright fresh-green sprout of two leaves, the
          only vivid colour in the picture. The mood is quiet and sad, but it
          is a sleeping creature, not a dead one: gentle, never eerie.
          GAME CAMERA (this is how the island looks inside the game): exactly
          the camera of the attached home island, a low front three-quarter
          view about 20 degrees above the horizon, a pale sky with soft far
          clouds above and the sea of clouds below rising to the island's
          underside. Every prop is at the scale of the attached tea stall.
          No characters other than Koke.
      - block: prop-style-v2
      - text: "AVOID: scary or hollow eyes, teeth, claws, a skull, bones, rot, ruins, fog walls, gloom, darkness, a sad crying face, a pointed or spiky underside, a drop or anything falling off the island, a copy of the home island's green lawn and round door, a whale shape, text, letters, zzz, a border, harsh shadows, outlines, photorealism, a 3D render look"

  - id: koke-island-1
    kind: plate
    name: koke-island-1
    size: 1536x1024
    canvas: 1536x1024
    edit_of: koke-island-0
    palettes: [world-foliage]
    chat: "Pofu · Koke island"
    light: {cell: day, layer: subject}
    notes: "Stage 1, the moss patches. An edit of stage 0: every outline, prop and the camera stay exactly in place so the stages crossfade. Review: only the moss on the hump and the lawn greens in patches (about a third), the buds swell a little; chroma about 55 percent of healed (+15 points); the light is still cool and flat, no warm light; Koke's eyes are still closed. Nothing new is added."
    acceptance: {edit_mode: region, edit_chroma: {warn: 0.30, fail: 0.15}}
    prompt:
      - text: |
          Edit the attached island plate from stage 0 to stage 1: the moss is
          waking. Repaint about a third of the moss on Koke's hump and on the
          lawn, in irregular soft patches (one on its shoulder, one along its
          back, one near its snout, a few on the lawn and the boulders), from
          dull grey-sage to a fresh living moss green; the rest stays grey.
          The sprout on its crown has grown a third leaf. The flower buds
          swell a little and show a hint of their colour at the tips, but all
          stay closed. The picture is a little more colourful overall (chroma
          about 55 percent of a healthy meadow); the light stays flat and
          cool, with no warm light. Koke is still fast asleep, eyes closed.
          Every shape, prop, stone, outline, the island's size, the camera and
          the composition stay exactly where they are in the attached image.
      - block: edit-keep-v1
      - text: "AVOID: warm sunlight, glow, open flowers, an open eye, new props, new characters, moving or resizing anything, scary details, text"

