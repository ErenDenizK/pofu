  # ------------------------------------------------------- Koke, the character

  - id: koke-asleep
    kind: char
    name: koke-asleep
    size: 1024x1024
    canvas: 1024x1024
    transparent: true
    fit: false
    palettes: [character, world-foliage]
    chat: "Pofu · Koke"
    light: {cell: day, layer: subject}
    notes: "ROOT of the pose chain. Review: a big round mossy creature lying curled up asleep, seen from the front three-quarter in the same camera as the island plate; round sleepy face, closed soft eyes, a calm mouth, tiny round ears, four stubby legs tucked under, one paw curled forward; the moss is a living sage green with a few lighter patches and a small leafy sprout on the crown (the healed colour, not the stuck grey); it fills about 80 percent of the canvas width, rests on a ground line at 88 percent of the height, and has room above for the standing pose. Gentle and funny, never scary: no teeth, no claws, not a whale, not a bear. Transparent background, no ground, no shadow."
    attach:
      - ref: R1
        role: "Pofu, the hamster: match his art style, lighting, level of fluff and finish exactly (do not draw him)."
      - ref: approved:mochi-v2
        role: "Mochi, the bunny: the same family of soft plush characters (do not draw her)."
      - ref: palette:character
        role: "The character palette card."
    prompt:
      - text: |
          Draw Koke, a huge, gentle, round moss creature fast asleep, as a game
          sprite on a transparent background, in exactly the same art style,
          lighting and level of softness as the attached hamster and bunny.
          It lies curled up in a plump rounded heap like a small green hill
          with a face, seen from the front, slightly from above. Its fur is
          thick living moss in sage and fresh green with a few lighter
          patches, soft and fluffy, with a small leafy sprout of two or three
          leaves on its crown and a few tiny clover leaves in its fur. A round
          sleepy face low at the front: a small blunt snout, a tiny dark nose,
          two eyes gently closed as soft curved lids with a few soft lashes, a
          calm small smile, a blush on each cheek, two tiny round ears. Four
          stubby legs tucked under its belly, with one rounded front paw
          curled out in front of its chin. It fills about 80 percent of the
          canvas width, lies low (its top about 55 percent of the canvas
          height), and rests on an invisible ground line at 88 percent of the
          height, centered, with empty space above it. No flowers, no ground,
          no shadow, no island.
      - block: style-anchor-v1
      - block: negative-v1
      - text: "AVOID: teeth, claws, open eyes, a frown, a whale or bear shape, glowing parts, flowers, a ground, a shadow, text, letters, zzz, outlines"

