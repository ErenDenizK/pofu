<title>Pofu Atlas</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Pofu's content board: islands, stations, characters, systems, storyboard, progression, ideas and every generated image.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap">
<style>
/* Layout: one pannable world of labelled regions (a studio content wall); fixed glass chrome on top. Tokens from design/tokens/pofu-tokens.json. */
:root {
  --bg: #FFF6EC;            /* cream-100, background.canvas */
  --sunken: #FBEBDD;        /* cream-200 */
  --card: #FFFBF5;          /* cream-50 */
  --raised: #FFFFFF;
  --fg: #2A1F2D;            /* ink-900 */
  --fg2: #66555F;           /* ink-600 */
  --fg3: #8E7D88;           /* ink-400 */
  --line: rgba(42, 31, 45, .12);
  --line2: rgba(42, 31, 45, .22);
  --accent: #6C4FD8;        /* violet-600 */
  --accent-tint: #EEE8FF;   /* violet-100 */
  --on-accent: #FFFFFF;
  --ok: #2F7349;  --ok-tint: #DDF1E3;
  --warn: #8A5A00; --warn-tint: #FCEBC8;
  --crit: #B23A5A; --crit-tint: #FBDDE5;
  --muted-tint: #EFE6EC;
  --glass: rgba(255, 251, 245, .82);
  --shadow: 0 1px 2px rgba(42, 31, 45, .08), 0 6px 18px rgba(42, 31, 45, .07);
  --dot: rgba(42, 31, 45, .09);
  /* region tints */
  --r-arch: #EAF4E4; --r-char: #FCE8E1; --r-sys: #ECE8FB; --r-story: #FFF0D9;
  --r-prog: #E4F0F6; --r-theme: #F6E7F1; --r-idea: #F2EEE4; --r-asset: #EDEAF0;
  /* type hues */
  --t-island: #4F8A5B; --t-station: #C07A2C; --t-character: #C4577A; --t-system: #6C4FD8;
  --t-moment: #B9811A; --t-theme: #A0558E; --t-idea: #6B7A3A; --t-asset: #557089;
  --font: "Nunito", ui-rounded, "SF Pro Rounded", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #15111C; --sunken: #1E1828; --card: #1E1828; --raised: #2A2236;
    --fg: #FFF6EC; --fg2: #B8A8B1; --fg3: #85768A;
    --line: rgba(255, 246, 236, .12); --line2: rgba(255, 246, 236, .22);
    --accent: #B9A2FF; --accent-tint: #2E2547; --on-accent: #15111C;
    --ok: #8FD4A4; --ok-tint: #1D3326; --warn: #F7C873; --warn-tint: #3A2E14;
    --crit: #FF9EB5; --crit-tint: #3E1D28; --muted-tint: #2A2236;
    --glass: rgba(30, 24, 40, .82);
    --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 8px 22px rgba(0, 0, 0, .35);
    --dot: rgba(255, 246, 236, .07);
    --r-arch: #18241C; --r-char: #2A1C22; --r-sys: #211C33; --r-story: #2A2216;
    --r-prog: #172229; --r-theme: #261B26; --r-idea: #22201A; --r-asset: #1F1D25;
    --t-island: #8CC084; --t-station: #ECA96E; --t-character: #FF9EB5; --t-system: #B9A2FF;
    --t-moment: #F7C873; --t-theme: #E1A6D3; --t-idea: #C6D08A; --t-asset: #9DB8CF;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #15111C; --sunken: #1E1828; --card: #1E1828; --raised: #2A2236;
  --fg: #FFF6EC; --fg2: #B8A8B1; --fg3: #85768A;
  --line: rgba(255, 246, 236, .12); --line2: rgba(255, 246, 236, .22);
  --accent: #B9A2FF; --accent-tint: #2E2547; --on-accent: #15111C;
  --ok: #8FD4A4; --ok-tint: #1D3326; --warn: #F7C873; --warn-tint: #3A2E14;
  --crit: #FF9EB5; --crit-tint: #3E1D28; --muted-tint: #2A2236;
  --glass: rgba(30, 24, 40, .82);
  --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 8px 22px rgba(0, 0, 0, .35);
  --dot: rgba(255, 246, 236, .07);
  --r-arch: #18241C; --r-char: #2A1C22; --r-sys: #211C33; --r-story: #2A2216;
  --r-prog: #172229; --r-theme: #261B26; --r-idea: #22201A; --r-asset: #1F1D25;
  --t-island: #8CC084; --t-station: #ECA96E; --t-character: #FF9EB5; --t-system: #B9A2FF;
  --t-moment: #F7C873; --t-theme: #E1A6D3; --t-idea: #C6D08A; --t-asset: #9DB8CF;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { height: 100%; box-sizing: border-box; overflow: hidden; }
body {
  height: 100%; margin: 0; overflow: hidden; background: var(--bg); color: var(--fg);
  font: 15px/1.4 var(--font); -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--glass); }
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2.5px solid var(--accent); outline-offset: 2px; }

/* ---------------------------------------------------------------- chrome */
#app { position: fixed; inset: 0; }
#viewport {
  position: absolute; inset: 0; overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none;
  background-color: var(--bg);
  background-image: radial-gradient(var(--dot) 1.2px, transparent 1.3px);
  background-size: 22px 22px; cursor: grab;
}
#viewport.dragging { cursor: grabbing; }
#world { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
#world.moving { will-change: transform; }

.topbar {
  position: absolute; z-index: 5; left: 0; right: 0; top: 0;
  padding: calc(env(safe-area-inset-top, 0px) + 10px) max(16px, env(safe-area-inset-right, 0px)) 10px max(16px, env(safe-area-inset-left, 0px));
  display: flex; gap: 8px; align-items: center; pointer-events: none;
}
.topbar > * { pointer-events: auto; }
.brand {
  display: flex; align-items: center; gap: 8px; padding: 0 12px 0 6px; height: 44px; border-radius: 22px;
  background: var(--glass); backdrop-filter: blur(14px) saturate(1.4); -webkit-backdrop-filter: blur(14px) saturate(1.4);
  box-shadow: var(--shadow); font-weight: 900; letter-spacing: -.01em; white-space: nowrap; border: 0;
}
.brand .seed { width: 32px; height: 32px; border-radius: 50%; background: var(--accent); display: grid; place-items: center; color: var(--on-accent); }
.brand .seed svg { width: 18px; height: 18px; }
.brand small { font-weight: 700; color: var(--fg3); font-size: 12px; }
.search {
  flex: 1; min-width: 0; position: relative; height: 44px; border-radius: 22px; background: var(--glass);
  backdrop-filter: blur(14px) saturate(1.4); -webkit-backdrop-filter: blur(14px) saturate(1.4); box-shadow: var(--shadow);
  display: flex; align-items: center;
}
.search svg { width: 18px; height: 18px; margin-left: 14px; color: var(--fg3); flex: none; }
.search input { flex: 1; min-width: 0; height: 100%; border: 0; background: transparent; padding: 0 14px 0 8px; font-size: 16px; outline: none; }
.iconbtn {
  flex: none; width: 44px; height: 44px; border-radius: 22px; border: 0; background: var(--glass);
  backdrop-filter: blur(14px) saturate(1.4); -webkit-backdrop-filter: blur(14px) saturate(1.4); box-shadow: var(--shadow);
  display: grid; place-items: center; position: relative;
}
.iconbtn svg { width: 20px; height: 20px; }
.iconbtn .dotbadge { position: absolute; top: 8px; right: 8px; width: 9px; height: 9px; border-radius: 50%; background: var(--accent); border: 2px solid var(--card); }
.results {
  position: absolute; left: 0; right: 0; top: 52px; max-height: min(60vh, 440px); overflow: auto; border-radius: 18px;
  background: var(--raised); box-shadow: var(--shadow); padding: 6px; border: 1px solid var(--line);
}
.results button {
  width: 100%; text-align: left; border: 0; background: transparent; border-radius: 12px; padding: 9px 10px;
  display: grid; grid-template-columns: 10px 1fr auto; gap: 10px; align-items: center; min-height: 44px;
}
.results button:hover, .results button.on { background: var(--accent-tint); }
.results .r-t { font-weight: 800; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.results .r-s { color: var(--fg3); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.results .empty { padding: 14px; color: var(--fg2); }

.regionbar {
  position: absolute; z-index: 4; left: 0; right: 0; bottom: 0;
  padding: 10px max(16px, env(safe-area-inset-right, 0px)) calc(env(safe-area-inset-bottom, 0px) + 10px) max(16px, env(safe-area-inset-left, 0px));
  display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; pointer-events: none;
}
.regionbar::-webkit-scrollbar { display: none; }
.regionbar button {
  pointer-events: auto; flex: none; height: 40px; padding: 0 14px; border-radius: 20px; border: 0; font-weight: 800; font-size: 14px;
  background: var(--glass); backdrop-filter: blur(14px) saturate(1.4); -webkit-backdrop-filter: blur(14px) saturate(1.4);
  box-shadow: var(--shadow); display: flex; align-items: center; gap: 8px; white-space: nowrap;
}
.regionbar button i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }

.zoomctl { position: absolute; z-index: 4; right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(env(safe-area-inset-bottom, 0px) + 62px); display: flex; flex-direction: column; gap: 8px; }

/* filters */
.sheet {
  position: absolute; z-index: 7; right: max(16px, env(safe-area-inset-right, 0px)); top: calc(env(safe-area-inset-top, 0px) + 62px);
  width: min(420px, calc(100vw - 32px)); max-height: calc(100% - 140px); overflow: auto;
  background: var(--raised); border-radius: 22px; box-shadow: var(--shadow); border: 1px solid var(--line); padding: 16px;
}
.sheet h3 { margin: 4px 0 8px; font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--fg3); font-weight: 800; }
.sheet .row { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
.fchip { min-height: 36px; padding: 0 12px; border-radius: 18px; border: 1.5px solid var(--line2); background: transparent; font-weight: 700; font-size: 14px; display: inline-flex; align-items: center; gap: 6px; }
.fchip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.fchip i { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }
.sheet .foot { display: flex; justify-content: space-between; align-items: center; gap: 12px; color: var(--fg2); font-size: 14px; }
.textbtn { border: 0; background: transparent; color: var(--accent); font-weight: 800; min-height: 44px; padding: 0 6px; }

/* overlay labels at far zoom */
#labels { position: absolute; inset: 0; pointer-events: none; z-index: 2; }
.olabel {
  position: absolute; pointer-events: auto; border: 0; transform: translate(0, -100%);
  padding: 6px 12px; border-radius: 14px; font-weight: 900; font-size: 15px; white-space: nowrap;
  background: var(--glass); box-shadow: var(--shadow); color: var(--fg);
}
.olabel span { color: var(--fg3); font-weight: 700; font-size: 12px; margin-left: 6px; }

/* ---------------------------------------------------------------- world */
.region { position: absolute; border-radius: 48px; }
.region > .rhead { position: absolute; left: 48px; top: 36px; right: 48px; }
.rhead h2 { margin: 0; font-size: 64px; line-height: 1; font-weight: 900; letter-spacing: -.02em; text-wrap: balance; }
.rhead p { margin: 10px 0 0; font-size: 22px; color: var(--fg2); max-width: 70ch; }
.far .rhead { visibility: hidden; }

.card {
  position: absolute; display: flex; gap: 10px; padding: 10px; border-radius: 16px; background: var(--card);
  box-shadow: var(--shadow); border: 1px solid var(--line); overflow: hidden;
}
.card .thumb { flex: none; width: 76px; height: 76px; border-radius: 12px; background: var(--sunken); display: grid; place-items: center; overflow: hidden; position: relative; }
.card .thumb img { width: 100%; height: 100%; object-fit: contain; }
.card .thumb.ph { font-weight: 900; font-size: 26px; color: var(--tc); background: color-mix(in srgb, var(--tc) 14%, var(--card)); }
.card .body { min-width: 0; display: flex; flex-direction: column; gap: 6px; flex: 1; }
.card .ttl { font-weight: 800; font-size: 16px; line-height: 1.2; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.card .sub { font-size: 12.5px; color: var(--fg2); line-height: 1.3; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.card .meta { margin-top: auto; display: flex; align-items: center; gap: 6px; flex-wrap: nowrap; min-width: 0; }
.card::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: var(--tc); opacity: .9; }
.card.sel { outline: 3px solid var(--accent); outline-offset: 3px; }
.card.dim, .lvl.dim { opacity: .14; }
.far .card > * { visibility: hidden; }
.far .card { box-shadow: none; background: color-mix(in srgb, var(--tc) 28%, var(--card)); }
.off { display: none !important; }

.chip { display: inline-flex; align-items: center; height: 20px; padding: 0 8px; border-radius: 10px; font-size: 11.5px; font-weight: 800; white-space: nowrap; }
.st-idea { background: var(--muted-tint); color: var(--fg2); }
.st-planned { background: var(--accent-tint); color: var(--accent); }
.st-in-production { background: var(--warn-tint); color: var(--warn); }
.st-in-app { background: var(--ok-tint); color: var(--ok); }
.st-cut { background: var(--crit-tint); color: var(--crit); text-decoration: line-through; }
.chip.hz { background: transparent; border: 1px solid var(--line2); color: var(--fg2); }
.chip.unused { background: var(--crit); color: var(--card); }
.nc { margin-left: auto; display: inline-flex; gap: 6px; align-items: center; font-size: 12px; color: var(--fg3); font-weight: 700; white-space: nowrap; }
.nc .fn { display: inline-flex; align-items: center; gap: 3px; color: var(--on-accent); background: var(--accent); border-radius: 9px; height: 18px; padding: 0 6px; font-weight: 800; }
.nc .fn[hidden] { display: none; }
.nc svg { width: 12px; height: 12px; }

.ty-island { --tc: var(--t-island); } .ty-station { --tc: var(--t-station); } .ty-character { --tc: var(--t-character); }
.ty-system { --tc: var(--t-system); } .ty-moment { --tc: var(--t-moment); } .ty-theme { --tc: var(--t-theme); }
.ty-idea { --tc: var(--t-idea); } .ty-asset { --tc: var(--t-asset); }

/* islands and stations */
.isle { position: absolute; border-radius: 40px; background: color-mix(in srgb, var(--card) 62%, transparent); border: 2px dashed color-mix(in srgb, var(--t-island) 45%, transparent); }
.isle.locked { border-style: dotted; }
.card.island { padding: 14px; gap: 16px; border-radius: 26px; }
.card.island .thumb { width: 220px; height: 146px; border-radius: 18px; background: linear-gradient(180deg, color-mix(in srgb, var(--accent-tint) 70%, var(--card)), var(--card)); }
.card.island .ttl { font-size: 30px; font-weight: 900; }
.card.island .sub { font-size: 14px; -webkit-line-clamp: 3; }
.card.island .rule { font-size: 13px; color: var(--fg2); font-weight: 700; }
.card.island .rule b { color: var(--fg); }
.card.station { flex-direction: column; gap: 10px; border-radius: 20px; }
.card.station .top { display: flex; gap: 10px; min-height: 64px; }
.card.station .top .thumb { width: 64px; height: 64px; }
.lvls { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
.lvl { position: relative; border-radius: 10px; background: var(--sunken); aspect-ratio: 1; display: grid; place-items: center; overflow: hidden; border: 1px solid var(--line); }
.lvl img { width: 100%; height: 100%; object-fit: contain; }
.lvl .n { position: absolute; left: 4px; top: 3px; font-size: 11px; font-weight: 900; color: var(--fg2); }
.lvl .c { position: absolute; right: 4px; bottom: 3px; font-size: 10px; font-weight: 800; color: var(--fg3); font-variant-numeric: tabular-nums; }
.lvl.ph { background: repeating-linear-gradient(135deg, var(--sunken) 0 6px, color-mix(in srgb, var(--sunken) 70%, var(--card)) 6px 12px); }
.lvl.ph .d { font-size: 10px; line-height: 1.15; color: var(--fg3); text-align: center; padding: 14px 4px 12px; font-weight: 700; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.lvl.has { background: var(--card); }
.lvl.cutl { opacity: .5; }

/* systems */
svg.edges { position: absolute; left: 0; top: 0; overflow: visible; pointer-events: none; }
svg.edges path { fill: none; stroke-width: 3; opacity: .55; }
svg.edges path.e-feeds { stroke: var(--ok); }
svg.edges path.e-drains { stroke: var(--crit); stroke-dasharray: 2 7; stroke-linecap: round; }
svg.edges path.e-leads_to { stroke: var(--accent); }
svg.edges path.e-requires { stroke: var(--fg3); stroke-dasharray: 10 8; }
svg.edges path.hot { opacity: 1; stroke-width: 5; }
svg.edges.focus path:not(.hot) { opacity: .12; }
.legend { display: flex; gap: 22px; flex-wrap: wrap; margin-top: 14px; font-size: 20px; font-weight: 800; color: var(--fg2); }
.legend span { display: inline-flex; align-items: center; gap: 10px; }
.legend i { width: 38px; height: 0; border-top: 4px solid; display: inline-block; }
.colhead { position: absolute; font-size: 22px; font-weight: 900; color: var(--fg3); text-transform: uppercase; letter-spacing: .08em; }

/* storyboard and timeline */
.actlabel { position: absolute; font-size: 26px; font-weight: 900; color: var(--fg); width: 220px; line-height: 1.1; }
.actlabel small { display: block; font-size: 15px; color: var(--fg3); font-weight: 700; margin-top: 4px; }
.arrow { position: absolute; height: 0; border-top: 3px solid color-mix(in srgb, var(--t-moment) 60%, transparent); }
.arrow::after { content: ""; position: absolute; right: -2px; top: -8px; border: 6.5px solid transparent; border-left: 10px solid color-mix(in srgb, var(--t-moment) 60%, transparent); }
.axis { position: absolute; height: 0; border-top: 3px solid var(--line2); }
.tick { position: absolute; width: 0; border-left: 2px solid var(--line2); }
.ticklabel { position: absolute; font-size: 20px; font-weight: 900; color: var(--fg2); transform: translateX(-50%); white-space: nowrap; font-variant-numeric: tabular-nums; }
.lane { position: absolute; border-radius: 28px; background: color-mix(in srgb, var(--card) 55%, transparent); }
.lanehead { position: absolute; font-size: 30px; font-weight: 900; }
.lanehead small { font-size: 18px; color: var(--fg3); font-weight: 800; margin-left: 8px; }
.card.mini { padding: 8px 10px 8px 12px; border-radius: 12px; }
.card.mini .ttl { font-size: 14px; -webkit-line-clamp: 2; }
.card.mini .day { font-size: 11.5px; color: var(--fg3); font-weight: 800; font-variant-numeric: tabular-nums; }
.card.asset { flex-direction: column; gap: 8px; padding: 8px; }
.card.asset .thumb { width: 100%; height: 132px; border-radius: 10px; background: repeating-conic-gradient(var(--sunken) 0 25%, var(--card) 0 50%) 0 0 / 16px 16px; }
.card.asset .thumb.ph { background: color-mix(in srgb, var(--tc) 10%, var(--card)); font-size: 14px; color: var(--fg3); }
.card.asset .ttl { font-size: 13.5px; font-family: var(--mono); font-weight: 700; -webkit-line-clamp: 1; }
.card.asset .meta { flex-wrap: wrap; gap: 4px; }
.card.asset .used { font-size: 11.5px; color: var(--fg3); font-weight: 700; }
.card.emo .thumb { width: 56px; height: 56px; }
.card.emo .sub { font-style: italic; }

/* ---------------------------------------------------------------- drawer */
#drawer {
  position: absolute; z-index: 8; background: var(--raised); box-shadow: 0 -8px 40px rgba(0, 0, 0, .18);
  display: flex; flex-direction: column; overflow: hidden;
  left: 0; right: 0; bottom: 0; height: 64%; border-radius: 26px 26px 0 0;
  transition: transform .32s cubic-bezier(.2, .9, .25, 1), height .28s ease;
}
#drawer.tall { height: calc(100% - env(safe-area-inset-top, 0px) - 64px); }
#drawer[hidden] { display: none !important; }
@media (min-width: 900px) {
  #drawer, #drawer.tall { left: auto; top: calc(env(safe-area-inset-top, 0px) + 68px); bottom: 12px; right: 12px; width: 440px; height: auto; border-radius: 24px; }
  #drawer .grab, #drawer .tallbtn { display: none; }
}
#drawer .dh { flex: none; padding: 6px max(16px, env(safe-area-inset-right, 0px)) 0 max(16px, env(safe-area-inset-left, 0px)); }
.grab { width: 44px; height: 5px; border-radius: 3px; background: var(--line2); margin: 4px auto 6px; }
.dtools { display: flex; gap: 8px; align-items: center; justify-content: space-between; }
.dtools .kind { font-size: 12px; font-weight: 800; text-transform: uppercase; letter-spacing: .08em; color: var(--tc); display: flex; align-items: center; gap: 8px; min-width: 0; }
.dtools .kind code { font-family: var(--mono); text-transform: none; letter-spacing: 0; color: var(--fg3); font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dtools .btns { display: flex; gap: 6px; flex: none; }
.dtools button { width: 40px; height: 40px; border-radius: 20px; border: 0; background: var(--sunken); display: grid; place-items: center; }
.dtools button svg { width: 18px; height: 18px; }
#dbody { flex: 1; overflow: auto; overscroll-behavior: contain; padding: 4px max(16px, env(safe-area-inset-right, 0px)) calc(env(safe-area-inset-bottom, 0px) + 24px) max(16px, env(safe-area-inset-left, 0px)); -webkit-user-select: text; user-select: text; }

<script type="application/json" id="atlas-data">/*__ATLAS_DATA__*/{}</script>
<script>
(() => {
"use strict";
const DATA = JSON.parse(document.getElementById("atlas-data").textContent);
const NODES = new Map(DATA.nodes.map(n => [n.id, n]));
const THUMBS = DATA.thumbs || {};

// ------------------------------------------------------------------ vocab (UI copy is Turkish)
const TYPE = { island: "Ada", station: "İstasyon", character: "Karakter", system: "Sistem", moment: "An", theme: "Tema", idea: "Fikir", asset: "Görsel" };
const STATUS = { idea: "Fikir", planned: "Planlandı", "in-production": "Üretimde", "in-app": "Uygulamada", cut: "Kesildi" };
const HORIZON = { now: "Şimdi", next: "Sonra", later: "İleride", maybe: "Belki" };
const EDGE_OUT = { unlocks: "Açar", requires: "Gerektirir", part_of: "Parçası olduğu", variant_of: "Türevi olduğu", uses_asset: "Kullandığı görseller",
  inspired_by: "İlham kaynağı", feeds: "Besler", drains: "Azaltır", leads_to: "Götürür", supersedes: "Yerini aldığı", related: "İlgili" };
const EDGE_IN = { unlocks: "Bunu açanlar", requires: "Buna ihtiyaç duyanlar", part_of: "İçindekiler", variant_of: "Türevleri", uses_asset: "Kullananlar",
  inspired_by: "İlham verdikleri", feeds: "Besleyenler", drains: "Azaltanlar", leads_to: "Buraya götürenler", supersedes: "Yerini alanlar", related: "İlgili (gelen)" };
const ACTS = [["first-run", "İlk açılış", "Onboarding, 55 sn"], ["gate", "Kapı", "Kalkan ve Hop!"], ["visit", "Ziyaret", "En fazla üç vuruş"],
  ["day", "Gün içinde", "Bakışlar ve tepkiler"], ["night", "Gece ve sabah", "Adalar uyur"], ["arc", "Haftalar", "İlk yedi gün ve ötesi"], ["repair", "Onarım", "Kurulum sağlığı"]];
const GROUPS = { gate: "Kapı", care: "Bakım", economy: "Ekonomi", world: "Dünya", app: "Uygulama", glance: "Bakış", character: "Karakter", visual: "Görsel dil", meta: "Kurallar" };

// ------------------------------------------------------------------ helpers
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const fmt = n => Number(n).toLocaleString("tr-TR");
const thumbOf = path => THUMBS[path];
const inbound = new Map();
for (const n of DATA.nodes) for (const [e, ts] of Object.entries(n.links || {})) for (const t of ts) {
  if (!inbound.has(t)) inbound.set(t, []);
  inbound.get(t).push({ edge: e, from: n.id });
}
const usedBy = id => (inbound.get(id) || []).filter(l => l.edge === "uses_asset" || l.edge === "inspired_by" || (l.edge === "variant_of" && NODES.get(l.from)?.type === "asset"));
const isUnused = n => n.type === "asset" && n.images.length > 0 && usedBy(n.id).length === 0;

// ------------------------------------------------------------------ world building
const items = [];      // {el?, id, x, y, w, h, primary, img}
const primaryOf = new Map();
const regions = [];
let html = "";

function thumbHTML(path, cls, letter) {
  const t = path && thumbOf(path);
  if (t) return `<div class="${cls}"><img alt="" decoding="async" data-src="${esc(t.s)}"></div>`;
  return `<div class="${cls} ph" aria-hidden="true">${esc(letter || "")}</div>`;
}
function noteCount(n) {
  const k = (n.notes || []).length;
  return `<span class="nc" data-nc="${esc(n.id)}">${k ? `<span title="Doküman notları">${k} not</span>` : ""}<span class="fn" hidden><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M4 5h16v11H9l-5 4z"/></svg><b></b></span></span>`;
}
function chip(n) { return `<span class="chip st-${n.status}">${STATUS[n.status]}</span>`; }

function addItem(id, x, y, w, h, inner, cls, primary = true) {
  const k = items.length;
  items.push({ id, x, y, w, h, primary });
  if (primary && !primaryOf.has(id)) primaryOf.set(id, k);
  const n = NODES.get(id);
  html += `<div class="card ty-${n ? n.type : "asset"} ${cls || ""}" data-k="${k}" data-id="${esc(id)}" style="left:${x}px;top:${y}px;width:${w}px;height:${h}px">${inner}</div>`;
}
function genericCard(n, x, y, w = 260, h = 100, primary = true, sub) {
  const letter = (n.title_tr || "?").replace(/^Pofu: /, "").trim()[0];
  const inner = thumbHTML(n.thumb, "thumb", letter) +
    `<div class="body"><div class="ttl">${esc(n.title_tr)}</div>${sub ? `<div class="sub">${esc(sub)}</div>` : ""}<div class="meta">${chip(n)}${noteCount(n)}</div></div>`;
  addItem(n.id, x, y, w, h, inner, "", primary);
}
function region(id, label, sub, color, w, h, build) {
  regions.push({ id, label, sub, color, w, h, build });
}
const byType = t => DATA.nodes.filter(n => n.type === t);

// --- Archipelago
const ISLAND_ORDER = ["island-aycicegi", "island-iskele", "island-yildiz", "island-kaplica", "island-kitap"];
const stationsOf = isl => byType("station").filter(s => (s.links.part_of || []).includes(isl)).sort((a, b) => (a.unlock?.day ?? 0) - (b.unlock?.day ?? 0));
const ST_W = 400, ST_H = 178, GAP = 28;
function stationCard(s, x, y) {
  const lv = (s.levels || []).map(l => {
    const a = l.asset && NODES.get(l.asset);
    const p = a && a.images[0];
    const t = p && thumbOf(p);
    const cls = `lvl${t ? " has" : " ph"}${a && a.status === "cut" ? " cutl" : ""}`;
    const k = items.length;
    const body = t ? `<img alt="" decoding="async" data-src="${esc(t.s)}">` : `<span class="d">${esc(l.title_tr)}</span>`;
    return `<div class="${cls}" ${a ? `data-id="${esc(a.id)}"` : ""} title="${esc(`L${l.level} · ${l.title_tr}`)}"><span class="n">L${l.level}</span>${body}<span class="c">${fmt(l.cost)}</span></div>`;
  }).join("");
  const inner = `<div class="top">${thumbHTML(s.thumb, "thumb", s.title_tr[0])}<div class="body"><div class="ttl">${esc(s.title_tr)}</div>` +
    `<div class="sub">${esc(NODES.get(s.resident)?.title_tr || "")} · ${esc(s.opens_en || "")}</div><div class="meta">${chip(s)}${noteCount(s)}</div></div></div><div class="lvls">${lv}</div>`;
  addItem(s.id, x, y, ST_W, ST_H, inner, "station");
}
function buildArchipelago(ox, oy) {
  let x = ox + 48, y0 = oy + 190, maxH = 0;
  for (const id of ISLAND_ORDER) {
    const isl = NODES.get(id); if (!isl) continue;
    const sts = stationsOf(id);
    const cols = sts.length > 3 ? 2 : 1;
    const innerW = cols * ST_W + (cols - 1) * GAP;
    const fw = Math.max(innerW, 400) + 56;
    const rows = Math.ceil(sts.length / cols);
    const headH = 210;
    const fh = headH + 40 + rows * (ST_H + GAP) + 20;
    html += `<div class="isle${isl.status === "planned" ? " locked" : ""}" style="left:${x}px;top:${y0}px;width:${fw}px;height:${fh}px"></div>`;
    const rule = isl.unlock ? `<div class="rule">Gün <b>${isl.unlock.day}</b> · ${esc(isl.unlock.rule_en || "")}</div>` : "";
    const inner = thumbHTML(isl.thumb, "thumb", isl.title_tr[0]) +
      `<div class="body"><div class="ttl">${esc(isl.title_tr)}</div><div class="sub">${esc(isl.ritual_en || isl.summary)}</div>${rule}<div class="meta">${chip(isl)}${noteCount(isl)}</div></div>`;
    addItem(id, x + 28, y0 + 28, fw - 56, headH - 20, inner, "island");
    sts.forEach((s, i) => stationCard(s, x + 28 + (i % cols) * (ST_W + GAP), y0 + headH + 30 + Math.floor(i / cols) * (ST_H + GAP)));
    x += fw + 48; maxH = Math.max(maxH, fh);
  }
  return { w: x - ox, h: y0 - oy + maxH + 60 };
}

// --- Characters
function buildCharacters(ox, oy) {
  const res = byType("character").filter(c => c.kind !== "emotion").sort((a, b) => (a.unlock?.day ?? 99) - (b.unlock?.day ?? 99));
  const emo = byType("character").filter(c => c.kind === "emotion");
  const cols = 4, w = 300, h = 112, g = 22;
  let y = oy + 190;
  html += `<div class="colhead" style="left:${ox + 48}px;top:${y - 40}px">Komşular</div>`;
  res.forEach((c, i) => genericCard(c, ox + 48 + (i % cols) * (w + g), y + Math.floor(i / cols) * (h + g), w, h, true, c.species_en));
  y += Math.ceil(res.length / cols) * (h + g) + 70;
  html += `<div class="colhead" style="left:${ox + 48}px;top:${y - 40}px">Pofu'nun duyguları</div>`;
  emo.forEach((c, i) => {
    const inner = `<div class="body"><div class="ttl">${esc(c.title_tr.replace(/^Pofu: /, ""))}</div><div class="sub">“${esc(c.line_tr || "")}”</div><div class="meta">${chip(c)}<span class="chip hz">${HORIZON[c.horizon]}</span>${noteCount(c)}</div></div>`;
    addItem(c.id, ox + 48 + (i % cols) * (w + g), y + Math.floor(i / cols) * (h + g), w, h, inner, "emo");
  });
  y += Math.ceil(emo.length / cols) * (h + g);
  return { w: 48 * 2 + cols * w + (cols - 1) * g, h: y - oy + 40 };
}

// --- Systems map
const SYS_W = 270, SYS_H = 104, SYS_CX = 330, SYS_CY = 170;
const sysEdges = [];
function buildSystems(ox, oy) {
  const sys = byType("system");
  let maxC = 0, maxR = 0;
  const pos = new Map();
  for (const s of sys) {
    const c = s.board?.col ?? 0, r = s.board?.row ?? 0;
    const x = ox + 48 + c * SYS_CX, y = oy + 250 + r * SYS_CY;
    pos.set(s.id, { x, y });
    maxC = Math.max(maxC, c); maxR = Math.max(maxR, r);
    genericCard(s, x, y, SYS_W, SYS_H, true, GROUPS[s.group] || "");
  }
  const W = 48 * 2 + maxC * SYS_CX + SYS_W, H = 250 + maxR * SYS_CY + SYS_H + 60;
  let paths = "";
  for (const s of sys) for (const e of ["feeds", "drains", "leads_to", "requires"]) for (const t of (s.links[e] || [])) {
    if (!pos.has(t)) continue;
    const a = pos.get(s.id), b = pos.get(t);
    let x1, y1, x2, y2, d;
    if (b.x > a.x + 10) { x1 = a.x + SYS_W; y1 = a.y + SYS_H / 2; x2 = b.x; y2 = b.y + SYS_H / 2; const m = (x2 - x1) * .5; d = `M${x1},${y1} C${x1 + m},${y1} ${x2 - m},${y2} ${x2},${y2}`; }
    else if (b.x < a.x - 10) { x1 = a.x; y1 = a.y + SYS_H / 2; x2 = b.x + SYS_W; y2 = b.y + SYS_H / 2; const m = Math.max(80, (x1 - x2) * .5); d = `M${x1},${y1} C${x1 - m},${y1 - 60} ${x2 + m},${y2 - 60} ${x2},${y2}`; }
    else { const down = b.y > a.y; x1 = a.x + SYS_W / 2 + 30; y1 = down ? a.y + SYS_H : a.y; x2 = b.x + SYS_W / 2 + 30; y2 = down ? b.y : b.y + SYS_H; d = `M${x1},${y1} C${x1 + 40},${(y1 + y2) / 2} ${x2 + 40},${(y1 + y2) / 2} ${x2},${y2}`; }
    paths += `<path class="e-${e}" data-from="${esc(s.id)}" data-to="${esc(t)}" d="${d}" marker-end="url(#ah-${e})"/>`;
  }
  const marker = e => `<marker id="ah-${e}" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="e-${e}" style="fill:currentColor;stroke:none"/></marker>`;
  html += `<svg class="edges" id="sysedges" width="1" height="1"><defs>${["feeds", "drains", "leads_to", "requires"].map(marker).join("")}</defs>${paths}</svg>`;
  return { w: W, h: H };
}

// --- Storyboard
function buildStory(ox, oy) {
  const w = 270, h = 116, gx = 56, gy = 40;
  let y = oy + 190, maxX = 0;
  for (const [act, label, sub] of ACTS) {
    const ms = byType("moment").filter(m => m.act === act).sort((a, b) => a.sequence - b.sequence);
    if (!ms.length) continue;
    html += `<div class="actlabel" style="left:${ox + 48}px;top:${y + 18}px">${esc(label)}<small>${esc(sub)}</small></div>`;
    ms.forEach((m, i) => {
      const x = ox + 290 + i * (w + gx);
      genericCard(m, x, y, w, h, true, m.title_en);
      if (i) html += `<div class="arrow" style="left:${x - gx + 8}px;top:${y + h / 2}px;width:${gx - 18}px"></div>`;
      maxX = Math.max(maxX, x + w);
    });
    y += h + gy;
  }
  return { w: maxX - ox + 48, h: y - oy + 30 };
}

// --- Progression timeline
const DAYPX = 64;
function buildTimeline(ox, oy) {
  const lanes = [["island", "Adalar"], ["station", "İstasyonlar"], ["character", "Komşular"], ["moment", "Anlar"]];
  const maxDay = Math.max(...DATA.nodes.filter(n => n.unlock).map(n => n.unlock.day)) + 4;
  const x0 = ox + 290, w = 200, h = 64;
  let y = oy + 230;
  const axisY = y - 30;
  html += `<div class="axis" style="left:${x0}px;top:${axisY}px;width:${maxDay * DAYPX}px"></div>`;
  for (let d = 0; d <= maxDay; d += 7) {

  resultSel = 0;
  results.innerHTML = resultList.length ? resultList.map((n, i) =>
    `<button type="button" class="ty-${n.type}${i === 0 ? " on" : ""}" data-go="${esc(n.id)}"><i style="width:10px;height:10px;border-radius:50%;background:var(--tc)"></i><span style="min-width:0"><div class="r-t">${esc(n.title_tr)}</div><div class="r-s">${TYPE[n.type]} · ${esc(n.title_en)}</div></span><span class="chip st-${n.status}">${STATUS[n.status]}</span></button>`).join("")
    : `<div class="empty">“${esc(q.value)}” için sonuç yok.</div>`;
  results.hidden = false; $("#filters").hidden = true;
}
q.addEventListener("input", runSearch);
q.addEventListener("focus", () => { if (q.value) runSearch(); });
q.addEventListener("keydown", e => {
  if (e.key === "Enter" && resultList[resultSel]) { openNode(resultList[resultSel].id, true); results.hidden = true; q.blur(); }
  if (e.key === "ArrowDown" || e.key === "ArrowUp") {
    e.preventDefault(); resultSel = (resultSel + (e.key === "ArrowDown" ? 1 : -1) + resultList.length) % Math.max(1, resultList.length);
    results.querySelectorAll("button").forEach((b, i) => b.classList.toggle("on", i === resultSel));
  }
});
results.addEventListener("click", e => { const b = e.target.closest("[data-go]"); if (b) { openNode(b.dataset.go, true); results.hidden = true; q.blur(); } });
document.addEventListener("pointerdown", e => {
  if (!e.target.closest(".search")) results.hidden = true;
  if (!e.target.closest("#filters, #filterbtn")) { $("#filters").hidden = true; $("#filterbtn").setAttribute("aria-expanded", "false"); }
}, true);

// ------------------------------------------------------------------ drawer
const drawer = $("#drawer"), dbody = $("#dbody");
let current = null;
function linkChip(id) {
  const n = NODES.get(id);
  if (!n) return `<span class="lchip missing">${esc(id)}</span>`;
  return `<button type="button" class="lchip ty-${n.type}" data-go="${esc(id)}"><i></i>${esc(n.title_tr)}</button>`;
}
function gallery(paths) {
  return `<div class="gallery">${paths.map(p => { const t = thumbOf(p); return t ? `<figure><div class="img"><img alt="" src="${esc(t.l)}"></div><figcaption>${esc(p)}${t.branch ? " · " + esc(t.branch) : ""}</figcaption></figure>` : ""; }).join("")}</div>`;
}
function srcLink(s) {
  const url = `${DATA.repo}/blob/main/${s.doc}${s.anchor || ""}`;
  return `<a href="${esc(url)}" target="_blank" rel="noopener">${esc(s.doc)}${s.anchor ? esc(s.anchor) : ""}</a>`;
}
function renderDrawer(n) {
  const parts = [];
  const brain = n.source === "lead-brainstorm" ? `<span class="chip brain">Ekip önerisi</span>` : "";
  parts.push(`<h1>${esc(n.title_tr)}</h1><p class="en">${esc(n.title_en)}</p>`);
  parts.push(`<div class="chips"><span class="chip st-${n.status}">${STATUS[n.status]}</span><span class="chip hz">Ufuk: ${HORIZON[n.horizon]}</span>${n.kind ? `<span class="chip hz">${esc(n.kind)}</span>` : ""}${n.group ? `<span class="chip hz">${esc(GROUPS[n.group] || n.group)}</span>` : ""}${brain}</div>`);
  if (isUnused(n)) parts.push(`<div class="flag">Bu görsel hiçbir düğümde kullanılmıyor. Bir istasyona, karaktere ya da temaya bağla, ya da kesildi olarak işaretle.</div>`);
  const art = [...n.images];
  if (n.type !== "asset" && n.type !== "station") for (const t of (n.links.uses_asset || [])) art.push(...(NODES.get(t)?.images || []));
  if (art.length) parts.push(`<section><h4>Görseller</h4>${gallery([...new Set(art)])}</section>`);
  parts.push(`<section><h4>Özet</h4><p>${esc(n.summary)}</p></section>`);
  const facts = [];
  if (n.theme_en) facts.push(["Tema", n.theme_en]);
  if (n.ritual_en) facts.push(["Ritüel", n.ritual_en]);
  if (n.unlock) facts.push(["Gün", `${n.unlock.day}${n.unlock.rule_en ? " · " + n.unlock.rule_en : ""}`]);
  if (n.opens_en) facts.push(["Açılış", n.opens_en]);
  if (n.species_en) facts.push(["Tür", n.species_en]);
  if (n.line_tr) facts.push(["Replik", "“" + n.line_tr + "”"]);
  if (n.size) facts.push(["Boyut", n.size]);
  if (n.batch && n.batch !== "unbatched") facts.push(["Parti", n.batch]);
  if (n.jobs && n.jobs.length) facts.push(["İş", n.jobs.join(", ")]);
  if (facts.length) parts.push(`<section><dl class="facts">${facts.map(([k, v]) => `<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join("")}</dl></section>`);
  if (n.residents?.length) parts.push(`<section><h4>Komşular</h4><div class="links"><div class="grp"><div>${n.residents.map(linkChip).join("")}</div></div></div></section>`);
  if (n.type === "island") { const sts = stationsOf(n.id); if (sts.length) parts.push(`<section><h4>İstasyonlar</h4><div class="links"><div class="grp"><div>${sts.map(s => linkChip(s.id)).join("")}</div></div></div></section>`); }
  if (n.stages) parts.push(`<section><h4>Aşamalar</h4><dl class="facts">${n.stages.map(s => `<dt>Aşama ${s.stage}</dt><dd>${s.tended_days} bakılan gün · ${esc(s.adds_en || "")}</dd>`).join("")}</dl></section>`);
  if (n.levels) parts.push(`<section><h4>Seviyeler</h4><div class="levels">${n.levels.map(l => {
    const a = l.asset && NODES.get(l.asset); const t = a && a.images[0] && thumbOf(a.images[0]);
    return `<button type="button" ${a ? `data-go="${esc(a.id)}"` : "disabled"}><span class="lt">${t ? `<img alt="" src="${esc(t.s)}">` : "L" + l.level}</span><span><b>L${l.level} · ${esc(l.title_tr)}</b><small>${esc(l.title_en)}</small><span class="num">${fmt(l.cost)} çekirdek · saatte ${String(l.rate).replace(".", ",")}${a ? " · " + STATUS[a.status] : ""}</span></span></button>`;
  }).join("")}</div></section>`);
  if (n.notes?.length) parts.push(`<section><h4>Notlar</h4><ul class="notes">${n.notes.map(x => `<li>${esc(x)}</li>`).join("")}</ul></section>`);
  const out = Object.entries(n.links || {}).filter(([, v]) => v.length);
  const inc = {};
  for (const l of inbound.get(n.id) || []) (inc[l.edge] ||= []).push(l.from);
  if (out.length || Object.keys(inc).length) {
    parts.push(`<section><h4>Bağlantılar</h4><div class="links">${out.map(([e, ts]) => `<div class="grp"><b>${esc(EDGE_OUT[e] || e)}</b><div>${ts.map(linkChip).join("")}</div></div>`).join("")}${Object.entries(inc).map(([e, fs]) => `<div class="grp"><b>${esc(EDGE_IN[e] || e)}</b><div>${fs.map(linkChip).join("")}</div></div>`).join("")}</div></section>`);
  }
  if (n.sources?.length || n.source) parts.push(`<section><h4>Kaynaklar</h4><div class="src">${(n.sources || []).map(srcLink).join("")}${n.source === "lead-brainstorm" ? `<span class="hint">Ekibin beyin fırtınası; hiçbir dokümanda henüz yok.</span>` : ""}</div></section>`);
  parts.push(`<section id="fnotes"><h4>Kurucu notları</h4><div class="thread" id="thread"></div><div id="composeWrap"></div></section>`);
  dbody.innerHTML = parts.join("");
  dbody.scrollTop = 0;
  $("#dkind").innerHTML = `<span>${TYPE[n.type]}</span><code>${esc(n.id)}</code>`;
  drawer.className = `ty-${n.type}${drawer.classList.contains("tall") ? " tall" : ""}`;
  notesUI(n.id);
}
dbody.addEventListener("click", e => { const b = e.target.closest("[data-go]"); if (b) openNode(b.dataset.go, true); });
function selectCard(id) {
  world.querySelectorAll(".card.sel").forEach(c => c.classList.remove("sel"));
  const k = primaryOf.get(id);
  if (k != null && items[k].el) items[k].el.classList.add("sel");
  const svg = document.getElementById("sysedges");
  if (svg) {
    const isSys = NODES.get(id)?.type === "system";
    svg.classList.toggle("focus", isSys);
    svg.querySelectorAll("path[data-from]").forEach(p => p.classList.toggle("hot", isSys && (p.dataset.from === id || p.dataset.to === id)));
  }
}
function openNode(id, fly) {
  const n = NODES.get(id); if (!n) return;
  current = id;
  drawer.hidden = false;
  renderDrawer(n);
  selectCard(id);
  if (location.hash.slice(1) !== id) history.replaceState(null, "", "#" + id);
  if (fly) {
    let k = primaryOf.get(id);
    if (k == null) k = items.findIndex(it => it.id === id);
    if (k >= 0) { const it = items[k]; requestAnimationFrame(() => flyToRect(it.x, it.y, it.w, it.h, 1.2)); }
  }
}
function closeDrawer() {
  drawer.hidden = true; current = null; selectCard(null);
  detachNotes();
  history.replaceState(null, "", location.pathname + location.search);
}
$("#dclose").addEventListener("click", closeDrawer);
$("#dtall").addEventListener("click", () => drawer.classList.toggle("tall"));
addEventListener("hashchange", () => { const id = decodeURIComponent(location.hash.slice(1)); if (NODES.has(id) && id !== current) openNode(id, true); });

// ------------------------------------------------------------------ founder notes (artifact runtime)
const RT = { db: null, user: null, comments: null, me: null, canWrite: null, ready: false, failed: false, all: new Map() };
const withTimeout = (p, ms) => Promise.race([p, new Promise(r => setTimeout(() => r(null), ms))]);
async function useCap(name) {
  try { return window.claude && typeof window.claude.use === "function" ? await withTimeout(window.claude.use(name), 10000) : null; }
  catch { return null; }
}
let noteSub = null, noteFor = null, noteDocs = [], noteState = "loading", noteTimer = 0, writeBlocked = false;
function detachNotes() { if (noteSub) { try { noteSub(); } catch {} } noteSub = null; noteFor = null; clearTimeout(noteTimer); }
function whoLabel(authorId) { return authorId && authorId === RT.me ? "Sen" : "Ekip"; }
function fmtDate(v) { const d = new Date(v); return isNaN(d) ? "" : d.toLocaleString("tr-TR", { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" }); }
function paintThread() {
  const th = document.getElementById("thread"); if (!th) return;
  const msg = {
    loading: `<p class="hint">Notlar yükleniyor…</p>`,
    slow: `<p class="hint">Notlara şu an ulaşılamıyor. Bağlantı gelince kendiliğinden yenilenir.</p>`,
    error: `<p class="hint">Notlar yüklenemedi. Sayfayı yeniden açınca tekrar denenir.</p>`,
  };
  const list = noteDocs.map(d => `<div class="note${d.authorId && d.authorId === RT.me ? " mine" : ""}"><div class="who">${whoLabel(d.authorId)} · ${esc(fmtDate(d.createdAt))}</div><div class="txt">${esc(d.text)}</div></div>`).join("");
  th.innerHTML = list || (noteState === "live" ? `<p class="hint">Henüz not yok. İlk notu sen ekle.</p>` : "") + (msg[noteState] || "");
  if (list && msg[noteState] && noteState !== "loading") th.insertAdjacentHTML("beforeend", msg[noteState]);
}
function composeUI(id) {
  const wrap = document.getElementById("composeWrap"); if (!wrap) return;
  if (!RT.ready) { wrap.innerHTML = `<p class="hint">Notlar bağlanıyor…</p>`; return; }
  if (!RT.db) {
    wrap.innerHTML = `<p class="hint">Kurucu notları yalnızca Claude'da yayımlanan sayfada açılır. Bu kopyada atlası gezebilirsin.</p>`;
    return;
  }
  const readOnly = RT.canWrite === false || writeBlocked;
  wrap.innerHTML = readOnly ? `<p class="hint">Bu sayfada not yazma iznin yok; notları okuyabilirsin.</p>` :
    `<div class="compose"><label class="hint" for="ntext">Not ekle</label><textarea id="ntext" maxlength="4000" placeholder="Bu düğüm hakkında ne düşünüyorsun?"></textarea>
     <div class="acts"><button class="btn" id="nadd" type="button">Ekle</button>${RT.comments ? `<button class="btn ghost" id="ncomment" type="button">Yorum</button>` : ""}<span class="hint" id="nmsg" role="status"></span></div></div>`;
  if (readOnly && RT.comments) wrap.insertAdjacentHTML("beforeend", `<div class="compose"><div class="acts"><button class="btn ghost" id="ncomment" type="button">Yorum</button></div></div>`);
  const add = document.getElementById("nadd");
  if (add) add.addEventListener("click", async () => {
    const ta = document.getElementById("ntext"), m = document.getElementById("nmsg");
    const text = ta.value.trim(); if (!text) { m.textContent = "Önce bir şey yaz."; return; }
    add.disabled = true; m.textContent = "Kaydediliyor…";
    try {
      await RT.db.collection("notes").add({ nodeId: id, text, createdAt: new Date().toISOString(), authorId: RT.me || null });
      ta.value = ""; m.textContent = "Eklendi.";
    } catch (err) {
      if (err && err.code === "invalid_argument") { writeBlocked = true; composeUI(id); return; }
      m.textContent = err && err.code === "quota_exceeded" ? "Not kotası doldu; eski notlardan birkaçını sil." : "Kaydedilemedi. Notun burada duruyor; tekrar dene.";
    } finally { add.disabled = false; }
  });
  const cb = document.getElementById("ncomment");
  if (cb) cb.addEventListener("click", async () => {
    try { await RT.comments.openComposer({ element: drawer }); } catch {}
  });
}
function notesUI(id) {
  composeUI(id);
  if (!RT.ready) { noteState = "loading"; noteDocs = []; paintThread(); return; }
  if (!RT.db) { const th = document.getElementById("thread"); if (th) th.innerHTML = ""; return; }
  if (noteFor === id) { paintThread(); return; }
  detachNotes();
  noteFor = id; noteDocs = []; noteState = "loading"; paintThread();
  noteTimer = setTimeout(() => { if (noteState === "loading") { noteState = "slow"; paintThread(); } }, 10000);
  try {
    noteSub = RT.db.collection("notes").where("nodeId", "==", id).orderBy("createdAt", "asc").onSnapshot(snap => {
      if (noteFor !== id) return;
      noteDocs = snap.docs.map(d => d.data()).filter(Boolean);
      if (!snap.metadata.fromCache) { noteState = "live"; clearTimeout(noteTimer); }
      paintThread();
    }, () => { if (noteFor !== id) return; noteState = "error"; clearTimeout(noteTimer); paintThread(); });
  } catch { noteState = "error"; paintThread(); }
}
function paintCounts() {
  const counts = new Map();
  for (const d of RT.all.values()) if (d && d.nodeId) counts.set(d.nodeId, (counts.get(d.nodeId) || 0) + 1);
  world.querySelectorAll(".nc[data-nc]").forEach(el => {
    const c = counts.get(el.dataset.nc) || 0, fn = el.querySelector(".fn");
    fn.hidden = !c; fn.querySelector("b").textContent = c || "";
  });
}
(async () => {
  const [db, user, comments] = await Promise.all([useCap("db"), useCap("user"), useCap("comments")]);
  RT.db = db; RT.user = user; RT.comments = comments;
  if (user) {
    try { RT.me = await user.id(); } catch { RT.me = null; }
    try { RT.canWrite = await user.can("data.write"); } catch { RT.canWrite = null; }
  }
  RT.ready = true;
  if (db) {
    try {
      db.collection("notes").limit(1000).onSnapshot(snap => {
        RT.all = new Map(snap.docs.map(d => [d.id, d.data()]));
        paintCounts();
      }, () => {});
    } catch {}
  }
  if (current) notesUI(current);
})();

// ------------------------------------------------------------------ start
const startId = decodeURIComponent(location.hash.slice(1));
const r0 = regions[0];
// Start on the archipelago (the most characteristic view), not on a dot field.
(function start() {
  // The home island's frame: big enough to read on a phone, the whole archipelago on a desktop.
  const isle = world.querySelector(".isle");
  const t = innerWidth < 900 && isle ? { x: isle.offsetLeft, y: r0.y + 20, w: isle.offsetWidth, h: isle.offsetTop + isle.offsetHeight - r0.y - 20 } : r0;
  const a = visibleArea();
  const s = clampS(Math.min(a.w / (t.w + 40), a.h / (t.h + 40)));
  cam.s = s; cam.x = a.x + a.w / 2 - (t.x + t.w / 2) * s; cam.y = a.y + 12 - (t.y) * s;
  apply(); settle();
})();
if (NODES.has(startId)) openNode(startId, true);
window.__atlas = { openNode, fit, flyToRect, regions, cam, closeDrawer };
})();
</script>
