summary: >-
  The rules depend only on what we can measure, and the copy never claims more. After a pass
  expires under the soft gate, time is unobserved until the next sign of life; nothing that
  rewards absence accrues across it. The 72-hour observation window holds seeds when unobserved.
notes:
- 'Done in G2 (#32): pass-expiry notification, post-expiry time unobserved.'
- >-
  With Screen Time, usage is measured at thresholds; exact per-session minutes are never visible.
