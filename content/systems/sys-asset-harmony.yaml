id: sys-asset-harmony
type: system
title_tr: Görsel uyum ölçümü
title_en: Asset harmony
status: in-app
horizon: now
summary: >-
  Every world master is measured on one footing (black and white point, chroma, white balance,
  edge softness, detail, named materials) against the approved island, Pofu for characters, and
  each station level against its chain's first level. Outliers get a 0-100 score and, where colour
  can fix them, a correction that the art pipeline bakes into the app's sprites; edges and detail
  are reported for the next generation. QA scores every new take the same way at promote time.
notes:
- 'Tool: tools/assets/harmony.py; config and manifest in design/art/harmony/; CI fails a stale manifest.'
- 'First run (2026-11-02): the çaydanlık copper turned from hue 54 to 59; station chains lost ~30 % chroma per level (cay-5 median chroma 10.9 vs L1 43.6) and are restored toward L1.'
- 'Batch 03/04 masters were baked with soft-lock and measure paler than the lock-light island; re-lock them from their raws where kept.'
- 'Look round 3: harmony corrects technical defects only (value range, white balance, chain chroma); materials are ranges in design/art/materials.json, pulled back only when out of range, so the rose copper stays rose. Re-locked seven batch-03 masters with lock-light where it scored better after correction (island-main-l-v2 87.2 -> 95.8, garden-3 69.6 -> 87.2); the app ships batch 05''s island-main-l-v3 (68.3 -> 86.4).'
