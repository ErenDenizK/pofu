summary: >-
  Every open of Pofu has an intent (gate, the minute, glance, visit, settled reopen, setup
  or repair), each with its own landing, length and exit. A glance or a repair is never forced
  through a visit.
notes:
- >-
  Landing rules: the gate opens Hop!, a widget tap the Today sheet, the icon builds the visit
  queue; night opens night Home.
