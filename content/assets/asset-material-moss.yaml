summary: 'A single small painted object for a cozy game, a crafting material: a soft
  round cushion of velvety sage-green moss, like a little pillow, with three tiny
  pale star-shaped moss flowers on top and a thin curl of cream root under it. Seen
  from the same low front three-quarter camera as the tea stall. Centered on an empty
  transparent background, about a third of the canvas wide, with wide empty space
  around it.'
