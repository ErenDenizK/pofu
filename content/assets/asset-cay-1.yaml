summary: >-
  A tiny Turkish tea stall (çay ocağı) for the island diorama. A small, rounded, chunky wooden
  counter in soft honey wood; on it a Turkish double teapot (çaydanlık: a small pot stacked
  on a larger one) in soft, muted rose-copper on a little round burner, and two tulip-shaped
  tea glasses of warm amber tea on tiny cream saucers. Friendly, toy-like proportions with
  few parts. The counter fills the lower half of the height…
