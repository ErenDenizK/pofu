summary: >-
  The first level of a small garden hive, the gift of a bee island: one plump straw skep,
  a rounded dome of woven honey-gold straw in broad soft bands, with a small dark arched doorway,
  sitting on a low round flat stone slab with a few small lavender sprigs at its foot and
  three tiny soft cream bees hovering. Nothing else. It fills the footprint's width and stays
  below the height bar's top; chunky, toy-like, few parts.
