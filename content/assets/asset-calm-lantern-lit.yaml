summary: >-
  Light the calm lantern more fully: a small, bright teardrop flame is visible inside the
  paper, and the glass and paper around it glow warm honey-gold, brightest around the flame
  and softening toward the ribs. The caps, the ribs, the loop and the post are unchanged.
  Light only inside the lantern's own outline: no halo, no rays and no light spill outside
  it (the app draws the glow).
