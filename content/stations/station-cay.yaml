title_en: Tea stall
status: in-app
horizon: now
summary: >-
  Mochi's tea stall: a counter, a copper çaydanlık and tulip glasses. The vertical slice station
  and the P-station reference for every other station's L1. Its L3 is the first style choice
  (rose stripes or İznik blue).
notes:
- >-
  Opens: Stage 2 (1 tended day). Level costs 1→5: 40 · 88 · 194 · 426 · 937 (total 1,685).
  Rate L1→L5: 5 → 16 seeds/hour before calm.
- L1 is the first approved station master and is in PofuWorld (batch 01).
- Reaching L3 is part of İskele's arrival rule.
- >-
  Art test 01 proved that level chains made as edits stay consistent (cay-2 as an edit of
  cay-1).
