summary: 'Story map (canonical): the book''s midpoint, a story stop at Revontuli''s ice hole,
  not a new island. The line brings up the old Keeper''s lantern; Mochi looks a long time:
  "Onu tanırdım." The question turns from who the Keeper is to whether Pofu will go like him.
  The lantern rides with the duo until it hangs on Nazlı''s hook at the finale.'
