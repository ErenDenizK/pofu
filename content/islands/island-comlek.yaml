id: island-comlek
type: island
title_tr: Çömlek
title_en: The potter's island
status: idea
horizon: maybe
summary: >-
  A red-clay island whose wheel turns only while the phone is down and stops during a pass. After twelve quiet hours a pot is fired. Game (Shape): drag to pull a pot to a shape from many cultures (an Avanos jug, a Japanese tea bowl, a Greek amphora). Toy: a thumbprint in wet clay stays forever. Material: clay.
notes:
- >-
  Developed from idea-island-comlek. Resident: Kil, a mole who only works when it is quiet.
