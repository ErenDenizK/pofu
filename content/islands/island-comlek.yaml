title_tr: Çömlek
title_en: The fairy-chimney kiln (Cappadocia)
status: idea
horizon: maybe
summary: 'Story map (canonical): a filler after Emanet. A potter with a cold kiln; a thumbprint
  on everything he touches. Kil, a potter mole; the duo bicker over who makes the first bowl.
  Secret for the last book: the hand that fired the Ring Stone.'
notes:
- Reconciled 2026-11-06 with the canonical Book One story map (docs/product/story-map/book-one.md);
  older notes below are history where they disagree.
- 'Design loop 2 (docs/product/design-loop/loop-2.md): the landform is a giant unglazed red-clay
  pot lying on its side (Avanos clay, no İznik blue); cold on the horizon from day one, lit
  from below by its kiln once it arrives (the craft cluster''s underlight). Balloons only
  at the bloom.'
- 'Revision 2026-11-03 (archipelago-system.md 1A, 11): redesigned from 4/10 (the mole and
  the game were fun, the island was not): the island is the kiln. Gift to home: Avanos cups,
  then a dawn balloon.'
- 'Developed from idea-island-comlek. Resident: Kil, a mole who only works when it is quiet.'
