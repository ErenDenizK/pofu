id: island-comlek
type: island
title_tr: Çömlek
title_en: The fairy-chimney kiln (Cappadocia)
status: idea
horizon: maybe
summary: >-
  A cluster of Cappadocia fairy chimneys in rose tuff; the tallest is hollowed into a kiln that glows like a lantern; always dawn, with hot-air balloons rising past. Resident: Kil, a mole. Game: merge clay into larger pots from many cultures (Suika's verb). Toy: a thumbprint in wet clay stays forever. Goods: pots and tea bowls, the web's most requested goods.
notes:
- >-
  Design loop 2 (docs/product/design-loop/loop-2.md): the landform is a giant unglazed red-clay pot lying on its side (Avanos clay, no İznik blue); cold on the horizon from day one, lit from below by its kiln once it arrives (the craft cluster's underlight). Balloons only at the bloom.
- >-
  Revision 2026-11-03 (archipelago-system.md 1A, 11): redesigned from 4/10 (the mole and the game were fun, the island was not): the island is the kiln. Gift to home: Avanos cups, then a dawn balloon.
- >-
  Developed from idea-island-comlek. Resident: Kil, a mole who only works when it is quiet.
