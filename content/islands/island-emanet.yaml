  older notes below are history where they disagree.
- 'Revision 2026-11-03 (archipelago-system.md 1A, 11): wonder 6; silhouette strengthened:
  the office on stilts is built from lost things (an umbrella roof, a teacup water tank, a
  top-hat chimney). Gift to home: a lost-and-found box, then a display shelf in the den.'
- No completion percentage, no empty slots shown.
