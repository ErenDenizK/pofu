summary: 'Story map (canonical): main island 3, afternoon, a story island (one return a day,
  no game engine). A lost-and-found where nothing is lost, only kept in trust. Theme: handing
  over; resting when tired is keeping too. Boncuk the magpie ends polishing cups at the counter.
  Söz line 7 under the scale; Mochi gives away her unopened linden tin. Gift: a parcel at
  the door on Wednesdays, polished finds for the workshop, a teal plank on Nazlı''s back.'
