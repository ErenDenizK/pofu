id: island-gezgin
type: island
title_tr: Gezgin
title_en: Nazlı, the cloud whale (the vehicle, the main road itself)
status: idea
horizon: maybe
summary: 'Story map (canonical): not an island to visit but the vehicle. A tired, wilful cloud
  whale with a handful of islands on her back docks at the pier in the first days; every main
  island is reached on her back and leaves one piece there (a pool and fall, an aurora jar,
  a teal plank, a moon stone; at the finale a young sunflower from home''s soil and Ihlamur''s
  lantern, lit). Resident Yosun, the tortoise postman. Form 2 on Mehtap''s full-moon night:
  she sings four notes for the first time.'
notes:
- Reconciled 2026-11-06 with the canonical Book One story map (docs/product/story-map/book-one.md);
  older notes below are history where they disagree.
- 'Revision 2026-11-03 (archipelago-system.md 1A, 11): moves from the day-100 milestone to
  wonder 2 on day 8 (the founder rated it 10/10); game: slide puzzle clearing cloud banks.
  Gift to home: Yosun at the harbor, then the whale moors on full moons. First Plus island
  in cut C2.'
- 'Checking risk: moves only at night; cut if reflex opens rise after she arrives.'
- 'Art: about 11 images plus 2 whale pose edits.'
