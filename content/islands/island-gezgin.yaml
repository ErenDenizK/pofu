id: island-gezgin
type: island
title_tr: Gezgin
title_en: The island on a whale
status: idea
horizon: maybe
summary: >-
  A wanderer: a grassy island with one cottage on the back of Nazlı, a sleeping cloud-whale. The 100-tended-day milestone; afterwards she circles the archipelago on a fixed nightly tour, never highlighted, never needed to find. Game (Echo): answer her song to steer her to the next mooring. Lore: she carries lost islands home.
notes:
- >-
  Revision 2026-11-03 (archipelago-system.md 1A, 11): moves from the day-100 milestone to wonder 2 on day 8 (the founder rated it 10/10); game: slide puzzle clearing cloud banks. Gift to home: Yosun at the harbor, then the whale moors on full moons. First Plus island in cut C2.
- >-
  Checking risk: moves only at night; cut if reflex opens rise after she arrives.
- >-
  Art: about 11 images plus 2 whale pose edits.
