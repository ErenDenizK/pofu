title_tr: Arı
title_en: The hanging hive (Çömlek's satellite)
status: idea
horizon: maybe
summary: >-
  A great honeycomb hanging from the bough of a floating pine, its cells little doors and windows; Muğla pine honey; a hot humming afternoon. Game: hexa sort on a honeycomb grid. Its bees fly to home's sunflowers. Satellite of Çömlek in the craft constellation.
notes:
- >-
  Promoted from the idea pool in island-curation.md 3.10; design loop 1 makes it Çömlek's satellite. Rung 9 of the spine: at night the bees' dance and the sunflower point the same way, toward the viewer.
- >-
  Honey stays a ritual, never a second currency (ADR-0015).
