id: island-kaplica
type: island
title_tr: Kaplıca
title_en: The hot spring
status: planned
horizon: later
summary: >-
  A hot-spring hamam. The warm spring: each quiet hour pours a ladle of warm water; when the
  spring is full (12 ladles) everyone soaks together for an evening and Pofu comes out glowing
  (wellbeing heals 25 % faster that night). Breathing breaks never fill it, so the limit is
  never farmable. Stations: hot spring, hamam, şerbet stand. Resident: Pamuk, an unbothered
  capybara.
notes:
- >-
  Proposed (archipelago-system.md): becomes a wonder island; station ladders retired, the warm-spring ritual stays; signature motion: steam that drifts to other islands as clouds; game idea: temperature mixing; year-2 pool.
- Arrives at 35 tended days and the ferry pier at level 3.
- Breathing breaks do not fill the spring (anti-farming).
