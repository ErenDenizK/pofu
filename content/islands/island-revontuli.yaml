id: island-revontuli
type: island
title_tr: Revontuli
title_en: The fox-fire island (Finland)
status: idea
horizon: maybe
summary: 'Story map (canonical): main island 2, night, flow + light. An ice island where the
  northern lights never rose, but the sauna is still warm. Theme: a light put out is not lost;
  the sky keeps it. Tuli, a fox with a plain white tail, ends painting the sky with it. Söz
  line 4 in the bucket under the sauna bench. Gift: one more lantern on home''s bridge (Friday:
  Tuli visits) and a painted aurora jar on Nazlı''s back. Olta, the book''s midpoint, happens
  at its ice hole.'
notes:
- Reconciled 2026-11-06 with the canonical Book One story map (docs/product/story-map/book-one.md);
  older notes below are history where they disagree.
- 'Revision 2026-11-03 (archipelago-system.md 1A, 11): wonder 3; silhouette strengthened:
  an ice floe with a glowing glassy edge, no soil. Always a winter night. Gift to home: a
  sauna hut on the pier, then the aurora on calm winter nights.'
- 'Signature motion: an aurora layerEffect shaped by the player''s own last stroke.'
- Native Finnish writer required; Tuli is serious about saunas, not a stereotype.
- Proposed for the Nordic market test (open question 9).
