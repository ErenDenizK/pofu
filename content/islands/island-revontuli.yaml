id: island-revontuli
type: island
title_tr: Revontuli
title_en: The fox-fire island (Finland)
status: idea
horizon: maybe
summary: >-
  A snowy island with a lakeside sauna and a frozen pond. Revontulet, the northern lights, means fox fires: an arctic fox sweeps sparks into the sky with its tail. Two verbs: ice fishing (Patience: drop a line, put the phone down, after 20 quiet minutes something has bitten) and painting the aurora (Trace: swipe Tuli's tail; your stroke is tonight's aurora). Material: frost.
notes:
- >-
  Signature motion: an aurora layerEffect shaped by the player's own last stroke.
- >-
  Native Finnish writer required; Tuli is serious about saunas, not a stereotype.
- >-
  Proposed for the Nordic market test (open question 9).
