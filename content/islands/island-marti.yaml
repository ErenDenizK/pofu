id: island-marti
type: island
title_tr: Martı Kayası
title_en: The gull rock (Gezgin's satellite)
status: idea
horizon: maybe
summary: >-
  A sea stack with a lighthouse-white cap that follows Nazlı the whale the way gulls follow a vapur. The gulls trade back trinkets they snatched (toss simit, get a found thing). Storks rest here on the real migration dates. Satellite of Gezgin in the journey constellation.
notes:
- >-
  Design loop 1 (2026-11-03): replaces Leylek as the home of the stork migration beat; Lale rests here and remembers carrying "a small one with a squeaky door" south (the old keeper thread).
- >-
  Six-axis profile and schedule in content/islands/profiles.yaml; checked by tools/content/island_metrics.py.
