id: island-caglayan
type: island
title_tr: Çağlayan
title_en: The island that pours
status: idea
horizon: maybe
summary: >-
  A mossy limestone wonder island with a waterfall that pours off its edge forever into the sea of clouds. Lore hook: where does the water come from, and where does it go? Its game (Flow grammar): rotate channel stones to route Damla's leaf boats; stages add a spring, a mill, and the edge (boats sent over it wash up on İskele's pier days later). Answer: the falls water every island. Material: water drops. Learning: the water cycle.
notes:
- >-
  Signature motion: a painted ribbon with a Metal layerEffect scrolling noise, Canvas mist where it meets the clouds, a mist rainbow at golden hour.
- >-
  Rumours: water heard at night; a bottle the vapur brings (the water never stops here); a mist rainbow caught by the lighthouse beam.
- >-
  Proposed first Plus island; test making it free in the friends beta (open question 5).
- >-
  Art: about 13 images; the water is code.
