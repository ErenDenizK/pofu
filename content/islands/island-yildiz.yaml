id: island-yildiz
type: island
title_tr: Mehtap
title_en: The crescent (was Yıldız)
status: idea
horizon: later
summary: >-
  A sleeping crescent moon resting in the clouds, an observatory dome in its inner curve and a rope ladder to its tip; always blue hour. The crescent waxes and wanes with the real moon. Resident: Nane, the sleepy owl. Game: one-stroke constellations with three cultures' names. The stargazing ritual is kept.
notes:
- >-
  Design loop 2 (docs/product/design-loop/loop-2.md): as Mehtap, the crescent landform stays and carries no face, eyes or smile; blue hour, silver from above, a starfield with gaps (the dark stars), a mirror-flat cloud sea below.
- >-
  Revision 2026-11-03 (archipelago-system.md 1A, 11): redesigned from Yıldız (3/10, an observatory on the home base) and renamed Mehtap; the id stays until the planned identifier rename. Never paint a single star beside the crescent's tip. Gift to home: a telescope, then the real moon over home.
- >-
  Proposed (archipelago-system.md): becomes a wonder island; its three station ladders are retired, the stargazing ritual stays; island game: constellations with three cultures' names (Connect); season 2, Plus.
- >-
  Arrives at 21 tended days and 10 calm nights (any, not in a row). Simulation: day 22.
- >-
  The one exception to A21's dead-end nights: the 20-second stargazing ritual, always ending
  in "İyi geceler".
