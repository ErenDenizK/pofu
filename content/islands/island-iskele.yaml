id: island-iskele
type: island
title_tr: İskele
title_en: The harbor
status: planned
horizon: later
summary: 'Ayçiçeği''s harbor district, no longer a separate island: a tea-and-simit
  pier growing from the home plate''s right edge into the cloud sea. The vapur docks
  here with postcards, rumour objects, visiting residents and goods from every island.
  Stations: simit cart, ferry pier, lighthouse. Resident: Simit, a honey tabby kitten.
  Game: loading the vapur (sort puzzle).'
notes:
- 'Revision 2026-11-03 (archipelago-system.md 1A, 11): merged into the home cluster
  as Ayçiçeği''s harbor district (1A.2); unfolds on tended days 1 to 3; the vapur
  is the archipelago''s one ferry.'
- 'Proposed (archipelago-system.md): a yield island of the launch pair and the archipelago''s
  curiosity inbox (rumour objects wash up on its pier); toy: the ferry horn, answered
  from the fog when a rumour is active; island game: loading the vapur (Pack); free
  tier.'
- 'Arrives at 8 tended days and the çay ocağı at level 3 ("Mochi''s regulars want
  simit with their tea"). Simulation: day 9 for every archetype.'
- Stations open 0, 3 and 7 tended days after it arrives.
- Postponed by the decision audit until after two weeks of daily use (islands 2–5,
  rituals, the map, the cloud pass).
- 'Postcards arrive in a fixed, published order: no random draw, no duplicates, no
  rarities (A17).'
- 'Asset counts for İskele: 1 plate + 15 level vignettes + Simit × 3 + the vapur +
  7 postcards ≈ 27 images. The plate has a ferry-pier notch on its right edge.'
