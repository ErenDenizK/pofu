title_tr: Yakamoz
title_en: The moon's reflection (Mehtap's satellite)
status: idea
horizon: maybe
summary: >-
  The moon's reflection, left on the cloud sea, became a disc of shallow glowing water you can wade in; plankton light up where Pofu steps. Ritual, no game. Satellite of Mehtap in the moon constellation.
notes:
- >-
  Design loop 1 (2026-11-03): rung 10 of the spine. The reflection holds one light the sky does not: a window still lit beyond the ring, where Book Two sails.
