id: island-koke
type: island
title_tr: Koke
title_en: The sleeping moss hill (first filler)
status: idea
horizon: maybe
summary: 'Story map (canonical): the first filler and the first visitor (Monday), on the first
  journey. A sleeping moss hill; Sumi the dormouse, sorry for sleeping, scratches out thank-you
  letters. Built as a five-stage island: kept as the gentle tutorial of the healing arc (lead,
  2026-11-06). Secret for Book Two: the hill seems to breathe.'
notes:
- Reconciled 2026-11-06 with the canonical Book One story map (docs/product/story-map/book-one.md);
  older notes below are history where they disagree.
- 'Design loop 2 (docs/product/design-loop/loop-2.md): the island is a sleeping old moss creature
  with a bonsai on its back, read first as a mossy mound; Sumi rakes around it so as not to
  wake it. It breathes once at stage 3 (the first hint that the sky is alive; Gezgin pays
  it off at scale). Its face is a crease, never a mascot face. Drizzle from Çağlayan''s spray,
  teal shadows, one paper lantern.'
- 'Revision 2026-11-03 (archipelago-system.md 1A, 11): redesigned from 6/10 (the same world
  set): the island is the bonsai; its own sky is rain. Gift to home: a water clacker, then
  rain greens home''s moss.'
- 'Resident: Sumi, a Japanese dormouse who sleeps through winter and apologises for it.'
- Native Japanese writer required; proposed for the Japan market test (open question 9).
