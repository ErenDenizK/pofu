id: island-koke
type: island
title_tr: Koke
title_en: The moss garden (Japan)
status: idea
horizon: maybe
summary: >-
  A small island of moss, maples and a dry stone garden with a bamboo water clacker. Lore hook: why does the gravel move by itself at night? Game (Trace): rake calm wave patterns around stones. Learning: the 72 Japanese micro-seasons; the garden's sign names the real one of the week, and the moss greens on real rainy days. Material: moss.
notes:
- >-
  Resident: Sumi, a Japanese dormouse who sleeps through winter and apologises for it.
- >-
  Native Japanese writer required; proposed for the Japan market test (open question 9).
