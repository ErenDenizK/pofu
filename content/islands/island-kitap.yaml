id: island-kitap
type: island
title_tr: Kitap
title_en: The library island
status: planned
horizon: later
summary: >-
  A library island. Bulut's story: a short illustrated story, one page per tended day, read
  in half a minute. Never more than one page a day, no cliffhanger nudges; finished books
  go on the shelf. Stations: reading tree, book house, printing press. Resident: Bulut, a
  cloud-soft chinchilla who reads aloud.
notes:
- >-
  Arrives with a season update, for everyone, and stays (simulated at day 50).
- >-
  Seasonal islands after Kitap follow the same template: a theme, three stations, one ritual,
  one resident, an arrival rule. They arrive in app updates and stay forever (A7).
