summary: >-
  A reedy island with a chimney and a huge stork nest on the Europe-Africa flyway. Storks circle on thermals in spring and autumn; Lale leaves one line about each city on the route. Game (Guide): tap to find rising warm air and lift a young stork city by city. Returns every year; nothing is missed. Material: feathers.
