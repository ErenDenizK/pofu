summary: 'Story map (canonical): the seasonal filler (the seventh of Book One''s fillers,
  lead 2026-11-06). Lale, an old stork who comes in the real spring and clacks her beak instead
  of laughing; she can appear anywhere in the book. Secret in Book Two.'
notes:
- Reconciled 2026-11-06 with the canonical Book One story map (docs/product/story-map/book-one.md);
  older notes below are history where they disagree.
- 'Design loop 2 (docs/product/design-loop/loop-2.md): the nest direction (a woven nest carried
  by storks, backlit hot windy dusk) is kept as a seasonal visitor, not a Book One step: it
  passes over during the real stork migration windows and carries Lale; the old Bekçi rode
  south in it. Profiled for the schedule in loop 3.'
- 'Revision 2026-11-03 (archipelago-system.md 1A, 11): redesigned from 2/10 (pretty storks
  on a green island): the island is the nest. Gift to home: a stork pair nests on the windmill
  each migration.'
- Developed from idea-island-leylek.
