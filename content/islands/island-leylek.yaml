id: island-leylek
type: island
title_tr: Leylek
title_en: The flying nest
status: idea
horizon: maybe
summary: >-
  A giant woven nest big enough for a cottage, carried across a warm windy dusk by a V of storks holding ribbons; it never touches the clouds. Arrives with each real migration and flies on after about six weeks. Resident: Lale. Game: glide on thermals city by city along the Europe–Africa flyway (Tiny Wings' verb).
notes:
- >-
  Design loop 2 (docs/product/design-loop/loop-2.md): the nest direction (a woven nest carried by storks, backlit hot windy dusk) is kept as a seasonal visitor, not a Book One step: it passes over during the real stork migration windows and carries Lale; the old Bekçi rode south in it. Profiled for the schedule in loop 3.
- >-
  Revision 2026-11-03 (archipelago-system.md 1A, 11): redesigned from 2/10 (pretty storks on a green island): the island is the nest. Gift to home: a stork pair nests on the windmill each migration.
- >-
  Developed from idea-island-leylek.
