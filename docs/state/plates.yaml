# Plate state table: one painted picture per island state (ADR-0022).
# Cells: painted = path of the lead-picked take (null = not painted, or the take was rejected
# and is being redone); lead_pick = take number; in_app = shipped in the app; founder_ok = null
# until the founder approves. Validated by tools/state/check_plates.py. See docs/state/README.md.
# sky_sets (ADR-0025): per island and light, the painted portrait master the sky set is split from;
# same cell keys as a stage cell (a null cell is not painted yet; rain is a founder-gated pilot).
# edited (optional): a derived plate the app ships instead of the pick, made by a committed script from
# the pick and other takes (docs/studio.md section 9; Home's IL1: tools/plate/il1_composite.py); the take stays untouched.
