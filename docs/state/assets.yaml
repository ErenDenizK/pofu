# Asset state table (asset system v1 section 2.4 and 4.4): one row per hook name the code asks
# for. state is the furthest of unpainted < painted < picked < in_repo < in_bundle < in_frame;
# master is the master folder (or the take a sheet is cut from) in this repository (null before in_repo). A row short of in_frame
# says why in note. Validated by tools/state/check_assets.py, which derives the bundle: a hook
# whose file is in the bundle must read in_bundle or in_frame, and one whose file is not must not.
# in_frame is set by the lead after a 1:1 crop of a device-size frame on screenshots/main.
