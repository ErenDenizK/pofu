<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>UI system v2 mockups</title>
<!--
  Boards for docs/design/ui-system-v2.md. Render with render.js.
  Real art: design/art/masters and design/art/stations (paths below).
  Stand-ins (marked on the boards): the seed jar, the calm lantern, the
  skip pots, the cheek puff (a CSS radial magnification that imitates the
  planned pouch shader), the crafted skin's clay, paper and wood (CSS
  gradients and SVG noise), the game pieces and the reward stamp.
  Glass is approximated with backdrop-filter and is clearer and flatter
  than Liquid Glass. Nunito stands in for SF Pro Rounded.
-->
<style>
@font-face { font-family: Nunito; src: url(../../../../design/prototypes/review-01/fonts/nunito-latin-ext-wght-normal.woff2) format('woff2'); font-weight: 200 1000; unicode-range: U+0100-024F, U+1E00-1EFF; }
@font-face { font-family: Nunito; src: url(../../../../design/prototypes/review-01/fonts/nunito-latin-wght-normal.woff2) format('woff2'); font-weight: 200 1000; }
:root {
  --ink: #2A1F2D; --ink6: #66555F; --ink4: #8E7D88; --violet: #6C4FD8; --violet7: #553BB8; --honey: #F5B83D;
  --cream: #FFFBF5; --cream1: #FFF6EC; --meadow: #2F7349; --peach8: #8A4F2B; --night: #15111C; --mist: #B8A8B1;
}
* { box-sizing: border-box; }
body { margin: 0; background: #ECE7E1; font-family: Nunito, system-ui, sans-serif; color: var(--ink); }
#board { width: 1700px; padding: 36px 40px 40px; background: #F4F0EA; }
h1 { font: 800 34px/1.1 Nunito; margin: 0 0 6px; letter-spacing: -0.3px; }
.sub { font: 500 17px/1.42 Nunito; color: var(--ink6); margin: 0 0 26px; max-width: 1560px; }
.sub small { font-size: 13px; color: #9a8c94; }
.row { display: flex; gap: 40px; align-items: flex-start; }
.col { display: flex; flex-direction: column; gap: 10px; }
.cap { font: 800 14px/1.3 Nunito; color: var(--ink6); letter-spacing: .5px; text-transform: uppercase; }
.phone { position: relative; width: 402px; height: 874px; border-radius: 56px; overflow: hidden; background: #ddd;
  box-shadow: 0 0 0 10px #1d1a20, 0 0 0 11px #3a363d, 0 30px 60px rgba(40,25,50,.25); isolation: isolate; }
.status { position: absolute; top: 18px; left: 34px; right: 30px; display: flex; justify-content: space-between; font: 700 17px Nunito; z-index: 40; color: var(--ink); }
.night .status { color: #fff; }
.island-cut { position: absolute; top: 11px; left: 50%; width: 124px; height: 36px; margin-left: -62px; background: #000; border-radius: 20px; z-index: 41; }
.homebar { position: absolute; bottom: 8px; left: 50%; width: 140px; height: 5px; margin-left: -70px; border-radius: 3px; background: rgba(0,0,0,.75); z-index: 41; }
.night .homebar { background: rgba(255,255,255,.85); }
.abs { position: absolute; }
img.abs { display: block; }
.num { font-variant-numeric: tabular-nums; }
.notes { flex: 1; display: flex; flex-direction: column; gap: 12px; min-width: 300px; }
.note { display: flex; gap: 12px; font: 500 15.5px/1.42 Nunito; color: var(--ink); }
.note b { font-weight: 800; }
.n { flex: none; width: 26px; height: 26px; border-radius: 13px; background: #2F9E5B; color: #fff; font: 800 14px/26px Nunito; text-align: center; box-shadow: 0 2px 6px rgba(0,0,0,.25); }
.pin { position: absolute; z-index: 60; }
.layer { display: inline-block; font: 800 11px/1 Nunito; padding: 4px 7px; border-radius: 6px; margin-right: 6px; vertical-align: 2px; letter-spacing: .3px; }
.L-n { background: #DDE6FF; color: #2C3E8C; } .L-c { background: #FBE3C8; color: #7A4313; } .L-d { background: #DDF1E1; color: #1F5E33; } .L-w { background: #EEE; color: #555; }
.verdict { margin-top: 6px; padding: 14px 16px; border-radius: 16px; background: #fff; font: 600 15px/1.45 Nunito; }
.standin { position: absolute; z-index: 55; font: 800 9.5px Nunito; color: rgba(42,31,45,.55); letter-spacing: .3px; background: rgba(255,255,255,.55); padding: 1px 4px; border-radius: 4px; }
.night .standin { color: rgba(255,255,255,.7); background: rgba(0,0,0,.3); }

/* ---------- world ---------- */
.sky { position: absolute; inset: 0; background: linear-gradient(180deg, #BFDDEB 0%, #D9EAEE 30%, #F3EBDD 52%, #F6E9D6 100%); }
.night .sky { background: linear-gradient(180deg, #14122B 0%, #241F45 38%, #3A2F57 56%, #2A2340 100%); }
.fog { position: absolute; left: 0; right: 0; bottom: 0; height: 230px; background: linear-gradient(to bottom, rgba(246,238,226,0), rgba(246,238,226,.8) 60%, rgba(246,238,226,.95)); z-index: 18; }
.night .fog { background: linear-gradient(to bottom, rgba(24,20,40,0), rgba(24,20,40,.8) 60%, rgba(24,20,40,.95)); }
.grade-night { filter: brightness(.52) saturate(.8) hue-rotate(-12deg) contrast(1.05); }
.grade-night-soft { filter: brightness(.62) saturate(.85) hue-rotate(-10deg); }
.star { position: absolute; width: 2px; height: 2px; border-radius: 1px; background: #fff; opacity: .8; }

/* Pofu with the cheek pouch stand-in: a radial magnification masked to each cheek */
.pofu { position: absolute; }
.pofu img { position: absolute; inset: 0; width: 100%; height: 100%; }
.pofu .ck { -webkit-mask-image: radial-gradient(ellipse var(--mw) var(--mh) at var(--mx) 64%, #000 50%, transparent 100%);
  mask-image: radial-gradient(ellipse var(--mw) var(--mh) at var(--mx) 64%, #000 50%, transparent 100%); }

/* ---------- glass skin (approximation) ---------- */
.glass { background: rgba(255,251,245,.42); backdrop-filter: blur(16px) saturate(1.6); -webkit-backdrop-filter: blur(16px) saturate(1.6);
  box-shadow: inset 0 1px 0 rgba(255,255,255,.9), inset 0 0 0 .6px rgba(255,255,255,.6), 0 8px 22px rgba(60,40,70,.16); color: var(--ink); }
.night .glass { background: rgba(36,30,52,.5); box-shadow: inset 0 1px 0 rgba(255,255,255,.22), inset 0 0 0 .6px rgba(255,255,255,.14), 0 8px 24px rgba(0,0,0,.35); color: #FFF6EC; }
.gprom { background: rgba(108,79,216,.9); color: #fff; backdrop-filter: blur(10px); box-shadow: inset 0 1px 0 rgba(255,255,255,.45), 0 8px 20px rgba(108,79,216,.35); }
.night .gprom { background: rgba(143,116,240,.92); color: #15111C; }
.plate-halo { position: absolute; border-radius: 40px; background: radial-gradient(closest-side, rgba(255,251,245,.55), rgba(255,251,245,0)); z-index: 19; }
.night .plate-halo { background: radial-gradient(closest-side, rgba(16,12,28,.55), rgba(16,12,28,0)); }

/* ---------- crafted skin (stand-ins for painted 9-slice faces) ---------- */
.clay { background: radial-gradient(120% 90% at 35% 25%, #FFF8EC 0%, #F1DEC4 55%, #DDBF9C 100%);
  box-shadow: inset 0 -5px 0 rgba(150,105,70,.35), inset 0 1.5px 0 rgba(255,255,255,.95), 0 3px 0 rgba(120,80,50,.22), 0 8px 16px rgba(90,60,40,.18); color: var(--ink); }
.clay-violet { background: radial-gradient(130% 110% at 35% 20%, #9C84F6 0%, #7457DE 50%, #5A3EC2 100%); color: #fff;
  box-shadow: inset 0 -5px 0 rgba(40,20,110,.4), inset 0 2px 0 rgba(255,255,255,.6), 0 4px 0 rgba(60,30,140,.45), 0 8px 18px rgba(80,50,160,.28); }
.paper { background-color: #F4E6CE; background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='f'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .55  0 0 0 0 .42  0 0 0 0 .3  0 0 0 .07 0'/></filter><rect width='160' height='160' filter='url(%23f)'/></svg>");
  box-shadow: 0 1px 0 rgba(255,255,255,.8) inset, 0 0 0 1.5px rgba(160,115,70,.35), 0 2px 0 rgba(150,105,65,.25), 0 8px 16px rgba(90,60,40,.2); color: var(--ink); }
.night .paper { background-color: #3B3150; color: #FFF1DE; box-shadow: 0 0 0 1px rgba(255,220,170,.18), 0 6px 14px rgba(0,0,0,.35); }
.wood { background: linear-gradient(180deg, #E9C79B 0%, #D9AE7B 48%, #C99766 100%); box-shadow: inset 0 2px 0 rgba(255,240,215,.7), inset 0 -3px 0 rgba(110,70,35,.35), 0 6px 14px rgba(80,50,30,.25); }
.stitch { outline: 1.5px dashed rgba(150,105,65,.45); outline-offset: -6px; }
.deckle { -webkit-mask: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 40' preserveAspectRatio='none'><path d='M3 2 Q20 0 40 2 T80 1 T97 3 L99 20 L97 38 Q70 40 50 38 T3 39 L1 20 Z'/></svg>") center/100% 100%; }

/* controls */
.cap44 { height: 44px; border-radius: 22px; display: flex; align-items: center; justify-content: center; gap: 7px; font: 800 16px Nunito; padding: 0 16px; }
.circle { width: 44px; height: 44px; border-radius: 22px; display: grid; place-items: center; }
.tag { height: 26px; border-radius: 13px; padding: 0 9px; display: flex; align-items: center; gap: 4px; font: 900 15px Nunito; }
.bubble { position: absolute; background: #FFFBF5; border-radius: 22px; padding: 11px 17px; font: 750 17px/1.28 Nunito; color: var(--ink); text-align: center; box-shadow: 0 6px 18px rgba(60,40,70,.16); z-index: 22; }
.bubble:after { content: ""; position: absolute; left: 50%; bottom: -9px; margin-left: -10px; border: 10px solid transparent; border-bottom: 0; border-top-color: #FFFBF5; }
.night .bubble { background: #2A2236; color: #FFF6EC; }
.night .bubble:after { border-top-color: #2A2236; }

/* sheet (native, approximated) */
.sheet { position: absolute; left: 8px; right: 8px; bottom: 8px; border-radius: 38px; z-index: 30; padding: 10px 20px 20px; }
.sheet.glassy { background: rgba(255,251,245,.78); backdrop-filter: blur(24px) saturate(1.5); box-shadow: inset 0 1px 0 rgba(255,255,255,.95), 0 -6px 30px rgba(60,40,70,.18); }
.night .sheet.glassy { background: rgba(30,24,40,.82); color: #FFF6EC; box-shadow: inset 0 1px 0 rgba(255,255,255,.15), 0 -6px 30px rgba(0,0,0,.4); }
.grab { width: 36px; height: 5px; border-radius: 3px; background: rgba(42,31,45,.25); margin: 0 auto 10px; }
.night .grab { background: rgba(255,255,255,.3); }
.srow { display: flex; align-items: center; gap: 12px; padding: 11px 0; border-bottom: .5px solid rgba(42,31,45,.12); }
.night .srow { border-bottom-color: rgba(255,255,255,.12); }
.srow:last-child { border-bottom: 0; }
.srow .t { font: 750 16.5px/1.25 Nunito; }
.srow .s { font: 500 13.5px/1.3 Nunito; color: var(--ink6); }
.night .srow .s { color: var(--mist); }
.srow .v { margin-left: auto; font: 900 20px Nunito; font-variant-numeric: tabular-nums; }
.ic28 { width: 34px; height: 34px; flex: none; display: grid; place-items: center; }
</style>
</head>
<body>
<div id="board"></div>
<script>
const A = '../../../../design/art/';
const ART = {
  pofu: A + 'masters/pofu-hamster-base-v1/pofu-hamster-base.png',
  mochi: A + 'masters/mochi-v2/mochi-v2.webp',
  findik: A + 'masters/findik-base/findik-base.webp',
  island: A + 'masters/island-main-l-v2/island-main-l-v2.webp',
  cloud: A + 'masters/cloud-1/cloud-1.png',
  cloud2: A + 'masters/cloud-2/cloud-2.png',
  cloudsea: A + 'masters/cloud-sea/cloud-sea.png',
  sun: A + 'masters/sun-glow/sun-glow.png',
  far: A + 'masters/far-isle-1/far-isle-1.png',
  cay: A + 'stations/cay-3/cay-3.png',
  cay1: A + 'stations/cay-1/cay-1.png',
  windmill: A + 'stations/windmill-2/windmill-2.png',
  pond: A + 'stations/pond-3/pond-3.png',
  simit: A + 'stations/simit-1/simit-1.png',
};

// ---------- small vector glyphs (vector twins and system symbols, stand-ins) ----------
const SEED = (s = 16, c = '#B9782A') => `<svg width="${s * 0.72}" height="${s}" viewBox="0 0 14 20" style="transform:rotate(18deg);flex:none"><path d="M7 0C11 4 13 9 12 13C11 17 9 20 7 20C5 20 3 17 2 13C1 9 3 4 7 0Z" fill="${c}"/><path d="M5.2 4.5C4 8 4 12 5.5 16M8.8 4.5C10 8 10 12 8.5 16" stroke="#FFF3DC" stroke-opacity=".85" stroke-width="1.3" fill="none" stroke-linecap="round"/></svg>`;
const GEAR = (c = '#2A1F2D') => `<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="1.9"><circle cx="12" cy="12" r="3.2"/><path d="M12 2.5v2.6M12 18.9v2.6M21.5 12h-2.6M5.1 12H2.5M18.7 5.3l-1.8 1.8M7.1 16.9l-1.8 1.8M18.7 18.7l-1.8-1.8M7.1 7.1L5.3 5.3"/><circle cx="12" cy="12" r="6.6"/></svg>`;
const MAP = (c = '#2A1F2D') => `<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="1.9" stroke-linejoin="round"><path d="M3 6l6-2 6 2 6-2v14l-6 2-6-2-6 2z"/><path d="M9 4v14M15 6v14"/></svg>`;
const XMARK = (c = '#2A1F2D') => `<svg width="18" height="18" viewBox="0 0 24 24" stroke="${c}" stroke-width="2.6" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>`;
const PAUSE = (c = '#2A1F2D') => `<svg width="18" height="18" viewBox="0 0 24 24" fill="${c}"><rect x="6" y="5" width="4" height="14" rx="1.5"/><rect x="14" y="5" width="4" height="14" rx="1.5"/></svg>`;
const CHEV = (c = '#8E7D88') => `<svg width="9" height="15" viewBox="0 0 9 15" fill="none" stroke="${c}" stroke-width="2" stroke-linecap="round"><path d="M1.5 1.5l6 6-6 6"/></svg>`;
const BLOOM_TWIN = (open, s = 14, c = '#C98A1A') => open
  ? `<svg width="${s}" height="${s}" viewBox="0 0 20 20">${[0, 60, 120, 180, 240, 300].map(a => `<ellipse cx="10" cy="4" rx="3" ry="4.2" fill="${c}" transform="rotate(${a} 10 10)"/>`).join('')}<circle cx="10" cy="10" r="3.6" fill="#6B4320"/></svg>`
  : `<svg width="${s}" height="${s}" viewBox="0 0 20 20"><path d="M10 3c4 3 5 8 0 14-5-6-4-11 0-14z" fill="none" stroke="${c}" stroke-width="2"/></svg>`;
const LANTERN_TWIN = (s = 18, c = '#C98A1A') => `<svg width="${s}" height="${s}" viewBox="0 0 20 20"><path d="M10 1.5v2" stroke="${c}" stroke-width="1.8" stroke-linecap="round"/><rect x="6.5" y="3.5" width="7" height="2" rx="1" fill="${c}"/><ellipse cx="10" cy="11" rx="6" ry="5.6" fill="${c}" opacity=".9"/><rect x="6.5" y="16" width="7" height="2" rx="1" fill="${c}"/></svg>`;

// ---------- painted-object stand-ins (vector) ----------
// Seed jar: milky glaze body with a window; fill drawn as a code mask (ADR-0018's jar, layered as specified in §6).
function JAR(x, y, fill, w = 56, night = false) {
  const id = 'j' + Math.round(x * 7 + y);
  const seeds = Array.from({ length: 40 }, (_, i) => {
    const cx = 9 + (i * 7.3) % 26, cy = 47 - (Math.floor(i / 4) * 3.6) + ((i * 13) % 3);
    return `<ellipse cx="${cx}" cy="${cy}" rx="1.9" ry="3" fill="${i % 3 ? '#9A6527' : '#C38A3F'}" transform="rotate(${(i * 41) % 70 - 35} ${cx} ${cy})"/>`;
  }).join('');
  const top = 50 - 34 * fill;
  return `<svg class="abs" style="left:${x}px;top:${y}px;z-index:14;${night ? 'filter:brightness(.62) saturate(.85)' : ''}" width="${w}" height="${w * 1.3}" viewBox="0 0 44 57">
   <ellipse cx="22" cy="54" rx="17" ry="3" fill="rgba(60,40,30,.22)"/>
   <path d="M11 9h22c0 2 1 3 3 5 4 3 6 8 6 16v12c0 7-5 11-12 11H14C7 53 2 49 2 42V30c0-8 2-13 6-16 2-2 3-3 3-5z" fill="#F7EBDA" stroke="#E3CDB1" stroke-width="1"/>
   <clipPath id="${id}"><rect x="8" y="17" width="28" height="33" rx="9"/></clipPath>
   <rect x="8" y="17" width="28" height="33" rx="9" fill="#E9D8C2"/>
   <g clip-path="url(#${id})"><path d="M0 ${top + 2} Q11 ${top - 2} 22 ${top + 1} T44 ${top}" fill="none"/><rect x="0" y="${top}" width="44" height="60" fill="#B47A35"/>${seeds}</g>
   <rect x="8" y="17" width="28" height="33" rx="9" fill="none" stroke="#D9C2A5" stroke-width="1"/>
   <path d="M12 21v20" stroke="#fff" stroke-opacity=".6" stroke-width="2" stroke-linecap="round"/>
   <path d="M9 4h26c2 0 3 1.5 3 3s-1 3-3 3H9c-2 0-3-1.5-3-3s1-3 3-3z" fill="#F3E3CF" stroke="#DCC4A6"/>
   <path d="M7 8.5h30" stroke="#E7A3A0" stroke-width="2"/></svg>`;
}
// Calm lantern: paper lantern on a short honey-wood post; glow drawn in code.
function LANTERN(x, y, glow, night = false) {
  return `<div class="abs" style="left:${x - 70}px;top:${y - 62}px;width:170px;height:170px;border-radius:85px;z-index:13;background:radial-gradient(circle, rgba(255,198,96,${glow}) 0%, rgba(255,198,96,${glow * .32}) 34%, rgba(255,198,96,0) 68%)"></div>
  <svg class="abs" style="left:${x}px;top:${y}px;z-index:14;${night ? 'filter:brightness(.8)' : ''}" width="30" height="96" viewBox="0 0 30 96">
   <ellipse cx="15" cy="93" rx="9" ry="2.4" fill="rgba(60,40,30,.22)"/>
   <rect x="13" y="30" width="4" height="62" rx="2" fill="#B98A5A"/>
   <path d="M15 4v4" stroke="#8C6440" stroke-width="2"/>
   <rect x="7" y="7" width="16" height="4" rx="2" fill="#C99A63"/>
   <ellipse cx="15" cy="20" rx="12" ry="10.5" fill="${glow > .5 ? '#FFD488' : '#F6E4C6'}"/>
   <ellipse cx="15" cy="20" rx="8" ry="7" fill="${glow > .5 ? '#FFE9B8' : '#FAEEDB'}" opacity=".9"/>
   <path d="M4 17h22M3.5 21h23M4 25h22" stroke="#E2C59A" stroke-width=".9" opacity=".8"/>
   <rect x="7" y="29" width="16" height="4" rx="2" fill="#C99A63"/></svg>`;
}
// Skip pots: one clay pot per reach today; a bloom per skip, a bud per open, closed at night.
function POTS(cx, y, arr, night = false) {
  const w = 36, gap = 6, total = arr.length * w + (arr.length - 1) * gap;
  return arr.map((open, i) => {
    const x = cx - total / 2 + i * (w + gap);
    const head = night
      ? `<path d="M18 6c4 2 5 7 0 11-5-4-4-9 0-11z" fill="#8FA35E"/><path d="M18 7.5c1.6 2 1.6 5 0 7.5" stroke="#E7B64A" stroke-width="1.6" fill="none"/>`
      : open
        ? `${[0, 40, 80, 120, 160, 200, 240, 280, 320].map(a => `<ellipse cx="18" cy="3.5" rx="3.4" ry="5.6" fill="#F6C24C" transform="rotate(${a} 18 11)"/>`).join('')}<circle cx="18" cy="11" r="4.8" fill="#7B4A22"/><circle cx="16.6" cy="9.8" r="1.2" fill="#9B6634"/>`
        : `<path d="M18 4c5 3 6 9 0 14-6-5-5-11 0-14z" fill="#7FA857"/><path d="M18 6c2 3 2 7 0 10" stroke="#F0C04E" stroke-width="1.8" fill="none"/>`;
    return `<svg class="abs" style="left:${x}px;top:${y}px;z-index:16" width="${w}" height="${w * 1.55}" viewBox="0 0 36 56">
      <path d="M18 17v22" stroke="#5E8F43" stroke-width="2.6"/>
      <path d="M18 30c-5-3-9-2-11 1 5 1 8 1 11-1z" fill="#6FA552"/><path d="M18 27c5-3 9-2 11 1-5 1-8 1-11-1z" fill="#6FA552"/>
      ${head}
      <path d="M8 38h20l-2.5 15a3 3 0 0 1-3 2.5h-9a3 3 0 0 1-3-2.5z" fill="#D88E66"/>
      <rect x="6" y="35" width="24" height="5.5" rx="2.4" fill="#E9A47B"/>
      <path d="M11 44h14" stroke="#C47852" stroke-width="1" opacity=".6"/></svg>`;
  }).join('');
}
function SPARK(x, y, s = 14) { return `<svg class="abs" style="left:${x}px;top:${y}px;z-index:17" width="${s}" height="${s}" viewBox="0 0 16 16"><path d="M8 0l1.6 6.4L16 8l-6.4 1.6L8 16l-1.6-6.4L0 8l6.4-1.6z" fill="#FFF4C8"/></svg>`; }

// Pofu at a given foot point and body width; k = cheek puff 0..1 (pouch-shader stand-in)
function POFU(cx, feetY, bodyW, k = 0, extra = '') {
  const W = bodyW / 753 * 1024, H = W * 1.5;
  const left = cx - W * (138 + 376.5) / 1024, top = feetY - H * 1375 / 1536;
  const s = 1 + 0.5 * k;
  const ck = side => { const x = side < 0 ? '25%' : '75%'; const ox = side < 0 ? '39%' : '61%';
    return `<img class="ck" src="${ART.pofu}" style="--mx:${x};--mw:${15 + 13 * k}%;--mh:${9 + 7 * k}%;transform-origin:${ox} 63%;transform:scale(${s},${1 + 0.22 * k})">`; };
  return `<div class="pofu" style="left:${left}px;top:${top}px;width:${W}px;height:${H}px;z-index:15;${extra}"><img src="${ART.pofu}">${k > 0 ? ck(-1) + ck(1) : ''}</div>
   <div class="abs" style="left:${cx - bodyW * .42}px;top:${feetY - 8}px;width:${bodyW * .84}px;height:16px;border-radius:50%;background:rgba(70,50,30,.2);filter:blur(4px);z-index:14"></div>`;
}
// A character from a 1024x1536 canvas with a known bbox, placed by feet
function CHAR(src, bbox, cx, feetY, bodyW, z = 12, extra = '') {
  const [x0, y0, x1, y1] = bbox, W = bodyW / (x1 - x0) * 1024, H = W * 1.5;
  return `<img class="abs" src="${src}" style="left:${cx - W * ((x0 + x1) / 2) / 1024}px;top:${feetY - H * y1 / 1536}px;width:${W}px;z-index:${z};${extra}">`;
}
// A station from a 1024x1024 canvas placed by its bottom-centre
function STATION(src, bbox, cx, bottom, w, z = 11, extra = '') {
  const [x0, y0, x1, y1] = bbox, W = w / (x1 - x0) * 1024;
  return `<img class="abs" src="${src}" style="left:${cx - W * ((x0 + x1) / 2) / 1024}px;top:${bottom - W * y1 / 1024}px;width:${W}px;z-index:${z};${extra}">`;
}
