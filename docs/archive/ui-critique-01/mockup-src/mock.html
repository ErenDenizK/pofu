<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>UI critique 01 mockups</title>
<style>
@font-face { font-family: Nunito; src: url(../../../../design/prototypes/review-01/fonts/nunito-latin-ext-wght-normal.woff2) format('woff2'); font-weight: 200 1000; unicode-range: U+0100-024F, U+1E00-1EFF; }
@font-face { font-family: Nunito; src: url(../../../../design/prototypes/review-01/fonts/nunito-latin-wght-normal.woff2) format('woff2'); font-weight: 200 1000; }
@font-face { font-family: Baloo; src: url(../../../../design/prototypes/review-01/fonts/baloo-2-latin-wght-normal.woff2) format('woff2'); font-weight: 400 800; }
:root {
  --ink: #2A1F2D; --ink6: #66555F; --ink4: #8E7D88; --violet: #6C4FD8; --honey: #F5B83D; --honey3: #F7C873;
  --cream: #FFFBF5; --meadow: #2F7349; --peach8: #8A4F2B; --night: #15111C;
}
* { box-sizing: border-box; }
body { margin: 0; background: #ECE7E1; font-family: Nunito, system-ui, sans-serif; color: var(--ink); }
#board { width: 1640px; padding: 36px 40px 40px; background: #F4F0EA; }
h1 { font: 800 34px/1.1 Nunito; margin: 0 0 4px; letter-spacing: -0.3px; }
.sub { font: 500 17px/1.4 Nunito; color: var(--ink6); margin: 0 0 26px; max-width: 1500px; }
.row { display: flex; gap: 36px; align-items: flex-start; }
.col { display: flex; flex-direction: column; gap: 10px; }
.cap { font: 700 15px/1.3 Nunito; color: var(--ink6); text-transform: uppercase; letter-spacing: .6px; }
.phone { position: relative; width: 402px; height: 874px; border-radius: 56px; overflow: hidden; background: #ddd center/cover no-repeat;
  box-shadow: 0 0 0 10px #1d1a20, 0 0 0 11px #3a363d, 0 30px 60px rgba(40,25,50,.25); }
.phone.dark { box-shadow: 0 0 0 10px #1d1a20, 0 0 0 11px #3a363d, 0 30px 60px rgba(40,25,50,.35); }
.status { position: absolute; top: 18px; left: 34px; right: 30px; display: flex; justify-content: space-between; font: 700 17px Nunito; z-index: 5; }
.dark .status { color: #fff; }
.island-cut { position: absolute; top: 11px; left: 50%; width: 124px; height: 36px; margin-left: -62px; background: #000; border-radius: 20px; z-index: 6; }
.notes { flex: 1; display: flex; flex-direction: column; gap: 12px; min-width: 330px; }
.note { display: flex; gap: 12px; font: 500 16px/1.42 Nunito; color: var(--ink); }
.note b { font-weight: 800; }
.note .n { flex: none; }
.n { width: 28px; height: 28px; border-radius: 14px; background: #E5484D; color: #fff; font: 800 15px/28px Nunito; text-align: center; box-shadow: 0 2px 6px rgba(0,0,0,.25); }
.n.g { background: #2F9E5B; }
.pin { position: absolute; z-index: 20; }
.verdict { margin-top: 8px; padding: 14px 16px; border-radius: 16px; background: #fff; font: 600 16px/1.45 Nunito; }
.verdict .k { font-weight: 800; }
.tag { font: 700 13px Nunito; color: #9a8c94; }

/* glass, approximated */
.glass { background: rgba(255,255,255,.34); backdrop-filter: blur(14px) saturate(1.7); -webkit-backdrop-filter: blur(14px) saturate(1.7);
  box-shadow: inset 0 1px 0 rgba(255,255,255,.85), inset 0 0 0 .5px rgba(255,255,255,.55), 0 8px 24px rgba(60,40,70,.14); }
.dark .glass { background: rgba(40,32,52,.42); box-shadow: inset 0 1px 0 rgba(255,255,255,.22), inset 0 0 0 .5px rgba(255,255,255,.14), 0 8px 24px rgba(0,0,0,.3); color: #FFF6EC; }
.gprom { background: rgba(108,79,216,.86); color: #fff; backdrop-filter: blur(10px); box-shadow: inset 0 1px 0 rgba(255,255,255,.45), 0 8px 22px rgba(108,79,216,.35); }
.abs { position: absolute; }
.cap44 { height: 44px; border-radius: 22px; display: flex; align-items: center; }
.circle { width: 44px; height: 44px; border-radius: 22px; display: grid; place-items: center; }
.num { font-variant-numeric: tabular-nums; }
.bubble { position: absolute; background: #FFFBF5; border-radius: 22px; padding: 12px 18px; font: 700 18px/1.3 Nunito; color: var(--ink); text-align: center;
  box-shadow: 0 6px 18px rgba(60,40,70,.16); }
.bubble:after { content: ""; position: absolute; left: 50%; bottom: -9px; margin-left: -10px; border: 10px solid transparent; border-bottom: 0; border-top-color: #FFFBF5; }
.dark .bubble { background: #2A2236; color: #FFF6EC; }
.dark .bubble:after { border-top-color: #2A2236; }
.fog { position: absolute; left: 0; right: 0; bottom: 0; height: 260px; background: linear-gradient(to bottom, rgba(250,246,240,0), rgba(250,246,240,.92) 55%, #F7F2EC); }
.dark .fog { background: linear-gradient(to bottom, rgba(26,22,40,0), rgba(26,22,40,.9) 55%, #1A1628); }
.standin { position: absolute; font: 700 10px Nunito; color: rgba(0,0,0,.4); letter-spacing: .3px; }
.dark .standin { color: rgba(255,255,255,.45); }
.homebar { position: absolute; bottom: 8px; left: 50%; width: 140px; height: 5px; margin-left: -70px; border-radius: 3px; background: rgba(0,0,0,.75); z-index: 9; }
.dark .homebar { background: rgba(255,255,255,.8); }
.redbox { position: absolute; border: 3px solid #E5484D; border-radius: 12px; z-index: 19; }
</style>
</head>
<body>
<div id="board"></div>
<script>
const SEED = (s = 16, c = '#C98A1A') => `<svg width="${s * 0.7}" height="${s}" viewBox="0 0 14 20" style="transform:rotate(18deg)"><path d="M7 0C11 4 13 9 12 13C11 17 9 20 7 20C5 20 3 17 2 13C1 9 3 4 7 0Z" fill="${c}"/><path d="M7 3C9 6 10 10 9.5 13" stroke="#fff8" stroke-width="1.4" fill="none" stroke-linecap="round"/></svg>`;
const LANTERN = (s = 16, c = '#E59A2C') => `<svg width="${s}" height="${s}" viewBox="0 0 20 20"><path d="M7 2h6M10 2v2" stroke="${c}" stroke-width="1.8" stroke-linecap="round"/><rect x="5" y="5" width="10" height="11" rx="3" fill="none" stroke="${c}" stroke-width="1.8"/><circle cx="10" cy="10.5" r="2.6" fill="${c}"/><path d="M6 18h8" stroke="${c}" stroke-width="1.8" stroke-linecap="round"/></svg>`;
const GEAR = (c = '#2A1F2D') => `<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="1.8"><circle cx="12" cy="12" r="3.2"/><path d="M12 2.5v2.6M12 18.9v2.6M21.5 12h-2.6M5.1 12H2.5M18.7 5.3l-1.8 1.8M7.1 16.9l-1.8 1.8M18.7 18.7l-1.8-1.8M7.1 7.1L5.3 5.3"/><circle cx="12" cy="12" r="6.6"/></svg>`;
const MAP = (c = '#2A1F2D') => `<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="1.8" stroke-linejoin="round"><path d="M3 6l6-2 6 2 6-2v14l-6 2-6-2-6 2z"/><path d="M9 4v14M15 6v14"/></svg>`;
const BEADS = (arr, size = 12, on = '#6C4FD8') => arr.map(b => `<span style="display:inline-block;width:${size}px;height:${size}px;border-radius:50%;margin-right:5px;${b ? `background:${on}` : `border:2px solid ${on};`}"></span>`).join('');
const FLOWER = (open, x, y, s = 30) => open
  ? `<svg class="abs" style="left:${x}px;top:${y}px" width="${s}" height="${s * 1.6}" viewBox="0 0 30 48"><path d="M15 22v26" stroke="#4E8A3A" stroke-width="3"/><path d="M15 36c-5-2-8-1-10 2 4 1 7 1 10-2z" fill="#5F9E46"/>${[0,45,90,135,180,225,270,315].map(a => `<ellipse cx="15" cy="6" rx="4" ry="7" fill="#F5B83D" transform="rotate(${a} 15 14)"/>`).join('')}<circle cx="15" cy="14" r="6" fill="#7A4A1E"/></svg>`
  : `<svg class="abs" style="left:${x}px;top:${y}px" width="${s}" height="${s * 1.6}" viewBox="0 0 30 48"><path d="M15 22v26" stroke="#4E8A3A" stroke-width="3"/><path d="M15 36c5-2 8-1 10 2-4 1-7 1-10-2z" fill="#5F9E46"/><path d="M15 8c5 3 6 9 0 14-6-5-5-11 0-14z" fill="#6FA552"/><path d="M15 10c2 3 2 7 0 10" stroke="#F5B83D" stroke-width="2"/></svg>`;
const JAR = (x, y, fill = .55, w = 50) => `<svg class="abs" style="left:${x}px;top:${y}px" width="${w}" height="${w * 1.25}" viewBox="0 0 40 50">
  <rect x="9" y="2" width="22" height="6" rx="2" fill="#B9874E"/>
  <path d="M8 9h24c3 0 5 3 5 6v26c0 4-3 7-7 7H10c-4 0-7-3-7-7V15c0-3 2-6 5-6z" fill="rgba(255,255,255,.45)" stroke="rgba(255,255,255,.95)" stroke-width="1.5"/>
  <clipPath id="jc${x}"><path d="M8 9h24c3 0 5 3 5 6v26c0 4-3 7-7 7H10c-4 0-7-3-7-7V15c0-3 2-6 5-6z"/></clipPath>
  <g clip-path="url(#jc${x})"><rect x="0" y="${48 - 38 * fill}" width="40" height="50" fill="#E9A93A"/>
  ${Array.from({length: 26}, (_, i) => `<ellipse cx="${4 + (i * 7) % 33}" cy="${50 - 38 * fill + 3 + Math.floor(i / 5) * 6}" rx="2" ry="3.2" fill="${i % 2 ? '#8A5A20' : '#C98A1A'}" transform="rotate(${(i * 37) % 60 - 30} ${4 + (i * 7) % 33} ${50 - 38 * fill + 3 + Math.floor(i / 5) * 6})"/>`).join('')}</g>
  <path d="M10 14v24" stroke="#fff" stroke-opacity=".7" stroke-width="2" stroke-linecap="round"/></svg>`;
const LAMPPOST = (x, y, glow, dark) => `<div class="abs" style="left:${x + 18 - 80}px;top:${y + 14 - 80}px;width:160px;height:160px;border-radius:80px;background:radial-gradient(circle, rgba(255,196,90,${glow}) 0%, rgba(255,196,90,${glow * .35}) 35%, rgba(255,196,90,0) 70%)"></div>
  <svg class="abs" style="left:${x - 33}px;top:${y - 40}px" width="66" height="180" viewBox="0 0 44 120"><path d="M22 18V118" stroke="#7A5232" stroke-width="4"/><path d="M22 20h12v6" stroke="#7A5232" stroke-width="3" fill="none"/>
  <rect x="26" y="26" width="16" height="20" rx="4" fill="${dark ? '#FFD27A' : '#FFE3A6'}" stroke="#7A5232" stroke-width="2.5"/><circle cx="34" cy="36" r="4" fill="#FFB43B"/></svg>`;
const SPARK = (x, y) => `<div class="abs" style="left:${x}px;top:${y}px;width:16px;height:16px;"><svg width="16" height="16" viewBox="0 0 16 16"><path d="M8 0l1.6 6.4L16 8l-6.4 1.6L8 16l-1.6-6.4L0 8l6.4-1.6z" fill="#FFF3C4"/></svg></div>`;
const PILE = (x, y) => `<div class="abs" style="left:${x}px;top:${y}px">${SEED(14)}${SEED(12, '#8A5A20')}${SEED(14)}</div>${SPARK(x + 26, y - 14)}`;

function phone({ bg, dark = false, inner = '', pins = [] }) {
  return `<div class="phone ${dark ? 'dark' : ''}" style="background-image:url(${bg})">
    <div class="island-cut"></div><div class="status"><span>9:41</span><span>●●● ▮</span></div>
    ${inner}
    ${pins.map(([n, x, y, g]) => `<div class="pin n ${g ? 'g' : ''}" style="left:${x}px;top:${y}px">${n}</div>`).join('')}
    <div class="homebar"></div></div>`;
}
function notes(list, verdict) {
  return `<div class="notes">${list.map(([n, t, g]) => `<div class="note"><div class="n ${g ? 'g' : ''}">${n}</div><div>${t}</div></div>`).join('')}${verdict ? `<div class="verdict">${verdict}</div>` : ''}</div>`;
}

// ---------- Boards ----------
const boards = {};

boards.current = () => `
<h1>Today's game screen, critiqued</h1>
<p class="sub">CI simulator screenshots from <code>screenshots/main</code> (merge of #59, 402 × 874 pt). Red boxes are findings; the grey IDs are the rows of <code>docs/design/ui-critique-01.md</code> §1.</p>
<div class="row">
 <div class="col"><div class="cap">Home · visit (collect beat)</div>${phone({ bg: '01-home-visit-light.jpg', inner: `
   <div class="redbox" style="left:18px;top:70px;width:262px;height:44px"></div>
   <div class="redbox" style="left:66px;top:368px;width:270px;height:66px"></div>
   <div class="redbox" style="left:16px;top:686px;width:370px;height:80px"></div>
   <div class="redbox" style="left:16px;top:772px;width:370px;height:62px"></div>
   <div class="redbox" style="left:-6px;top:574px;width:100px;height:50px"></div>`,
   pins: [[1, 286, 76], [2, 342, 374], [3, 340, 668], [4, 20, 806], [5, 98, 580], [6, 350, 40]] })}</div>
 <div class="col"><div class="cap">Station sheet · build</div>${phone({ bg: '04-station-build-light.jpg', inner: `
   <div class="redbox" style="left:14px;top:540px;width:374px;height:120px"></div>
   <div class="redbox" style="left:14px;top:762px;width:374px;height:62px"></div>`,
   pins: [[7, 356, 512], [8, 356, 734]] })}</div>
 <div class="col"><div class="cap">Rehearsal · the left screen</div>${phone({ bg: '07-prova-panel-light.jpg', inner: `
   <div class="redbox" style="left:98px;top:366px;width:206px;height:76px"></div>
   <div class="redbox" style="left:162px;top:122px;width:236px;height:400px;border-style:dashed;border-color:#999"></div>`,
   pins: [[9, 70, 380], [10, 20, 200]] })}</div>
 ${notes([
  [1, '<span class="tag">H4 H5</span> <b>Three chip styles in one row</b>: honey-tinted glass, plain glass, glass circle. Mood is told in words while Pofu\'s face is 200 pt below. "Huzur ×1,7" is a multiplier, not a feeling.'],
  [2, '<span class="tag">H6</span> <b>Pofu talks like a receipt</b>: "991 çekirdek topladı. Huzur ×1,7." The bubble is a system callout: white box, 17 pt label type, no voice.'],
  [3, '<span class="tag">H2</span> <b>A Screen Time widget glued over the island</b>: opaque cream card (opacity .96), two unlabeled meters (beads + four grey bars), "en az 15 / 60 dk". It covers the island lip the framing spec keeps visible.'],
  [4, '<span class="tag">H3</span> <b>A form submit button</b>: full-width violet "Topla", 380 pt from the seeds it collects. The most tactile beat of the game is a SaaS CTA.'],
  [5, '<span class="tag">H9</span> <b>Editor affordance in a painting</b>: a dashed "+" ellipse, half off screen.'],
  [6, '<span class="tag">H1 H7</span> <b>No seed balance anywhere</b>, and no visible way to the island or the map (pinch only).'],
  [7, '<span class="tag">S1</span> <b>Choosing a build without seeing it</b>: name, five grey 10 pt dots, "İnşa yeri", "Saatte 0 çekirdek". Two thirds of the sheet is blank.'],
  [8, '<span class="tag">S1</span> <b>The violet slab again</b>, now with the price. No preview, no Pofu, no anticipation.'],
  [9, '<span class="tag">H10</span> <b>The hero line is cut</b> by the dev panel ("Sen yo… çeki…"); the panel opens expanded by default.'],
  [10, '<span class="tag">H8</span> <b>Half the screen is sky</b>; the world is a 210 pt strip between two chrome bands. The screen reads as an app with a picture behind it.'],
 ])}
</div>`;

boards.a = () => `
<h1>Direction A · Quiet Glass</h1>
<p class="sub">ADR-0018 as written, executed with discipline. One glass cluster per band, numerals instead of sentences, the world gets the middle 60 %. Closest to Apple Weather and Journal. <span class="tag">Fonts: Nunito stands in for SF Pro Rounded. Background: the CI screenshot with its chrome removed.</span></p>
<div class="row">
 <div class="col"><div class="cap">Visit · collect beat</div>${phone({ bg: 'home-light.jpg', inner: `
   <div class="abs glass cap44" style="left:20px;top:62px;padding:0 14px;gap:8px;font:800 17px Nunito">
     ${SEED(16)}<span class="num">1.240</span><span style="width:1px;height:20px;background:rgba(42,31,45,.18);margin:0 4px"></span>${LANTERN(18)}<span class="num">×1,7</span></div>
   <div class="abs glass circle" style="right:20px;top:62px">${GEAR()}</div>
   <div class="bubble" style="left:78px;top:384px;width:246px">Sen yokken 991 çekirdek birikti!</div>
   <div class="fog" style="height:200px"></div>
   <div class="abs glass" style="left:16px;right:16px;top:690px;border-radius:30px;padding:14px 16px 14px 18px">
     <div style="display:flex;align-items:flex-end;gap:16px">
       <div style="flex:1"><div style="font:700 13px Nunito;color:var(--ink6)">Bugün</div>
         <div style="display:flex;align-items:baseline;gap:6px"><span class="num" style="font:800 30px/1 Nunito">3/4</span><span style="font:700 15px Nunito">boş verdin</span></div>
         <div style="margin-top:7px">${BEADS([1, 1, 0, 1])}</div></div>
       <div style="text-align:right"><div style="font:700 13px Nunito;color:var(--ink6)">Akışta</div>
         <div><span class="num" style="font:800 30px/1 Nunito">15</span><span style="font:700 15px Nunito"> / 60 dk</span></div></div>
     </div>
     <div class="gprom cap44" style="margin-top:12px;height:50px;border-radius:25px;justify-content:center;gap:10px;font:800 18px Nunito">${SEED(16, '#fff')} 991 çekirdeği topla</div>
   </div>`,
   pins: [[1, 238, 54, 1], [2, 330, 372, 1], [3, 380, 700, 1], [4, 380, 780, 1]] })}</div>
 <div class="col"><div class="cap">Settled · nothing asks</div>${phone({ bg: 'home-light.jpg', inner: `
   <div class="abs glass cap44" style="left:20px;top:62px;padding:0 14px;gap:8px;font:800 17px Nunito">
     ${SEED(16)}<span class="num">2.231</span><span style="width:1px;height:20px;background:rgba(42,31,45,.18);margin:0 4px"></span>${LANTERN(18)}<span class="num">×1,7</span></div>
   <div class="abs glass circle" style="right:20px;top:62px">${GEAR()}</div>
   <div class="fog" style="height:170px"></div>
   <div class="abs glass cap44" style="left:20px;top:782px;padding:0 18px;gap:10px;font:700 16px Nunito">
     <span>Bugün <b class="num">3/4</b></span>${BEADS([1, 1, 0, 1], 9)}<span style="color:var(--ink6)">· 15 dk</span></div>
   <div class="abs glass circle" style="right:20px;top:782px">${MAP()}</div>`,
   pins: [[5, 300, 774, 1], [6, 384, 774, 1]] })}</div>
 ${notes([
  [1, '<b>One status cluster</b> (a GlassEffectContainer): seeds and calm as vector twins + numerals. The mood pill is gone; Pofu\'s face and VoiceOver value carry mood.', 1],
  [2, '<b>Pofu speaks like a friend</b>, one idea per line, 18 pt. Numbers live in chrome, not in his mouth.', 1],
  [3, '<b>Today becomes a glass dock</b>, not an opaque card: two labeled numerals ("3/4 boş verdin", "15 / 60 dk akışta"), beads under their own number.', 1],
  [4, '<b>The primary carries the payoff</b> ("991 çekirdeği topla") inside the same glass group, so it morphs into the seed counter.', 1],
  [5, '<b>Settled collapses to one line</b>; the button disappears and the island is uncovered.', 1],
  [6, '<b>A visible way out to the map</b> (SF Symbol, system action). Pinch stays a shortcut, not the only path.', 1],
 ], '<span class="k">Pros:</span> respects ADR-0018 to the letter; buildable in 2 days; most legible; Dynamic Type and VoiceOver are free. <span class="k">Cons:</span> it is still an app over a painting. It fixes the craft, not the founder\'s complaint: the UI is still not the game.')}
</div>`;

boards.b = () => `
<h1>Direction B · Living Diorama</h1>
<p class="sub">State lives in the world; glass is only for what you do. The seed jar, the calm lantern and a skip bed of sunflowers are the readouts; their native twin is one Today glance that peeks from the bottom. Closest to Neko Atsume, Sky's cape and A Short Hike's feathers. <span class="tag">Jar, lantern and flowers are vector stand-ins for painted art.</span></p>
<div class="row">
 <div class="col"><div class="cap">Visit · morning, collect in the world</div>${phone({ bg: 'home-light.jpg', inner: `
   <div class="abs glass circle" style="right:20px;top:62px">${GEAR()}</div>
   ${LAMPPOST(318, 440, .7)}
   ${JAR(52, 540, .35)}
   <div class="abs glass" style="left:44px;top:606px;height:26px;padding:0 10px;border-radius:13px;font:800 14px/26px Nunito" class="num">1.240</div>
   ${PILE(270, 610)}${PILE(150, 640)}${PILE(20, 690)}
   <div class="bubble" style="left:96px;top:372px;width:226px">Sen yokken çekirdekler birikti!</div>
   <div class="abs gprom cap44" style="left:30px;top:478px;padding:0 16px;gap:8px;font:800 16px Nunito;height:44px">${SEED(14, '#fff')} Topla · 991</div>
   <svg class="abs" style="left:66px;top:520px" width="14" height="18"><path d="M7 18L0 6h14z" fill="rgba(108,79,216,.86)"/></svg>
   <div class="fog" style="height:200px"></div>
   ${FLOWER(1, 112, 700)}${FLOWER(1, 152, 704)}${FLOWER(0, 192, 702)}${FLOWER(1, 232, 700)}
   <div class="abs glass" style="left:96px;right:96px;top:784px;height:50px;border-radius:25px;display:flex;align-items:center;justify-content:center;gap:8px;font:700 15px Nunito">
     <span style="position:absolute;top:6px;left:50%;margin-left:-18px;width:36px;height:4px;border-radius:2px;background:rgba(42,31,45,.25)"></span>
     <span style="margin-top:6px">Bugün <b class="num">3/4</b> · <b class="num">15</b> dk</span></div>
   <span class="standin" style="left:52px;top:528px">JAR</span><span class="standin" style="left:300px;top:578px">LANTERN</span><span class="standin" style="left:120px;top:690px">SKIP BED</span>`,
   pins: [[1, 26, 588, 1], [2, 360, 380, 1], [3, 16, 470, 1], [4, 280, 700, 1], [5, 316, 790, 1], [6, 330, 120, 1]] })}</div>
 <div class="col"><div class="cap">Settled · night, the lantern says it</div>${phone({ bg: 'home-dark.jpg', dark: true, inner: `
   <div class="abs glass circle" style="right:20px;top:62px">${GEAR('#FFF6EC')}</div>
