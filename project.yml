# XcodeGen spec for Pofu. The .xcodeproj is generated from this file and is
# not committed; run `xcodegen generate` after cloning or pulling.
# See docs/adr/0009-xcodegen-and-package-layout.md and docs/development.md.
name: Pofu

options:
  deploymentTarget:
    iOS: "26.0"
  developmentLanguage: en
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: true
    LOCALIZATION_PREFERS_STRING_CATALOGS: true
    SWIFT_EMIT_LOC_STRINGS: true
    DEAD_CODE_STRIPPING: true

packages:
  PofuKit:
    path: Packages/PofuKit

targets:
  Pofu:
    type: application
    platform: iOS
    sources:
      - path: App
      # The shield's colors, icon and notification, shared with the
      # Screen Time extensions for Rehearsal mode's replica.
      - path: Extensions/Shared
    # The bundle identifier and signing team live in the xcconfig, so that a
    # git-ignored Config/Local.xcconfig can override them per machine and
    # survive regeneration. DEVELOPMENT_TEAM is empty there; CI builds
    # unsigned.
    configFiles:
      Debug: Config/Pofu.xcconfig
      Release: Config/Pofu.xcconfig
    dependencies:
      - package: PofuKit
        product: PofuCore
      - package: PofuKit
        product: PofuScreenTime
      - package: PofuKit
        product: PofuPersistence
      - package: PofuKit
        product: PofuDesignSystem
      - package: PofuKit
        product: PofuCompanion
      - package: PofuKit
        product: PofuWorld
      # The Ayar tuning panel's values (debug builds' Rehearsal mode).
      - package: PofuKit
        product: PofuTuning
    settings:
      base:
        PRODUCT_NAME: Pofu
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: true
        # Merged with the generated Info.plist: LSApplicationQueriesSchemes
        # for the hand-off back to the guarded app after Hop!.
        INFOPLIST_FILE: Config/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: Pofu
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.healthcare-fitness
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: true
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: true
        # UILaunchScreen lives in Config/Info.plist, with a launch color.
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: true

  # The same app with the Screen Time gate: the Family Controls and App
  # Group entitlements, POFU_SCREEN_TIME_LIVE, and the three extensions.
  # Needs the paid membership; see docs/development.md, "Membership day 1".
  # Keep its settings in step with the Pofu target above.
  PofuLive:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Extensions/Shared
    configFiles:
      Debug: Config/Pofu.xcconfig
      Release: Config/Pofu.xcconfig
    dependencies:
      - package: PofuKit
        product: PofuCore
      - package: PofuKit
        product: PofuScreenTime
      - package: PofuKit
        product: PofuPersistence
      - package: PofuKit
        product: PofuDesignSystem
      - package: PofuKit
        product: PofuCompanion
      - package: PofuKit
        product: PofuWorld
      - package: PofuKit
        product: PofuTuning
      - target: PofuShieldConfiguration
      - target: PofuShieldAction
      - target: PofuActivityMonitor
    settings:
      base:
        PRODUCT_NAME: PofuLive
        # Always the final identifier, whatever Local.xcconfig says for
        # the free build: the extensions' identifiers derive from it.
        PRODUCT_BUNDLE_IDENTIFIER: $(POFU_BUNDLE_ID_BASE)
        CODE_SIGN_ENTITLEMENTS: Config/Entitlements/PofuLive.entitlements
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) POFU_SCREEN_TIME_LIVE
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: true
        INFOPLIST_FILE: Config/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: Pofu
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.healthcare-fitness
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: true
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: true
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: true

  # Renders IslandScene in the simulator, hosted in the Pofu app so sheets
  # and glass draw as they do on a phone, and writes PNGs for the founder's
  # review (the world-screenshots artifact in CI). Not part of the Pofu
  # scheme's tests; run it with the PofuWorldScreenshots scheme.
  PofuWorldScreenshots:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/WorldScreenshots
    dependencies:
      - target: Pofu
      - package: PofuKit
        product: PofuCore
      - package: PofuKit
        product: PofuDesignSystem
      - package: PofuKit
        product: PofuWorld
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(POFU_BUNDLE_ID_BASE).WorldScreenshots
        GENERATE_INFOPLIST_FILE: true
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Pofu.app/Pofu
        BUNDLE_LOADER: $(TEST_HOST)
    configFiles:
      Debug: Config/Pofu.xcconfig
      Release: Config/Pofu.xcconfig

  # The Screen Time extensions, embedded only in PofuLive. Their bundle
  # identifiers derive from POFU_BUNDLE_ID_BASE, so they always start with
  # the app's.
  PofuShieldConfiguration:
    type: app-extension
    platform: iOS
    sources:
      - path: Extensions/ShieldConfiguration
      - path: Extensions/Shared/ShieldStyle.swift
      # Pofu's face on the shield, shared with PofuCompanion (not a copy).
      - path: Packages/PofuKit/Sources/PofuCompanion/Resources/pofu-hamster.png
        buildPhase: resources
    configFiles:
      Debug: Config/Pofu.xcconfig
      Release: Config/Pofu.xcconfig
    dependencies:
      - package: PofuKit
        product: PofuCore
      - package: PofuKit
        product: PofuPersistence
      - package: PofuKit
        product: PofuScreenTime
      - package: PofuKit
        product: PofuDesignSystem
    settings:
      base:
        PRODUCT_NAME: PofuShieldConfiguration
        PRODUCT_BUNDLE_IDENTIFIER: $(POFU_BUNDLE_ID_BASE).ShieldConfiguration
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: Config/Entitlements/ScreenTimeExtension.entitlements
        GENERATE_INFOPLIST_FILE: true
        INFOPLIST_FILE: Extensions/ShieldConfiguration/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: Pofu Shield

  PofuShieldAction:
    type: app-extension
    platform: iOS
    sources:
      - path: Extensions/ShieldAction
      - path: Extensions/Shared/GateNotificationContent.swift
    configFiles:
      Debug: Config/Pofu.xcconfig
      Release: Config/Pofu.xcconfig
    dependencies:
      - package: PofuKit
        product: PofuCore
      - package: PofuKit
        product: PofuPersistence
      - package: PofuKit
        product: PofuScreenTime
    settings:
      base:
        PRODUCT_NAME: PofuShieldAction
        PRODUCT_BUNDLE_IDENTIFIER: $(POFU_BUNDLE_ID_BASE).ShieldAction
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: Config/Entitlements/ScreenTimeExtension.entitlements
        GENERATE_INFOPLIST_FILE: true
        INFOPLIST_FILE: Extensions/ShieldAction/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: Pofu Shield Action

  PofuActivityMonitor:
    type: app-extension
    platform: iOS
    sources:
      - path: Extensions/DeviceActivityMonitor
    configFiles:
      Debug: Config/Pofu.xcconfig
      Release: Config/Pofu.xcconfig
    dependencies:
      - package: PofuKit
        product: PofuCore
      - package: PofuKit
        product: PofuPersistence
      - package: PofuKit
        product: PofuScreenTime
    settings:
      base:
        PRODUCT_NAME: PofuActivityMonitor
        PRODUCT_BUNDLE_IDENTIFIER: $(POFU_BUNDLE_ID_BASE).DeviceActivityMonitor
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: Config/Entitlements/ScreenTimeExtension.entitlements
        GENERATE_INFOPLIST_FILE: true
        INFOPLIST_FILE: Extensions/DeviceActivityMonitor/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: Pofu Activity Monitor

schemes:
  Pofu:
    build:
      targets:
        Pofu: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - package: PofuKit/PofuCoreTests
        - package: PofuKit/PofuScreenTimeTests
        - package: PofuKit/PofuPersistenceTests
        - package: PofuKit/PofuDesignSystemTests
        - package: PofuKit/PofuCompanionTests
        - package: PofuKit/PofuWorldTests
        - package: PofuKit/PofuTuningTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release

  # The Screen Time build. Signs only with the paid team.
  PofuLive:
    build:
      targets:
        PofuLive: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - package: PofuKit/PofuCoreTests
        - package: PofuKit/PofuScreenTimeTests
        - package: PofuKit/PofuPersistenceTests
        - package: PofuKit/PofuDesignSystemTests
        - package: PofuKit/PofuCompanionTests
        - package: PofuKit/PofuWorldTests
        - package: PofuKit/PofuTuningTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release

  # Simulator screenshots of the island scene, in Turkish (the founder's
  # language): xcodebuild test -scheme PofuWorldScreenshots.
  PofuWorldScreenshots:
    build:
      targets:
        Pofu: all
        PofuWorldScreenshots: [test]
    test:
      config: Debug
      language: tr
      region: TR
      targets:
        - PofuWorldScreenshots
