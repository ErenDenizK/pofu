name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # macOS minutes bill at 10x. Decide first, on a cheap Linux runner, whether
  # anything that affects the Swift build changed; docs, design, content and
  # Python tooling never need the macOS job.
  changes:
    name: Detect what changed
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      swift: ${{ steps.diff.outputs.swift }}
      tools: ${{ steps.diff.outputs.tools }}
    steps:
      - name: Check out
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Classify the changed files
        id: diff
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          if [ -z "${BASE:-}" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "No usable base; running everything."
            echo "swift=true" >> "$GITHUB_OUTPUT"
            echo "tools=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files="$(git diff --name-only "$BASE...$HEAD")"
          printf '%s\n' "$files"
          # Anything outside these paths can affect the app build.
          swift_files="$(printf '%s\n' "$files" | grep -Ev '^(docs/|design/|tools/|content/|[^/]+\.md$|\.gitignore$|LICENSE)' | grep -v '^$' || true)"
          # Art masters and the bake script feed the asset-harmony check.
          tools_files="$(printf '%s\n' "$files" | grep -E '^(tools|content|design/art|design/prototypes/interactions/tools)/' || true)"
          echo "swift=$([ -n "$swift_files" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "tools=$([ -n "$tools_files" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

  python-tools:
    name: Test the Python tools
    needs: changes
    if: needs.changes.outputs.tools == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r tools/assets/requirements.txt -r tools/imagegen/requirements.txt -r tools/content/requirements.txt

      - name: Test the asset tools
        run: python3 -I -m unittest discover -s tools/assets -p "test_*.py"

      - name: Test the image pipeline
        run: python3 -I -m pytest -q tools/imagegen/tests

      # Every master measured against the reference; fails when a master,
      # the config or a correction changed without re-running harmony.py
      # measure (and preblur.py app, which bakes the corrections).
      - name: Check the asset harmony manifest
        run: python3 -I tools/assets/harmony.py check

      - name: Validate the content graph (Pofu Atlas)
        run: |
          python3 -I tools/content/validate.py
          python3 -I -m pytest -q tools/content/tests

  build-and-test:
    name: Test PofuKit and build the app
    needs: changes
    if: needs.changes.outputs.swift == 'true'
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Select Xcode 26 or newer
        run: |
          set -euo pipefail
          current_major="$(xcodebuild -version | awk '/^Xcode/ { split($2, v, "."); print v[1] }')"
          if [ "${current_major:-0}" -lt 26 ]; then
            newest="$(ls -d /Applications/Xcode_2[6-9]*.app 2>/dev/null | sort -V | tail -n 1 || true)"
            if [ -z "$newest" ]; then
              echo "::error::No Xcode 26 or newer is installed on this runner."
              ls -d /Applications/Xcode*.app
              exit 1
            fi
            sudo xcode-select -s "$newest/Contents/Developer"
          fi
          xcodebuild -version
          swift --version

      - name: Test PofuKit
        run: swift test --package-path Packages/PofuKit -Xswiftc -warnings-as-errors

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate the Xcode project
        run: xcodegen generate

      - name: Build the app for the iOS Simulator
        run: |
          set -o pipefail
          xcodebuild build \
            -project Pofu.xcodeproj \
            -scheme Pofu \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            SWIFT_TREAT_WARNINGS_AS_ERRORS=YES

      # The Screen Time build: the app with the Family Controls entitlement
      # and its shield and monitor extensions. Unsigned here, so it proves
      # everything compiles; only a paid team can sign and run it.
      - name: Build the live Screen Time app for the iOS Simulator
        run: |
          set -o pipefail
          xcodebuild build \
            -project Pofu.xcodeproj \
            -scheme PofuLive \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            SWIFT_TREAT_WARNINGS_AS_ERRORS=YES

      # The founder reviews screenshots, never web prototypes: render the
      # island scene in the simulator (402 x 874 pt at 3x, the iPhone 17
      # class) and upload the PNGs as the world-screenshots artifact.
      - name: Render the world screenshots
        run: |
          set -euo pipefail
          udid="$(xcrun simctl list devices available --json | python3 -I -c '
          import json, sys
          devices = [d for runtime, ds in json.load(sys.stdin)["devices"].items() if "iOS" in runtime for d in ds]
          for name in ("iPhone 17 Pro", "iPhone 17", "iPhone 16 Pro"):
              match = [d for d in devices if d["name"] == name]
              if match:
                  print(match[-1]["udid"])
                  break
          ')"
          if [ -z "$udid" ]; then
            echo "::error::No iPhone 17 Pro, iPhone 17 or iPhone 16 Pro simulator is installed."
            xcrun simctl list devices available
            exit 1
          fi
          out="$RUNNER_TEMP/world-screenshots"
          mkdir -p "$out"
          set -o pipefail
          TEST_RUNNER_WORLD_SCREENSHOTS_DIR="$out" xcodebuild test \
            -project Pofu.xcodeproj \
            -scheme PofuWorldScreenshots \
            -destination "id=$udid" \
            -resultBundlePath "$RUNNER_TEMP/world-screenshots.xcresult" \
            CODE_SIGNING_ALLOWED=NO \
            SWIFT_TREAT_WARNINGS_AS_ERRORS=YES
          # The PNGs are attached to the result as well; export them if the
          # simulator could not write to the runner's folder.
          if ! ls "$out"/*.png >/dev/null 2>&1; then
            xcrun xcresulttool export attachments \
              --path "$RUNNER_TEMP/world-screenshots.xcresult" \
              --output-path "$out"
          fi
          ls -la "$out"

      - name: Upload the world screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: world-screenshots
          path: ${{ runner.temp }}/world-screenshots
          if-no-files-found: error

  # The artifact host is not reachable from every review environment, so
  # the screenshots are also published where git can fetch them: a
  # single-commit orphan branch, screenshots/<head branch with / as ->,
  # force-pushed on every green run. See docs/development.md.
  publish-screenshots:
    name: Publish the world screenshots to a branch
    needs: build-and-test
    if: >-
      needs.build-and-test.result == 'success' &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out
        uses: actions/checkout@v5
        with:
          path: repo

      - name: Download the world screenshots
        uses: actions/download-artifact@v4
        with:
          name: world-screenshots
          path: shots

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Convert to JPEG and draw a contact sheet
        run: |
          set -euo pipefail
          pip install --quiet "Pillow>=10.1" "numpy>=1.26"
          mkdir -p out
          python3 -I - shots out <<'PY'
          import pathlib, sys
          from PIL import Image, ImageDraw
          src, out = map(pathlib.Path, sys.argv[1:3])
          pngs = sorted(src.glob("*.png"))
          if not pngs:
              sys.exit("no screenshots in the artifact")
          thumbs = []
          for png in pngs:
              im = Image.open(png).convert("RGB")
              # The look grids and the camera strip hold many phones; keep them readable.
              h = {"look-compare": 1800, "look-grades": 2000, "look-motion": 1100}.get(png.stem, 1000)
              w = round(im.width * h / im.height)
              im.resize((w, h), Image.LANCZOS).save(out / (png.stem + ".jpg"), "JPEG", quality=85, optimize=True)
              if png.stem.startswith("look-"):
                  continue
              thumbs.append((png.stem, im.resize((round(im.width * 600 / im.height), 600), Image.LANCZOS)))
          # One row per appearance (light, then dark), one column per state.
          rows = [[t for t in thumbs if t[0].endswith(s)] for s in ("-light", "-dark")]
          rows = [r for r in rows if r] or [thumbs]
          cols = max(len(r) for r in rows)
          tw, th, pad, label = thumbs[0][1].width, 600, 16, 28
          sheet = Image.new("RGB", (pad + cols * (tw + pad), pad + len(rows) * (th + label + pad)), (240, 240, 240))
          draw = ImageDraw.Draw(sheet)
          for r, row in enumerate(rows):
              for c, (name, im) in enumerate(row):
                  x, y = pad + c * (tw + pad), pad + r * (th + label + pad)
                  draw.text((x, y + 6), name, fill=(40, 40, 40))
                  sheet.paste(im, (x, y + label))
          sheet.save(out / "contact.jpg", "JPEG", quality=85, optimize=True)
          PY
          cp shots/*.txt out/ 2>/dev/null || true
          # The asset-harmony contact sheet: every master before and after its correction.
          python3 -I repo/tools/assets/harmony.py measure --dry-run --sheet out/harmony.jpg > out/harmony.txt
          # Measured numbers for every grade frame (tools/assets/frame_metrics.py).
          python3 -I repo/tools/assets/frame_metrics.py shots > out/grade-metrics.txt || true
          cat out/grade-metrics.txt
          ls -la out

      - name: Force-push the screenshots branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_BRANCH: ${{ github.head_ref || github.ref_name }}
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          branch="screenshots/${SOURCE_BRANCH//\//-}"
          cd out
          git init -q
          git checkout -q --orphan "$branch"
          git config user.name "Eren Deniz Kuyucaklıoğlu"
          git config user.email "109629701+ErenDenizK@users.noreply.github.com"
          git add -A
          git commit -q -m "chore(screenshots): world screenshots for $SOURCE_BRANCH at ${SOURCE_SHA:0:7}"
          git push -q --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:refs/heads/$branch"
          echo "Published to $branch"
