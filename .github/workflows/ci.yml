name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    name: Test PofuKit and build the app
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Select Xcode 26 or newer
        run: |
          set -euo pipefail
          current_major="$(xcodebuild -version | awk '/^Xcode/ { split($2, v, "."); print v[1] }')"
          if [ "${current_major:-0}" -lt 26 ]; then
            newest="$(ls -d /Applications/Xcode_2[6-9]*.app 2>/dev/null | sort -V | tail -n 1 || true)"
            if [ -z "$newest" ]; then
              echo "::error::No Xcode 26 or newer is installed on this runner."
              ls -d /Applications/Xcode*.app
              exit 1
            fi
            sudo xcode-select -s "$newest/Contents/Developer"
          fi
          xcodebuild -version
          swift --version

      - name: Test PofuKit
        run: swift test --package-path Packages/PofuKit

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate the Xcode project
        run: xcodegen generate

      - name: Build the app for the iOS Simulator
        run: |
          set -o pipefail
          xcodebuild build \
            -project Pofu.xcodeproj \
            -scheme Pofu \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO
