name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # macOS minutes bill at 10x. Decide first, on a cheap Linux runner, whether
  # anything that affects the Swift build changed; docs, design and Python
  # tooling never need the macOS job.
  changes:
    name: Detect what changed
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      swift: ${{ steps.diff.outputs.swift }}
      tools: ${{ steps.diff.outputs.tools }}
    steps:
      - name: Check out
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Classify the changed files
        id: diff
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          if [ -z "${BASE:-}" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "No usable base; running everything."
            echo "swift=true" >> "$GITHUB_OUTPUT"
            echo "tools=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files="$(git diff --name-only "$BASE...$HEAD")"
          printf '%s\n' "$files"
          # Anything outside these paths can affect the app build.
          swift_files="$(printf '%s\n' "$files" | grep -Ev '^(docs/|design/|tools/|[^/]+\.md$|\.gitignore$|LICENSE)' | grep -v '^$' || true)"
          tools_files="$(printf '%s\n' "$files" | grep -E '^tools/' || true)"
          echo "swift=$([ -n "$swift_files" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "tools=$([ -n "$tools_files" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

  python-tools:
    name: Test the Python tools
    needs: changes
    if: needs.changes.outputs.tools == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r tools/assets/requirements.txt -r tools/imagegen/requirements.txt

      - name: Test the asset tools
        run: python3 -I -m unittest discover -s tools/assets -p "test_*.py"

      - name: Test the image pipeline
        run: python3 -I -m pytest -q tools/imagegen/tests

  build-and-test:
    name: Test PofuKit and build the app
    needs: changes
    if: needs.changes.outputs.swift == 'true'
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Select Xcode 26 or newer
        run: |
          set -euo pipefail
          current_major="$(xcodebuild -version | awk '/^Xcode/ { split($2, v, "."); print v[1] }')"
          if [ "${current_major:-0}" -lt 26 ]; then
            newest="$(ls -d /Applications/Xcode_2[6-9]*.app 2>/dev/null | sort -V | tail -n 1 || true)"
            if [ -z "$newest" ]; then
              echo "::error::No Xcode 26 or newer is installed on this runner."
              ls -d /Applications/Xcode*.app
              exit 1
            fi
            sudo xcode-select -s "$newest/Contents/Developer"
          fi
          xcodebuild -version
          swift --version

      - name: Test PofuKit
        run: swift test --package-path Packages/PofuKit -Xswiftc -warnings-as-errors

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate the Xcode project
        run: xcodegen generate

      - name: Build the app for the iOS Simulator
        run: |
          set -o pipefail
          xcodebuild build \
            -project Pofu.xcodeproj \
            -scheme Pofu \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            SWIFT_TREAT_WARNINGS_AS_ERRORS=YES

      # The Screen Time build: the app with the Family Controls entitlement
      # and its shield and monitor extensions. Unsigned here, so it proves
      # everything compiles; only a paid team can sign and run it.
      - name: Build the live Screen Time app for the iOS Simulator
        run: |
          set -o pipefail
          xcodebuild build \
            -project Pofu.xcodeproj \
            -scheme PofuLive \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            SWIFT_TREAT_WARNINGS_AS_ERRORS=YES

      # The founder reviews screenshots, never web prototypes: render the
      # island scene in the simulator (402 x 874 pt at 3x, the iPhone 17
      # class) and upload the PNGs as the world-screenshots artifact.
      - name: Render the world screenshots
        run: |
          set -euo pipefail
          udid="$(xcrun simctl list devices available --json | python3 -I -c '
          import json, sys
          devices = [d for runtime, ds in json.load(sys.stdin)["devices"].items() if "iOS" in runtime for d in ds]
          for name in ("iPhone 17 Pro", "iPhone 17", "iPhone 16 Pro"):
              match = [d for d in devices if d["name"] == name]
              if match:
                  print(match[-1]["udid"])
                  break
          ')"
          if [ -z "$udid" ]; then
            echo "::error::No iPhone 17 Pro, iPhone 17 or iPhone 16 Pro simulator is installed."
            xcrun simctl list devices available
            exit 1
          fi
          out="$RUNNER_TEMP/world-screenshots"
          mkdir -p "$out"
          set -o pipefail
          TEST_RUNNER_WORLD_SCREENSHOTS_DIR="$out" xcodebuild test \
            -project Pofu.xcodeproj \
            -scheme PofuWorldScreenshots \
            -destination "id=$udid" \
            -resultBundlePath "$RUNNER_TEMP/world-screenshots.xcresult" \
            CODE_SIGNING_ALLOWED=NO \
            SWIFT_TREAT_WARNINGS_AS_ERRORS=YES
          # The PNGs are attached to the result as well; export them if the
          # simulator could not write to the runner's folder.
          if ! ls "$out"/*.png >/dev/null 2>&1; then
            xcrun xcresulttool export attachments \
              --path "$RUNNER_TEMP/world-screenshots.xcresult" \
              --output-path "$out"
          fi
          ls -la "$out"

      - name: Upload the world screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: world-screenshots
          path: ${{ runner.temp }}/world-screenshots
          if-no-files-found: error
