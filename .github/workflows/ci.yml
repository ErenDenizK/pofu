name: CI

on:
  pull_request:
    # `labeled` so adding the `screens` label re-runs CI with screenshots.
    types: [opened, synchronize, reopened, labeled]
  push:
    branches: [main]
  # The player-path frames (a separate macOS job) can also be run by hand.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # macOS minutes bill at 10x. Decide first, on a cheap Linux runner, whether
  # anything that affects the Swift build changed; docs, design, content and
  # Python tooling never need the macOS job.
  changes:
    name: Detect what changed
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      swift: ${{ steps.diff.outputs.swift }}
      tools: ${{ steps.diff.outputs.tools }}
      screens: ${{ steps.diff.outputs.screens }}
      beats: ${{ steps.diff.outputs.beats }}
      pathframes: ${{ steps.diff.outputs.pathframes }}
    steps:
      - name: Check out
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Classify the changed files
        id: diff
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          # Manual override: the `screens` label forces the screenshot jobs.
          LABEL_SCREENS: ${{ github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'screens') }}
          # Motion beats (videos) are opt-in: the `beats` label (founder budget, 2026-11-04).
          LABEL_BEATS: ${{ github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'beats') }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ -z "${BASE:-}" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "No usable base; running everything."
            echo "swift=true" >> "$GITHUB_OUTPUT"
            echo "tools=true" >> "$GITHUB_OUTPUT"
            echo "screens=true" >> "$GITHUB_OUTPUT"
            echo "beats=false" >> "$GITHUB_OUTPUT"
            echo "pathframes=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files="$(git diff --name-only "$BASE...$HEAD")"
          printf '%s\n' "$files"
          # Anything outside these paths can affect the app build.
          swift_files="$(printf '%s\n' "$files" | grep -Ev '^(docs/|design/|tools/|content/|[^/]+\.md$|\.gitignore$|LICENSE)' | grep -v '^$' || true)"
          # Art masters and the bake script feed the asset-harmony check.
          tools_files="$(printf '%s\n' "$files" | grep -E '^(tools|content|design/art|design/prototypes/interactions/tools)/' || true)"
          # Screenshots and motion beats only matter when what they show can
          # change: the app, the world, Pofu, the minigames, Rehearsal, the
          # design system, the screenshot tests and the recording scripts.
          screen_files="$(printf '%s\n' "$files" | grep -E '^(App/|Tests/WorldScreenshots/|project\.yml$|\.github/scripts/|Packages/PofuKit/Sources/(PofuWorld|PofuCompanion|PofuGames|PofuDesignSystem)/|Packages/PofuKit/Sources/PofuCore/Rehearsal/)' || true)"
          screens=false
          if [ -n "$screen_files" ] || [ "$LABEL_SCREENS" = "true" ]; then screens=true; fi
          echo "screens=$screens" >> "$GITHUB_OUTPUT"
          # The player-path frames (21 days, about 11 macOS minutes) render in their own job: on
          # pushes to main, on manual dispatch and on pull requests that carry the `screens` label.
          pathframes=false
          if [ "$screens" = true ] && { [ "$EVENT" != pull_request ] || [ "$LABEL_SCREENS" = true ]; }; then pathframes=true; fi
          echo "pathframes=$pathframes" >> "$GITHUB_OUTPUT"
          echo "beats=$([ "$screens" = true ] && [ "$LABEL_BEATS" = true ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "swift=$([ -n "$swift_files" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "tools=$([ -n "$tools_files" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

  python-tools:
    name: Test the Python tools
    needs: changes
    if: needs.changes.outputs.tools == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r tools/assets/requirements.txt -r tools/plate/requirements.txt -r tools/imagegen/requirements.txt -r tools/content/requirements.txt

      - name: Test the asset tools
        run: python3 -I -m unittest discover -s tools/assets -p "test_*.py"

      - name: Test the plate tools
        run: python3 -I -m unittest discover -s tools/plate -p "test_*.py"

      # docs/state/plates.yaml: painted paths and lead picks exist.
      - name: Check the plate state table
        run: |
          python3 -I -m unittest discover -s tools/state -p "test_*.py"
          python3 -I tools/state/check_plates.py

      # Every caster has a current pre-blurred shadow silhouette
      # (light and shadow v2); `shadows.py run` regenerates them.
      - name: Check the shadow silhouettes
        run: python3 -I tools/assets/shadows.py check

      # No Koke island sprite carries its take's own sky outside the island
      # (tools/assets/koke_matte.py cuts them).
      - name: Check the Koke island cuts
        run: python3 -I tools/assets/koke_sky_check.py

      - name: Test the image pipeline
        run: python3 -I -m pytest -q tools/imagegen/tests

      # The art factory (ADR-0026): closure, sync to pofu-art, ingest of picks.
      - name: Test the art-factory scripts
        run: python3 -I -m unittest discover -s tools/art -p "test_*.py"

      # The studio's own instruments (docs/studio.md): what changed for the player, and where a
      # session's budget went.
      - name: Test the studio tools
        run: python3 -I -m unittest discover -s tools/studio -p "test_*.py"

      # Every master measured against the reference; fails when a master,
      # the config or a correction changed without re-running harmony.py
      # measure (and preblur.py app, which bakes the corrections).
      - name: Check the asset harmony manifest
        run: python3 -I tools/assets/harmony.py check

      # The colour script (design/art/colour-script.json) is valid and its
      # generated Swift is current.
      - name: Check the colour script
        run: python3 -I tools/assets/colour_script.py check

      - name: Test the review sheets
        run: python3 -I -m pytest -q tools/review/tests

      - name: Test Pofu's rig compositor
        run: python3 -I -m pytest -q tools/rig/tests

      - name: Test the changelog collector
        run: python3 -I -m unittest discover -s tools/changelog/tests

      - name: Check relative Markdown links
        run: python3 -I tools/docs/check_links.py

      - name: Validate the content graph (asset nodes)
        run: |
          python3 -I tools/content/validate.py
          python3 -I -m pytest -q tools/content/tests

      # Island continuity, novelty, pacing and tiers (docs/product/design-loop).
      - name: Check the island profiles
        run: python3 -I tools/content/island_metrics.py

  build-and-test:
    name: Test PofuKit and build the app
    needs: changes
    if: needs.changes.outputs.swift == 'true'
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Select Xcode 26 or newer
        run: |
          set -euo pipefail
          current_major="$(xcodebuild -version | awk '/^Xcode/ { split($2, v, "."); print v[1] }')"
          if [ "${current_major:-0}" -lt 26 ]; then
            newest="$(ls -d /Applications/Xcode_2[6-9]*.app 2>/dev/null | sort -V | tail -n 1 || true)"
            if [ -z "$newest" ]; then
              echo "::error::No Xcode 26 or newer is installed on this runner."
              ls -d /Applications/Xcode*.app
              exit 1
            fi
            sudo xcode-select -s "$newest/Contents/Developer"
          fi
          xcodebuild -version
          swift --version

      # PofuKit has no external dependencies (no Package.resolved), so the
      # key covers the manifests; restore-keys reuse the newest build.
      - name: Cache SwiftPM and DerivedData
        uses: actions/cache@v4
        with:
          path: |
            Packages/PofuKit/.build
            ~/Library/Developer/Xcode/DerivedData
          key: xcode-${{ runner.os }}-${{ hashFiles('Packages/PofuKit/Package.swift', 'project.yml') }}-${{ github.sha }}
          restore-keys: |
            xcode-${{ runner.os }}-${{ hashFiles('Packages/PofuKit/Package.swift', 'project.yml') }}-
            xcode-${{ runner.os }}-

      - name: Test PofuKit
        run: swift test --package-path Packages/PofuKit -Xswiftc -warnings-as-errors

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate the Xcode project
        run: xcodegen generate

      - name: Build the app for the iOS Simulator
        run: |
          set -o pipefail
          xcodebuild build \
            -project Pofu.xcodeproj \
            -scheme Pofu \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            SWIFT_TREAT_WARNINGS_AS_ERRORS=YES

      # The Screen Time build: the app with the Family Controls entitlement
      # and its shield and monitor extensions. Unsigned here, so it proves
      # everything compiles; only a paid team can sign and run it.
      - name: Build the live Screen Time app for the iOS Simulator
        run: |
          set -o pipefail
          xcodebuild build \
            -project Pofu.xcodeproj \
            -scheme PofuLive \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            SWIFT_TREAT_WARNINGS_AS_ERRORS=YES

      # The founder reviews screenshots, never web prototypes: render the
      # island scene in the simulator (402 x 874 pt at 3x, the iPhone 17
      # class) and upload the PNGs as the world-screenshots artifact.
      - name: Render the world screenshots
        if: needs.changes.outputs.screens == 'true'
        run: |
          set -euo pipefail
          udid="$(xcrun simctl list devices available --json | python3 -I -c '
          import json, sys
          devices = [d for runtime, ds in json.load(sys.stdin)["devices"].items() if "iOS" in runtime for d in ds]
          for name in ("iPhone 17 Pro", "iPhone 17", "iPhone 16 Pro"):
              match = [d for d in devices if d["name"] == name]
              if match:
                  print(match[-1]["udid"])
                  break
          ')"
          if [ -z "$udid" ]; then
            echo "::error::No iPhone 17 Pro, iPhone 17 or iPhone 16 Pro simulator is installed."
            xcrun simctl list devices available
            exit 1
          fi
          echo "SIM_UDID=$udid" >> "$GITHUB_ENV"
          out="$RUNNER_TEMP/world-screenshots"
          mkdir -p "$out"
          set -o pipefail
          TEST_RUNNER_WORLD_SCREENSHOTS_DIR="$out" xcodebuild test \
            -project Pofu.xcodeproj \
            -scheme PofuWorldScreenshots \
            -destination "id=$udid" \
            -skip-testing:PofuWorldScreenshots/PlayerPathWeek1ScreenshotTests \
            -skip-testing:PofuWorldScreenshots/PlayerPathWeek2ScreenshotTests \
            -skip-testing:PofuWorldScreenshots/PlayerPathWeek3ScreenshotTests \
            -skip-testing:PofuWorldScreenshots/PlayerPathScreensScreenshotTests \
            -resultBundlePath "$RUNNER_TEMP/world-screenshots.xcresult" \
            CODE_SIGNING_ALLOWED=NO \
            SWIFT_TREAT_WARNINGS_AS_ERRORS=YES
          # The PNGs are attached to the result as well; export them if the
          # simulator could not write to the runner's folder.
          if ! ls "$out"/*.png >/dev/null 2>&1; then
            xcrun xcresulttool export attachments \
              --path "$RUNNER_TEMP/world-screenshots.xcresult" \
              --output-path "$out"
          fi
          ls -la "$out"

      - name: Upload the world screenshots
        if: always() && needs.changes.outputs.screens == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: world-screenshots
          path: ${{ runner.temp }}/world-screenshots
          if-no-files-found: error

      # Motion review (docs/research/pro-game-craft.md, upgrade 1): scripted
      # beats played live in the same simulator while the host records the
      # screen, one clip per beat. The test and the recorder hand off
      # through files; see .github/scripts/record-beats.sh.
      - name: Record the motion beats
        if: needs.changes.outputs.beats == 'true'
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/motion-beats"
          mkdir -p "$out"
          .github/scripts/record-beats.sh "$SIM_UDID" "$out" > "$RUNNER_TEMP/recorder.log" 2>&1 &
          recorder=$!
          set +e
          TEST_RUNNER_MOTION_BEATS_DIR="$out" xcodebuild test \
            -project Pofu.xcodeproj \
            -scheme PofuWorldScreenshots \
            -destination "id=$SIM_UDID" \
            -only-testing:PofuWorldScreenshots/MotionBeatTests \
            -resultBundlePath "$RUNNER_TEMP/motion-beats.xcresult" \
            CODE_SIGNING_ALLOWED=NO \
            SWIFT_TREAT_WARNINGS_AS_ERRORS=YES 2>&1 | tail -n 80
          status=${PIPESTATUS[0]}
          touch "$out/all.done"
          for _ in $(seq 1 120); do
            kill -0 "$recorder" 2>/dev/null || break
            sleep 0.5
          done
          kill "$recorder" 2>/dev/null || true
          wait "$recorder" || true
          cat "$RUNNER_TEMP/recorder.log"
          ls -la "$out" "$out/raw"
          exit "$status"

      - name: Upload the motion beats
        if: always() && needs.changes.outputs.beats == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: motion-beats
          path: |
            ${{ runner.temp }}/motion-beats/raw/*.mov
            ${{ runner.temp }}/motion-beats/beats.tsv
          if-no-files-found: error

  # The player-path frames (R10): the tester's 21 days with the paintings on, at device
  # resolution. About 11 macOS minutes, so only where asked: pushes to main, manual dispatch
  # and pull requests with the `screens` label. They publish with the other frames below.
  path-frames:
    name: Render the player-path frames
    needs: changes
    if: needs.changes.outputs.screens == 'true' && needs.changes.outputs.pathframes == 'true'
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Select Xcode 26 or newer
        run: |
          set -euo pipefail
          current_major="$(xcodebuild -version | awk '/^Xcode/ { split($2, v, "."); print v[1] }')"
          if [ "${current_major:-0}" -lt 26 ]; then
            newest="$(ls -d /Applications/Xcode_2[6-9]*.app 2>/dev/null | sort -V | tail -n 1 || true)"
            if [ -z "$newest" ]; then
              echo "::error::No Xcode 26 or newer is installed on this runner."
              exit 1
            fi
            sudo xcode-select -s "$newest/Contents/Developer"
          fi
          xcodebuild -version

      - name: Cache DerivedData
        uses: actions/cache@v4
        with:
          path: |
            Packages/PofuKit/.build
            ~/Library/Developer/Xcode/DerivedData
          key: xcode-path-${{ runner.os }}-${{ hashFiles('Packages/PofuKit/Package.swift', 'project.yml') }}-${{ github.sha }}
          # Only the render job's own caches: the test job's DerivedData
          # (xcode-*) once restored a stale PofuCore module, and the
          # screenshot target failed with "cannot find 'PlayerPath'".
          restore-keys: |
            xcode-path-${{ runner.os }}-${{ hashFiles('Packages/PofuKit/Package.swift', 'project.yml') }}-

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate the Xcode project
        run: xcodegen generate

      - name: Render the player-path frames
        run: |
          set -euo pipefail
          udid="$(xcrun simctl list devices available --json | python3 -I -c '
          import json, sys
          devices = [d for runtime, ds in json.load(sys.stdin)["devices"].items() if "iOS" in runtime for d in ds]
          for name in ("iPhone 17 Pro", "iPhone 17", "iPhone 16 Pro"):
              match = [d for d in devices if d["name"] == name]
              if match:
                  print(match[-1]["udid"])
                  break
          ')"
          if [ -z "$udid" ]; then
            echo "::error::No iPhone 17 Pro, iPhone 17 or iPhone 16 Pro simulator is installed."
            exit 1
          fi
          out="$RUNNER_TEMP/path-frames"
          mkdir -p "$out"
          set -o pipefail
          TEST_RUNNER_WORLD_SCREENSHOTS_DIR="$out" xcodebuild test \
            -project Pofu.xcodeproj \
            -scheme PofuWorldScreenshots \
            -destination "id=$udid" \
            -only-testing:PofuWorldScreenshots/PlayerPathWeek1ScreenshotTests \
            -only-testing:PofuWorldScreenshots/PlayerPathWeek2ScreenshotTests \
            -only-testing:PofuWorldScreenshots/PlayerPathWeek3ScreenshotTests \
            -only-testing:PofuWorldScreenshots/PlayerPathScreensScreenshotTests \
            -resultBundlePath "$RUNNER_TEMP/path-frames.xcresult" \
            CODE_SIGNING_ALLOWED=NO \
            SWIFT_TREAT_WARNINGS_AS_ERRORS=YES
          if ! ls "$out"/*.png >/dev/null 2>&1; then
            xcrun xcresulttool export attachments \
              --path "$RUNNER_TEMP/path-frames.xcresult" \
              --output-path "$out"
          fi
          ls -la "$out"

      - name: Upload the player-path frames
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: path-frames
          path: ${{ runner.temp }}/path-frames
          if-no-files-found: error

  # The artifact host is not reachable from every review environment, so
  # the screenshots are also published where git can fetch them: a
  # single-commit orphan branch, screenshots/<head branch with / as ->,
  # force-pushed on every green run. See docs/development.md.
  publish-screenshots:
    name: Publish the world screenshots to a branch
    needs: [changes, build-and-test, path-frames]
    if: >-
      !cancelled() &&
      needs.build-and-test.result == 'success' &&
      (needs.path-frames.result != 'cancelled') &&
      needs.changes.outputs.screens == 'true' &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out
        uses: actions/checkout@v5
        with:
          path: repo

      - name: Download the world screenshots
        uses: actions/download-artifact@v4
        with:
          name: world-screenshots
          path: shots

      - name: Download the player-path frames
        if: needs.path-frames.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: path-frames
          path: shots

      - name: Download the motion beats
        if: needs.changes.outputs.beats == 'true'
        uses: actions/download-artifact@v4
        with:
          name: motion-beats
          path: beats-raw

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Convert to JPEG and draw a contact sheet
        run: |
          set -euo pipefail
          pip install --quiet "Pillow>=10.1" "numpy>=1.26"
          mkdir -p out
          python3 -I - shots out <<'PY'
          import pathlib, shutil, sys
          from PIL import Image, ImageDraw
          src, out = map(pathlib.Path, sys.argv[1:3])
          pngs = sorted(src.glob("*.png"))
          if not pngs:
              sys.exit("no screenshots in the artifact")
          thumbs = []
          for png in pngs:
              # Full device resolution, kept as written (the Home plate resolution A/B, the painted
              # sky's stops, whose island edge against the sky is judged at 1:1, and the painted Map and flight).
              if png.stem.startswith(("home-plate-full-", "caglayan-plate-full-", "koke-sky-", "harbor-sky-", "map-plate-", "flight-", "path-")):
                  shutil.copy(png, out / png.name)
                  continue
              im = Image.open(png).convert("RGB")
              # The look grids and the camera strip hold many phones; keep them readable.
              h = {"look-compare": 1800, "look-grades": 2000, "look-script": 1800, "look-motion": 1100, "look-pan": 1100, "look-teapot": 900, "look-plates": 1800, "home-growth-il1-il10": 1864}.get(png.stem, 1000)
              w = round(im.width * h / im.height)
              im.resize((w, h), Image.LANCZOS).save(out / (png.stem + ".jpg"), "JPEG", quality=85, optimize=True)
              if png.stem.startswith("look-"):
                  continue
              thumbs.append((png.stem, im.resize((round(im.width * 600 / im.height), 600), Image.LANCZOS)))
          # One row per appearance (light, then dark), one column per state.
          rows = [[t for t in thumbs if t[0].endswith(s)] for s in ("-light", "-dark")]
          rows = [r for r in rows if r] or [thumbs]
          cols = max(len(r) for r in rows)
          tw, th, pad, label = thumbs[0][1].width, 600, 16, 28
          sheet = Image.new("RGB", (pad + cols * (tw + pad), pad + len(rows) * (th + label + pad)), (240, 240, 240))
          draw = ImageDraw.Draw(sheet)
          for r, row in enumerate(rows):
              for c, (name, im) in enumerate(row):
                  x, y = pad + c * (tw + pad), pad + r * (th + label + pad)
                  draw.text((x, y + 6), name, fill=(40, 40, 40))
                  sheet.paste(im, (x, y + label))
          sheet.save(out / "contact.jpg", "JPEG", quality=85, optimize=True)
          PY
          cp shots/*.txt shots/*.json out/ 2>/dev/null || true
          # The player-path week sheets (R10): days 1 to 7, 8 to 14 and 15 to 21 as the tester meets them,
          # one montage each (tools/review/sheet.py), published beside the 1206x2622 frames.
          for week in 1 2 3; do
            first=$(( (week - 1) * 7 + 1 ))
            files=()
            for day in $(seq "$first" $(( first + 6 ))); do
              for f in $(printf 'shots/path-d%02d-*.png' "$day"); do
                [ -e "$f" ] && files+=("$f")
              done
            done
            if [ "${#files[@]}" -gt 0 ]; then
              python3 -I repo/tools/review/sheet.py montage "${files[@]}" --cols 6 --max 4000 -o "out/path-week${week}.jpg"
            fi
          done
          # The asset-harmony contact sheet: every master before and after its correction.
          python3 -I repo/tools/assets/harmony.py measure --dry-run --sheet out/harmony.jpg > out/harmony.txt
          # Measured numbers for every grade frame (tools/assets/frame_metrics.py).
          python3 -I repo/tools/assets/frame_metrics.py shots > out/grade-metrics.txt || true
          cat out/grade-metrics.txt
          # The concept match sheet: each home light state beside its concept,
          # with main's frames as "before" (docs/research/concept-match.md).
          mkdir -p main-shots
          if git -C repo fetch -q --depth 1 origin screenshots/main; then
            git -C repo archive FETCH_HEAD | tar -x -C main-shots
          fi
          python3 -I repo/tools/assets/concept_match.py shots out/concept-match.jpg --before main-shots > out/concept-match.txt || true
          # The plate-first home beside its concept (ADR-0022).
          python3 -I repo/tools/plate/home_sheet.py shots out/home-plate.jpg --before main-shots || true
          # The colour script's swatches.
          python3 -I repo/tools/assets/colour_script.py swatches out/colour-script.png
          # Framing before and after: round 2's published frames beside these.
          mkdir -p before
          if git -C repo fetch -q --depth 1 origin screenshots/feat-look-round-2; then
            git -C repo archive FETCH_HEAD | tar -x -C before
            python3 -I repo/tools/assets/framing_sheet.py before shots out/look-framing.jpg
          fi
          ls -la out

      - name: Check out the encoding script
        uses: actions/checkout@v5
        with:
          path: src
          sparse-checkout: .github/scripts

      - name: Encode the motion beats and write the index
        if: needs.changes.outputs.beats == 'true'
        env:
          SOURCE_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          set -euo pipefail
          command -v ffmpeg >/dev/null || { sudo apt-get update -q && sudo apt-get install -y -q ffmpeg; }
          python3 -I src/.github/scripts/encode-beats.py beats-raw out "$GITHUB_REPOSITORY" "screenshots/${SOURCE_BRANCH//\//-}"
          ls -la out/beats

      - name: Force-push the screenshots branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_BRANCH: ${{ github.head_ref || github.ref_name }}
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          branch="screenshots/${SOURCE_BRANCH//\//-}"
          cd out
          git init -q
          git checkout -q --orphan "$branch"
