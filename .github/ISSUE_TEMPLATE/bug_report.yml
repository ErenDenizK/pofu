name: Bug report
description: Report something that does not work as intended.
labels: ["type: bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: What happened?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open ...
        2. Tap ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Device and iOS version
      placeholder: iPhone 17, iOS 26.1
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App version and build
  - type: textarea
    id: media
    attributes:
      label: Screenshots or screen recordings
