<title>Pofu Hub</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Pofu için sakin bir panel: sorular, ada puanları, şu an yapılanlar ve yol haritası.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap">
<style>
/* Pofu Hub: one calm column. Questions first (tick one option), then what is happening now, then the
   roadmap. Data lives in the artifact db: questions/{id}, answers/{qid}, notes/{auto}, status/now, roadmap/main.
   Tokens follow design/tokens/pofu-tokens.json. */
:root {
  --bg: #FFF6EC; --sunken: #FBEBDD; --card: #FFFBF5; --raised: #FFFFFF;
  --fg: #2A1F2D; --fg2: #66555F; --fg3: #7C6B76;
  --line: rgba(42, 31, 45, .12); --line2: rgba(42, 31, 45, .24);
  --accent: #6C4FD8; --accent-tint: #EEE8FF; --on-accent: #FFFFFF;
  --ok: #2F7349; --ok-tint: #DDF1E3;
  --warn: #8A5A00; --warn-tint: #FCEBC8;
  --crit: #B23A5A;
  --muted-tint: #EFE6EC;
  --shadow: 0 1px 2px rgba(42, 31, 45, .06), 0 4px 14px rgba(42, 31, 45, .05);
  --font: "Nunito", ui-rounded, "SF Pro Rounded", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #15111C; --sunken: #1E1828; --card: #1E1828; --raised: #2A2236;
    --fg: #FFF6EC; --fg2: #B8A8B1; --fg3: #9A8A9F;
    --line: rgba(255, 246, 236, .12); --line2: rgba(255, 246, 236, .24);
    --accent: #B9A2FF; --accent-tint: #2E2547; --on-accent: #15111C;
    --ok: #8FD4A4; --ok-tint: #1D3326; --warn: #F7C873; --warn-tint: #3A2E14;
    --crit: #FF9EB5; --muted-tint: #2A2236;
    --shadow: 0 1px 2px rgba(0, 0, 0, .35), 0 6px 18px rgba(0, 0, 0, .25);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #15111C; --sunken: #1E1828; --card: #1E1828; --raised: #2A2236;
  --fg: #FFF6EC; --fg2: #B8A8B1; --fg3: #9A8A9F;
  --line: rgba(255, 246, 236, .12); --line2: rgba(255, 246, 236, .24);
  --accent: #B9A2FF; --accent-tint: #2E2547; --on-accent: #15111C;
  --ok: #8FD4A4; --ok-tint: #1D3326; --warn: #F7C873; --warn-tint: #3A2E14;
  --crit: #FF9EB5; --muted-tint: #2A2236;
  --shadow: 0 1px 2px rgba(0, 0, 0, .35), 0 6px 18px rgba(0, 0, 0, .25);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--fg);
  font: 16px/1.45 var(--font); -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent;
  overflow-x: hidden;
}
button, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2.5px solid var(--accent); outline-offset: 2px; }
[hidden] { display: none !important; }

.wrap {
  max-width: 720px; margin: 0 auto; padding-block: 18px 56px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
header.top { display: flex; align-items: center; gap: 10px; margin-bottom: 4px; }
.seed { width: 32px; height: 32px; border-radius: 50%; background: var(--accent); color: var(--on-accent); display: grid; place-items: center; flex: none; }
.seed svg { width: 17px; height: 17px; }
header.top h1 { margin: 0; font-size: 22px; font-weight: 900; letter-spacing: -.01em; }

.banner { margin: 12px 0 0; padding: 12px 14px; border-radius: 14px; font-size: 15px; font-weight: 600; background: var(--warn-tint); }

section { margin-top: 30px; }
.sec-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin: 0 2px 6px; }
.sec-head h2 { margin: 0; font-size: 26px; font-weight: 900; letter-spacing: -.01em; }
.sec-head .meta { color: var(--fg3); font-size: 13.5px; font-weight: 700; text-align: right; }
.quiet { margin: 0 2px 14px; color: var(--fg2); font-size: 15px; font-weight: 600; }
.loading { padding: 22px 0; text-align: center; color: var(--fg3); font-weight: 700; }
.empty { padding: 16px; border-radius: 16px; border: 1.5px dashed var(--line2); color: var(--fg2); font-weight: 600; text-align: center; }

/* question card */
.card { background: var(--card); border: 1px solid var(--line); border-radius: 20px; box-shadow: var(--shadow); padding: 16px; margin: 0 0 14px; }
.card h3 { margin: 0 0 6px; font-size: 19px; line-height: 1.3; font-weight: 900; text-wrap: balance; }
.card .ctx { margin: 0 0 12px; color: var(--fg2); font-size: 15px; }
.options { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 200px), 1fr)); gap: 10px; margin: 0 0 12px; padding: 0; border: 0; min-width: 0; }
.opt {
  display: flex; flex-direction: column; gap: 8px; text-align: left; width: 100%; min-width: 0;
  padding: 12px; border-radius: 16px; border: 1.5px solid var(--line2); background: var(--raised);
}
.opt[aria-checked="true"] { border-color: var(--accent); background: var(--accent-tint); box-shadow: 0 0 0 1px var(--accent) inset; }
.opt .top { display: flex; align-items: flex-start; gap: 8px; }
.opt .radio { width: 22px; height: 22px; margin-top: 1px; border-radius: 50%; border: 2px solid var(--line2); display: grid; place-items: center; flex: none; }
.opt[aria-checked="true"] .radio { border-color: var(--accent); background: var(--accent); color: var(--on-accent); }
.opt .radio svg { width: 13px; height: 13px; opacity: 0; }
.opt[aria-checked="true"] .radio svg { opacity: 1; }
.opt .lbl { font-weight: 800; font-size: 16px; line-height: 1.3; min-width: 0; overflow-wrap: anywhere; }
.opt .rec { align-self: flex-start; font-size: 12px; font-weight: 800; color: var(--accent); background: var(--accent-tint); border: 1px solid var(--accent); border-radius: 10px; padding: 0 8px; line-height: 20px; }
.opt[aria-checked="true"] .rec { background: var(--raised); }
.facts { display: grid; gap: 4px; margin: 0; font-size: 14px; color: var(--fg2); }
.facts > div { display: grid; grid-template-columns: 34px 1fr; gap: 6px; min-width: 0; overflow-wrap: anywhere; }
.facts dt { font-weight: 900; font-size: 12.5px; letter-spacing: .02em; padding-top: 1px; }
.facts dd { margin: 0; }
.facts .pro dt { color: var(--ok); }
.facts .con dt { color: var(--crit); }
.facts .cost dt { color: var(--warn); }
.recbox { padding: 11px 14px; border-radius: 14px; background: var(--sunken); font-size: 15px; color: var(--fg2); }
.recbox b { color: var(--fg); font-weight: 800; }

/* optional note, kept quiet */
details.note { margin-top: 8px; }
details.note summary { list-style: none; display: inline-flex; align-items: center; min-height: 44px; padding: 0 2px; color: var(--fg3); font-size: 14px; font-weight: 700; cursor: pointer; }
details.note summary::-webkit-details-marker { display: none; }
details.note summary::before { content: "+"; margin-right: 6px; font-weight: 900; }
details.note[open] summary::before { content: "–"; }
.note-body textarea { display: block; width: 100%; min-height: 84px; resize: vertical; padding: 11px 13px; border-radius: 14px; border: 1.5px solid var(--line2); background: var(--raised); font-size: 17px; line-height: 1.4; }
.note-body textarea:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-tint); }
.note-foot { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: 6px; }
.note-foot .hint { color: var(--fg3); font-size: 13px; font-weight: 600; }
.btn { min-height: 44px; padding: 0 18px; border-radius: 22px; border: 0; background: var(--accent); color: var(--on-accent); font-weight: 800; font-size: 15.5px; white-space: nowrap; }
.btn:disabled { opacity: .45; cursor: default; }
.btn.ghost { background: transparent; color: var(--accent); border: 1.5px solid var(--line2); min-height: 40px; padding: 0 14px; font-size: 14.5px; }

/* answered */
details.done { margin-top: 18px; background: var(--card); border: 1px solid var(--line); border-radius: 18px; }
details.done summary { list-style: none; display: flex; align-items: center; justify-content: space-between; min-height: 48px; padding: 0 16px; font-weight: 800; color: var(--fg2); cursor: pointer; }
details.done summary::-webkit-details-marker { display: none; }
details.done summary .n { color: var(--fg3); font-weight: 700; }
.done-row { display: flex; align-items: center; gap: 10px; padding: 10px 16px; border-top: 1px solid var(--line); }
.done-row .txt { flex: 1; min-width: 0; }
.done-row .t { font-weight: 800; font-size: 15px; overflow-wrap: anywhere; }
.done-row .c { color: var(--ok); font-size: 14px; font-weight: 700; overflow-wrap: anywhere; }

/* status + roadmap */
.list { background: var(--card); border: 1px solid var(--line); border-radius: 20px; box-shadow: var(--shadow); overflow: hidden; }
.item { display: flex; align-items: flex-start; gap: 12px; padding: 13px 16px; border-top: 1px solid var(--line); }
.item:first-child { border-top: 0; }
.item .txt { flex: 1; min-width: 0; font-weight: 700; overflow-wrap: anywhere; }
.pill { flex: none; display: inline-flex; align-items: center; height: 24px; padding: 0 10px; border-radius: 12px; font-size: 12.5px; font-weight: 800; margin-top: 1px; }
.pill.doing { background: var(--accent-tint); color: var(--accent); }
.pill.next { background: var(--muted-tint); color: var(--fg2); }
.pill.blocked { background: var(--warn-tint); color: var(--warn); }

.phase { margin: 0 0 14px; }
.phase h3 { margin: 0 2px 8px; font-size: 17px; font-weight: 900; display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
.phase h3 .n { color: var(--fg3); font-size: 13.5px; font-weight: 700; white-space: nowrap; }
.check { width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--line2); flex: none; display: grid; place-items: center; margin-top: 1px; }
.check svg { width: 13px; height: 13px; opacity: 0; }
.item.done .check { background: var(--ok); border-color: var(--ok); color: var(--bg); }
.item.done .check svg { opacity: 1; }
.item.done .txt { color: var(--fg3); font-weight: 600; }

/* islands: one compact row per island, a 1-10 tap scale, a collapsed note */
.isl { background: var(--card); border: 1px solid var(--line); border-radius: 18px; box-shadow: var(--shadow); padding: 14px; margin: 0 0 10px; }
.isl-head { display: flex; align-items: flex-start; gap: 12px; }
.isl-thumb { width: 48px; height: 48px; border-radius: 12px; object-fit: cover; flex: none; background: var(--sunken); }
.isl-main { flex: 1; min-width: 0; }
.isl-name { margin: 0; font-size: 18px; line-height: 1.25; font-weight: 900; overflow-wrap: anywhere; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 5px; }
.chip { display: inline-flex; align-items: center; height: 22px; padding: 0 9px; border-radius: 11px; font-size: 12.5px; font-weight: 800; background: var(--muted-tint); color: var(--fg2); }
.chip.size { background: var(--accent-tint); color: var(--accent); }
.isl-sum { margin: 8px 0 0; color: var(--fg2); font-size: 15px; overflow-wrap: anywhere; }
.scale { display: grid; grid-template-columns: repeat(10, minmax(0, 1fr)); gap: 4px; margin: 12px 0 0; padding: 0; border: 0; min-width: 0; }
.dot { min-width: 0; min-height: 44px; padding: 0; border-radius: 12px; border: 1.5px solid var(--line2); background: var(--raised); font-weight: 800; font-size: 13.5px; font-variant-numeric: tabular-nums; color: var(--fg2); }
.dot[aria-checked="true"] { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.dot.prev { border-style: dashed; border-color: var(--accent); color: var(--accent); }
.dot:disabled { cursor: default; opacity: .6; }
.isl-last { margin: 8px 0 0; color: var(--fg3); font-size: 13.5px; font-weight: 700; }
.isl-last b { color: var(--fg2); font-weight: 900; }

.toast { position: fixed; z-index: 50; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translate(-50%, 12px); background: var(--fg); color: var(--bg); padding: 10px 16px; border-radius: 20px; font-weight: 800; font-size: 15px; opacity: 0; transition: opacity .2s, transform .2s; pointer-events: none; max-width: calc(100% - 32px); }
.toast.on { opacity: 1; transform: translate(-50%, 0); }
@media (prefers-reduced-motion: reduce) { .toast { transition: none; } }
</style>

<div class="wrap" lang="tr">
  <header class="top">
    <span class="seed" aria-hidden="true"><svg viewBox="0 0 20 20" fill="currentColor"><path d="M10 2c3.6 2.4 5.6 5.4 5.6 8.6A5.6 5.6 0 0 1 4.4 10.6C4.4 7.4 6.4 4.4 10 2z"/></svg></span>
    <h1>Pofu Hub</h1>
  </header>
  <div id="banner" class="banner" role="status" hidden></div>

  <section id="sec-q" aria-labelledby="h-q">
    <div class="sec-head"><h2 id="h-q">Sorular</h2><span class="meta" id="q-meta"></span></div>
    <p class="quiet">Cevaplamazsan önerimle devam ederim.</p>
    <div id="q-list"><div class="loading">Yükleniyor…</div></div>
    <details class="done" id="done-box" hidden>
      <summary><span>Cevaplananlar</span><span class="n" id="done-n"></span></summary>
      <div id="done-list"></div>
    </details>
  </section>

  <section id="sec-isl" aria-labelledby="h-isl">
    <div class="sec-head"><h2 id="h-isl">Adalar</h2><span class="meta" id="isl-meta"></span></div>
    <p class="quiet">Puan vermek isteğe bağlı.</p>
    <div id="isl-list"><div class="loading">Yükleniyor…</div></div>
  </section>

  <section id="sec-now" aria-labelledby="h-now">
    <div class="sec-head"><h2 id="h-now">Şu an</h2><span class="meta" id="now-meta"></span></div>
    <div class="list" id="now-list"><div class="loading">Yükleniyor…</div></div>
  </section>

  <section id="sec-rm" aria-labelledby="h-rm">
    <div class="sec-head"><h2 id="h-rm">Yol haritası</h2></div>
    <div id="rm-list"><div class="loading">Yükleniyor…</div></div>
  </section>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(() => {
  'use strict';
  const $ = (s, r = document) => r.querySelector(s);
  const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
  const CHECK = '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.5 8.5l3 3 6-7"/></svg>';
  const withIcon = (host) => { host.insertAdjacentHTML('beforeend', CHECK); return host; };
  const nowIso = () => new Date().toISOString();
  const toMs = (v) => { if (v == null) return 0; if (typeof v === 'number') return v; const n = Date.parse(v); return Number.isNaN(n) ? 0 : n; };
  const str = (v) => (v == null ? '' : String(v));
  const fmt = new Intl.DateTimeFormat('tr-TR', { day: 'numeric', month: 'long' });

  const state = { db: null, userId: null, canWrite: false, mode: 'loading', stale: false, questions: null, answers: null, now: undefined, roadmap: undefined, islands: null, scores: null, reopen: new Set(), drafts: new Map(), islDrafts: new Map() };

  let toastTimer = 0;
  function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('on'), 1800); }

  function renderBanner() {
    const b = $('#banner'); let msg = '';
    if (state.mode === 'offline') msg = 'Bu sayfa Claude içinde açılınca canlı çalışır. Şu an veri yok.';
    else if (state.mode === 'readonly') msg = 'Salt okunur görünüm. Seçim yapmak için sayfayı sahibi olarak aç.';
    else if (state.stale) msg = 'Verilere şu an ulaşılamıyor. Gösterilenler eski olabilir.';
    b.hidden = !msg; b.textContent = msg;
  }

  // ---------------------------------------------------------------- writes
  const queues = new Map();
  function queueWrite(key, fn) {
    const prev = queues.get(key) || Promise.resolve();
    const next = prev.catch(() => {}).then(fn);
    queues.set(key, next); return next;
  }
  async function withRetry(fn) {
    try { return await fn(); } catch (e) {
      if (e && e.code === 'unavailable') { await new Promise((r) => setTimeout(r, 500)); return fn(); }
      throw e;
    }
  }
  function writeFailed(e) {
    const c = e && e.code;
    if (c === 'invalid_argument' || c === 'not_granted' || c === 'revoked' || c === 'capability_disabled') { state.canWrite = false; state.mode = 'readonly'; renderBanner(); renderQuestions(); renderIslands(); return 'Bu görünümde yazma izni yok.'; }
    return 'Kaydedilemedi. Tekrar dene.';
  }

  async function choose(qid, key) {
    if (!state.canWrite || !state.db) return;
    const prev = state.answers && state.answers.get(qid);
    if (prev && prev.choice === key) return;
    state.reopen.delete(qid);
    state.answers = new Map(state.answers || []);
    state.answers.set(qid, { choice: key, updatedAt: nowIso(), authorId: state.userId });
    renderQuestions();
    try {
      await queueWrite('answers/' + qid, () => withRetry(() => state.db.doc('answers/' + qid).set({ choice: key, updatedAt: nowIso(), authorId: state.userId })));
      toast('Kaydedildi');
    } catch (e) {
      if (prev) state.answers.set(qid, prev); else state.answers.delete(qid);
      renderQuestions(); toast(writeFailed(e));
    }
  }

  async function sendNote(qid, text, btn, area) {
    btn.disabled = true;
    try {
      const body = { targetType: 'question', targetId: qid, text, createdAt: nowIso() };
      if (state.userId) body.authorId = state.userId;
      await withRetry(() => state.db.collection('notes').add(body));
      state.drafts.delete(qid); area.value = ''; toast('Not eklendi');
    } catch (e) { toast(writeFailed(e)); }
    btn.disabled = !area.value.trim();
  }

  // ---------------------------------------------------------------- render: questions
  const isAnswered = (q) => q.status === 'answered' || (q.status === 'open' && state.answers && state.answers.has(q.id));
  const bySort = (a, b) => (Number(a.priority) || 99) - (Number(b.priority) || 99) || toMs(a.createdAt) - toMs(b.createdAt);

  function factRow(cls, label, value) {
    const v = str(value).trim();
    if (!v || v === '—') return null;
    const row = el('div', cls); row.append(el('dt', null, label), el('dd', null, v)); return row;
  }

  function optionButton(q, o, chosen, rec) {
    const b = el('button', 'opt'); b.type = 'button'; b.setAttribute('role', 'radio');
    b.setAttribute('aria-checked', String(chosen === o.key)); b.disabled = !state.canWrite;
    const top = el('div', 'top');
    top.append(withIcon(el('span', 'radio')), el('span', 'lbl', str(o.label)));
    b.append(top);
    if (rec) b.append(el('span', 'rec', 'Önerim'));
    const facts = el('dl', 'facts');
    for (const r of [factRow('pro', '+', o.pros), factRow('con', '−', o.cons), factRow('cost', '₺', o.cost)]) if (r) facts.append(r);
    if (facts.children.length) b.append(facts);
    b.addEventListener('click', () => choose(q.id, o.key));
    return b;
  }

  function questionCard(q) {
    const card = el('article', 'card'); card.dataset.qid = q.id;
    const h = el('h3', null, str(q.title)); card.append(h);
    if (q.context) card.append(el('p', 'ctx', str(q.context)));
    const chosen = state.answers && state.answers.get(q.id) ? state.answers.get(q.id).choice : null;
    const recKey = q.recommendation && q.recommendation.key;
    const g = el('div', 'options'); g.setAttribute('role', 'radiogroup'); g.setAttribute('aria-label', str(q.title));
    for (const o of (Array.isArray(q.options) ? q.options : [])) g.append(optionButton(q, o, chosen, o.key === recKey));
    card.append(g);
    if (q.recommendation && q.recommendation.reason) {
      const rb = el('div', 'recbox'); rb.append(el('b', null, 'Önerim: '), document.createTextNode(str(q.recommendation.reason))); card.append(rb);
    }
    if (state.canWrite) card.append(noteBox(q));
    return card;
  }

  function noteBox(q) {
    const d = el('details', 'note'); d.append(el('summary', null, 'Not ekle'));
    const body = el('div', 'note-body');
    const area = el('textarea'); area.id = 'note-' + q.id; area.rows = 3; area.setAttribute('aria-label', 'Not'); area.value = state.drafts.get(q.id) || '';
    const foot = el('div', 'note-foot'); foot.append(el('span', 'hint', 'İstersen yaz, istersen boş bırak.'));
    const send = el('button', 'btn', 'Ekle'); send.type = 'button'; send.disabled = !area.value.trim();
    area.addEventListener('input', () => { state.drafts.set(q.id, area.value); send.disabled = !area.value.trim(); });
    send.addEventListener('click', () => sendNote(q.id, area.value.trim(), send, area));
    foot.append(send); body.append(area, foot); d.append(body);
    if (area.value) d.open = true;
    d.addEventListener('toggle', () => { if (d.open) d.dataset.open = '1'; else delete d.dataset.open; });
    return d;
  }

  function renderQuestions() {
    const list = $('#q-list');
    if (state.questions == null || state.answers == null) return;
    // keep open note drawers and focus across re-renders
    const openNotes = new Set([...list.querySelectorAll('details.note[open]')].map((d) => d.closest('[data-qid]').dataset.qid));
    const active = document.activeElement && document.activeElement.id && list.contains(document.activeElement) ? document.activeElement.id : null;
    const all = state.questions.filter((q) => q.status === 'open' || q.status === 'answered').sort(bySort);
    const todo = all.filter((q) => !isAnswered(q) || state.reopen.has(q.id));
    const done = all.filter((q) => isAnswered(q) && !state.reopen.has(q.id));
    list.replaceChildren();
    if (!todo.length) list.append(el('div', 'empty', all.length ? 'Şu an cevap bekleyen soru yok.' : 'Şu an soru yok. Yeni bir soru olursa burada görünür.'));
    for (const q of todo) list.append(questionCard(q));
    for (const q of todo) if (openNotes.has(q.id)) { const d = list.querySelector('[data-qid="' + CSS.escape(q.id) + '"] details.note'); if (d) d.open = true; }
    if (active) { const a = document.getElementById(active); if (a) a.focus(); }
    $('#q-meta').textContent = todo.length ? todo.length + ' açık' : '';

    const box = $('#done-box'), dl = $('#done-list');
    box.hidden = !done.length; $('#done-n').textContent = done.length || '';
    dl.replaceChildren();
    for (const q of done) {
      const a = state.answers.get(q.id);
      const opt = a && (q.options || []).find((o) => o.key === a.choice);
      const row = el('div', 'done-row'); const txt = el('div', 'txt');
      txt.append(el('div', 't', str(q.title)));
      if (opt) txt.append(el('div', 'c', 'Seçimin: ' + str(opt.label)));
      row.append(txt);
      if (state.canWrite && a) { const b = el('button', 'btn ghost', 'Değiştir'); b.type = 'button'; b.addEventListener('click', () => { state.reopen.add(q.id); renderQuestions(); const c = list.querySelector('[data-qid="' + CSS.escape(q.id) + '"]'); if (c) c.scrollIntoView({ block: 'center' }); }); row.append(b); }
      dl.append(row);
    }
  }

  // ---------------------------------------------------------------- islands
  // islands/{id}: name, cluster, size, round, summary, imageUrl?, order?
  // islandScores/{islandId}__r{round}: islandId, round, score (1-10), note, authorId, updatedAt
  const scoreKey = (id, round) => id + '__r' + round;
  const latestScore = (id) => {
    let best = null;
    for (const d of (state.scores ? state.scores.values() : [])) if (d.islandId === id && Number.isFinite(Number(d.score)) && (!best || Number(d.round) > Number(best.round))) best = d;
    return best;
  };

  async function saveScore(isl, score, note) {
    if (!state.canWrite || !state.db) return false;
    const round = Number(isl.round) || 1; const key = scoreKey(isl.id, round);
    const prev = state.scores.get(key);
    const body = { islandId: isl.id, round, score, note: note == null ? str(prev && prev.note) : note, authorId: state.userId || null, updatedAt: nowIso() };
    state.scores = new Map(state.scores); state.scores.set(key, Object.assign({ id: key }, body));
    renderIslands();
    try {
      await queueWrite('islandScores/' + key, () => withRetry(() => state.db.doc('islandScores/' + key).set(body)));
      toast('Kaydedildi'); return true;
    } catch (e) {
      state.scores = new Map(state.scores);
      if (prev) state.scores.set(key, prev); else state.scores.delete(key);
      renderIslands(); toast(writeFailed(e)); return false;
    }
  }

  function islandRow(isl) {
    const round = Number(isl.round) || 1;
    const cur = state.scores.get(scoreKey(isl.id, round));
    const last = latestScore(isl.id);
    const curScore = cur ? Number(cur.score) : null;
    const prevScore = !cur && last ? Number(last.score) : null;
    const card = el('article', 'isl'); card.dataset.iid = isl.id;
    const head = el('div', 'isl-head');
    const img = str(isl.imageUrl);
    if (img.startsWith('data:image/') || img.startsWith('/_blob/')) { const im = el('img', 'isl-thumb'); im.src = img; im.alt = ''; im.loading = 'lazy'; head.append(im); }
    const main = el('div', 'isl-main');
    main.append(el('h3', 'isl-name', str(isl.name) || isl.id));
    const chips = el('div', 'chips');
    for (const [c, v] of [['', isl.cluster], ['size', isl.size], ['', 'tur ' + round]]) if (str(v).trim()) chips.append(el('span', 'chip ' + c, str(v)));
    main.append(chips); head.append(main); card.append(head);
    if (isl.summary) card.append(el('p', 'isl-sum', str(isl.summary)));

    const g = el('div', 'scale'); g.setAttribute('role', 'radiogroup'); g.setAttribute('aria-label', str(isl.name) + ' puanı');
    for (let n = 1; n <= 10; n++) {
      const b = el('button', 'dot' + (prevScore === n ? ' prev' : ''), String(n)); b.type = 'button'; b.setAttribute('role', 'radio');
      b.setAttribute('aria-checked', String(curScore === n)); b.setAttribute('aria-label', n + ' puan'); b.disabled = !state.canWrite;
      b.addEventListener('click', () => { if (curScore !== n) saveScore(isl, n, state.islDrafts.has(isl.id) ? state.islDrafts.get(isl.id) : undefined); });
      g.append(b);
    }
    card.append(g);
    if (cur) card.append(el('p', 'isl-last', 'Puanın: ' + curScore));
    else if (last) { const p = el('p', 'isl-last'); p.append(document.createTextNode('Son puan: '), el('b', null, String(last.score)), document.createTextNode(' (tur ' + str(last.round) + ')')); card.append(p); }

    if (state.canWrite) {
      const d = el('details', 'note'); d.append(el('summary', null, (cur && cur.note) ? 'Notu düzenle' : 'Not ekle'));
      const body = el('div', 'note-body');
      const area = el('textarea'); area.id = 'inote-' + isl.id; area.rows = 3; area.setAttribute('aria-label', str(isl.name) + ' notu');
      area.value = state.islDrafts.has(isl.id) ? state.islDrafts.get(isl.id) : str(cur && cur.note);
      const foot = el('div', 'note-foot'); const hint = el('span', 'hint', cur ? 'Kısa bir not yeter.' : 'Not, puanla birlikte kaydedilir. Önce bir puan seç.');
      const save = el('button', 'btn', 'Kaydet'); save.type = 'button';
      const dirty = () => area.value.trim() !== str(cur && cur.note).trim();
      save.disabled = !cur || !dirty();
      area.addEventListener('input', () => { state.islDrafts.set(isl.id, area.value); save.disabled = !cur || !dirty(); });
      save.addEventListener('click', async () => { save.disabled = true; if (await saveScore(isl, curScore, area.value.trim())) state.islDrafts.delete(isl.id); });
      foot.append(hint, save); body.append(area, foot); d.append(body);
      if (state.islDrafts.has(isl.id)) d.open = true;
      card.append(d);
    }
    return card;
  }

  function renderIslands() {
    const list = $('#isl-list');
    if (state.islands == null || state.scores == null) return;
    const openNotes = new Set([...list.querySelectorAll('details.note[open]')].map((d) => d.closest('[data-iid]').dataset.iid));
    const ae = document.activeElement; const active = ae && ae.id && list.contains(ae) ? ae.id : null;
    const caret = active && ae.selectionStart != null ? ae.selectionStart : null;
    const items = state.islands.filter((i) => i && i.name).sort((a, b) => (Number(a.order) || 999) - (Number(b.order) || 999) || str(a.name).localeCompare(str(b.name), 'tr'));
    list.replaceChildren();
    if (!items.length) list.append(el('div', 'empty', 'Henüz ada yok. Adalar eklenince burada görünür.'));
    for (const isl of items) list.append(islandRow(isl));
    for (const iid of openNotes) { const d = list.querySelector('[data-iid="' + CSS.escape(iid) + '"] details.note'); if (d) d.open = true; }
    if (active) { const a = document.getElementById(active); if (a) { a.focus(); if (caret != null && a.setSelectionRange) a.setSelectionRange(caret, caret); } }
    const scored = items.filter((i) => latestScore(i.id)).length;
    $('#isl-meta').textContent = items.length ? scored + '/' + items.length + ' puanlandı' : '';
  }

  // ---------------------------------------------------------------- render: now + roadmap
  const STATE_LABEL = { doing: 'Yapılıyor', next: 'Sırada', blocked: 'Takıldı' };
  const STATE_ORDER = { doing: 0, blocked: 1, next: 2 };
  function renderNow() {
    const list = $('#now-list');
    if (state.now === undefined) return;
    list.replaceChildren();
    const items = state.now && Array.isArray(state.now.items) ? state.now.items.filter((i) => i && i.text) : [];
    if (!items.length) { list.append(el('div', 'empty', 'Şu an listelenen bir iş yok.')); $('#now-meta').textContent = ''; return; }
    items.map((it, i) => [it, i]).sort((a, b) => (STATE_ORDER[a[0].state] ?? 3) - (STATE_ORDER[b[0].state] ?? 3) || a[1] - b[1]).forEach(([it]) => {
      const row = el('div', 'item'); const st = STATE_ORDER[it.state] != null ? it.state : 'next';
      row.append(el('span', 'pill ' + st, STATE_LABEL[st]), el('div', 'txt', str(it.text))); list.append(row);
    });
    const t = toMs(state.now.updatedAt); $('#now-meta').textContent = t ? fmt.format(new Date(t)) : '';
  }

  function renderRoadmap() {
    const host = $('#rm-list');
    if (state.roadmap === undefined) return;
    host.replaceChildren();
    const phases = state.roadmap && Array.isArray(state.roadmap.phases) ? state.roadmap.phases : [];
    if (!phases.length) { host.append(el('div', 'empty', 'Yol haritası henüz yazılmadı.')); return; }
    for (const p of phases) {
      const items = Array.isArray(p.items) ? p.items.filter((i) => i && i.text) : [];
      const sec = el('div', 'phase'); const h = el('h3', null, str(p.title));
      const done = items.filter((i) => i.done).length; h.append(el('span', 'n', items.length ? done + '/' + items.length : ''));
      sec.append(h);
      const list = el('div', 'list');
      for (const it of items) { const row = el('div', 'item' + (it.done ? ' done' : '')); row.append(withIcon(el('span', 'check')), el('div', 'txt', str(it.text))); list.append(row); }
      if (!items.length) list.append(el('div', 'empty', 'Boş'));
      sec.append(list); host.append(sec);
    }
  }

  function renderAll() { renderBanner(); renderQuestions(); renderIslands(); renderNow(); renderRoadmap(); }

  function showEmpty() {
    state.questions = []; state.answers = new Map(); state.islands = []; state.scores = new Map(); state.now = null; state.roadmap = null; renderAll();
  }

  // ---------------------------------------------------------------- boot
  async function boot() {
    if (!window.claude || typeof window.claude.use !== 'function') { state.mode = 'offline'; showEmpty(); return; }
    let db = null, user = null;
    try { [db, user] = await Promise.all([window.claude.use('db'), window.claude.use('user')]); } catch { db = null; }
    if (!db) { state.mode = 'offline'; showEmpty(); return; }
    state.db = db;
    if (user) {
      try { state.userId = await user.id(); } catch { state.userId = null; }
      let can = null; try { can = await user.can('data.write'); } catch { can = null; }
      state.canWrite = can !== false;
    } else state.canWrite = true;
    state.mode = state.canWrite ? 'live' : 'readonly';
    renderBanner();

    const pending = new Set(['questions', 'answers', 'islands', 'islandScores', 'status', 'roadmap']);
    const watchdog = setTimeout(() => { if (pending.size) { state.stale = true; if (state.questions == null) state.questions = []; if (state.answers == null) state.answers = new Map(); if (state.islands == null) state.islands = []; if (state.scores == null) state.scores = new Map(); if (state.now === undefined) state.now = null; if (state.roadmap === undefined) state.roadmap = null; renderAll(); } }, 10000);
    const settle = (name, meta) => { if (meta && meta.fromCache) return; if (pending.delete(name) && !pending.size) { clearTimeout(watchdog); if (state.stale) { state.stale = false; renderBanner(); } } };
    const onErr = (name) => (e) => {
      pending.delete(name);
      if (e && (e.code === 'revoked' || e.code === 'not_granted')) { state.canWrite = false; state.mode = 'readonly'; } else state.stale = true;
      if (state.questions == null) state.questions = []; if (state.answers == null) state.answers = new Map();
      if (state.islands == null) state.islands = []; if (state.scores == null) state.scores = new Map();
      if (state.now === undefined) state.now = null; if (state.roadmap === undefined) state.roadmap = null;
      renderAll();
    };
    const docs = (snap) => snap.docs.filter((d) => d.exists).map((d) => Object.assign({ id: d.id }, d.data()));
    const subs = [
      ['questions', db.collection('questions'), (s) => { state.questions = docs(s); renderQuestions(); }],
      ['answers', db.collection('answers'), (s) => { const m = new Map(); for (const d of docs(s)) m.set(d.id, d); state.answers = m; renderQuestions(); }],
      ['islands', db.collection('islands'), (s) => { state.islands = docs(s); renderIslands(); }],
      ['islandScores', db.collection('islandScores'), (s) => { const m = new Map(); for (const d of docs(s)) m.set(d.id, d); state.scores = m; renderIslands(); }],
      ['status', db.doc('status/now'), (d) => { state.now = d.exists ? d.data() : null; renderNow(); }],
      ['roadmap', db.doc('roadmap/main'), (d) => { state.roadmap = d.exists ? d.data() : null; renderRoadmap(); }],
    ];
    for (const [name, ref, fn] of subs) ref.onSnapshot((snap) => { try { fn(snap); } finally { settle(name, snap.metadata); } }, onErr(name));
  }
  boot();
})();
</script>
