<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>İstasyon Kartı</title>
<style>
  :root{--paper:#fff8ec;--ink:#4a3526;--soft:#8a7461;--honey:#f6c65b;--honey-deep:#e2a93a;--line:#eadcc6;--accent:#d9744a}
  html,body{margin:0;height:100%;background:#bcd3ee;overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
  body{font-family:ui-rounded,"SF Pro Rounded","Nunito","Inter",system-ui,sans-serif;color:var(--ink)}
  #stage{position:absolute;left:50%;top:50%;width:402px;height:874px;transform-origin:0 0;overflow:hidden;background:#9fc0ea}
  #home{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  #dim{position:absolute;inset:0;background:linear-gradient(rgba(60,40,30,.0),rgba(60,40,30,.22) 40%)}
  .sheet{position:absolute;left:0;right:0;bottom:0;height:600px;background:var(--paper);border-radius:34px 34px 0 0;box-shadow:0 -8px 30px rgba(70,45,20,.28)}
  .hero{position:relative;height:310px;border-radius:34px 34px 0 0;overflow:hidden;background:#cfe3f6}
  .hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:opacity .7s ease,transform 1.1s cubic-bezier(.2,.8,.2,1)}
  .hero img.b{opacity:0}
  .hero .fade{position:absolute;left:0;right:0;bottom:0;height:70px;background:linear-gradient(rgba(255,248,236,0),rgba(255,248,236,.0) 40%,var(--paper))}
  .hero .flash{position:absolute;inset:0;background:radial-gradient(circle at 50% 55%,rgba(255,244,200,.95),rgba(255,236,170,0) 62%);opacity:0;pointer-events:none}
  .hero .flash.go{animation:flash 1.1s ease-out}
  @keyframes flash{0%{opacity:0;transform:scale(.6)}25%{opacity:1}100%{opacity:0;transform:scale(1.5)}}
  .grab{position:absolute;left:50%;top:8px;width:40px;height:5px;margin-left:-20px;border-radius:3px;background:rgba(255,255,255,.75);box-shadow:0 1px 2px rgba(0,0,0,.18)}
  .tag{position:absolute;left:16px;top:18px;font-weight:700;font-size:13px;letter-spacing:.2px;color:var(--accent);background:rgba(255,250,240,.94);padding:6px 11px;border-radius:999px;box-shadow:0 1px 4px rgba(70,45,20,.2)}
  .close{position:absolute;right:14px;top:14px;width:36px;height:36px;border-radius:50%;border:0;background:rgba(255,250,240,.94);color:var(--ink);font:700 15px system-ui;box-shadow:0 1px 4px rgba(70,45,20,.2)}
  .ladder{position:relative;height:60px;margin:-34px 22px 0;display:flex;justify-content:space-between;align-items:center}
  .ladder::before{content:"";position:absolute;left:24px;right:24px;top:50%;height:0;border-top:3px dotted #d9c6a8;transform:translateY(-1px)}
  .ladder .done{position:absolute;left:24px;top:50%;height:3px;background:var(--honey);border-radius:2px;transform:translateY(-1px);transition:width .6s ease}
  .med{position:relative;width:48px;height:48px;border-radius:50%;border:0;padding:0;background:var(--paper);box-shadow:0 0 0 3px var(--paper),0 2px 6px rgba(70,45,20,.28);transition:transform .25s cubic-bezier(.3,1.6,.5,1)}
  .med i{position:absolute;inset:0;border-radius:50%;background-size:245%;background-repeat:no-repeat}
  .med.built{box-shadow:0 0 0 3px var(--honey),0 2px 6px rgba(70,45,20,.28)}
  .med.next{box-shadow:0 0 0 3px var(--paper),0 0 0 5px var(--honey),0 2px 6px rgba(70,45,20,.28)}
  .med.next::after{content:"";position:absolute;inset:-9px;border-radius:50%;border:2px solid var(--honey);opacity:0;animation:pulse 2.2s ease-out infinite}
  @keyframes pulse{0%{transform:scale(.8);opacity:.9}100%{transform:scale(1.25);opacity:0}}
  .med.veil i{filter:blur(2.5px) saturate(.25) brightness(1.12);opacity:.55}
  .med.veil{box-shadow:0 0 0 3px var(--paper),0 1px 3px rgba(70,45,20,.18);background:#f1e6d2}
  .med.sel{transform:scale(1.22)}
  .med.pop{animation:pop .7s cubic-bezier(.3,1.6,.5,1)}
  @keyframes pop{0%{transform:scale(.7)}60%{transform:scale(1.4)}100%{transform:scale(1.22)}}
  .body{padding:14px 22px 0}
  .row{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
  h1{margin:0;font-size:30px;line-height:1.1;font-weight:800;letter-spacing:-.2px}
  .rate{flex:none;font-size:14px;font-weight:700;color:var(--soft);font-variant-numeric:tabular-nums;display:flex;align-items:center;gap:5px}
  .rate b{color:var(--ink)}
  .desc{margin:8px 0 0;font-size:17px;line-height:1.35;color:var(--soft);min-height:46px}
  .plaque{position:relative;margin-top:18px;height:58px;width:100%;border:0;border-radius:29px;background:var(--honey);box-shadow:0 3px 0 var(--honey-deep),0 8px 16px rgba(190,130,30,.28);font:800 19px ui-rounded,"SF Pro Rounded","Inter",system-ui,sans-serif;color:var(--ink);display:flex;align-items:center;justify-content:center;gap:8px;overflow:hidden;transition:transform .12s}
  .plaque:active{transform:translateY(2px)}
  .plaque.short{background:#f3e8d3;box-shadow:inset 0 0 0 1.5px var(--line)}
  .plaque .fill{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,#f9d98a,var(--honey));border-radius:29px 12px 12px 29px;transition:width .6s ease}
  .plaque span,.plaque svg{position:relative}
  .sub{margin-top:11px;text-align:center;font-size:13.5px;color:var(--soft);font-variant-numeric:tabular-nums}
  .donebox{margin-top:18px;text-align:center;font-size:16px;color:var(--soft);padding:16px 0}
  #demo{position:absolute;left:0;right:0;top:66px;display:flex;gap:6px;justify-content:center;flex-wrap:wrap;padding:0 10px}
  #demo button{font:600 12.5px system-ui;color:var(--ink);background:rgba(255,248,236,.92);border:0;border-radius:999px;padding:8px 11px;box-shadow:0 1px 4px rgba(80,50,20,.25)}
  #demo button.on{background:var(--honey)}
  body.shot #demo{display:none}
</style>
</head>
<body>
<div id="stage">
  <img id="home" alt="">
  <div id="dim"></div>
  <div id="demo"></div>
  <div class="sheet">
    <div class="hero">
      <img class="a" alt=""><img class="b" alt="">
      <div class="fade"></div><div class="flash"></div>
      <div class="grab"></div><div class="tag"></div><button class="close" aria-label="Kapat">✕</button>
    </div>
    <div class="ladder"><div class="done"></div></div>
    <div class="body">
      <div class="row"><h1></h1><div class="rate"></div></div>
      <p class="desc"></p>
      <div id="action"></div>
    </div>
  </div>
</div>

// The station sheet from scratch: the picture of the next form is the sheet, and the
// station's own five forms are the level gauge. Costs and rates are the catalog's
// (ArchipelagoCatalog.standard); the lines are draft copy.
const ST = {
  windmill: { accent: '#c9623a', focus: [0.49, 0.44], costs: [40, 55, 75, 100, 130],
    names: ['Rüzgâr Gülü', 'Değirmen', 'Değirmen', 'Değirmen', 'Büyük Değirmen'],
    lines: ['Direğin ucunda küçük bir rüzgâr gülü. Rüzgârı ilk o duyar.', 'Taş kule yükselir. Kanatları tahta, daha yelkensiz.', 'Kanatlara bez yelken gerilir. Kapının önüne un çuvalları dizilir.', 'Yanına fırın kanadı eklenir. Bacası tüter.', 'Kule iki kat olur. Bir seyir balkonu, kanat uçlarında fenerler.'] },
  pond: { accent: '#2f86b8', focus: [0.42, 0.46], costs: [15, 25, 40, 60, 85],
    names: ['Gölcük', 'Gölet', 'Gölet', 'Gölet', 'Nilüfer Gölü'],
    lines: ['Taşlarla çevrili küçük bir su. Üstünde üç nilüfer.', 'Su iki katına yayılır. Kıyısında uzun sazlar biter.', 'Bir iskele, bir kayık. Çimenin içinden bir dere gelir.', 'Kemerli bir köprü kurulur. Akşam fenerleri yanar.', 'Adacıkta bir çardak. Su, adanın kenarından aşağı dökülür.'] },
};
const q = new URLSearchParams(location.hash.slice(1));
const s = { st: q.get('st') || 'windmill', lv: +(q.get('lv') || 2), jar: +(q.get('jar') || 60), view: 0 };
if (q.get('shot')) document.body.classList.add('shot');
const $ = x => document.querySelector(x);
const rate = lv => (lv * 0.48).toLocaleString('tr-TR', { maximumFractionDigits: 1 });
const SEED = '<svg width="13" height="19" viewBox="0 0 13 19" style="transform:rotate(18deg)"><path d="M6.5 0.6C10.5 4.6 12.4 9 12.4 12.4c0 3.5-2.6 6-5.9 6S0.6 15.9 0.6 12.4C0.6 9 2.5 4.6 6.5 0.6z" fill="#4a3526"/><path d="M6.5 4v12M3.6 8.5v6.5M9.4 8.5v6.5" stroke="#fff3da" stroke-width="1.3" stroke-linecap="round" fill="none"/></svg>';
let front = 'a';
function show(form, instant) {
  const src = ASSETS[s.st + form], cur = $('.hero img.' + front);
  if (cur.dataset.f === s.st + form) return;
  if (instant) { cur.src = src; cur.dataset.f = s.st + form; return; }
  const other = front === 'a' ? 'b' : 'a', o = $('.hero img.' + other);
  o.src = src; o.dataset.f = s.st + form; o.style.transform = 'scale(1.06)';
  requestAnimationFrame(() => { o.style.opacity = 1; o.style.transform = 'scale(1)'; cur.style.opacity = 0; });
  front = other;
}
function render(instant) {
  const d = ST[s.st], max = s.lv >= 5, next = Math.min(s.lv + 1, 5);
  if (!s.view) s.view = max ? 5 : next;
  document.documentElement.style.setProperty('--accent', d.accent);
  show(s.view, instant);
  $('.tag').textContent = s.view > s.lv ? 'Sıradaki' : s.view === s.lv ? 'Şimdi' : 'Önceden';
  $('h1').textContent = d.names[s.view - 1];
  $('.desc').textContent = d.lines[s.view - 1];
  $('.rate').innerHTML = s.view > s.lv ? `Günde <b>${rate(s.lv)} → ${rate(s.view)}</b>${SEED}` : `Günde <b>${rate(s.lv)}</b>${SEED}`;
  const lad = $('.ladder'); lad.querySelectorAll('.med').forEach(m => m.remove());
  for (let f = 1; f <= 5; f++) {
    const b = document.createElement('button');
    b.className = 'med ' + (f <= s.lv ? 'built' : f === s.lv + 1 ? 'next' : 'veil') + (f === s.view ? ' sel' : '');
    b.innerHTML = `<i style="background-image:url(${ASSETS[s.st + f]});background-position:${(245 * d.focus[0] - 50) / 1.45}% ${(188.6 * d.focus[1] - 50) / 0.886}%"></i>`;
    b.setAttribute('aria-label', `${f}. hâli: ${d.names[f - 1]}`);
    if (f <= s.lv + 1) b.onclick = () => { s.view = f; render(); };
    lad.appendChild(b);
  }
  $('.ladder .done').style.width = `calc((100% - 48px) * ${(s.lv - 1) / 4})`;
  const act = $('#action');
  if (max) { act.innerHTML = `<div class="donebox">Her hâli kuruldu. Buradan büyüğü yok.</div>`; return; }
  const cost = d.costs[next - 1], missing = Math.max(0, cost - s.jar);
  if (missing) act.innerHTML = `<div class="plaque short"><div class="fill" style="width:${Math.round(s.jar / cost * 100)}%"></div><span>${missing} çekirdek daha</span></div><div class="sub">Yanaklarında ${s.jar} / ${cost} çekirdek var.</div>`;
  else { act.innerHTML = `<button class="plaque"><span>Kur · ${cost}</span>${SEED}</button><div class="sub">Yanaklarındaki ${s.jar} çekirdekten ${cost} tanesi gider.</div>`; act.querySelector('button').onclick = build; }
}
function build() {
  const d = ST[s.st], next = s.lv + 1;
  s.jar -= d.costs[next - 1]; s.lv = next; s.view = next;
  const fl = $('.flash'); fl.classList.remove('go'); void fl.offsetWidth; fl.classList.add('go');
  if (navigator.vibrate) navigator.vibrate([10, 40, 20]);
  render();
  const m = document.querySelectorAll('.med')[next - 1]; m.classList.add('pop');
  setTimeout(() => { s.view = 0; render(); }, 2600);   // then the sheet turns to what comes after
}
function demo() {
  const el = $('#demo'); el.innerHTML = '';
  const add = (label, on, fn) => { const b = document.createElement('button'); b.textContent = label; if (on) b.className = 'on'; b.onclick = () => { fn(); s.view = 0; render(); demo(); }; el.appendChild(b); };
  add('Değirmen', s.st === 'windmill', () => s.st = 'windmill'); add('Gölet', s.st === 'pond', () => s.st = 'pond');
  for (let l = 1; l <= 5; l++) add('Sv ' + l, s.lv === l, () => s.lv = l);
  add('Çekirdek az', s.jar < 30, () => s.jar = s.jar < 30 ? 300 : 12);
}
function fit() { const k = Math.min(innerWidth / 402, innerHeight / 874), st = $('#stage'); st.style.transform = `scale(${k}) translate(-50%,-50%)`; }
$('#home').src = ASSETS.home; addEventListener('resize', fit); fit(); render(true); demo();
</script>
