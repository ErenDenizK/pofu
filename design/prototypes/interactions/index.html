<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="claude:viewport-fit-sides" content="cover">
<title>Pofu Etkileşimler</title>
<meta name="description" content="Pofu'nun dünyası için etkileşim prototipi: kademeli yakınlaştırma, istasyon odağı, alan derinliği, cam menüler ve tepkiler.">
<style>
@font-face { font-family: "Baloo 2"; src: url("fonts/baloo-2-latin-wght-normal.woff2") format("woff2"); font-weight: 400 800; font-display: swap; }
@font-face { font-family: "Nunito"; src: url("fonts/nunito-latin-ext-wght-normal.woff2") format("woff2"); font-weight: 200 1000; font-display: swap; unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF; }
@font-face { font-family: "Nunito"; src: url("fonts/nunito-latin-wght-normal.woff2") format("woff2"); font-weight: 200 1000; font-display: swap; unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }

/* Tokens from the design language: cream canvas, plum ink, violet for action. The world is
   painted and keeps its colours in dark mode; only the glass frame and sheets change. */
:root {
  --bg: #F3EADF; --ink: #2A1F2D; --ink-2: #66555F; --ink-3: #8E7D88; --line: rgba(42, 31, 45, .10);
  --accent: #6C4FD8; --accent-ink: #FFFFFF; --accent-tint: #EEE8FF; --accent-on-tint: #553BB8;
  --honey: #F5B83D; --meadow: #2F7349; --card: #FFFBF5;
  --glass: rgba(255, 255, 255, .40); --glass-edge: rgba(255, 255, 255, .62); --glass-ink: #2A1F2D;
  --sheet: rgba(255, 251, 246, .94); --sheet-solid: #FFFBF5; --panel: rgba(255, 251, 246, .975);
  --display: "Baloo 2", ui-rounded, "SF Pro Rounded", system-ui, sans-serif;
  --body: "Nunito", ui-rounded, "SF Pro Rounded", system-ui, sans-serif;
  --safe-t: max(env(safe-area-inset-top), 12px); --safe-b: max(env(safe-area-inset-bottom), 12px);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #17121C; --ink: #F6EEF3; --ink-2: #CDBFC8; --ink-3: #A898A3; --line: rgba(255, 255, 255, .12);
  --accent: #9D86FF; --accent-ink: #160F24; --accent-tint: #2C2445; --accent-on-tint: #CFC2FF; --card: #2A2230;
  --glass: rgba(40, 30, 46, .46); --glass-edge: rgba(255, 255, 255, .18); --glass-ink: #F6EEF3;
  --sheet: rgba(36, 28, 42, .95); --panel: rgba(36, 28, 42, .975); --sheet-solid: #241C2A; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #17121C; --ink: #F6EEF3; --ink-2: #CDBFC8; --ink-3: #A898A3; --line: rgba(255, 255, 255, .12);
  --accent: #9D86FF; --accent-ink: #160F24; --accent-tint: #2C2445; --accent-on-tint: #CFC2FF; --card: #2A2230;
  --glass: rgba(40, 30, 46, .46); --glass-edge: rgba(255, 255, 255, .18); --glass-ink: #F6EEF3;
  --sheet: rgba(36, 28, 42, .95); --panel: rgba(36, 28, 42, .975); --sheet-solid: #241C2A; color-scheme: dark; }

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; background: var(--bg); overflow: hidden; overscroll-behavior: none; }
body { font-family: var(--body); color: var(--ink); -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
button { font: inherit; color: inherit; border: 0; background: none; padding: 0; margin: 0; cursor: pointer; }
img { -webkit-user-drag: none; user-select: none; }

/* The phone. Full screen on a phone; a 402 x 874 frame on a desktop. */
#app { position: relative; width: 100vw; height: 100vh; height: 100dvh; margin: 0 auto; overflow: hidden; overflow: clip; isolation: isolate; background: #CBE6F1; }
@media (min-width: 560px) and (min-height: 700px) {
  body { display: grid; place-items: center; }
  #app { width: 402px; height: min(874px, calc(100dvh - 32px)); border-radius: 48px; box-shadow: 0 0 0 10px #1E1828, 0 30px 60px -20px rgba(0, 0, 0, .5); }
}

/* ---------------------------------------------------------------- world */
#wrap { position: absolute; inset: 0; transform-origin: 50% 40%; will-change: transform; }
#world { position: absolute; inset: 0; touch-action: none; overflow: hidden; }
.sky { position: absolute; inset: -40px; background: linear-gradient(180deg, #A9D3EC 0%, #CBE6F1 42%, #F6EDE2 78%, #FCEBDD 100%); }
.sky::after { content: ""; position: absolute; left: -180px; top: -150px; width: 520px; height: 520px; background: radial-gradient(circle, rgba(255, 240, 205, .85), rgba(255, 240, 205, 0) 60%); }
.par { position: absolute; inset: 0; will-change: transform; pointer-events: none; }
.par img { position: absolute; max-width: none; opacity: .92; }
.drift { animation: drift 16s ease-in-out infinite alternate; }
@keyframes drift { to { transform: translateX(24px); } }
#cam { position: absolute; left: 0; top: 0; width: 0; height: 0; transform-origin: 0 0; will-change: transform; pointer-events: none; }
.obj { position: absolute; width: 0; height: 0; }
.obj .tf { position: absolute; left: 0; top: 0; width: 0; height: 0; transform-origin: 0 0; }
.obj img { position: absolute; display: block; max-width: none; }
.obj img.b1, .obj img.b2 { opacity: 0; }
.locked img { filter: grayscale(.85) brightness(1.08); }
.sea { position: absolute; left: -70px; right: -70px; bottom: -14px; height: 170px; pointer-events: none; will-change: transform; }
.sea::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 90px; background: linear-gradient(180deg, rgba(239, 230, 243, 0), #EFE6F3 62%); }
.sea img { position: absolute; bottom: 30px; max-width: none; }
#tilt { position: absolute; inset: 0; transform-origin: 50% 62%; will-change: transform; pointer-events: none; }
#skycB, #seaB { opacity: 0; }
/* Tilt-shift: a second camera layer holding only the deep-blur variants, under a static
   screen-space gradient mask (clear in the middle, opaque at the top and bottom). */
#tsw, #skycB, #seaB { -webkit-mask-image: linear-gradient(180deg, #000 0%, #000 8%, transparent 34%, transparent 60%, #000 86%); mask-image: linear-gradient(180deg, #000 0%, #000 8%, transparent 34%, transparent 60%, #000 86%); }
#tsw { position: absolute; inset: 0; opacity: 0; pointer-events: none; }
#camB { position: absolute; left: 0; top: 0; width: 0; height: 0; transform-origin: 0 0; will-change: transform; }
#camB img { position: absolute; display: block; max-width: none; }
.sea.nofade::after { display: none; }
/* Depth cues */
.csh, .cao { position: absolute; border-radius: 50%; pointer-events: none; }
.csh { background: radial-gradient(closest-side, rgba(52, 66, 44, .34), rgba(52, 66, 44, .16) 55%, rgba(52, 66, 44, 0)); }
.cao { background: radial-gradient(closest-side, rgba(40, 44, 30, .38), rgba(40, 44, 30, 0)); }
.noshadow .csh, .noshadow .cao, .noshadow .psh { display: none; }
.haze { position: absolute; background: #DCEBF5; opacity: 0; -webkit-mask-size: 100% 100%; mask-size: 100% 100%; -webkit-mask-repeat: no-repeat; mask-repeat: no-repeat; pointer-events: none; }
.glplate { position: absolute; display: none; }
#bokeh { opacity: 0; will-change: transform, opacity; }
.bk { position: absolute; border-radius: 50%; will-change: transform; }
.bk.petal { border-radius: 60% 40% 55% 45%; }
@keyframes bkA { 0% { transform: translate(0, 0) rotate(0); } 50% { transform: translate(18px, -26px) rotate(40deg); } 100% { transform: translate(-6px, -48px) rotate(90deg); } }
@keyframes bkB { 0% { transform: translate(0, 0); } 50% { transform: translate(-20px, 14px); } 100% { transform: translate(8px, 30px); } }
.pollen { position: absolute; left: 0; top: 0; width: 0; height: 0; }
.pollen i { position: absolute; width: 2.4px; height: 2.4px; margin: -1.2px 0 0 -1.2px; border-radius: 50%; background: radial-gradient(closest-side, #FFF8D6, #FFF4C2 55%, rgba(255, 236, 160, 0)); animation: pol 7s ease-in-out infinite alternate; }
@keyframes pol { to { transform: translate(9px, -12px); } }
.rm .bk, .rm .pollen i { animation: none; }
/* NPC card: a small glass card above the resident (a readout with one action). */
.npc { position: absolute; left: 0; top: 0; z-index: 15; width: 232px; padding: 12px 14px 12px; border-radius: 22px; background: var(--panel); box-shadow: 0 10px 28px rgba(42, 31, 45, .2), inset 0 1px 0 var(--glass-edge); opacity: 0; visibility: hidden; transform-origin: 50% 0; }
.npc.on { visibility: visible; }
.npc::after { content: ""; position: absolute; left: var(--tail, 50%); top: -7px; width: 16px; height: 16px; margin-left: -8px; transform: rotate(45deg); background: var(--panel); border-radius: 3px; }
.npc .nh { display: flex; align-items: baseline; gap: 8px; }
.npc .nh b { font: 800 17px/1.1 var(--display); }
.npc .nh span { font: 700 12.5px/1.2 var(--body); color: var(--ink-2); }
.npc p { margin: 6px 0 10px; font: 650 15px/1.3 var(--body); }
.npc p:empty { display: none; }
.npc .go { width: 100%; height: 44px; border-radius: 22px; background: var(--accent-tint); color: var(--accent-on-tint); font: 850 15px/1 var(--body); position: relative; z-index: 1; }
.sg.multi button[aria-pressed="true"]::before { content: "✓ "; }
#dim { position: absolute; inset: 0; background: #1B1320; opacity: 0; pointer-events: none; }

/* Pofu: anchor (feet) > hop (WAAPI) > squash/lean (springs) > breathing (CSS) > art */
.pofu .br { position: absolute; left: 0; top: 0; width: 0; height: 0; transform-origin: 0 0; animation: breathe 3.6s ease-in-out infinite; }
@keyframes breathe { 50% { transform: scale(1.012, 1.022); } }
.pofu .face { opacity: 0; transition: opacity 90ms linear; }
.pofu .face.on { opacity: 1; }
.pofu .base { transition: opacity 90ms linear; }
.pofu .base.off { opacity: 0; }
.psh { position: absolute; border-radius: 50%; background: radial-gradient(closest-side, rgba(47, 72, 52, .3), rgba(47, 72, 52, 0)); }
.rm .pofu .br { animation: none; }

/* ---------------------------------------------------------------- screen-space overlays */
.layer { position: absolute; inset: 0; pointer-events: none; }
.pin { position: absolute; left: 0; top: 0; width: 30px; height: 30px; margin: -30px 0 0 -15px; opacity: 0; filter: drop-shadow(0 3px 5px rgba(42, 31, 45, .25)); }
.mlabel { position: absolute; left: 0; top: 0; transform: translate(-50%, -50%); white-space: nowrap; font: 800 13px/1 var(--body); color: #2A1F2D; background: rgba(255, 251, 245, .92); padding: 6px 10px; border-radius: 12px; opacity: 0; box-shadow: 0 2px 8px rgba(42, 31, 45, .12); }
.mlabel small { font-weight: 700; color: #8E7D88; margin-left: 4px; }
.mlabel.new { background: #6C4FD8; color: #fff; } .mlabel.new small { color: #E6DEFF; }
.bubble { position: absolute; left: 0; top: 0; max-width: 270px; width: max-content; background: #FFFBF5; color: #2A1F2D; border-radius: 22px; padding: 12px 16px; text-align: center; font: 700 16px/1.32 var(--body); box-shadow: 0 8px 24px rgba(42, 31, 45, .14); opacity: 0; transform-origin: 50% 100%; }
.bubble::after { content: ""; position: absolute; left: 50%; bottom: -7px; width: 16px; height: 16px; margin-left: -8px; transform: rotate(45deg); background: #FFFBF5; border-radius: 3px; }
.chipw { position: absolute; left: 0; top: 0; white-space: nowrap; font: 800 13px/1 var(--body); background: #FFFBF5; color: #2A1F2D; padding: 7px 11px; border-radius: 14px; box-shadow: 0 4px 12px rgba(42, 31, 45, .16); }
.tag { position: absolute; left: 0; top: 0; white-space: nowrap; font: 800 20px/1 var(--display); color: #fff; background: #6C4FD8; padding: 8px 14px 6px; border-radius: 16px; box-shadow: 0 8px 18px rgba(108, 79, 216, .35); }
.spark { position: absolute; left: 0; top: 0; width: 18px; height: 18px; margin: -9px 0 0 -9px; }
.puff { position: absolute; left: 0; top: 0; width: 34px; height: 22px; margin: -11px 0 0 -17px; border-radius: 50%; background: radial-gradient(closest-side, rgba(255, 246, 232, .95), rgba(255, 246, 232, 0)); }
.ripple { position: absolute; left: 0; top: 0; width: 56px; height: 22px; margin: -11px 0 0 -28px; border-radius: 50%; border: 2px solid rgba(255, 255, 255, .85); }
.leaf { position: absolute; left: 0; top: 0; width: 7px; height: 4px; margin: -2px 0 0 -3px; border-radius: 50%; background: #8CC084; }
.wisp { position: absolute; left: 0; top: 0; width: 10px; height: 6px; margin: -3px 0 0 -5px; border-radius: 50%; background: rgba(255, 244, 228, .95); }
.hit { position: absolute; left: 0; top: 0; border: 1.5px dashed rgba(108, 79, 216, .9); background: rgba(108, 79, 216, .10); border-radius: 10px; }
.hit.p { border-color: rgba(233, 105, 111, .95); background: rgba(233, 105, 111, .1); }
.hit.r { border-color: rgba(47, 115, 73, .95); background: rgba(47, 115, 73, .1); }
.hit.e { border-radius: 50%; }
.hit i { position: absolute; left: 4px; top: 3px; font: 800 10px/1 var(--body); font-style: normal; color: #2A1F2D; background: rgba(255, 255, 255, .8); padding: 2px 4px; border-radius: 4px; }

/* ---------------------------------------------------------------- glass chrome */
#chrome { position: absolute; inset: 0; pointer-events: none; }
#chrome > * { pointer-events: auto; }
.glass { background: var(--glass); -webkit-backdrop-filter: blur(12px) saturate(1.6); backdrop-filter: blur(12px) saturate(1.6); box-shadow: 0 8px 22px rgba(42, 31, 45, .12), inset 0 1px 0 var(--glass-edge), inset 0 0 0 1px rgba(255, 255, 255, .28); color: var(--glass-ink); }
.nofx .glass { -webkit-backdrop-filter: none; backdrop-filter: none; background: rgba(255, 251, 245, .9); }
.top { position: absolute; left: 16px; right: 16px; top: calc(var(--safe-t) + 4px); height: 44px; display: flex; align-items: center; gap: 8px; pointer-events: none; }
.top > * { pointer-events: auto; }
.pill { height: 44px; border-radius: 22px; display: inline-flex; align-items: center; gap: 8px; padding: 0 14px 0 12px; font: 800 15px/1 var(--body); white-space: nowrap; }
.circ { width: 44px; height: 44px; border-radius: 22px; display: grid; place-items: center; }
.circ svg { width: 22px; height: 22px; }
.wb { width: 42px; height: 6px; border-radius: 3px; background: rgba(42, 31, 45, .14); overflow: hidden; } .wb i { display: block; height: 100%; width: 74%; background: linear-gradient(90deg, #F6A290, #E9696F); border-radius: 3px; }
.spacer { flex: 1; }
.pressable { transition: transform 160ms cubic-bezier(.2, .8, .2, 1); }
.pressable:active { transform: scale(.94); }
.calm { position: absolute; left: 50%; top: calc(var(--safe-t) + 56px); transform: translateX(-50%); height: 36px; border-radius: 18px; display: flex; align-items: center; gap: 7px; padding: 0 13px 0 6px; font: 850 14px/1 var(--body); white-space: nowrap; pointer-events: none; }
.calm b { color: #2F7349; } .calm small { font-weight: 700; color: var(--ink-2); font-size: 12px; }
.ctx { position: absolute; left: 50%; top: calc(var(--safe-t) + 100px); transform: translateX(-50%); white-space: nowrap; font: 800 13px/1 var(--body); padding: 8px 12px; border-radius: 14px; pointer-events: none; opacity: 0; }
.seg { position: absolute; left: 50%; bottom: calc(var(--safe-b) + 10px); transform: translateX(-50%); height: 52px; border-radius: 26px; padding: 4px; display: flex; }
.seg button { position: relative; z-index: 1; width: 88px; height: 44px; border-radius: 22px; font: 800 15px/1 var(--body); }
.seg .ind { position: absolute; left: 4px; top: 4px; width: 88px; height: 44px; border-radius: 22px; background: rgba(255, 255, 255, .78); box-shadow: 0 2px 8px rgba(42, 31, 45, .14); will-change: transform; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .seg .ind { background: rgba(255, 255, 255, .16); } }
.seg button[aria-pressed="true"] { color: var(--accent-on-tint); }
.tab { position: absolute; right: 0; top: 46%; width: 44px; height: 112px; border-radius: 16px 0 0 16px; display: grid; place-items: center; }
.tab span { writing-mode: vertical-rl; transform: rotate(180deg); font: 800 13px/1 var(--body); letter-spacing: .02em; }
.toast { position: absolute; left: 50%; bottom: calc(var(--safe-b) + 74px); transform: translateX(-50%); max-width: calc(100% - 32px); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font: 750 13px/1 var(--body); padding: 9px 13px; border-radius: 15px; opacity: 0; pointer-events: none; }
#hud { position: absolute; left: 12px; bottom: calc(var(--safe-b) + 72px); display: flex; flex-direction: column-reverse; gap: 4px; pointer-events: none; }
#hud div { font: 800 11px/1 var(--body); color: #fff; background: rgba(42, 31, 45, .72); padding: 5px 8px; border-radius: 9px; white-space: nowrap; }
#hud div::before { content: "◉ "; color: #FFD27A; }
#fps { position: absolute; right: 12px; bottom: calc(var(--safe-b) + 72px); font: 800 11px/1 var(--body); color: #fff; background: rgba(42, 31, 45, .72); padding: 5px 8px; border-radius: 9px; display: none; pointer-events: none; }

/* Glass morph panels: the panel is the button, grown. clip-path is the one non-transform
   property animated here (a small element; SwiftUI does this natively with glassEffectID). */
.morph { position: absolute; z-index: 30; padding: 6px; pointer-events: none; visibility: hidden; }
.morph.open { pointer-events: auto; visibility: visible; }
.morph .mp { border-radius: 26px; overflow: hidden; background: var(--panel); }
/* Text on glass needs a calm base: the panel is the thick variant of the material. */
.morph .mc { opacity: 0; }
.mlist button { display: flex; align-items: center; gap: 12px; width: 100%; min-height: 48px; padding: 0 16px; text-align: left; font: 750 16px/1.2 var(--body); }
.mlist button + button { border-top: 1px solid var(--line); }
.mlist svg { width: 22px; height: 22px; flex: none; }
.seedp { padding: 16px; }
.seedp h3 { margin: 0; font: 800 28px/1 var(--display); display: flex; align-items: center; gap: 10px; }
.seedp p { margin: 8px 0 0; font: 650 14px/1.35 var(--body); color: var(--ink-2); }
.seedp .row { display: flex; justify-content: space-between; margin-top: 12px; padding-top: 10px; border-top: 1px solid var(--line); font: 750 14px/1 var(--body); }
#scrim { position: absolute; inset: 0; z-index: 29; display: none; }
#scrim.on { display: block; }

/* ---------------------------------------------------------------- sheet (detents) */
.sheet { position: absolute; left: 0; right: 0; top: 0; height: 100%; z-index: 20; will-change: transform; transform: translateY(110%); touch-action: none; }
.sheet .body { position: absolute; left: 8px; right: 8px; top: 0; bottom: -40px; border-radius: 34px 34px 0 0; background: var(--sheet); box-shadow: 0 -10px 30px rgba(42, 31, 45, .16), inset 0 1px 0 var(--glass-edge); overflow: hidden; }
.sheet.large .body { left: 0; right: 0; }
.grab { width: 40px; height: 5px; border-radius: 3px; background: rgba(42, 31, 45, .22); margin: 7px auto 0; }
.shead { display: flex; align-items: flex-start; gap: 12px; padding: 10px 14px 0 20px; }
.shead h2 { margin: 4px 0 0; font: 800 24px/1.05 var(--display); }
.shead p { margin: 4px 0 0; font: 700 14px/1.2 var(--body); color: var(--ink-2); }
.shead .circ { margin-left: auto; flex: none; }
.sc { padding: 0 20px; transition: opacity 120ms linear; }
.sc.fade { opacity: 0; }
.dots { display: flex; gap: 6px; align-items: center; margin: 12px 0 0; font: 750 13px/1 var(--body); color: var(--ink-2); }
.dots i { width: 10px; height: 10px; border-radius: 5px; background: rgba(42, 31, 45, .14); }
.dots i.on { background: var(--honey); }
.dots span { margin-left: 6px; }
.next { display: flex; gap: 12px; align-items: center; margin-top: 12px; padding: 10px; border-radius: 20px; background: var(--sheet-solid); box-shadow: 0 1px 0 var(--line); }
.next .th { width: 64px; height: 64px; border-radius: 14px; background: #F4E9DC; display: grid; place-items: center; overflow: hidden; flex: none; }
.next .th img { width: 78px; height: auto; margin-top: 6px; }
.next .th.tbd { border: 2px dashed rgba(42, 31, 45, .2); background: transparent; font: 800 11px/1.1 var(--body); color: var(--ink-3); text-align: center; }
.next b { display: block; font: 800 15px/1.2 var(--body); }
.next span { display: block; margin-top: 3px; font: 650 14px/1.3 var(--body); color: var(--ink-2); }
.rate { margin-top: 8px; font: 700 13px/1.2 var(--body); color: var(--ink-3); }
.cta { margin-top: 14px; width: 100%; height: 52px; border-radius: 26px; background: var(--accent); color: var(--accent-ink); font: 850 17px/1 var(--body); display: flex; align-items: center; justify-content: center; gap: 8px; box-shadow: 0 8px 20px rgba(108, 79, 216, .32), inset 0 1px 0 rgba(255, 255, 255, .35); transition: transform 160ms cubic-bezier(.2, .8, .2, 1), opacity 160ms; }
.cta:active { transform: scale(.97); }
.cta[disabled] { background: rgba(42, 31, 45, .10); color: var(--ink-2); box-shadow: none; cursor: default; }
.cta[disabled]:active { transform: none; }
.hist { margin: 18px 0 0; padding: 0; list-style: none; }
.hist li { display: flex; gap: 10px; padding: 10px 0; border-top: 1px solid var(--line); font: 650 14px/1.3 var(--body); color: var(--ink-2); }
.hist li b { color: var(--ink); min-width: 74px; }
.compact .sc .more { opacity: 0; }

/* Compare panel (prototype tooling, not product UI). */
#panel { position: absolute; left: 0; right: 0; bottom: 0; height: 78%; z-index: 40; transform: translateY(105%); will-change: transform; }
#panel .body { position: absolute; inset: 0; border-radius: 30px 30px 0 0; background: var(--sheet-solid); box-shadow: 0 -10px 30px rgba(0, 0, 0, .2); display: flex; flex-direction: column; }
#panel .ph { display: flex; align-items: center; gap: 8px; padding: 6px 12px 6px 20px; }
#panel .ph h2 { margin: 0; font: 800 22px/1 var(--display); flex: 1; }
#panel .pc { overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 0 16px calc(var(--safe-b) + 16px); touch-action: pan-y; overscroll-behavior: contain; }
.opt { padding: 12px 0; border-top: 1px solid var(--line); }
.opt h3 { margin: 0 0 8px; font: 800 14px/1.2 var(--body); }
.opt p { margin: 8px 0 0; font: 650 13px/1.35 var(--body); color: var(--ink-2); }
.sg { display: flex; gap: 6px; flex-wrap: wrap; }
.sg button { min-height: 44px; padding: 0 12px; border-radius: 14px; background: rgba(42, 31, 45, .06); font: 750 14px/1.1 var(--body); }
.sg button[aria-pressed="true"] { background: var(--accent-tint); color: var(--accent-on-tint); box-shadow: inset 0 0 0 1.5px var(--accent); }
.sg button .rec { font-size: 11px; font-weight: 800; color: var(--meadow); margin-left: 4px; }

/* Cloud pass */
#clouds { position: absolute; inset: 0; z-index: 25; pointer-events: none; display: none; }
#clouds.on { display: block; pointer-events: auto; }
#clouds img { position: absolute; max-width: none; }
</style>
</head>
<body>
<div id="app">
  <div id="wrap">
    <div id="world" aria-label="Pofu'nun adası" role="img">
      <div class="sky"></div>
      <div class="par" id="skyc"></div>
      <div class="par" id="skycB"></div>
      <div id="tilt"><div id="cam"></div><div id="tsw"><div id="camB"></div></div></div>
      <div class="sea" id="sea"></div>
      <div class="sea nofade" id="seaB"></div>
      <div class="layer" id="bokeh"></div>
      <div id="dim"></div>
      <div class="layer" id="ov"></div>
      <div class="layer" id="fx"></div>
      <div class="layer" id="hits"></div>
    </div>
  </div>

  <div id="chrome">
    <div class="top">
      <div class="pill glass" aria-label="Pofu'nun keyfi iyi"><svg width="20" height="20" viewBox="0 0 24 24"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z" fill="#E9696F"/></svg><span class="wb"><i></i></span></div>
      <span class="spacer"></span>
      <button class="pill glass pressable" id="seedBtn" aria-label="Çekirdekler"><svg width="22" height="22" viewBox="0 0 24 24"><g transform="rotate(28 12 12)"><ellipse cx="12" cy="12" rx="6" ry="10" fill="#5B4636"/><path d="M12 4v16" stroke="#F3E6D6" stroke-width="1.8" stroke-linecap="round"/></g></svg><span id="seedN">420</span></button>
      <button class="circ glass pressable" id="moreBtn" aria-label="Diğer"><svg viewBox="0 0 24 24" fill="currentColor"><circle cx="5.5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="18.5" cy="12" r="2"/></svg></button>
    </div>
    <div class="calm glass" id="calm"><svg width="24" height="24" viewBox="0 0 30 30"><circle cx="15" cy="15" r="12" fill="none" stroke="rgba(95,181,122,.25)" stroke-width="3.5"/><circle cx="15" cy="15" r="12" fill="none" stroke="#5FB57A" stroke-width="3.5" stroke-linecap="round" stroke-dasharray="45.2 75.4" transform="rotate(-90 15 15)"/></svg><b>Huzur ×1,6</b><small>büyüyor</small></div>
    <div class="ctx glass" id="ctxIsland">Ayçiçeği · 5 istasyon</div>
    <div class="ctx glass" id="ctxMap">Takımada · 5 ada</div>
    <div class="seg glass" id="seg" role="group" aria-label="Çerçeve">
      <span class="ind" id="segInd"></span>
      <button data-f="home" aria-pressed="true">Pofu</button>
      <button data-f="island" aria-pressed="false">Ada</button>
      <button data-f="map" aria-pressed="false">Harita</button>
    </div>
    <button class="tab glass" id="tabBtn" aria-label="Alternatifler"><span>Alternatifler</span></button>
    <div class="toast glass" id="toast"></div>
    <div id="hud" aria-hidden="true"></div>
    <div id="fps" aria-hidden="true"></div>
  </div>

  <div class="npc" id="npc" role="dialog" aria-label="Komşu">
    <div class="nh"><b id="npcName">Mochi</b><span id="npcSt">Çay ocağı · Seviye 2</span></div>
    <p id="npcLine">Çay demlendi.</p>
    <button class="go pressable" id="npcGo">Tezgâha git</button>
  </div>
  <div id="scrim"></div>
  <div class="morph" id="seedMorph"><div class="mp glass"><div class="mc seedp">
    <h3><svg width="32" height="32" viewBox="0 0 24 24"><g transform="rotate(28 12 12)"><ellipse cx="12" cy="12" rx="6" ry="10" fill="#5B4636"/><path d="M12 4v16" stroke="#F3E6D6" stroke-width="1.8" stroke-linecap="round"/></g></svg><span id="seedN2">420</span></h3>
    <p>Ada sen telefondan uzakken topladı. Çekirdek ekran süresi almaz; yalnızca ada için.</p>
    <div class="row"><span>Bugün</span><span>+186</span></div>
    <div class="row"><span>Huzur</span><span>×1,6</span></div>
  </div></div></div>
  <div class="morph" id="moreMorph"><div class="mp glass"><div class="mc mlist">
    <button data-act="hits"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="4" width="16" height="16" rx="4" stroke-dasharray="3 3"/></svg>Dokunma alanları</button>
    <button data-act="theme"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg>Açık / koyu</button>
    <button data-act="panel"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg>Alternatifler</button>
  </div></div></div>

  <div class="sheet" id="sheet" role="dialog" aria-label="İstasyon">
    <div class="body">
      <div class="grab"></div>
      <div class="shead"><div><h2 id="stTitle">Çay ocağı</h2><p id="stSub">Mochi'nin</p></div>
        <button class="circ glass pressable" id="sheetClose" aria-label="Kapat"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M7 7l10 10M17 7L7 17"/></svg></button></div>
      <div class="sc" id="stBody"></div>
    </div>
  </div>

  <div id="panel" role="dialog" aria-label="Alternatifler">
    <div class="body">
      <div class="grab"></div>
      <div class="ph"><h2>Alternatifler</h2><button class="circ pressable" id="panelClose" aria-label="Kapat"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" width="22" height="22"><path d="M7 7l10 10M17 7L7 17"/></svg></button></div>
      <div class="pc" id="panelBody"></div>
    </div>
  </div>

  <div id="clouds"></div>
</div>
<script src="app.js"></script>
</body>
</html>
