// The stream board as a tabletop toy: a prototype of the look, playable.
// Rules are the shipped ones (docs/design/flow-game.md); boards are the
// shipped stage 1 board 1 and stage 4 board 2. 'o' marks a cell left empty.
const BOARDS = {
  1: { start: ['S # o', '┘ └ #', '# ─ ─', 'o P o'], solved: ['S # o', '└ ┐ #', '# │ ─', 'o P o'] },
  4: { start: ['o # S # o', '# └ ┬ ┌ #', 'o ─ ├ ┘ ┌', '└ ┐ │ ┬ ─', 'G # ┘ W ┌', 'P o P # o'],
       solved: ['o # S # o', '# ┌ ┴ ┐ #', 'o │ ├ └ ┐', '┌ ┘ │ ┬ │', 'G # ┌ W ┘', 'P o P # o'] },
};
const N = 1, E = 2, S = 4, W = 8;
const GLYPH = { '│': ['straight', 0], '─': ['straight', 1], '└': ['bend', 0], '┌': ['bend', 1], '┐': ['bend', 2], '┘': ['bend', 3],
  '├': ['split', 0], '┬': ['split', 1], '┤': ['split', 2], '┴': ['split', 3], 'S': ['source', 0], 'P': ['mouth', 0], 'W': ['wheel', 0],
  'G': ['gate', 0], '#': ['rock', 0], '.': ['grass', 0], 'o': ['empty', 0] };
const BASE = { straight: N | S, gate: N | S, bend: N | E, split: N | E | S, source: S, mouth: N, wheel: E | W, rock: 0, grass: 0, empty: 0 };
const TURNS = { straight: 1, bend: 1, split: 1 };
const rotCW = o => ((o << 1) & 15) | (o >> 3);
const opp = d => (d === N ? S : d === S ? N : d === E ? W : E);
const STEP = { [N]: [-1, 0], [E]: [0, 1], [S]: [1, 0], [W]: [0, -1] };

const q = new URLSearchParams(location.hash.slice(1));
const st = { board: q.get('board') || '1', mode: q.get('mode') || 'dial', holes: q.get('holes') !== '0', seams: q.get('seams') !== '0', t: 0 };
const SHOT = !!q.get('shot'); let shots = 0;
if (SHOT) document.body.classList.add('shot');
let cells = [], rows = 0, cols = 0, wet = new Set(), solved = false, solvedAt = 0;

function load(which) {
  const b = BOARDS[st.board][which].map(r => r.split(' '));
  rows = b.length; cols = b[0].length;
  cells = b.map((r, i) => r.map((g, j) => { const [kind, rot] = GLYPH[g]; return { kind, rot, shown: rot * 90, r: i, c: j, press: 0 }; }));
  flood();
}
const at = (r, c) => (r >= 0 && r < rows && c >= 0 && c < cols ? cells[r][c] : null);
const isEmpty = x => !x || x.kind === 'empty' && st.holes;
const turnable = x => x && TURNS[x.kind];
function openings(x) { let o = BASE[x.kind]; for (let i = 0; i < x.rot % 4; i++) o = rotCW(o); return o; }
function flood() {
  wet = new Set(); const stack = [];

  g.strokeStyle = 'rgba(86,128,44,.75)'; g.lineWidth = 2 * (L.rim + 1.1); g.stroke(k);
  g.strokeStyle = STONE; g.lineWidth = 2 * L.rim; g.stroke(k);
  g.strokeStyle = 'rgba(255,255,255,.55)'; g.lineWidth = 1.6; g.stroke(k); g.restore();
}
function pill(x, y, w, h, text, bold) {
  g.save(); g.shadowColor = 'rgba(80,50,20,.25)'; g.shadowBlur = 5 * scale; g.shadowOffsetY = 1.5 * scale;
  g.fillStyle = 'rgba(255,249,238,.94)'; g.beginPath(); g.roundRect(x, y, w, h, h / 2); g.fill(); g.restore();
  g.fillStyle = '#4a3526'; g.font = (bold ? '700 ' : '600 ') + '13px ui-rounded,system-ui,sans-serif'; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText(text, x + w / 2, y + h / 2 + 0.5);
}
function hud() {
  const y = SAFE_T + 8, tg = cells.flat().filter(x => x.kind === 'mouth' || x.kind === 'wheel');
  pill(16, y, 36, 36, '✕', true);
  pill(FW / 2 - 62, y + 2, 124, 32, st.board === '1' ? 'Pano 1 / 2' : 'Pano 2 / 2', true);
  pill(FW - 16 - 66, y + 2, 66, 32, '💧 ' + tg.filter(x => wet.has(x)).length + '/' + tg.length, true);
  if (solved) pill(FW / 2 - 70, y + 44, 140, 28, 'Su yolunu buldu.', false);
}

cv.addEventListener('pointerdown', ev => {
  const dpr = cv.width / innerWidth, px = (ev.clientX * dpr - ox) / scale, py = (ev.clientY * dpr - oy) / scale;
  const x = at(Math.floor((py - L.y) / L.cell), Math.floor((px - L.x) / L.cell));
  if (!x || solved) return;
  if (turnable(x)) { x.rot += 1; x.press = 1; if (x.kind === 'straight' && x.rot % 2 === 0 && x.rot >= 4) { x.rot -= 4; x.shown -= 360; } flood(); if (navigator.vibrate) navigator.vibrate(8); }
});
function sync() {
  document.querySelectorAll('#opts button').forEach(b => b.classList.toggle('on', b.dataset.k === 'holes' ? st.holes : b.dataset.k === 'seams' ? st.seams : st[b.dataset.k] === b.dataset.v));
}
document.getElementById('opts').addEventListener('click', ev => {
  const b = ev.target.closest('button'); if (!b) return;
  const k = b.dataset.k; base = null;
  if (k === 'board') { st.board = b.dataset.v; solved = false; load('start'); layout(); }
  if (k === 'mode') st.mode = b.dataset.v;
  if (k === 'holes') st.holes = !st.holes, flood();
  if (k === 'seams') st.seams = !st.seams;
  if (k === 'solve') { solved = false; load('solved'); }
  sync();
});
addEventListener('resize', resize);
(async () => {
  await Promise.all(Object.entries(ASSETS).map(([k, src]) => new Promise(res => { const im = new Image(); im.onload = res; im.src = src; IMG[k] = im; })));
  for (const k of ['lawn', 'water', 'bed']) PAT[k] = g.createPattern(IMG[k], 'repeat');
  PAT.lawn.setTransform(new DOMMatrix().scale(0.5)); PAT.bed.setTransform(new DOMMatrix().scale(0.4));
  resize(); load(q.get('solve') ? 'solved' : 'start'); layout(); sync();
  requestAnimationFrame(frame);
})();
</script>
