<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pofu · UX prototype</title>
<style>
/* Nunito stands in for SF Pro Rounded, which cannot ship in a web prototype. */
@font-face { font-family: "Nunito"; font-weight: 200 1000; font-display: block;
  src: url("assets/fonts/nunito-latin-wght-normal.woff2") format("woff2");
  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
@font-face { font-family: "Nunito"; font-weight: 200 1000; font-display: block;
  src: url("assets/fonts/nunito-latin-ext-wght-normal.woff2") format("woff2");
  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF; }

:root {
  /* Brand: warm cream and peach from the illustration; violet stays the accent. */
  --cream: #FFF8F2;
  --peach: #FDEDE5;
  --peach-2: #F9DCCD;
  --peach-3: #F2C6B0;
  --ink: #2A2130;          /* 15.9:1 on cream */
  --ink-2: #4E424B;        /* 9.4:1 on cream */
  --ink-3: #665962;        /* 6.3:1 on cream, 4.6:1 on the darkest floor peach */
  --violet: #6C4FD8;       /* PofuPalette.violetDeep: 5.6:1 on white */
  --violet-press: #5A3FC4;
  --violet-soft: #EEE9FF;
  --violet-tint: #F6F2FF;
  --lilac: #B9A2FF;
  --gold: #E3A440;
  --seed: #3B302C;
  --plum: #1D1630;
  --plum-2: #2C2246;
  --hairline: rgba(42, 33, 48, .08);
  --glass: rgba(255, 255, 255, .62);
  --glass-strong: rgba(255, 255, 255, .82);
  --spring-pop: cubic-bezier(.34, 1.56, .64, 1);
  --font: "Nunito", ui-rounded, "SF Pro Rounded", system-ui, sans-serif;
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; }
body {
  font-family: var(--font); color: var(--ink); background: #E9E4EE;
  display: flex; align-items: center; justify-content: center; gap: 40px; min-height: 100vh;
  -webkit-font-smoothing: antialiased; font-feature-settings: "tnum" 0;
}
body.bare { background: transparent; }
button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; }

/* ---------- Device frame (iPhone 17: 402 × 874 pt) ---------- */
.device {
  position: relative; width: 426px; height: 898px; padding: 12px; border-radius: 72px;
  background: linear-gradient(145deg, #3a3340, #1a161e 40%, #2b2530);
  box-shadow: 0 0 0 1.5px #5c5462 inset, 0 40px 80px -20px rgba(40, 20, 60, .45), 0 10px 30px rgba(40, 20, 60, .2);
  flex: none;
}
body.bare .device { box-shadow: 0 0 0 1.5px #5c5462 inset; }
.screen {
  position: relative; width: 402px; height: 874px; border-radius: 60px; overflow: hidden;
  background: var(--cream); isolation: isolate;
}
.statusbar {
  position: absolute; top: 0; left: 0; right: 0; height: 54px; z-index: 50; pointer-events: none;
  display: flex; align-items: center; justify-content: space-between; padding: 6px 34px 0 50px;
  font: 600 17px/1 Inter, system-ui, sans-serif; letter-spacing: -.2px; color: var(--ink);
}
.statusbar svg { display: block; }
.statusbar .right { display: flex; gap: 7px; align-items: center; }
.screen.dark .statusbar, .screen.dark .home-ind { color: #fff; }
.island {
  position: absolute; top: 11px; left: 50%; transform: translateX(-50%); z-index: 60;
  width: 126px; height: 37px; border-radius: 20px; background: #000;
  display: flex; align-items: center; justify-content: space-between; padding: 0 12px 0 6px;
  transition: width .5s var(--spring-pop);
}
.island.live { width: 168px; }
.island .ia, .island .ib { opacity: 0; transition: opacity .3s .15s; }
.island.live .ia, .island.live .ib { opacity: 1; }
.island .ia { width: 26px; height: 26px; border-radius: 50%; overflow: hidden; background: #FDEDE5 url(assets/pofu-hamster.png) no-repeat; background-size: 40px auto; background-position: -7px -5px; }
.island .ib { font: 700 15px/1 var(--font); color: #C9B8FF; font-variant-numeric: tabular-nums; }
.home-ind {
  position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%); width: 139px; height: 5px;
  border-radius: 3px; background: currentColor; color: var(--ink); z-index: 55; cursor: pointer;
}
.home-ind::after { content: ""; position: absolute; inset: -16px -20px; }

/* ---------- Screens ---------- */
.scr { position: absolute; inset: 0; display: flex; flex-direction: column; }
.pad { padding: 62px 20px 34px; }
.fill { flex: 1; }
.center { text-align: center; }
.row { display: flex; align-items: center; }
.col { display: flex; flex-direction: column; }
.gap4 { gap: 4px; } .gap8 { gap: 8px; } .gap12 { gap: 12px; } .gap16 { gap: 16px; }

/* Type scale, mapped from iOS text styles at the default size (Large). */
.t-large, .t-title1, .t-title2, .t-title3, .t-body, .bubble { text-wrap: balance; }
.t-hero { font-size: 64px; line-height: 1; font-weight: 900; letter-spacing: -1.5px; }
.t-large { font-size: 34px; line-height: 40px; font-weight: 850; letter-spacing: -.6px; }
.t-title1 { font-size: 28px; line-height: 34px; font-weight: 850; letter-spacing: -.4px; }
.t-title2 { font-size: 22px; line-height: 28px; font-weight: 800; letter-spacing: -.2px; }
.t-title3 { font-size: 20px; line-height: 25px; font-weight: 800; }
.t-head { font-size: 17px; line-height: 22px; font-weight: 750; }
.t-body { font-size: 17px; line-height: 24px; font-weight: 550; }
.t-callout { font-size: 16px; line-height: 21px; font-weight: 600; }
.t-sub { font-size: 15px; line-height: 20px; font-weight: 600; }
.t-foot { font-size: 13px; line-height: 18px; font-weight: 650; }
.t-cap { font-size: 12px; line-height: 16px; font-weight: 750; letter-spacing: .2px; }
.c2 { color: var(--ink-2); } .c3 { color: var(--ink-3); } .cv { color: var(--violet); }
.num { font-variant-numeric: tabular-nums; }
.eyebrow { font-size: 13px; line-height: 18px; font-weight: 800; letter-spacing: .6px; text-transform: uppercase; color: var(--ink-3); }

/* Buttons: every tap target is at least 44 pt. */
.btn {
  height: 56px; border-radius: 28px; padding: 0 24px; display: flex; align-items: center; justify-content: center; gap: 8px;
  font-size: 17px; font-weight: 800; letter-spacing: -.1px; transition: transform .25s var(--spring-pop), background .2s, opacity .2s;
  position: relative; overflow: hidden; white-space: nowrap; width: 100%;
}
.btn:active { transform: scale(.96); }
.btn-primary { background: var(--violet); color: #fff; box-shadow: 0 8px 20px -6px rgba(108, 79, 216, .55), inset 0 1px 0 rgba(255,255,255,.25); }
.btn-primary:active { background: var(--violet-press); }
.btn-glass {
  background: var(--glass-strong); color: var(--ink); height: 52px;
  box-shadow: inset 0 0 0 1px rgba(255,255,255,.9), 0 1px 0 rgba(255,255,255,.6) inset, 0 6px 18px -8px rgba(80, 40, 30, .25);
  backdrop-filter: blur(20px) saturate(1.6); -webkit-backdrop-filter: blur(20px) saturate(1.6);
}
.btn-tinted { background: var(--violet-soft); color: var(--violet); height: 52px; }
.btn-text { height: 44px; width: auto; padding: 0 12px; color: var(--violet); font-weight: 800; }
.btn .fillbar { position: absolute; inset: 0; transform-origin: left; background: rgba(108,79,216,.12); transform: scaleX(var(--p, 0)); }
.btn[disabled] { cursor: default; }
.btn-glass[disabled] .lbl { opacity: .5; }
.btn .lbl { position: relative; display: flex; gap: 6px; align-items: center; }
.icon-btn {
  width: 44px; height: 44px; border-radius: 22px; display: grid; place-items: center; color: var(--ink);
  background: var(--glass); box-shadow: inset 0 0 0 1px rgba(255,255,255,.85), 0 4px 14px -6px rgba(80,40,30,.25);
  backdrop-filter: blur(18px) saturate(1.5); -webkit-backdrop-filter: blur(18px) saturate(1.5);
}
.chip {
  min-height: 44px; padding: 10px 14px; border-radius: 22px; background: #fff; color: var(--ink);
  font-size: 15px; line-height: 20px; font-weight: 700; display: inline-flex; align-items: center; gap: 8px; justify-content: center;
  box-shadow: inset 0 0 0 1px var(--hairline), 0 2px 6px -3px rgba(80,40,30,.15);
  transition: transform .25s var(--spring-pop), background .2s, box-shadow .2s, color .2s;
}
.chip:active { transform: scale(.95); }
.chip.on { background: var(--violet-tint); color: var(--violet); box-shadow: inset 0 0 0 2px var(--violet); }
.card { background: #fff; border-radius: 24px; box-shadow: 0 1px 0 rgba(255,255,255,.8) inset, 0 10px 30px -14px rgba(90, 50, 30, .25), 0 0 0 1px rgba(42,33,48,.04); }
.glass-card {
  background: rgba(255,255,255,.66); border-radius: 26px;
  box-shadow: inset 0 0 0 1px rgba(255,255,255,.9), 0 12px 32px -16px rgba(90,50,30,.3);
  backdrop-filter: blur(24px) saturate(1.6); -webkit-backdrop-filter: blur(24px) saturate(1.6);
}

/* Seed icon and the pouch capsule */
.seed { width: 1em; height: 1em; display: inline-block; vertical-align: -0.12em; flex: none; }
.pouch-cap { height: 44px; padding: 0 14px 0 10px; border-radius: 22px; display: flex; align-items: center; gap: 6px; font-weight: 850; font-size: 17px; }

/* Beads: one per reach. Filled = skipped, ring = opened. Shape and fill both differ. */
.beads { display: flex; flex-wrap: wrap; gap: 6px; }
.bead { width: 16px; height: 16px; border-radius: 50%; flex: none; }
.bead.s { background: var(--violet); box-shadow: inset 0 -2px 0 rgba(0,0,0,.12), inset 0 2px 0 rgba(255,255,255,.25); }
.bead.o { box-shadow: inset 0 0 0 2px #CFC3CB; }
.bead.new { animation: beadIn .7s var(--spring-pop) both .35s; }
@keyframes beadIn { from { transform: translateY(-26px) scale(.2); opacity: 0; } to { transform: none; opacity: 1; } }

/* ---------- Pofu ---------- */
.pofu { position: relative; width: var(--w, 260px); aspect-ratio: 508 / 471; flex: none; --cheek: .35; --close: 0; }
.pofu .shadow { position: absolute; left: 14%; right: 14%; bottom: -3%; height: 10%; border-radius: 50%;
  background: radial-gradient(closest-side, rgba(150, 80, 50, .26), rgba(150, 80, 50, 0)); }
.pofu .body { position: absolute; inset: 0; transform-origin: 50% 100%; animation: breathe 3.8s ease-in-out infinite; }
.pofu .lean { position: absolute; inset: 0; transform-origin: 50% 100%; transition: transform .6s var(--spring-pop); }
.pofu img.art { position: absolute; inset: 0; width: 100%; height: 100%; display: block; user-select: none; -webkit-user-drag: none;
  transform: scaleX(calc(1 + var(--cheek) * .035)); transition: transform .5s var(--spring-pop), filter .8s; }
@keyframes breathe { 0%, 100% { transform: scale(1, 1); } 50% { transform: scale(.994, 1.018); } }
.pofu .pouch { position: absolute; width: 27%; height: 25%; top: 41%; border-radius: 50%; pointer-events: none;
  transform: translate(-50%, 0) scale(calc(.55 + var(--cheek) * .6)); opacity: calc(.15 + var(--cheek) * .95);
  transition: transform .55s var(--spring-pop), opacity .4s;
  background:
    radial-gradient(circle at 38% 32%, rgba(255,255,255,.75), rgba(255,255,255,0) 26%),
    radial-gradient(closest-side, rgba(255,166,150,.62), rgba(255,190,172,.42) 45%, rgba(255,226,210,.0) 100%); }
.pofu .pouch.l { left: 27.8%; } .pofu .pouch.r { left: 75%; }
.pofu .lid { position: absolute; width: 15.4%; height: 16.4%; top: 35.2%;
  -webkit-mask-image: radial-gradient(closest-side, #000 82%, transparent 100%); mask-image: radial-gradient(closest-side, #000 82%, transparent 100%); pointer-events: none; }
.pofu .lid.l { left: 26.6%; } .pofu .lid.r { left: 60.5%; }
.pofu .lid .cover { position: absolute; left: 0; right: 0; top: 0; height: calc(var(--close) * 100%);
  background: linear-gradient(180deg, #F9DEC4, #FBE7D5 70%); border-radius: 0 0 50% 50% / 0 0 30% 30%;
  border-bottom: 0 solid rgba(70, 42, 34, .85); }
.pofu.m-tired .lid .cover { border-bottom-width: 3px; }
@keyframes spin { to { transform: rotate(360deg); } }
.pofu .lid.l .cover { background: linear-gradient(100deg, #F6D3B3, #FBE8D8 65%); }
.pofu .lid.r .cover { background: linear-gradient(260deg, #F7D5B2, #FCEBDA 65%); }
.pofu .lid svg { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; }
.pofu.m-sleep, .pofu.m-focus, .pofu.m-happy { --close: 1; }
.pofu.m-sleep .lid svg.sleep, .pofu.m-focus .lid svg.sleep, .pofu.m-happy .lid svg.happy { opacity: 1; }
.pofu.m-sleep .lid .cover, .pofu.m-focus .lid .cover, .pofu.m-happy .lid .cover { border-bottom-color: transparent; }
.pofu.m-tired { --close: .5; }
.pofu.m-tired img.art { filter: saturate(.55) brightness(.98); }
.pofu.m-sleep img.art { filter: brightness(.9) saturate(.85); }
.pofu.m-sleep .body { animation-duration: 6s; }
.pofu.m-focus .body { animation-duration: 5.2s; }
.pofu.blink .lid .cover { animation: blink .22s ease-in-out; }
@keyframes blink { 0%, 100% { height: calc(var(--close) * 100%); } 50% { height: 100%; } }
.pofu .zzz { position: absolute; right: 8%; top: 6%; font-weight: 900; color: var(--lilac); font-size: 26px; opacity: 0; }
.pofu.m-sleep .zzz { animation: zzz 3.6s ease-in-out infinite; }
@keyframes zzz { 0% { opacity: 0; transform: translate(0, 10px) scale(.7); } 30% { opacity: 1; } 100% { opacity: 0; transform: translate(18px, -26px) scale(1.15); } }
.pofu .tap { position: absolute; inset: 8% 10% 2%; border-radius: 50%; cursor: pointer; }

/* ---------- Scenes ---------- */
.room { position: absolute; inset: 0; background:
  radial-gradient(120% 60% at 50% 40%, #FFF6EE 0%, rgba(255,246,238,0) 70%),
  linear-gradient(180deg, #FFF3EA 0%, #FDE9DE 58%, #F8D9C8 100%); }
.room .window { position: absolute; left: 50%; top: 150px; width: 250px; height: 300px; transform: translateX(-50%);
  border-radius: 125px 125px 28px 28px; background: linear-gradient(180deg, #FFF9F3, #FFF1E6); box-shadow: inset 0 0 0 10px rgba(255,255,255,.55), inset 0 0 40px rgba(242, 198, 176, .35); }
.room .floor { position: absolute; left: -10%; right: -10%; top: 520px; height: 600px; border-radius: 50% 50% 0 0 / 50px 50px 0 0;
  background: linear-gradient(180deg, #F7DACA, #F4D0BD 30%, #F1C9B4); }
.pad > * { pointer-events: auto; }
.pad > .fill { pointer-events: none; }
.pad > .fill * { pointer-events: auto; }
/* A round storybook window: evening sky, two mullions. */
.room .win { position: absolute; left: 50%; margin-left: -46px; top: 118px; width: 92px; height: 92px; border-radius: 50%;
  background: radial-gradient(circle at 50% 120%, #FFD9B8 0%, #F7C6C9 38%, #CDBBF2 75%, #B6A6EC 100%);
  box-shadow: 0 0 0 9px #FFF8F1, 0 0 0 10px rgba(226,190,170,.6), inset 0 6px 14px rgba(90,60,120,.18); overflow: hidden; }
.room .win::before, .room .win::after { content: ""; position: absolute; background: #FFF8F1; }
.room .win::before { left: 50%; top: 0; bottom: 0; width: 6px; transform: translateX(-50%); }
.room .win::after { top: 50%; left: 0; right: 0; height: 6px; transform: translateY(-50%); }
.room .win i { position: absolute; right: 18px; top: 16px; width: 14px; height: 14px; border-radius: 50%; background: #FFF4D6; box-shadow: 0 0 12px 4px rgba(255,240,200,.7); }
.wheel { display: block; }
.wheel .spin { transform-origin: 50% 50%; transform-box: fill-box; }
.bowl { display: block; }
.bubble {
  position: relative; background: #fff; border-radius: 22px; padding: 12px 16px; font-size: 17px; line-height: 23px; font-weight: 750;
  box-shadow: 0 10px 26px -12px rgba(90,50,30,.35), 0 0 0 1px rgba(42,33,48,.04); max-width: 300px; text-align: center; text-wrap: balance;
}
.bubble::after { content: ""; position: absolute; left: 50%; bottom: -9px; width: 18px; height: 18px; background: #fff; transform: translateX(-50%) rotate(45deg); border-radius: 0 0 5px 0; }
.bubble.tap { cursor: pointer; }
.bubble.dark, .bubble.dark::after { background: #3A2D5E; color: #F4EEFF; }
.proto-link { height: 44px; padding: 0 16px; border-radius: 22px; border: 1.5px dashed currentColor; font-size: 15px; font-weight: 750; opacity: .8; align-self: center; }

/* ---------- Sheets ---------- */
.dim { position: absolute; inset: 0; background: rgba(40, 24, 30, .28); z-index: 20; animation: fadeIn .3s both; }
.sheet { position: absolute; left: 0; right: 0; bottom: 0; z-index: 30; background: rgba(255, 250, 246, .94);
  border-radius: 38px 38px 0 0; padding: 8px 20px 34px; box-shadow: 0 -10px 40px -10px rgba(60,30,30,.25), inset 0 1px 0 rgba(255,255,255,.9);
  backdrop-filter: blur(30px) saturate(1.6); -webkit-backdrop-filter: blur(30px) saturate(1.6); display: flex; flex-direction: column; }
.sheet.anim { animation: sheetUp .55s cubic-bezier(.2, 1.1, .3, 1) both; }
.sheet .grab { width: 36px; height: 5px; border-radius: 3px; background: rgba(42,33,48,.18); margin: 0 auto 10px; flex: none; }
.sheet-head { display: flex; align-items: center; justify-content: space-between; min-height: 44px; }
@keyframes sheetUp { from { transform: translateY(100%); } to { transform: none; } }
@keyframes fadeIn { from { opacity: 0; } }

/* ---------- Hop! ---------- */
.hop-bg { position: absolute; inset: 0; background: radial-gradient(90% 55% at 50% 48%, #FFF7F0 0%, #FDE8DC 60%, #F9D9C9 100%); }
.hop-chip { align-self: center; height: 36px; padding: 0 14px 0 6px; border-radius: 18px; display: flex; align-items: center; gap: 8px;
  font-size: 15px; font-weight: 750; color: var(--ink-2); background: rgba(255,255,255,.7); box-shadow: inset 0 0 0 1px rgba(255,255,255,.9); }
.appicon { width: 24px; height: 24px; border-radius: 7px; flex: none; display: grid; place-items: center; color: #fff; }
.app-ig { background: radial-gradient(circle at 30% 107%, #fdf497 0%, #fd5949 45%, #d6249f 60%, #285AEB 90%); }
.app-yt { background: #FF2D2D; }
.app-tt { background: #111; }
.hop-word { color: var(--violet); }
.breath-ring { position: absolute; left: 50%; top: 50%; width: 300px; height: 300px; border-radius: 50%; transform: translate(-50%, -50%) scale(var(--b, .8));
  background: radial-gradient(closest-side, rgba(185,162,255,.0) 60%, rgba(185,162,255,.28) 80%, rgba(185,162,255,0) 100%); }
.reason-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.reason-grid .chip { justify-content: flex-start; text-align: left; padding: 10px 14px; border-radius: 18px; }
.price-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.price { height: 84px; border-radius: 20px; background: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
  box-shadow: inset 0 0 0 1px var(--hairline), 0 4px 12px -6px rgba(80,40,30,.2); transition: transform .25s var(--spring-pop); }
.price:active { transform: scale(.95); }
.price .m { font-size: 15px; font-weight: 750; color: var(--ink-2); }
.price .p { font-size: 22px; font-weight: 900; display: flex; align-items: center; gap: 4px; }
.price.on { background: var(--violet-tint); box-shadow: inset 0 0 0 2.5px var(--violet); }
.price.on .m { color: var(--violet); }
.price.na { opacity: .45; }
.sparkle { position: absolute; width: 14px; height: 14px; pointer-events: none; }
.night { background: radial-gradient(90% 60% at 50% 45%, #3A2C5C 0%, #241B3B 55%, #17112A 100%); color: #F4EEFF; }
.night .c2 { color: #CBBFE6; } .night .c3 { color: #A99CC7; }
.night .btn-primary { background: #B9A2FF; color: #1D1630; box-shadow: 0 8px 22px -8px rgba(185,162,255,.6); }
.night .btn-glass { background: rgba(255,255,255,.1); color: #F4EEFF; box-shadow: inset 0 0 0 1px rgba(255,255,255,.14); }
.stars i { position: absolute; width: 3px; height: 3px; border-radius: 50%; background: #fff; opacity: .6; }

/* ---------- Simulated surfaces (not Pofu) ---------- */
.springboard { background: linear-gradient(160deg, #F3B9A6 0%, #C9A6E8 55%, #8E7FD6 100%); }
.sb-grid { display: grid; grid-template-columns: repeat(4, 64px); gap: 26px 26px; justify-content: center; padding-top: 80px; }
.sb-app { display: flex; flex-direction: column; align-items: center; gap: 6px; font: 500 12px/1 Inter, system-ui; color: #fff; text-shadow: 0 1px 2px rgba(0,0,0,.25); cursor: pointer; }
.sb-app .ic { width: 64px; height: 64px; border-radius: 16px; display: grid; place-items: center; box-shadow: 0 4px 10px rgba(0,0,0,.15); transition: transform .3s var(--spring-pop); }
.sb-app:active .ic { transform: scale(.9); }
.sim-label { position: absolute; left: 50%; transform: translateX(-50%); bottom: 30px; font: 600 12px/1 Inter, system-ui; color: rgba(255,255,255,.85); background: rgba(0,0,0,.25); padding: 7px 12px; border-radius: 12px; white-space: nowrap; }
.feed-sim { background: #fff; }
.feed-sim .sk { background: #EEEEF0; border-radius: 10px; }
.ios-list { background: #F2F2F7; font-family: Inter, system-ui, sans-serif; color: #000; }

/* ---------- Charts ---------- */
.bars { display: flex; align-items: flex-end; gap: 2px; height: 72px; }
.bars .b { flex: 1; background: #DCD3F8; border-radius: 4px 4px 0 0; min-height: 3px; position: relative; }
.bars .b.hi { background: var(--violet); }
.bars .b:hover { filter: brightness(.92); }
.axis { display: flex; justify-content: space-between; font-size: 12px; font-weight: 700; color: var(--ink-3); margin-top: 6px; }
.hbar { height: 10px; border-radius: 5px; background: #DCD3F8; }

/* ---------- Panel (outside the device) ---------- */
.panel { width: 300px; max-height: 898px; overflow: auto; font-family: Inter, system-ui, sans-serif; font-size: 13px; color: #3b3340;
  background: rgba(255,255,255,.7); border-radius: 22px; padding: 18px; box-shadow: 0 10px 30px -14px rgba(40,20,60,.3); }
.panel h1 { font: 800 18px/1.2 var(--font); margin-bottom: 4px; }
.panel h2 { font-size: 11px; text-transform: uppercase; letter-spacing: .8px; color: #8a7f8f; margin: 16px 0 6px; }
.panel a { display: block; padding: 6px 10px; border-radius: 9px; color: inherit; text-decoration: none; }
.panel a:hover { background: rgba(108,79,216,.08); }
.panel a.on { background: var(--violet); color: #fff; }
.panel .seg { display: inline-flex; background: #ece7f1; border-radius: 10px; padding: 3px; gap: 2px; }
.panel .seg button { padding: 5px 12px; border-radius: 8px; font-size: 12px; font-weight: 700; }
.panel .seg button.on { background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.12); }
body.bare .panel { display: none; }

@media (prefers-reduced-motion: reduce) { .pofu .body { animation: none; } }
body.static *, body.static *::before, body.static *::after { animation-duration: 0s !important; animation-delay: 0s !important; transition: none !important; }

/* Turkish suffixes follow vowel harmony and consonant assimilation, so they
   cannot be hard-coded next to a number or a name. Locative (-de/-da/-te/-ta)
   for a number, decided by how its last word is pronounced. */
function trLoc(n) {
  const units = ["da", "de", "de", "te", "te", "te", "da", "de", "de", "da"];
  const tens = ["", "da", "de", "da", "ta", "de", "ta", "te", "de", "da"];
  if (n % 10) return units[n % 10];
  if (n % 100) return tens[(n % 100) / 10];
  return n === 0 ? "da" : "de";
}

/* ---------- Springs: real damped-spring curves as CSS linear() easings ---------- */
function spring({ stiffness = 180, damping = 18, mass = 1, from = 0, velocity = 0 } = {}) {
  let x = from, v = velocity, t = 0; const dt = 1 / 120, pts = [x]; let calm = 0;
  while (t < 2.5) {
    const f = -stiffness * (x - 1) - damping * v; v += (f / mass) * dt; x += v * dt; t += dt;
    if (pts.length < 400 && Math.round(t * 120) % 2 === 0) pts.push(+x.toFixed(4));
    if (Math.abs(x - 1) < 0.0015 && Math.abs(v) < 0.02) { if (++calm > 10) break; } else calm = 0;
  }
  pts.push(1);
  return { easing: `linear(${pts.join(",")})`, duration: Math.round(t * 1000) };
}

const appIcon = (k, size = 24) => `<span class="appicon app-${k}" style="width:${size}px;height:${size}px;border-radius:${size * .28}px">${I[k]}</span>`;

/* ---------- Components ---------- */
function pofu({ w = 260, mood = "", cheek = .35, cls = "", id = "" } = {}) {
  const lidSvg = `<svg class="sleep" viewBox="0 0 100 100"><path d="M18 46 Q50 72 82 46" stroke="#4A2F27" stroke-width="7" fill="none" stroke-linecap="round"/></svg><svg class="happy" viewBox="0 0 100 100"><path d="M18 62 Q50 28 82 62" stroke="#4A2F27" stroke-width="7.5" fill="none" stroke-linecap="round"/></svg>`;
  return `<div class="pofu ${mood ? "m-" + mood : ""} ${cls}" ${id ? `id="${id}"` : ""} style="--w:${w}px;--cheek:${cheek}">
    <div class="shadow"></div>
    <div class="lean"><div class="body">
      <img class="art" src="assets/pofu-hamster.png" alt="${S.name}, a round fluffy hamster">
      <div class="pouch l"></div><div class="pouch r"></div>
      <div class="lid l"><div class="cover"></div>${lidSvg}</div><div class="lid r"><div class="cover"></div>${lidSvg}</div>
    </div></div>
    <div class="zzz">z</div><div class="tap"></div>
  </div>`;
}
const cheekFor = (b) => b < 10 ? .05 : b < 40 ? .35 : b < 90 ? .65 : 1;
function beads(list, newLast = false, size = 16) {
  return `<div class="beads" role="img" aria-label="${list.filter(b => b === "S").length} of ${list.length} reaches skipped">${list.map((b, i) => `<span class="bead ${b === "S" ? "s" : "o"} ${newLast && i === list.length - 1 ? "new" : ""}" style="width:${size}px;height:${size}px"></span>`).join("")}</div>`;
}
function wheel(size, { spin = false, opacity = 1, id = "" } = {}) {
  const spokes = Array.from({ length: 8 }, (_, i) => { const a = i * Math.PI / 4; return `<line x1="100" y1="100" x2="${100 + 78 * Math.cos(a)}" y2="${100 + 78 * Math.sin(a)}"/>`; }).join("");
  const rungs = Array.from({ length: 28 }, (_, i) => { const a = i * Math.PI * 2 / 28; return `<line x1="${100 + 70 * Math.cos(a)}" y1="${100 + 70 * Math.sin(a)}" x2="${100 + 86 * Math.cos(a)}" y2="${100 + 86 * Math.sin(a)}"/>`; }).join("");
  return `<svg ${id ? `id="${id}"` : ""} class="wheel" width="${size}" height="${size * 1.2}" viewBox="0 0 200 240" style="opacity:${opacity}" aria-hidden="true">
    <path d="M100 100 L52 232 M100 100 L148 232" stroke="#D9C6F7" stroke-width="9" stroke-linecap="round"/>
    <ellipse cx="100" cy="232" rx="66" ry="6" fill="#E9D9F7"/>
    <g class="spin" ${spin ? 'style="animation:spin 1.1s linear infinite"' : ""}>
      <circle cx="100" cy="100" r="88" fill="rgba(255,255,255,.35)" stroke="#CBB8FA" stroke-width="7"/>
      <circle cx="100" cy="100" r="70" fill="none" stroke="#CBB8FA" stroke-width="4"/>
      <g stroke="#D7C8FB" stroke-width="3.5" stroke-linecap="round">${rungs}</g>
      <g stroke="#E1D5FC" stroke-width="3" stroke-linecap="round">${spokes}</g>
    </g>
    <circle cx="100" cy="100" r="9" fill="#B9A2FF"/>
  </svg>`;
}
function bowl(w = 70) {
  const seeds = [[-16, -3, -30], [-6, -7, 10], [5, -4, -15], [15, -6, 25], [-1, -11, 40], [10, -11, -5]].map(([x, y, r]) =>
    `<g transform="translate(${35 + x} ${16 + y}) rotate(${r}) scale(.42)"><path d="M0 -11C4.4 -7.2 6.6 -1.4 5.3 4.3 4.4 8.2-4.4 8.2-5.3 4.3-6.6-1.4-4.4-7.2 0-11Z" fill="#3B302C"/><path d="M-2 -6C-3 -2-3 2-1.8 6M2 -6C3 -2 3 2 1.8 6" stroke="#F4E7D3" stroke-width="1.3" fill="none"/></g>`).join("");
  return `<svg class="bowl" width="${w}" height="${w * .5}" viewBox="0 0 70 35" aria-hidden="true">${seeds}<path d="M3 14h64c0 11-10 19-32 19S3 25 3 14z" fill="#B9A2FF"/><path d="M3 14h64" stroke="#CDB9FF" stroke-width="3" stroke-linecap="round"/><path d="M10 20c4 6 12 9 25 9" stroke="#fff" stroke-opacity=".35" stroke-width="2.5" fill="none" stroke-linecap="round"/></svg>`;
}
const sparkleSvg = (c) => `<svg viewBox="0 0 24 24" width="100%" height="100%"><path d="M12 1.5c.7 5.2 3.3 7.8 10.5 10.5-7.2 2.7-9.8 5.3-10.5 10.5C11.3 17.3 8.7 14.7 1.5 12 8.7 9.3 11.3 6.7 12 1.5z" fill="${c}"/></svg>`;
function speech(text, id = "") { return `<div class="bubble" ${id ? `id="${id}"` : ""}>${text}</div>`; }

/* Hop! shared frame */
function hopFrame({ rung, q, stage, actions, chipN = 1, night = false, note = true }) {
  return `<div class="scr pad ${night ? "night dark" : ""}" data-rung="${rung}">
    ${night ? `<div class="hop-bg night"></div><div class="stars" style="position:absolute;inset:0">${[[40, 120], [330, 90], [300, 200], [70, 260], [360, 330], [24, 420], [200, 70]].map(([x, y]) => `<i style="left:${x}px;top:${y}px"></i>`).join("")}</div>` : `<div class="hop-bg"></div>`}
    <div class="hop-chip" style="position:relative;${night ? "background:rgba(255,255,255,.1);color:#CBBFE6;box-shadow:none" : ""}">${appIcon("ig", 24)}${chipN ? t("reachChip", "Instagram", t("nth")[chipN]) : "Instagram"}</div>
    <div class="col center" style="position:relative;margin-top:18px;gap:2px">
      <div class="t-hero hop-word" id="hw" style="${night ? "color:#C9B8FF" : ""}">${t("hop")}</div>
      ${q ? `<div class="t-title2" style="margin-top:6px">${q}</div>` : ""}
    </div>
    <div class="fill col" style="align-items:center;justify-content:center;position:relative" id="stage">${stage}</div>
    <div class="col gap8" style="position:relative">
      ${actions}
      ${note ? `<p class="t-foot c3 center" style="margin-top:2px">${t("swipeNote")}</p>` : ""}
    </div>
  </div>`;
}
function hopIn(v) {
  anim(v.querySelector("#hw"), [{ transform: "scale(.4)", opacity: 0 }, { transform: "none", opacity: 1 }], SPR.pop);
  anim(v.querySelector("#p"), [{ transform: "translateY(90px) scale(.7)" }, { transform: "none" }], spring({ stiffness: 240, damping: 14 }));
  const l = v.querySelector("#p .lean"); if (l) l.style.transform = "rotate(-5deg) translateX(-4px)";
  hapticNote(v, "rigid");
}
function neverBtn() { return `<button class="btn btn-primary" data-skip>${t("never")}</button>`; }
function wireSkip(v) { v.querySelectorAll("[data-skip]").forEach(b => b.onclick = () => { S.beads.push("S"); go("hop-skipped", { fresh: true }); }); }

def("hop-pause", "Hop!", "Rung 1 · Pause", () => hopFrame({
  rung: "pause", q: t("pauseQ"), chipN: 0,
  stage: `<div class="breath-ring" id="ring" style="--b:${STATIC ? 1 : .8}"></div>
    <div style="position:absolute;left:50%;top:50%;transform:translate(-50%,-52%);opacity:.5">${wheel(280, { spin: !STATIC })}</div>
    ${pofu({ w: 250, cheek: cheekFor(S.balance), id: "p" })}
    <div class="t-title3 c2" id="bcap" style="position:absolute;bottom:2px">${STATIC ? t("breatheOut") : t("breatheIn")}</div>`,
  actions: `<button class="btn btn-glass" id="open" disabled style="--p:${STATIC ? .62 : 0}"><span class="fillbar"></span><span class="lbl">${t("openFor", 5)}</span></button>${neverBtn()}`,
}), (v) => {
  hopIn(v); wireSkip(v);
  const ring = v.querySelector("#ring"), cap = v.querySelector("#bcap"), open = v.querySelector("#open"), p = v.querySelector("#p .body");
  if (STATIC) { p.style.transform = "scale(1.06)"; return; }
  const T0 = performance.now(), IN = 2500, OUT = 2500;
  (function tick(now) {
    if (!document.body.contains(open)) return;
    const e = now - T0, k = Math.min(1, e / (IN + OUT));
    const b = e < IN ? e / IN : 1 - (e - IN) / OUT, ease = .5 - Math.cos(Math.max(0, Math.min(1, b)) * Math.PI) / 2;
    ring.style.setProperty("--b", .78 + ease * .3); p.style.transform = `scale(${1 + ease * .08})`; p.style.animation = "none";
    open.style.setProperty("--p", k); cap.textContent = e < IN ? t("breatheIn") : e < IN + OUT ? t("breatheOut") : t("breathDone");
    if (k < 1) requestAnimationFrame(tick); else { open.disabled = false; open.onclick = () => handoff(5); anim(open, [{ transform: "scale(.97)" }, { transform: "none" }]); }
  })(T0);
});

/* ---------- Behaviours ---------- */
function celebrate(p, stage, fromX = 0) {
  if (!p || STATIC) return;
  const lean = p.querySelector(".lean");
  // Crouch, hop (off the wheel when fromX is set), land with a squish.
  lean.animate([
    { transform: `translateX(${fromX}px) scale(1,1)`, offset: 0 }, { transform: `translateX(${fromX}px) scale(1.1,.86)`, offset: .16 },
    { transform: `translateX(${fromX * .45}px) translateY(-52px) scale(.94,1.1)`, offset: .42 },
    { transform: `translateX(${fromX * .15}px) translateY(-44px) scale(1,1)`, offset: .55 }, { transform: "translateY(0) scale(1.1,.88)", offset: .78 }, { transform: "scale(1,1)", offset: 1 },
  ], { duration: fromX ? 1000 : 900, easing: "cubic-bezier(.3,.7,.4,1)" });
  const cols = ["#B9A2FF", "#F2B9A0", "#6C4FD8", "#FFD38A"];
  for (let i = 0; i < 12; i++) {
    const s = document.createElement("div"); s.className = "sparkle"; s.innerHTML = sparkleSvg(cols[i % 4]);
    const sz = 10 + (i * 7) % 12; s.style.width = s.style.height = sz + "px";
    s.style.left = "50%"; s.style.top = "50%"; stage.appendChild(s);
    const a = (i / 12) * Math.PI * 2 + .3, r = 120 + (i * 37) % 60;
    s.animate([{ transform: "translate(-50%,-50%) scale(.2)", opacity: 0 }, { transform: `translate(calc(-50% + ${Math.cos(a) * r * .6}px), calc(-50% + ${Math.sin(a) * r * .6}px)) scale(1.1)`, opacity: 1, offset: .5 }, { transform: `translate(calc(-50% + ${Math.cos(a) * r}px), calc(-50% + ${Math.sin(a) * r}px)) scale(.4) rotate(90deg)`, opacity: 0 }],
      { duration: 1100, delay: 250, easing: "cubic-bezier(.2,.8,.3,1)", fill: "both" }).onfinish = () => s.remove();
  }
}
function flySeed(v, from, to, big = false) {
  if (STATIC || !from || !to) return;
  const scr = document.getElementById("screen").getBoundingClientRect(), a = from.getBoundingClientRect(), b = to.getBoundingClientRect();
  const s = document.createElement("div"); s.innerHTML = I.seed; s.style.cssText = `position:absolute;z-index:40;font-size:${big ? 28 : 20}px;left:${a.left - scr.left + a.width / 2}px;top:${a.top - scr.top + a.height / 2}px;pointer-events:none`;
  document.getElementById("screen").appendChild(s);
  const dx = b.left + b.width * .52 - a.left - a.width / 2, dy = b.top + b.height * .6 - a.top - a.height / 2;
  s.animate([{ transform: "translate(-50%,-50%) scale(.6)", opacity: 0 }, { transform: `translate(calc(-50% + ${dx * .5}px), calc(-50% + ${dy * .5 - 80}px)) scale(1.1) rotate(160deg)`, opacity: 1, offset: .5 }, { transform: `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px)) scale(.3) rotate(320deg)`, opacity: .2 }],
    { duration: 520, easing: "cubic-bezier(.3,.1,.6,1)", fill: "both" }).onfinish = () => s.remove();
}
function handoff(mins) { S.passMin = mins; go("hop-handoff"); }
function setIsland(on) { const i = document.getElementById("island"); i.classList.toggle("live", on);
  clearInterval(setIsland.iv); if (on && !STATIC) { let s = S.passMin * 60 - 2; setIsland.iv = setInterval(() => { s--; document.getElementById("islandTime").textContent = `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`; }, 1000); } }
function hapticNote() { /* Haptics are specified in docs/product/ux/user-flows.md; a browser cannot play them. */ }
function idle(v) {
  const p = v.querySelector("#p"); if (!p) return;
  p.querySelector(".tap").onclick = () => { anim(p.querySelector(".lean"), [{ transform: "scale(1.12,.86)" }, { transform: "none" }], spring({ stiffness: 420, damping: 10 })); };
  anim(v.querySelector("#bub"), [{ transform: "translateY(8px) scale(.85)", opacity: 0 }, { transform: "none", opacity: 1 }], SPR.pop, { delay: 200 });
}
function blinkLoop() { if (STATIC) return; const ps = document.querySelectorAll("#view .pofu:not(.m-sleep):not(.m-focus):not(.m-happy)"); ps.forEach(p => { p.classList.remove("blink"); void p.offsetWidth; p.classList.add("blink"); }); setTimeout(blinkLoop, 2800 + Math.random() * 2600); }

/* ---------- Router ---------- */
let current = null;
function go(id, o = {}) {
  if (!SCREENS[id]) id = "home";
  if (id === "hop-skipped" && !o.fresh && !o.instant) S.beads.push("S");
  current = id;
  const sc = SCREENS[id], v = document.getElementById("view");
  v.innerHTML = sc.render();
  document.getElementById("screen").classList.toggle("dark", !!(sc.dark || id === "springboard"));
  if (!sc.island) setIsland(false);
  v.querySelectorAll("[data-go]").forEach(b => b.addEventListener("click", (e) => { e.stopPropagation(); go(b.dataset.go); }));
  sc.mount(v, o);
  if (!o.instant && !STATIC && !["earn", "store", "recap"].includes(id)) v.firstElementChild?.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 220, easing: "ease-out" });
  document.querySelectorAll("#nav a").forEach(a => a.classList.toggle("on", a.dataset.s === id));
  const u = new URL(location); u.searchParams.set("screen", id); if (LANG === "tr") u.searchParams.set("lang", "tr"); else u.searchParams.delete("lang"); history.replaceState(null, "", u);
}
function buildNav() {
  const groups = {};
  Object.values(SCREENS).forEach(s => (groups[s.group] ||= []).push(s));
  document.getElementById("nav").innerHTML = Object.entries(groups).map(([g, list]) => `<h2>${g}</h2>${list.map(s => `<a href="#" data-s="${s.id}">${s.label}</a>`).join("")}`).join("");
  document.querySelectorAll("#nav a").forEach(a => a.onclick = (e) => { e.preventDefault(); if (a.dataset.s.startsWith("hop-") && a.dataset.s !== "hop-skipped") S.reason = -1; go(a.dataset.s); });
  document.querySelectorAll("#langSeg button").forEach(b => { b.classList.toggle("on", b.dataset.l === LANG); b.onclick = () => { LANG = b.dataset.l; document.documentElement.lang = LANG; buildNav(); go(current, { instant: true }); }; });
}
document.getElementById("homeInd").onclick = () => go(current === "springboard" ? "home" : "springboard");
document.getElementById("reset").onclick = (e) => { e.preventDefault(); S = JSON.parse(JSON.stringify(INIT)); go("onb-welcome"); };
document.documentElement.lang = LANG;
if (Q.get("reason")) S.reason = +Q.get("reason");
if (Q.get("balance")) S.balance = +Q.get("balance");
document.fonts.ready.then(() => { buildNav(); go(Q.get("screen") || "onb-welcome"); setTimeout(blinkLoop, 2000); });
</script>
