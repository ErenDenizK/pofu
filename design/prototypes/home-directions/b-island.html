<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pofu Home · B. The island that grows</title>
<link rel="stylesheet" href="home.css">
<style>
  .isle { animation: isleBob 7s ease-in-out infinite; }
  @keyframes isleBob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
  .far-isle { animation: isleBob 9s ease-in-out infinite; }
  .pofu { animation: pofuBob 7s ease-in-out infinite; }
  @keyframes pofuBob { 0%, 100% { translate: 0 0; } 50% { translate: 0 -5px; } }
  .cloudsea { animation: seaDrift 40s ease-in-out infinite alternate; }
  @keyframes seaDrift { from { transform: translateX(-14px); } to { transform: translateX(14px); } }
  .fall { stroke-dasharray: 10 14; animation: fall 1.1s linear infinite; }
  @keyframes fall { to { stroke-dashoffset: -24; } }
  .new-sprout .spark { animation: spark 2.6s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
  @keyframes spark { 0%, 100% { opacity: .15; transform: scale(.6); } 50% { opacity: 1; transform: scale(1); } }
  .root { transform-box: fill-box; transform-origin: 50% 0; animation: rootSway 6s ease-in-out infinite; }
  @keyframes rootSway { 0%, 100% { transform: rotate(-3deg); } 50% { transform: rotate(3deg); } }
  .petal-glow { animation: glowPulse 3.4s ease-in-out infinite; }
  .ffly { animation: float2 var(--d, 7s) ease-in-out infinite, glowPulse 2.4s ease-in-out infinite; animation-delay: var(--dl, 0s); }
  .vit-wilting .world > svg { filter: saturate(.7); }
  .cloudpuff { animation: driftCloud var(--d, 90s) linear infinite; animation-delay: var(--dl, 0s); }
  @keyframes driftCloud { from { transform: translateX(-160px); } to { transform: translateX(540px); } }
</style>
</head>
<body>
<div id="device"><div id="screen"></div></div>
<aside id="panel"></aside>
<script src="home.js"></script>
<script>
const PAL = {
  day:   { sky: ['#9FD0EC', '#C4E3F1', '#EAF1EC', '#FBEBDD'], sea: '#FFFFFF', seaShade: '#E3EEF6', grass: ['#B5E09A', '#7DBE74'], lip: '#5E9E6A', soil: ['#E2B386', '#B97E57', '#8E5A3E'], strata: '#F0CFA6', far: '#BFD7DF' },
  night: { sky: ['#15111C', '#221B3B', '#33295E', '#4A3C7A'], sea: '#4B4180', seaShade: '#2E2752', grass: ['#3F6A5A', '#24423C'], lip: '#1C3330', soil: ['#5C4256', '#463247', '#33233A'], strata: '#715470', far: '#3A3466' },
  wilt:  { sky: ['#CBC7D3', '#D9D5DD', '#E6E2E4', '#EEE8E3'], sea: '#F4F2F4', seaShade: '#DDDAE2', grass: ['#BDCDA7', '#93A987'], lip: '#7E9478', soil: ['#D9BBA0', '#B08A6E', '#8C6A55'], strata: '#E6D2BC', far: '#CDD1D8' },
};

// ---------- plants (stand-ins for painted props; each species has sprout / bud / bloom) ----------
function stem(h, droop, col = '#5E9E5C') { const dx = droop ? 7 : 0; return `<path d="M0 0 Q ${dx * .3} ${-h * .55} ${dx} ${-h}" stroke="${col}" stroke-width="2.2" fill="none" stroke-linecap="round"/>`; }
function leaves(h, col = '#79B771') { return `<path d="M0 ${-h * .3} q -9 -4 -11 -11 q 8 1 11 8z" fill="${col}"/><path d="M0 ${-h * .42} q 9 -4 11 -11 q -8 1 -11 8z" fill="${col}" opacity=".9"/>`; }
const PLANT = {
  sprout(o) { return `<g class="${o.isNew ? 'new-sprout' : ''}"><path d="M0 0v-8" stroke="#5E9E5C" stroke-width="2" stroke-linecap="round"/><path d="M0 -7 q -8 -2 -9 -9 q 7 0 9 7z" fill="#8FD07A"/><path d="M0 -8 q 8 -3 10 -10 q -8 0 -10 8z" fill="#A6DE8C"/>${o.isNew ? `<g class="spark" style="animation-delay:${o.i * -0.37}s"><path d="M8 -22 l1.4 3.2 3.2 1.4 -3.2 1.4 -1.4 3.2 -1.4 -3.2 -3.2 -1.4 3.2 -1.4z" fill="${o.night ? '#F7E08A' : '#FFFFFF'}"/></g>` : ''}</g>`; },
  daisy(o) {
    const h = 26, top = o.droop ? `translate(7 ${-h + 2}) rotate(40)` : `translate(0 ${-h})`;
    const petals = o.closed ? `<ellipse cx="0" cy="-3" rx="4" ry="6" fill="#F4EFE6"/>` : [0, 45, 90, 135, 180, 225, 270, 315].map((a) => `<ellipse cx="0" cy="-7" rx="3" ry="6" fill="#FFFFFF" transform="rotate(${a})"/>`).join('') + `<circle r="4" fill="#F5B83D"/><circle cx="-1" cy="-1" r="1.6" fill="#FFE1A0"/>`;
    return stem(h, o.droop) + leaves(h) + `<g transform="${top}">${o.glow ? `<circle r="13" fill="#FFF3C2" opacity=".55" class="petal-glow" filter="url(#glow)"/>` : ''}${petals}</g>`;
  },
  tulip(o) {
    const h = 28, top = o.droop ? `translate(8 ${-h + 3}) rotate(50)` : `translate(0 ${-h})`;
    const head = o.closed ? `<path d="M-4 0 q 0 -12 4 -14 q 4 2 4 14 z" fill="#E9A99A"/>` : `<path d="M-8 -2 q -1 -12 3 -14 q 3 5 5 6 q 2 -1 5 -6 q 4 2 3 14 q -8 6 -16 0z" fill="#F6A290"/><path d="M-3 -4 q 3 -10 3 -10 q 1 0 3 10z" fill="#FDC1B0" opacity=".8"/>`;
    return stem(h, o.droop) + `<path d="M0 0 q -10 -8 -8 -20 q 6 6 8 18z" fill="#79B771"/>` + `<g transform="${top}">${o.glow ? `<circle cy="-6" r="13" fill="#FFC9B8" opacity=".5" class="petal-glow" filter="url(#glow)"/>` : ''}${head}</g>`;
  },
  lavender(o) {
    const h = 32; return `<g ${o.droop ? 'transform="rotate(16)"' : ''}>${[-5, 0, 5].map((dx, k) => `<path d="M${dx * .4} 0 Q ${dx} ${-h * .5} ${dx * 1.4} ${-h + k * 3}" stroke="#6E9A62" stroke-width="1.6" fill="none"/>${[0, 1, 2, 3, 4].map((j) => `<ellipse cx="${dx * 1.4 - j * dx * .05}" cy="${-h + k * 3 + j * 4}" rx="2.4" ry="3" fill="${o.closed ? '#B8AFC8' : ['#B9A2FF', '#A58BEA', '#C9B5F2'][j % 3]}"/>`).join('')}`).join('')}${o.glow ? `<ellipse cx="0" cy="${-h + 6}" rx="12" ry="14" fill="#C9B5F2" opacity=".45" class="petal-glow" filter="url(#glow)"/>` : ''}</g>`;
  },
  mushroom(o) {
    return `<path d="M-5 0 q -1 -10 1 -14 h 8 q 2 4 1 14 z" fill="#FBEBDD"/><path d="M-5 -6 q 5 2 10 0" stroke="#E6CDB8" stroke-width="1" fill="none"/><path d="M-15 -13 q 1 -14 15 -15 q 14 1 15 15 q -15 4 -30 0z" fill="url(#cap)"/><circle cx="-6" cy="-21" r="2.4" fill="#FFF6EC"/><circle cx="5" cy="-24" r="1.8" fill="#FFF6EC"/><circle cx="9" cy="-17" r="2" fill="#FFF6EC"/>${o.glow ? `<ellipse cx="0" cy="-18" rx="18" ry="12" fill="#FFB49E" opacity=".4" class="petal-glow" filter="url(#glow)"/>` : ''}`;
  },
  tree(o) {
    const blossoms = o.closed ? '' : [[-14, -52], [10, -60], [18, -44], [-4, -40], [-20, -38], [4, -70]].map(([x, y]) => `<circle cx="${x}" cy="${y}" r="2.6" fill="#FDD9CF"/>`).join('');
    return `<path d="M-3 0 q -1 -18 1 -30 h 4 q 2 12 1 30z" fill="#A8744E"/><path d="M0 -24 q 8 -6 12 -14" stroke="#A8744E" stroke-width="2.5" fill="none"/>
      <circle cx="-14" cy="-44" r="16" fill="url(#leafA)"/><circle cx="12" cy="-48" r="18" fill="url(#leafB)"/><circle cx="-2" cy="-62" r="17" fill="url(#leafA)"/>${blossoms}`;
  },
  bush(o) { return `<ellipse cx="0" cy="-9" rx="16" ry="11" fill="url(#leafB)"/><ellipse cx="-7" cy="-13" rx="9" ry="8" fill="url(#leafA)"/>${o.closed ? '' : '<circle cx="6" cy="-12" r="2.2" fill="#F6A290"/><circle cx="-3" cy="-6" r="2.2" fill="#F6A290"/><circle cx="10" cy="-5" r="2" fill="#F6A290"/>'}`; },
};
function plant(type, x, y, s, o = {}) {
  const sway = type === 'tree' || type === 'bush' || type === 'mushroom' ? '' : `class="sway-soft" style="animation-delay:${-((x * 7) % 50) / 10}s"`;
  return `<g transform="translate(${x} ${y}) scale(${s})"><g ${sway}>${PLANT[type](o)}</g></g>`;
}

function cloudPuff(x, y, s, col, o = 1, d = 100, dl = 0) {
  return `<g class="cloudpuff" style="--d:${d}s;--dl:${dl}s"><g transform="translate(${x} ${y}) scale(${s})" opacity="${o}" filter="url(#soft)"><ellipse cx="0" cy="8" rx="50" ry="13" fill="${col}"/><circle cx="-18" cy="0" r="16" fill="${col}"/><circle cx="8" cy="-6" r="21" fill="${col}"/><circle cx="30" cy="3" r="13" fill="${col}"/></g></g>`;
}

function island(P, cx, cy, rx, opts = {}) {
  const ry = rx * (opts.ry || 0.34), depth = rx * (opts.depth || 0.64);
  const L = cx - rx, R = cx + rx;
  const under = `M${L} ${cy} C ${L + 2} ${cy + depth * .45}, ${cx - rx * .55} ${cy + depth * .7}, ${cx - rx * .18} ${cy + depth * .95} Q ${cx} ${cy + depth * 1.08} ${cx + rx * .18} ${cy + depth * .93} C ${cx + rx * .6} ${cy + depth * .68}, ${R - 2} ${cy + depth * .45}, ${R} ${cy} Z`;
  const id = opts.id || 'main';
  let g = `<clipPath id="uc-${id}"><path d="${under}"/></clipPath>
    <path d="${under}" fill="url(#soil)"/>
    <g clip-path="url(#uc-${id})" opacity=".55">
      ${[0.18, 0.36, 0.56].map((k, i) => `<path d="M${L - 10} ${cy + depth * k} Q ${cx - rx * .4} ${cy + depth * k + 10}, ${cx} ${cy + depth * k + 2} T ${R + 10} ${cy + depth * k + 4}" stroke="${P.strata}" stroke-width="${6 - i}" fill="none" opacity="${.7 - i * .15}"/>`).join('')}
      <path d="${under}" fill="url(#soilShade)"/>
    </g>`;
  if (!opts.simple) {
    // pebbles, roots, Pofu's burrow window (he sleeps inside the island)
    g += [[-.55, .2, 5], [.42, .3, 4], [-.2, .52, 3.5], [.2, .62, 4.5], [.6, .14, 3]].map(([u, v, r]) => `<ellipse cx="${cx + u * rx}" cy="${cy + v * depth}" rx="${r * 1.4}" ry="${r}" fill="${P.strata}" opacity=".75"/>`).join('');
    g += [[-.12, .97, 28], [.1, .95, 18], [-.35, .82, 14], [.38, .78, 20]].map(([u, v, len], i) => `<path class="root" style="animation-delay:${-i * 1.5}s" d="M${cx + u * rx} ${cy + v * depth - 4} q ${i % 2 ? 6 : -6} ${len * .5} ${i % 2 ? -2 : 3} ${len}" stroke="${P.soil[2]}" stroke-width="2" fill="none" stroke-linecap="round"/>`).join('');
    const wx = cx - rx * .42, wy = cy + ry * .9 + depth * .22;
    g += `<g transform="translate(${wx} ${wy})">${opts.night ? '<circle cy="-4" r="24" fill="#F5B83D" opacity=".55" filter="url(#glow)"/>' : ''}
      <path d="M-11 9 V-4 A11 11 0 0 1 11 -4 V9 Z" fill="${opts.night ? '#4A2E20' : '#8E5A3E'}"/>
      <path d="M-8.5 9 V-4 A8.5 8.5 0 0 1 8.5 -4 V9 Z" fill="${opts.night ? '#B9824F' : '#D69D63'}"/>
      <circle cy="-3" r="3.4" fill="${opts.night ? '#FFD98A' : '#F3E3C6'}"/>
      <circle cx="4.5" cy="3.5" r="1.1" fill="${opts.night ? '#5A3A26' : '#6E4128'}"/>
      <path d="M-14 10 h28" stroke="${P.strata}" stroke-width="2.5" stroke-linecap="round"/></g>`;
  }
  // grass top with a darker front lip
  g += `<ellipse cx="${cx}" cy="${cy + 5}" rx="${rx + 1}" ry="${ry + 4}" fill="${P.lip}"/>
    <ellipse cx="${cx}" cy="${cy}" rx="${rx}" ry="${ry}" fill="url(#grass)"/>
    <ellipse cx="${cx - rx * .25}" cy="${cy - ry * .35}" rx="${rx * .55}" ry="${ry * .45}" fill="#FFFFFF" opacity="${opts.night ? .04 : .16}" filter="url(#soft)"/>`;
  if (!opts.simple) g += Array.from({ length: Math.round(rx / 5) }, (_, i) => { const a = (i * 137.5) % 360 * Math.PI / 180, r = Math.sqrt(((i * 53) % 97) / 97); const x = cx + Math.cos(a) * r * rx * .9, y = cy + Math.sin(a) * r * ry * .85; return `<path d="M${x - 2} ${y} q 1 -4 2 -6 q 1 2 2 6z" fill="${opts.night ? '#5B8A72' : '#CDEBB0'}" opacity="${opts.night ? .35 : .55}"/>`; }).join('');
  // grass tufts hanging over the lip
  g += Array.from({ length: Math.round(rx / 14) }, (_, i) => { const t = (i + .5) / Math.round(rx / 14); const x = L + 8 + t * (rx * 2 - 16); const y = cy + ry * Math.sqrt(Math.max(0, 1 - ((x - cx) / rx) ** 2)) + 3; return `<path d="M${x - 5} ${y - 2} q 3 6 5 9 q 2 -3 5 -9z" fill="${P.lip}"/>`; }).join('');
  return g;
}

function world(s) {
  const P = PAL[s.pal];
  const night = s.pal === 'night', wilt = s.pal === 'wilt';
  const grown = s.growth !== 'early';
  const cx = 201, cy = grown ? 540 : 548, rx = grown ? 182 : 136;
  const o = { night, droop: wilt, closed: wilt || (night && !s.quietBloom), glow: night && s.quietBloom };
  let svg = `<svg viewBox="0 0 402 874" preserveAspectRatio="none"><defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${P.sky[0]}"/><stop offset=".4" stop-color="${P.sky[1]}"/><stop offset=".7" stop-color="${P.sky[2]}"/><stop offset=".9" stop-color="${P.sky[3]}"/></linearGradient>
    <linearGradient id="soil" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${P.soil[0]}"/><stop offset=".55" stop-color="${P.soil[1]}"/><stop offset="1" stop-color="${P.soil[2]}"/></linearGradient>
    <linearGradient id="soilShade" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity=".18"/><stop offset=".5" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#3A2030" stop-opacity=".22"/></linearGradient>
    <radialGradient id="grass" cx=".35" cy=".3" r=".8"><stop offset="0" stop-color="${P.grass[0]}"/><stop offset="1" stop-color="${P.grass[1]}"/></radialGradient>
    <radialGradient id="leafA" cx=".35" cy=".3" r=".75"><stop offset="0" stop-color="${night ? '#4F7F68' : wilt ? '#A9BE95' : '#A6D88E'}"/><stop offset="1" stop-color="${night ? '#2C4A40' : wilt ? '#7F9878' : '#5E9E6A'}"/></radialGradient>
    <radialGradient id="leafB" cx=".35" cy=".3" r=".75"><stop offset="0" stop-color="${night ? '#5A8A70' : wilt ? '#B4C6A0' : '#B9E39A'}"/><stop offset="1" stop-color="${night ? '#30503F' : wilt ? '#879E7E' : '#6FAE6E'}"/></radialGradient>
    <radialGradient id="cap" cx=".35" cy=".3" r=".8"><stop offset="0" stop-color="#FFC0A8"/><stop offset="1" stop-color="#E2846C"/></radialGradient>
    <radialGradient id="sun" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="${night ? '#FFF1D6' : '#FFFCEB'}"/><stop offset=".2" stop-color="${night ? '#FFF1D6' : '#FFF6DA'}" stop-opacity=".9"/><stop offset=".55" stop-color="${night ? '#8C7FD0' : '#FFF3D0'}" stop-opacity="${night ? .16 : .32}"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="2.4"/></filter>
    <filter id="sea" x="-20%" y="-50%" width="140%" height="200%"><feGaussianBlur stdDeviation="5"/></filter>
    <filter id="glow" x="-200%" y="-200%" width="500%" height="500%"><feGaussianBlur stdDeviation="3.5"/></filter>
  </defs>
  <rect width="402" height="874" fill="url(#sky)"/>`;
  if (night) {
    svg += `<circle cx="80" cy="200" r="88" fill="url(#sun)"/><path d="M92 176a25 25 0 1 0 0 45a20 20 0 1 1 0-45z" fill="#FFF1D6"/>`;
    svg += [[40, 250], [150, 222], [312, 196], [262, 270], [350, 300], [196, 290], [110, 330], [372, 236], [222, 210], [300, 352], [24, 360], [170, 384], [130, 150], [240, 160], [330, 150], [60, 320], [280, 228], [380, 400], [14, 200], [205, 250], [96, 420], [350, 450]].map(([x, y], i) => `<circle class="twinkle" style="animation-delay:${-i * 0.6}s" cx="${x}" cy="${y}" r="${i % 3 ? 1.2 : 1.9}" fill="#FFF6DC"/>`).join('');
  } else if (!wilt) {
    svg += `<circle cx="-10" cy="70" r="260" fill="url(#sun)"/>`;
  }
  // drifting high clouds
  const cc = night ? '#4A4078' : wilt ? '#F1EEF2' : '#FFFFFF';
  svg += cloudPuff(60, 250, 1, cc, night ? .45 : .9, 110, -30) + cloudPuff(300, 200, .6, cc, night ? .35 : .8, 140, -90);
  if (wilt) svg += cloudPuff(160, 300, 1.7, '#ECE8EE', .9, 170, -60) + cloudPuff(330, 360, 1.3, '#E5E1E9', .85, 160, -120) + `<rect width="402" height="874" fill="#DAD4E2" opacity=".22"/>`;
  // distant islands: a neighbor visiting (bunny), and an empty one waiting
  if (grown) {
    svg += `<g class="far-isle" style="animation-delay:-3s" opacity="${night ? .75 : .92}"><g transform="translate(330 214)">${island(P, 0, 0, 40, { simple: true, id: 'n1', night })}${plant('tree', -20, 0, .42, o)}${plant('daisy', 24, 4, .5, o)}<image href="assets/neighbor-bunny.webp" x="-8" y="-24" width="30" height="27"/></g></g>`;
  }
  // cloud sea (the calm bottom band where chrome sits)
  svg += `<g class="cloudsea"><rect x="-30" y="760" width="470" height="140" fill="${P.sea}" opacity="${night ? .55 : .95}"/>
    ${[[-10, 760, 46], [50, 744, 40], [110, 756, 44], [170, 740, 38], [230, 752, 46], [292, 742, 40], [352, 754, 44], [410, 746, 40]].map(([x, y, r]) => `<circle cx="${x}" cy="${y}" r="${r}" fill="${P.sea}" opacity="${night ? .55 : .95}" filter="url(#sea)"/>`).join('')}
    ${[[30, 800, 50], [150, 806, 56], [280, 798, 52], [390, 808, 50]].map(([x, y, r]) => `<circle cx="${x}" cy="${y}" r="${r}" fill="${P.seaShade}" opacity="${night ? .5 : .5}" filter="url(#sea)"/>`).join('')}</g>`;
  // main island
  let isle = island(P, cx, cy, rx, { night });
  // waterfall: unlocked at a 14-day streak
  if (grown) { const wx = cx + rx * .86, wy = cy + rx * .34 * .5; const d = `M${wx} ${wy} q 7 6 8 22 L ${wx + 9} 770`;
    isle += `<path d="${d}" stroke="${night ? '#8FA6E0' : '#CFEAF6'}" stroke-width="8" fill="none" opacity=".9" stroke-linecap="round"/><path class="fall" d="${d}" stroke="#FFFFFF" stroke-width="3.5" fill="none" opacity="${night ? .5 : .95}" stroke-linecap="round"/><ellipse cx="${wx + 9}" cy="764" rx="22" ry="8" fill="#fff" opacity="${night ? .4 : .85}" filter="url(#soft)"/>`; }
  // garden: back row first, then the sides; today's sprouts along the front rim
  const garden = grown
    ? [['tree', 232, 492, .6], ['mushroom', 178, 494, .6], ['bush', 126, 502, 1], ['lavender', 290, 502, 1], ['tulip', 160, 512, .8], ['mushroom', 262, 506, .75],
       ['tree', 66, 528, 1.08], ['tree', 338, 520, .92], ['daisy', 96, 532, .85],
       ['daisy', 34, 552, 1], ['tulip', 56, 570, 1], ['mushroom', 98, 566, .95], ['lavender', 308, 556, .9], ['tulip', 358, 556, 1], ['daisy', 376, 570, .9], ['daisy', 330, 578, .85]]
    : [['tree', 112, 534, .5], ['daisy', 92, 556, .85], ['tulip', 300, 540, .85], ['mushroom', 318, 562, .7], ['daisy', 270, 524, .7]];
  isle += garden.map(([t, x, y, k]) => plant(t, x, y, k, o)).join('');
  isle += `</g><g class="isle front">`; // front layer group closes after Pofu? (Pofu sits between back and front)
  const sk = [...s.beads].filter((b) => b === 'S').length;
  const n = Math.min(sk, grown ? 7 : 3);
  const front = [];
  for (let i = 0; i < n; i++) {
    const t = n === 1 ? .5 : i / (n - 1);
    const x = grown ? 62 + t * 278 : 120 + t * 162;
    const y = cy + (rx * .34) * Math.sqrt(Math.max(0, 1 - ((x - cx) / rx) ** 2)) - 9;
    front.push(plant('sprout', x, y, 1.05, { isNew: true, i, night }));
  }
  isle += front.join('');
  if (night) {
    const pos = [[70, 470], [330, 460], [120, 560], [290, 560], [372, 520], [30, 520], [214, 440], [250, 600]];
    svg += pos.slice(0, sk).map(([x, y], i) => `<g class="ffly" style="--d:${6 + i}s;--dl:${-i}s"><circle cx="${x}" cy="${y}" r="7" fill="#F7E08A" opacity=".5" filter="url(#glow)"/><circle cx="${x}" cy="${y}" r="2" fill="#FFF3B8"/></g>`).join('');
  }
  isle += '';
  // Pofu is inserted by the page between the two island groups (see overlay)
  const wisp = `<g class="cloudpuff" style="--d:70s;--dl:-25s"><g transform="translate(120 668) scale(1.3)" opacity="${night ? .35 : .75}" filter="url(#soft)"><ellipse cx="0" cy="0" rx="44" ry="8" fill="${P.sea}"/><ellipse cx="18" cy="-5" rx="22" ry="8" fill="${P.sea}"/></g></g>`;
  return svg + `<g class="isle">${isle}</g>${wisp}</svg>`;
}

mount({
  id: 'b', kicker: 'Direction B · recommended', title: 'The island that grows',
  standin: 'Stand-in scene and plants (code). Pofu: production art R1',
  presets: [
