jobs:
  x-home-flow-il1-v3:
    pick: 2
    publication: exploration; not promoted; lead review pending
    note: Take 1 is manually ineligible because a conspicuous band of clustered flowers
      remains along the harbour islet edge. Take 2 is eligible on the observed criteria.
      QA lock_load is 0.0 for both; among eligible takes, take 2 is the only candidate
      and is auto-picked by QA. Palette drift is an advisory warning in this exploration.
      Not promoted because this is an exploration.
    manual_review:
      job: x-home-flow-il1-v3
      reviewer: independent visual review
      reference: x-home-flow-final-rich.webp
      criteria:
      - Keep the island silhouette, all earth doors, rope bridge, harbour-islet outline,
        and sky elements in place.
      - Keep the far islands and whale clear and fully coloured; mist only the hilltop
        and harbour islet with thin sunlit mist.
      - Remove the specified buildings, props, flower borders, and vines; keep three
        sunflowers in a small unfenced bed and the wheel tipped on its side.
      - Keep the rest of the image aligned to the root and preserve its clear, rich
        colour.
      revision_history:
      - revision: 1
        status: superseded
        note: The initial review incorrectly treated scattered small lawn flowers
          as a failure and treated inability to prove pixel registration as a disqualifying
          failure. The authored prompt specifically names flower borders for removal;
          those observations alone do not establish a failure.
      - revision: 2
        status: current
        note: Rechecked the root and both candidates at matched full-canvas scale.
          Mist stays on the left hill mass and harbour islet; it does not reach the
          far islands or whale. No continuous flower border is evident on the main
          lawn.
      takes:
      - take: 1
        source_sha256: d0e783bb54b59b3551fded284374e878d24482597a38d3c1eb239d407ec52c2a
        eligible: false
        reasons:
        - The harbour islet retains a conspicuous band of clustered pink and purple
          flowers along its far edge. Those clusters read as a remaining flower border,
          despite removal of the other listed structures and props.
        - The mist remains on the hill mass and harbour islet; the far islands and
          whale stay clear and fully coloured. The garden has three sunflowers without
          a fence, the wheel is tipped on its side, and the rope bridge remains.
        caveats:
        - The broad island contour looks similar to the root. Visual inspection does
          not prove pixel-for-pixel registration, but no specific contour or sky-element
          displacement was established in this review.
      - take: 2
        source_sha256: 199f286c6d19f154a24cb6cbbbd89ae0359ac621be31d722623627754c95ad2c
        eligible: true
        reasons:
        - The mist stays over the left hill mass and harbour islet; it does not veil
          the far islands or whale. It reads as thin sunlit mist in the named areas.
        - The listed buildings and props are absent, the rope bridge and earth doors
          remain, the garden shows three sunflowers without a fence, and the wheel
          is tipped on its side. No continuous flower border is evident.
        caveats:
        - The broad island contour and distant elements look similar to the root,
          but visual inspection does not prove pixel-for-pixel registration. No specific
          displacement or silhouette change was established.
