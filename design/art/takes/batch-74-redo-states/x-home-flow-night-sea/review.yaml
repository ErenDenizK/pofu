      - Change only the cloud sea below the island to a darker blue-violet, with lighter
        blue-lilac crests and soft silver highlights.
      - Keep the cloud shapes and positions, and preserve the island, earth body,
        roots, buildings, doors, lamps, windows, sky, moon, stars, far islands, and
        cloud-whale.
      takes:
      - take: 1
        source_sha256: 29a66bbc0129fb832e2c52a6bf2de4b10132f947c50ece5e1d04e1a501efd76c
        eligible: true
        reasons:
        - The cloud sea is visibly darker than the parent, with blue-violet hollows,
          lighter blue-lilac cloud crests, and soft pale highlights.
        - The island and its underside, roots, sky, moon, stars, far islands, and
          cloud-whale appear in the same positions and retain their parent colours;
          no specific changed object or area outside the cloud sea was observed.
        caveats:
        - This is a visual comparison and does not establish pixel-for-pixel identity
          outside the cloud sea.
      - take: 2
        source_sha256: 5a893fff3189db7afe495434197d1cf622eb178dca6590a96cd2209b4b319ea9
        eligible: true
        reasons:
        - The cloud sea is visibly darker than the parent, with blue-violet hollows,
          lighter blue-lilac cloud crests, and soft pale highlights.
        - The island and its underside, roots, sky, moon, stars, far islands, and
          cloud-whale appear in the same positions and retain their parent colours;
          no specific changed object or area outside the cloud sea was observed.
        caveats:
