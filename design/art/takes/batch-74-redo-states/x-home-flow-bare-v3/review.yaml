    pick: null
    publication: exploration; rejected by the lead 2026-11-11, redo queued; never promoted
    lead_review: "Lead reject (third try): the lawn is a puffed lime pillow whose upper contour rises over where the buildings stood, so new land appears; not the root's deep green. Redo queued as a masked region edit."
    note: 'Both takes fail manual review: the lawn is lime/yellow rather than the
      requested deep green, and the exposed upper contour is broader and smoother
      than the root. The harbour islet remains separate and the named structures appear
      removed. No eligible take; the two-take request is complete, so skip without
      regeneration.'
    status: rejected
    skip_reason: Both requested takes fail manual eligibility review for lawn color
      and island silhouette. Batch header directs retaining both and moving on; no
      additional takes requested.
    manual_review:
    - take: 1
      source_sha256: 4b303cac40316ed106a75e6a79ed7808ff3b30d249345985b0e14b5397ce35b4
      eligible: false
      reasons:
      - The lawn is much brighter and more lime/yellow than the root's deep green,
        despite having visible grass texture.
      - The newly exposed upper land contour reads as a broader, smoother mound than
        the root; exact silhouette and cliff-edge preservation are not established
        visually.
      - The harbour islet is visibly separate, and the buildings, props, and flowers
        appear removed while the doors, sky, distant islands, and whale remain broadly
        present.
      caveats:
      - This is a visual comparison, not a pixel-registration test; small shifts in
        the sky elements cannot be ruled out.
    - take: 2
      source_sha256: c246af4d6c44e8a768aeb44d3a6770a4039e04541a320a16c2492202a5e56946
      eligible: false
      reasons:
      - The lawn is much brighter and more lime/yellow than the root's deep green;
        grass texture remains visible but does not match the requested color and shading.
      - The newly exposed upper land contour reads as a broader, smoother mound than
        the root; exact silhouette and cliff-edge preservation are not established
        visually.
      - The harbour islet is visibly separate, and the buildings, props, and flowers
        appear removed while the doors, sky, distant islands, and whale remain broadly
        present.
      caveats:
      - This is a visual comparison, not a pixel-registration test; small shifts in
        the sky elements cannot be ruled out.
    actual_generation_calls: 2
