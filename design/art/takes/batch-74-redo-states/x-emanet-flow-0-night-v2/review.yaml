    pick: null
    publication: exploration; not promoted; lead review pending
    note: 'Both takes fail manual review: the authored story fog is broad, even mauve
      haze in the parent, but these candidates introduce distinct upper-sky cloud
      banks and a much thicker localized stage fog. The original inventory and existing
      warm window source remain; lanterns stay unlit. No extra takes requested.'
    status: skipped
    skip_reason: Both candidates visibly change the fog pattern and extent; the two-take
      phase is complete, so skip.
    manual_review:
      job: x-emanet-flow-0-night-v2
      reviewer: independent visual cross-review
      parent: plate__x-emanet-flow-0--t1.webp
      criteria:
      - Keep the stage 0 scene and object inventory, changing only light and colour.
      - Keep the story fog in the same places, shapes, and extent as the parent.
      - Keep lamps, lanterns, and windows that are unlit in the parent unlit; only
        existing lit sources retain a small warm pool.
      - Use a blue night sky and maintain readable, fairly light subject colours.
      takes:
      - take: 1
        source_sha256: 323cbc1883c5a472dedbce1555daf2420d745a7dc9174b23e297a3af75f4e763
        eligible: false
        reasons:
        - The parent is veiled by broad, even mauve haze. This take instead has distinct
          billowing cloud banks across the upper sky and a thicker, localized horizontal
          fog bank in front of the stage around the platform and objects. The fog
          pattern and extent are visibly different from the parent.
        - The original inventory remains broadly present. The shop's already-lit window
          source stays warm, while the hanging lanterns on the right rack remain unlit;
          no additional lit lamp is apparent.
        caveats:
        - No pixel-registration test was performed. The fog difference described above
          is a visible compositional change, not a claim based solely on unproven
          exact registration.
      - take: 2
        source_sha256: 9e683c5ff25d789a7b39218e3da6bc1ab11b553d9b8d90c196ee237f8cdb6a8d
        eligible: false
        reasons:
        - The parent is veiled by broad, even mauve haze. This take instead has broad,
          swirling cloud banks across much of the upper sky and a pronounced dense
          mist layer across the stage. The fog pattern and extent are visibly different
          from the parent.
        - The original inventory remains broadly present. The shop's already-lit window
          source stays warm, while the hanging lanterns on the right rack remain unlit;
          no additional lit lamp is apparent.
        caveats:
        - No pixel-registration test was performed. The fog difference described above
          is a visible compositional change, not a claim based solely on unproven
          exact registration.
    actual_generation_calls: 2
