      - take: 1
        source_sha256: a39f9b9c64e298df51a44dcb6f4d9208a44a8fd3f9a50c3ee88755895c2d526c
        eligible: true
        reasons:
        - 'The island inventory is preserved: garden and fence, path, tea stall and
          cart, upright wheel, and both doors remain; no additional lamp or glowing
          object is visible.'
        - The sky is deep blue, the moon is soft and round, the cloud sea remains
          light lilac-white, and the island remains readable under cool light. Tiny
          warm points appear on the far islands as requested.
        - Warm light is confined to existing windows; the prompt's requested far-island
          warm points are small.
        caveats:
        - The sky has more than a few stars by a strict count, though they remain
          small and subdued. No specific inventory or placement failure was established
          visually.
      - take: 2
        source_sha256: 89da45b0d67d4d1a88ce956b909d8eccf5af0c3fde1ea297c48d8bddcb42b3f2
        eligible: true
