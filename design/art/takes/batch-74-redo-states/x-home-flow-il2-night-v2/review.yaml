      - Preserve the day plate's objects, shapes, and positions while changing the
        light and colour to night.
      - Use a soft deep-blue sky, round moon, and a few small stars; keep the cloud
        sea light and lilac-white and the island readable.
      - Warm light comes only from windows already in the scene; do not add lamps,
        bulbs, lanterns, strings, or other glowing objects.
      - Far islands are dim shapes with tiny warm lights; keep the cloud-whale pale
        if present.
