      all test encodings. No oversize upload was attempted, no lossless/canvas waiver,
      downscale, palette reduction, split delivery, lossy master or extra generation.
      Archive all four q90 review takes and contact sheet, cut the content node, promote
      no master and create no misleading Harmony shard. No dependent jobs in the pilot.
      Founder review pending; lead must resolve full-resolution lossless delivery
      before a future authorized attempt.'
