batch: batch-17-islands-v2
contact_sheet: design/art/takes/batch-17-islands-v2/x2-koke-b/contact.jpg
jobs:
  x2-koke-b:
    pick: 4
    publication: selected exploration; never promoted
    note: 'auto-picked by QA; founder review pending. Both initial takes recommend
      manual rejection only on the mandatory recognizable sleeping-animal silhouette
      at native60: observed full body+lantern and body-only profiles remain generic
      rounded stone/mounds, whereas the color image relies on internal face/tail relief
      to name a sleeping cat. This is not an8-point/rubric, palette, style or pebbles
      rejection, and no home-door claim is made. The cloud-occluded animal is never
      reconstructed. Owner alone decides any one permitted retry pair and final pick.
      One allowed retry pair (takes3/4) reviewed from immutable retained originals
      after official POSTEDall4; all four take slots exhausted. Takes1/2 are preserved
      unchanged. Take3 fails the required sleeping-animal native60 profile; take4
      is recommended eligible with moderate confidence from real protruding ear/head
      geometry. No new images, picks, post, promotion, source-art edits or Git writes
      by reviewer. Owner independently inspected originals, the actual native60 body-only
      proof and the full-subject source-bound contact. Take4 is accepted with moderate
      confidence as a generic low curled/resting mammal from its projecting head and
      real raised ear, without requiring cat species or unseen paws/tail. The animal
      reading remains an explicit founder-review caveat, not a claim that hidden geometry
      was verified. Take4 is the sole hard-passing candidate; no further calls.'
