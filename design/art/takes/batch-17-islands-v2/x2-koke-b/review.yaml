  note: 'Both initial takes recommend manual rejection only on the mandatory recognizable
    sleeping-animal silhouette at native60: observed full body+lantern and body-only
    profiles remain generic rounded stone/mounds, whereas the color image relies on
    internal face/tail relief to name a sleeping cat. This is not an8-point/rubric,
