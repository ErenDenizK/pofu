    note: 'auto-picked by QA; founder review pending. Both takes recommend pass: chain-suspended
      greenhouse dome, brass base, fogged/wiped panes, orchids and sunbeams. The brass
      base is not home soil, and its door is arch-topped rectangular rather than circular.
      Source-bound black profiles/native60 views are annotations only, with chain/cloud
      uncertainty explicit; no final pick. Root full-resolution door adjudication:
      both entries have straight lower jambs/flat bottoms and arch-topped rectangular
      glazing, distinct from the home oval wooden leaf with separate circular porthole.
      Cross-panes/warm shading are common family style, not independently banned;
      architectural echo is advisory. No retry spent.'
