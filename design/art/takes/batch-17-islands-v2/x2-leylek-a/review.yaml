manual_review:
  note: 'Assessment revision, without new generation or budget reset: root closeup
    adjudication distinguishes arch-rectangular entries from the actual home oval
    leaf/separate circular porthole; wood/cross-pane resemblance alone is shared style.
    Existing takes1 and3 now have complete source-observed nest+storks+ribbon native60px
    proofs and pass. Take3 has the lowest QA lock load of all four existing candidates
    (2.4904), so it is the eligible auto-pick. The old blanket skip is historical
    and superseded; candidates2/4 remain higher-load unselected diagnostics without
    a new geometry verdict. All four original takes remain archived; the one allowed
    retry remains spent, no fifth call.'
  takes:
    '1':
      pass: true
      silhouette_name: 'whole flight assembly: giant woven cottage-nest carried by
        a flock of storks on coral ribbons'
      rubric:
      - 3
      - 2
      - 1
      - 2
      - 1
      evidence: 'Re-review is limited to existing take1 and the complete depicted
        physical assembly, not the nest body alone. The native60 unmodified source
        crop and source-observed black profile retain the suspended nest, six flying
        bird forms, and the thin actual ribbon supports with open sky between them.
        This is nameable as a flying nest/bird-carried home and is distinct from a
        lawn/soil island. The nest floats above a visible gap to the clouds. Chimney,
        lantern and small entry provide inhabited scale; straw/white/black/coral at
        warm windy dusk supply its own palette and sky. Door geometry is arch-topped
        rectangular: straight lower wood-leaf sides and a flat lower edge/sill, with
        arched rectangular four-pane glazing. It is not the home reference fully oval
        wood leaf with a separate round/oval porthole. Wood, warm light and cross
        panes alone are shared family style, not the banned shape.'
