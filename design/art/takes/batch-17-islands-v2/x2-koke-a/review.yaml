      evidence: 'The bonsai itself is the named landform: a massive curved trunk and
        asymmetrical layered needle pads dominate the garden. Rain, reflective wet
        slate, pond rings, bamboo clacker, root-side tea house and a single red maple
        branch are visible. Raked fine gravel is explicitly requested; functional
        slate pavers and upper structural roots are distinguished from copied loose
        pebbles and dangling home roots. No brown soil bowl, lawn oval, fully oval
        wooden home door or separate circular porthole is seen. Rectangular glazing
        and straight lower jambs remain ordinary family style. The landform mask includes
        actual trunk, needle pads and slate garden rather than a convex silhouette
        filling the air gaps. Native60 profile remains recognizable as a windswept
        bonsai without relying on the little house.'
