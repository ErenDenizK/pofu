  prompt: 'REFERENCES (attached, in this order):

    1. The object to paint, as the island''s own painting shows it: its identity, camera, light and style. Paint
    this object alone; leave out the lawn, the path, the sky and everything beside it.

    2. The painting style and finish of the island up close: soft clay-like forms, warm wood, the light from the
    upper left. Match the look only; do not copy its objects.


    Paint one small building-like object for a cozy picture-book island,

    alone, as a game cut-out: a small round wooden counter built like a low

    barrel of upright staves, with a cream-and-yellow striped cloth awning on

    two thin wooden poles above it and one white teapot on the counter.

    Nothing else. It is the same object as in the first attached picture: keep

    its shapes, its materials, its colours and its proportions, and paint it

    larger and cleanly on its own. Seen from the same low camera as the

    attached picture, a front three-quarter view from a little above, lit

    softly from the upper left. It fills about three quarters of the canvas

    and is centred, with clear empty space on every side and above it, because

    more will be added to it later. It stands alone on a fully transparent

    background: no ground, no lawn patch, no disc and no shadow on the ground.

    Where it meets the ground its foot is hidden by a short, irregular fringe

    of grass blades that overlap it, never a flat shelf or a straight cut.

    Paint only what is named: nothing from the surroundings of the attached

    picture.


    STYLE: a finished painted illustration for a premium cozy mobile game, like

    a page from a beloved picture book: soft painterly 2D with gentle airbrushed

    shading, rounded chunky forms, no outlines, no hard edges, matte surfaces

    with at most one soft highlight per object. COLOUR: vivid, saturated and

    jewel-like, as in the key art of a high-end animated film: intense grass

    greens, glowing sunflower yellow, deep sky blue, warm peach earth, crisp

    white petals; strong contrast between warm lit colour and cool shadow

    colour; every material keeps its own true colour. VALUES: a full range, from

    bright sunlit tops to deep warm shadows under eaves, inside foliage, beneath

    the lawn rim and around doors, so every object separates clearly from what

    is behind it and the picture reads at a glance on a small phone screen.

    Shadows are coloured (warm brown, plum, deep teal), never black or grey.

    Light direction and shadow hue follow the LIGHT block of this prompt.

    Colourful but never neon, never HDR, never glossy. No text, no letters, no

    numbers, no logos, no watermark, no border, no frame.


    AVOID: glossy or metallic shine, specular glints, reflections, hammered

    or dimpled metal, wood grain, fine surface texture, photorealism, a 3D

    render look, plastic or vinyl, high contrast, black or near-black

    shadows, saturated or neon colors, outlines, cel shading, text, letters,

    numbers, logos, watermarks, characters or animals, a floor, a background,

    a ground shadow.


    AVOID: a ground, a lawn patch, a disc or platform under it, a cast shadow on the ground, a flat straight-cut
    foot, a background or sky colour, a white sticker border, an outline, a pale fringe or halo, a second building,
    a character or animal, a path, a fence that is not named, a different camera, a front-on or top-down view, text,
    letters


    LIGHT (hour: day, layer: subject). Bright, clear, toy-like.

    Paint this under the clear daylight cell: key light #FFF6EC from the upper left, soft cool fill #BFD6EE, a faint
    rim #FFE9C9 on the far edge. The game relights and grades this sprite for the hour, so keep the light neutral
    and readable. Do NOT paint a cast shadow on the ground or onto a background: only soft contact occlusion where
    forms touch.

    VALUES (the reference envelope): a high-key picture inside one envelope of soft, milky air. Every value sits
    between light mid-tone and cream-white; the darkest recesses (door holes, gaps, pond rims) are a mid-value tinted
    with the shadow hue, never black. Form turns in small value steps. Colour lives in the halftones; lights bleach
    to cream. No dark outlines: edges are found by value and hue. The cloud sea below is the brightest large surface
    and lights the island''s underside with a warm bounce.

    This is the SUBJECT plane: the clearest forms and the crispest edges in the picture, still inside the envelope.


    Output: one image, transparent background PNG, square 1024 x 1024.

    '
