jobs:
  x-week-visitor:
    pick: 2
    publication: selected exploration; never promoted
    note: 'auto-picked by QA; founder review pending. Both originals show a complete
      distinct travelling fox cub: pointed dark-tipped ears, white-tipped bushy tail,
      cream chest, two front paws and two feet, sage scarf, bundle on a stick over
      one shoulder and round lantern in the other paw. No head curl, extra clothes,
      letters, ground or cast ground shadow. Both originals were composited on cream
      and dark for manual review and independently checked by a read-only reviewer.
      The exaggerated warm halo in the raw RGBA viewer disappears on proper composites;
      there is no visible external lantern glow or flame. The pale gold globe with
      cream central shading is interpreted as a pale unlit painted lantern under the
      header rule; no emissive overlay is claimed. The stick bundle and fox ears/tail
      distinguish a visiting traveller from the established residents. Hard QA passes.
      Character preset has no lock-load check, so equal default zero loads are broken
      by higher advisory Harmony82.6 for take2 versus79.8 for take1. Style/light/palette
      warnings remain advisory for this exploration. Never promoted.'
