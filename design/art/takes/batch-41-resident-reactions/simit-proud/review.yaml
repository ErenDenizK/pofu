    note: auto-picked by QA; founder review pending. Independent root review of parent/locked
      checkerboard confirms take2 preserves the lower-body silhouette, tail curl/stripes,
      paws and coral bandana layout. Face/chin lift and upright ears are the allowed
      changes; half-closed content eyes retain catchlights, and the small closed smile
      is warm rather than a sneer. Global edit stability .7031 is dominated by these
      requested large-face changes; central-body kept .9287 and alpha IoU .9978 support
      close registration without claiming literal texture identity or inventing a
      global threshold. Both initial takes hard-pass; char-guard applies no grading,
      so take2 wins higher Harmony71.2 vs68.3. Full-canvas lossless WebP570764 bytes
      is RGBA-identical to locked output. Advisory light/edit warnings are retained;
      no retry, resizing or local pixel edits.
