  the same weight, relative to the icon''s size, as on the attached sheet,

  with one small flat accent of honey (#F2B45A) or moss green (#94B062); no

  gradients and no shading. Rounded, friendly, chunky forms, simple enough

  to read at a tiny size. Draw this one icon only, once.


