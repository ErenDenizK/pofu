  1. The app''s existing icon sheet: the exact style to copy (line weight, corner radius, cream fill,
  honey and moss accents). Draw none of its icons again; it shows nine icons, you draw one.


  One app menu icon for the same set as the icons on the attached sheet,

  alone and centred on a transparent background, filling about two thirds of

  the square: a rounded tile with three short rows, each row a round dot and

  a line, one dot in honey. Exactly the attached style: a soft cream fill

  (#FBF1D8) inside a rounded warm cocoa line (#5B4636) of the same weight,

  relative to the icon''s size, as on the attached sheet, with one small flat

  accent of honey (#F2B45A) or moss green (#94B062); no gradients and no

  shading. Rounded, friendly, chunky forms, simple enough to read at a tiny

  size. Draw this one icon only, once.


  AVOID: a second icon, a grid or a sheet of icons, any icon copied from the attached sheet, text, letters,
  numbers, a brand logo, gradients, shading, 3D, glass, a shadow, thin hairlines, a line heavier than
