    original_packet:
      batch: batch-35-experience-pilot
      job: glow-ground-pool
      worktree: /workspace/art-20261105-experience-pilot
      prompt: 'REFERENCES (attached, in this order):

        1. The approved tea stall: match its painting, finish, camera, scale and colors
        exactly (do not draw the stall).


        A pool of warm lamplight lying on a lawn, seen from a low camera about 17
        degrees above the ground, so the

        pool is a wide flat ellipse about twice as wide as it is tall, centered in
        the image and filling about

        80 percent of the width. Brightest near the middle, with a soft, slightly
        uneven painterly edge that

        dies into black well before the image border. Warm honey-gold light only:
        no grass blades, no ground, no

        shadows, no object casting it.


        UI OBJECT: a painted object that the app places under or inside native

        iOS glass controls. Never paint glass, frosted panels, buttons, frames,

        progress bars or any interface chrome: the app draws all glass and all

        controls natively. The object is centered with a generous transparent

        margin of about 10% on every side.


        GLOW SPRITE: a painterly additive light sprite for a game: the app adds it
        on top of the world with

        plus-lighter blending, so black means no light at all. Painted with the same
        soft airbrushed grain as the

        attached art, a smooth falloff from a brighter center to nothing, a very slight
        painterly irregularity so

        it is never a perfect digital gradient. Color is a warm candle-light honey-gold
        (#FFC872 at the center

        fading through #FF9F4A to black) unless stated. Pure black (#000000) background,
        not transparent, no

        other colors, no objects.


        AVOID: any object, a lamp, a window, a flame, a sun, a sphere or a visible
        light source, stars, rays or spikes, lens flare, hard edges, outlines, text,
        letters, a border, a frame, grey or colored backgrounds, banding, a halo ring.
        Everything outside the glow is pure black (#000000).


        Output: one image, opaque, full bleed, square 1024 x 1024.

        '
      refs:
      - /workspace/art-20261105-experience-pilot/design/art/stations/tea-stall-1/tea-stall-1.png
      reference_sha256:
