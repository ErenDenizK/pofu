    original_packet:
      batch: batch-35-experience-pilot
      job: launch-sky
      worktree: /workspace/art-20261105-experience-pilot
      prompt: 'REFERENCES (attached, in this order):

        1. The approved tea stall: match its painting, finish, camera, scale and colors
        exactly (do not draw the stall).

        2. The sea of clouds below every island: paint the clouds like this (do not
        draw the sea).


        A tall full-bleed dawn sky for a cozy mobile game''s launch screen, a portrait
        image. Top to bottom: a soft

        lilac-blue sky at the top, melting through pale peach and warm cream to a
        glowing honey horizon about two

        thirds down; a few long, soft, slightly flat clouds in thin calm bands across
        the sky, lit warm from below;

        a gentle bank of puffy cream clouds along the bottom third, lit pink-gold
        on their tops. The light is

        calm and hopeful, a quiet new morning. Keep the middle of the image open and
        uncluttered so a small

        island can sit there; keep anything important within the central two thirds
        of the width and nothing

        within the top 12 percent. No island, no sun disc, no birds, no stars, no
        characters.


        Painted in the same soft airbrushed picture-book finish as the attached art,
        milky pastel colors lifted toward cream, no outlines, no hard edges.


        AVOID: a border, text, harsh shadows, saturated or neon colors, dark moods,
        outlines, photorealism, a 3D render look, an island, a sun disc, birds, stars,
        characters, banding


        LIGHT (hour: dawn, layer: subject). Hush, promise.

        Key light #F4C7A4 from the left, a little above; fill #C9B8F0; rim #FFD9BC
        along the edge facing away from the key. Shadows are tinted #B9A2FF (never
        grey or black) and fall toward the right, a little below; paint a contact
        shadow in that hue under every object that touches the ground or another form,
        firmest in the subject plane.

        VALUES: haze is depth, not a filter over the whole frame. The subject plane
        uses the full value range: true darks in the deepest recesses (eyes, door,
        soil, gaps between forms) and clean highlights. Contrast falls only with distance
        from the subject. A soft, gentle look means soft local colour and soft edges,
        never lifted blacks, a milky veil or a grey-white wash.

        This is the SUBJECT plane: no atmosphere at all, the strongest contrast and
        the deepest darks in the picture.


        Output: one image, opaque, full bleed, portrait 1024 x 1536.

        '
      refs:
      - /workspace/art-20261105-experience-pilot/design/art/stations/tea-stall-1/tea-stall-1.png
      - /workspace/art-20261105-experience-pilot/design/art/masters/cloud-sea/cloud-sea.png
