    original_packet:
      batch: batch-35-experience-pilot
      job: dressing-meadow
      worktree: /workspace/art-20261105-experience-pilot
      prompt: 'REFERENCES (attached, in this order):

        1. The approved tea stall: match its painting, finish, camera, scale and colors
        exactly (do not draw the stall).

        2. The palette card for props: use only these colors (and mixes of them).


        A sheet of twelve small lawn-dressing pieces for a cozy island diorama, in
        a grid of four columns by three

        rows, each piece complete and separate with wide empty space around it, none
        touching or overlapping: row 1,

        three grass tufts of different sizes (a small one, a taller one, a tuft with
        two seed heads) and a clump of

        clover; row 2, three wildflower clumps (daisies, cornflowers, buttercups:
        each four or five chunky flowers on

        short stems) and a single tall foxglove; row 3, a group of three smooth pebbles,
        a single flat stone, a small

        ring of five toadstools with cream caps and warm rose spots, and a half-buried
        mossy stone. Each piece is

        small and chunky, seen from the same low front three-quarter camera, standing
        on nothing.


        STYLE: soft painterly 2D illustration from the same picture book as the

        attached hamster: the same gentle airbrushed shading, the same light,

        high-key values and the same milky pastel colors. Simple, rounded, chunky

        shapes with few parts; fewer, larger shapes, because this is seen small on

        a phone. Every material is painted matte, as a soft form with broad,

        smooth value changes: wood without grain, metal without hammering or

        reflections, glass as a soft tinted shape, cloth without weave. At most

        one small, soft highlight per object; no glints, no shine. Colors are

        muted and lifted toward cream; the darkest shadow is a warm mid-brown,

        never near black. Warm diffused key light from the upper left, a faint

        warm rim light along the right edge, soft ambient shadow only where forms

        touch. Clean, calm, uncluttered. No outlines, no hard edges. No text, no

        letters, no numbers, no logos, no watermark, no border, no frame, no

        sticker outline.


        AVOID: a floor, a ground shadow, cast shadows, text, letters, outlines, characters
        or animals, pieces touching or overlapping, a background


        LIGHT (hour: day, layer: subject). Bright, clear, toy-like.

        Paint this under the clear daylight cell: key light #FFF6EC from the upper
        left, soft cool fill #BFD6EE, a faint rim #FFE9C9 on the far edge. The game
        relights and grades this sprite for the hour, so keep the light neutral and
        readable. Do NOT paint a cast shadow on the ground or onto a background: only
        soft contact occlusion where forms touch.

        VALUES: haze is depth, not a filter over the whole frame. The subject plane
        uses the full value range: true darks in the deepest recesses (eyes, door,
        soil, gaps between forms) and clean highlights. Contrast falls only with distance
        from the subject. A soft, gentle look means soft local colour and soft edges,
        never lifted blacks, a milky veil or a grey-white wash.

        This is the SUBJECT plane: no atmosphere at all, the strongest contrast and
        the deepest darks in the picture.


        Output: one image, transparent background PNG, landscape 1536 x 1024.

        '
