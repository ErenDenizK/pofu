prompt: "REFERENCES (attached, in this order):\n1. The home island: the same painting,\
  \ the same low camera (about 20 degrees), the same softness and scale of a floating\
  \ island. Do not draw this island.\n2. The sea of clouds below every island: paint\
  \ the clouds like this.\n3. Style reference only (no characters unless asked): the\
  \ hamster's soft painting and pastel colors.\n\nA concept painting for a cozy mobile\
  \ game: Y\u0131ld\u0131z at night: above the\nobservatory, seven plump gold stars\
  \ joined by soft thin golden lines into\na gentle constellation shape like a ladle,\
  \ the dome shutter open to it, a\nsmall round sleepy owl (Nane, tiny) on the dome\
  \ edge looking up. Seen from\nthe same low front three-quarter camera as the attached\
  \ island, the island\nfloating over a sea of clouds. Peaceful and wondrous, never\
  \ dramatic.\n\nSTYLE: soft painterly 2D illustration from the same picture book\
  \ as the\nattached hamster: the same gentle airbrushed shading, the same light,\n\
  high-key values and the same milky pastel colors. Simple, rounded, chunky\nshapes\
  \ with few parts; fewer, larger shapes, because this is seen small on\na phone.\
  \ Every material is painted matte, as a soft form with broad,\nsmooth value changes:\
  \ wood without grain, metal without hammering or\nreflections, glass as a soft tinted\
  \ shape, cloth without weave. At most\none small, soft highlight per object; no\
  \ glints, no shine. Colors are\nmuted and lifted toward cream; the darkest shadow\
  \ is a warm mid-brown,\nnever near black. Warm diffused key light from the upper\
  \ left, a faint\nwarm rim light along the right edge, soft ambient shadow only where\
  \ forms\ntouch. Clean, calm, uncluttered. No outlines, no hard edges. No text, no\n\
  letters, no numbers, no logos, no watermark, no border, no frame, no\nsticker outline.\n\
  \nAVOID: characters (except where named), a border, text, harsh shadows, saturated\
  \ or neon colors, dark moods\n\nOutput: one image, opaque, full bleed, landscape\
  \ 1536 x 1024."
