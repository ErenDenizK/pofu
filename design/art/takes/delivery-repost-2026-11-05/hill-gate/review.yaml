    original_callback_sha256: 8096da98363a533e2a7790f373f9a30ec031c34bd3708c3a38fcc6d1f434ec12
    original_packet:
      batch: batch-33-home-showcase
      job: hill-gate
      worktree: /workspace/art-20261105-showcase-full
      prompt: 'REFERENCES (attached, in this order):

        1. The composition guide: footprint ellipse, anchor cross and height bar.
        Follow it, then remove it.

        2. The path lamp of this island: same honey wood, finish and scale family
        (do not draw the lamp).

        3. The approved tea stall: match its painting, finish, camera, scale and colors
        exactly (do not draw the stall).

        4. The palette card for props: use only these colors (and mixes of them).


        A small garden gate at the foot of a hill path, for the island

        diorama: two short, round pale-stone posts each topped with a

        little moss cap, and between them a closed double gate of soft

        honey wood with a round top, a large simple sunflower carved into

        its round top panel (broad petals, a round centre), and two low

        stone steps in front of it going up. Behind the gate nothing but

        empty space. Narrow: it fills about half the footprint''s width and

        two thirds of the height bar, standing on the footprint.


        VIEW: the same fixed front three-quarter view as the attached island: a

        low camera about 20 degrees above the horizon, so you see the front of

        the object fully and only a narrow sliver of its top (a round tabletop

        reads as a flat oval about a third as tall as it is wide). Follow the

        attached guide exactly: the object stands on the magenta ground ellipse,

        centered on the magenta cross, its front edge on the front of the

        ellipse, no taller than the magenta height bar. Then remove the guide

        completely: no ellipse, no cross, no bar, no magenta, no grid may remain

        in the output.


        STYLE: soft painterly 2D illustration from the same picture book as the

        attached hamster: the same gentle airbrushed shading, the same light,

        high-key values and the same milky pastel colors. Simple, rounded, chunky

        shapes with few parts; fewer, larger shapes, because this is seen small on

        a phone. Every material is painted matte, as a soft form with broad,

        smooth value changes: wood without grain, metal without hammering or

        reflections, glass as a soft tinted shape, cloth without weave. At most

        one small, soft highlight per object; no glints, no shine. Colors are

        muted and lifted toward cream; the darkest shadow is a warm mid-brown,

        never near black. Warm diffused key light from the upper left, a faint

        warm rim light along the right edge, soft ambient shadow only where forms

        touch. Clean, calm, uncluttered. No outlines, no hard edges. No text, no

        letters, no numbers, no logos, no watermark, no border, no frame, no

        sticker outline.


        AVOID: glossy or metallic shine, specular glints, reflections, hammered

        or dimpled metal, wood grain, fine surface texture, photorealism, a 3D

        render look, plastic or vinyl, high contrast, black or near-black

        shadows, saturated or neon colors, outlines, cel shading, text, letters,

        numbers, logos, watermarks, characters or animals, a floor, a background,

        a ground shadow.


        AVOID: a fence line, a wall, a padlock, a chain, a sign, a hill behind the
        gate.


        LIGHT (hour: day, layer: subject). Bright, clear, toy-like.

        Paint this under the clear daylight cell: key light #FFF6EC from the upper
        left, soft cool fill #BFD6EE, a faint rim #FFE9C9 on the far edge. The game
        relights and grades this sprite for the hour, so keep the light neutral and
        readable. Do NOT paint a cast shadow on the ground or onto a background: only
        soft contact occlusion where forms touch.

        VALUES: haze is depth, not a filter over the whole frame. The subject plane
        uses the full value range: true darks in the deepest recesses (eyes, door,
        soil, gaps between forms) and clean highlights. Contrast falls only with distance
        from the subject. A soft, gentle look means soft local colour and soft edges,
        never lifted blacks, a milky veil or a grey-white wash.

        This is the SUBJECT plane: no atmosphere at all, the strongest contrast and
        the deepest darks in the picture.


        Output: one image, transparent background PNG, square 1024 x 1024.

        '
