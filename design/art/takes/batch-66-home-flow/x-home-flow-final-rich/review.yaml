jobs:
  x-home-flow-final-rich:
    pick: 1
    publication: concept master picked by the lead (take 1); promoted locally; publication held because the full-size lossless master exceeds the upload cap
    note: >-
      Take 1 has all four home doors in the correct row; its harbor islet rises in two lawn tiers
      beyond the guide. Take 2 also shows the two-tier harbor, and has only three home round doors:
      the rose door is missing. The clear and rich prompts use the required plate-style blocks, but
      the shared LIGHT block still describes milky air, never-black shadows and cream-white values,
      which may constrain the colour ladder; the prompt was left unchanged. Lead pick: take 1. Local
      promotion succeeded. The locked master remains pixel-identical to the native take at 1024x1536;
      the lossless PNG is 1,971,842 bytes and its exact lossless WebP equivalent is 1,458,528 bytes,
      both above the 614,400-byte upload limit. No resize, lossy master, or pixel edit was applied.
      Publication is held pending an approved delivery solution.
