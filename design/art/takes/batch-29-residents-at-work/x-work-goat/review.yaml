    note: auto-picked by QA; founder review pending. Both show the on-model cream/honey
      bearded goat with small horns and long relaxed ears, no head curl, gripping
      coral rope with mouth and one hoof while wrapping it round the pier post. A
      tiny wooden ferry waits beside the familiar chunky pier. Four limbs are anatomically
      consistent; no letters or Pofu added. The inherited eyebrow line reads more
      concentrated/stern than softly proud; both add a blue water-like surface beneath
      the pier instead of an explicit cloud sea, which the listed working-frame prompt
      does not forbid. These are recorded concept context/mood limitations, not a
      registered station edit. Core review of identity and the calm mooring action
      passes. Hard QA then lowest lock load decides; style/light warnings advisory.
      Never promoted.
