    note: auto-picked by QA; founder review pending. Both show the familiar round
      home island widened on the right for a small lily-pad pond and one frog, a stone
      path from a picket-fenced garden without an arch to the striped-awning tea corner,
      and a rope bridge leaving the left edge to a separate small harbor islet with
      bagel cart, pier and tiny ferry. The lawn retains substantial empty green space,
      the round front door, soft earth bowl, roots and cloud sea. Take1 shows two
      visible sunflower heads, take2 three; the level4 brief does not prescribe their
      count. Core notes-defined stage markers pass. These independently generated
      concepts attach only the main baseline island and do not preserve pixel registration
      or exact earlier-level placement; later frames may move the harbor, explicitly
      a continuity limitation rather than an approved production chain. No text or
      added resident beyond the specified frog. All references and exact prompt unchanged.
      Eligible hard QA then lowest lock load and higher Harmony; style/light warnings
      advisory. Never promoted.
