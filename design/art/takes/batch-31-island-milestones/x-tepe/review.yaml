      reward terrace above the windmill with stone path and steps, honey bench, chunky
      cream-and-brass tripod telescope, empty round pale-stone seasonal stage beside
      a leafy tree, and exactly three bare soil plots marked with small stones for
      future add-ons. Windmill roof and sails sit below the terrace, cream cloud sea
      and first dusk stars beyond; no residents or text. Take2 adds a small roofed
      lookout platform, an interpretation of the named lookout, without occupying
      any future plot. The requested full lower-island panorama is compressed to the
      familiar front earth-door silhouette rather than a complete visible station
      map: retain this close-framing/background limitation, not a claim of registered
      integration. Notes-defined calm lookout/room-for-add-ons review passes. All
      four main references and exact prompt unchanged; independent concept, never
      production plate. Eligible hard QA then lowest lock load and higher Harmony;
      exploration style/light warnings advisory. Never promoted.'
