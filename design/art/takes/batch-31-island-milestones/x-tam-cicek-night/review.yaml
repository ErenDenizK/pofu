    note: 'auto-picked by QA; founder review pending. Take2 clearly shows all nine
      named residents gathered on the lawn: central on-model fluffy Pofu with his
      own curl, long-eared Mochi, striped Simit, goggled Findik, goat, exactly three
      frogs and one mossy two-leaf sprout. Only Pofu carries the signature head curl.
      Take1 is excluded because the goat has a curled forehead tuft between its horns.
      Both otherwise have a peaceful indigo-plum ceremony sky, two-head giant sunflower,
      a lit lantern chain from garden toward lighthouse, open hill gate and warm path,
      and a huge gentle cloud-whale overhead with mossy back and glowing lantern hooks.
      No text, fireworks or dramatic burst. Take2 preserves the core ceremony and
      counts; no unlisted character-design references or previous-level frames were
      attached, so it remains an independent concept, not a registered full station
      layout. Eligible hard QA then lowest lock load and higher Harmony; exploration
      style/light warnings advisory. Never promoted.'
