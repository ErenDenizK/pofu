    pick: 3
    publication: selected exploration; never promoted
    note: auto-picked by QA; founder review pending. After the sole exact-prompt retry,
      takes3 and4 restore an unobstructed flower-arch gate opening on the hill path,
      clearly leading up to the bench and tripod telescope. No closed leaves remain
      across the path. Initial1/2 are excluded for their closed gates, contrary to
      the notes-defined opened hilltop/full-bloom state and home-progression section5.
      Both retries show the giant two-head sunflower, tiled and flagged tea stall,
      pond with three floating lit lanterns, large gear-sign workshop, left windmill
      with flag/window boxes, harbor pier with bunting and lighthouse garden, and
      warm terrace lamps under first dusk stars. The prompt was not rewritten and
      no extra references were added. Independent frames alter exact station placement
      and move the harbor from IL4 left to IL10 right because only the bare main island
      is attached; these are reviewable stage concepts, never a registered full production
      chain or proof of every catalog asset. Preserve this continuity limitation and
      the initial gate-state ambiguity explicitly. No text or extra residents. Eligible
      hard QA then lowest lock load and higher Harmony; exploration style/light warnings
      advisory. Never promoted.
