    note: 'auto-picked by QA; founder review pending. Both focus on the level7 additions:
      raised rear terrace with tool-wall workshop, chimney and large gear sign; striped
      lighthouse and warm lamp on a small harbor platform; rose, lilac and mustard
      borders along paths; glowing round path lamps; bench, paper-lantern string,
      toy sailboat at the pond and mailbox beside the round front door. No windmill
      is built. Familiar home grass/earth bowl, embedded pebbles, hanging roots and
      cloud sea remain recognisable. The complete previous-level garden/tea layout
      is not represented in these new-feature concept crops: only the base island
      is attached, no earlier concept frame is a reference. Harbor side also changes
      between takes and later milestones. Preserve these layout/continuity limitations
      explicitly; these are independent explorations, never a registered or complete
      production upgrade chain. The job notes-defined listed additions/decor review
      passes in both. No text, extra residents or head curls. Eligible hard QA then
      lowest lock load and higher Harmony; exploration style/light warnings advisory.
      Never promoted.'
