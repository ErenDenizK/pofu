      fuses the explicitly separate right harbor islet into one continuous home soil
      bowl with an internal canal/arched bridge instead of the connecting bridge to
      a separate islet. Take2 and retry3 additionally substitute a vegetable/rose-arch
      bed for the earlier sunflower garden; other takes retain that garden. Workshop
      tools/chimney/gear, tea, pond, pier/ferry, lighthouse, borders, bench, lanterns,
      sailboat and mailbox are visible with no windmill, but cannot excuse literal
      topology failure. Exclude all four and skip only this independent job. Initial
      pair peer/owner reviewed, both retries owner viewed. No pixel-continuity or
      extra-prop threshold, no further generation, exploration never promoted.
