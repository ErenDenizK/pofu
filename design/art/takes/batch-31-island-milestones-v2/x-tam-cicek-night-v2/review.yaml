    note: 'All four originals and the sole unchanged retry are preserved. All four
      contain the correct numerical nine-figure group (five mammals, three frogs,
      one sprout; overhead whale separate), two giant sunflower heads, lantern chain
      and open hill gate. All four nevertheless draw goggled Findik as a bushy-tailed
      squirrel/chipmunk without hedgehog spines, rather than the known resident hedgehog,
      and merge the right harbor into the main home soil bowl rather than a separate
      islet. Initial originals/locked independently reviewed, both retry originals
      owner-viewed. Station identities in the background are not all independently
      certified: the rear shop is not distinctly the requested gear/tool workshop,
      so it is not double-counted as tea and workshop. Exclude all four for resident
      identity/topology and skip only this independent job; no invented figure-count,
      extra accessory or pixel-continuity gate. Future authorized text should explicitly
      repeat Findik the hedgehog (the frozen abbreviated name is retained unchanged
      here). No further generation or local pixel edits; never promoted.'
