    note: 'auto-picked by QA; founder review pending. Both original and official locked
      candidates are independently visually eligible: exactly three complete separate
      scenes with the same Pofu and honey round door/window in a low cream wall segment.
      Calm has gentle open eyes; proud has lifted chin/chest and a paw on the frame;
      sleepy droops, yawns and leans with heavy lids. Signature curl is retained only
      on Pofu, cheeks are natural and unpuffed, and no island, lettering, sparkle,
      extra limbs or background is painted. Take2 has the lowest eligible lock load0.0100
      versus0.0138. The canonical sheet char-guard preserves the fur finish without
      a prop-lock override; no manual pixel edits. Exact-RGBA lossless preflight verifies
      its553930-byte WebP can preserve the full1536x1024 master under614400 without
      resizing. Real Harmony measure/check and own shard accompany the master; advisory
      light warnings remain for founder review.'
