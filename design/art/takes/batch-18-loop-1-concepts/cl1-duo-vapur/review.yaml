        curl and raised round ears. Mochi holds a two-tier çaydanlık with a visible
        amber stream reaching the tea glass; her face and pupils turn right toward
        Pofu, while he faces farther right toward the faint island in morning fog.
        Pofu rests his forepaws on the upper rail and his visible feet sit at the
        lower rail level; part of the exact foot contact is occluded, so upper-rail
        perching is not claimed. A broad cloud sea and pale morning blue surround
        the white ferry, with warm amber tea as the landmark. The relationship reads
        without letters. No painted text, UI, border, home lawn/soil bowl/roots/round
        home door or sunflower is observed. Composition uses a close left-cropped
        deck instead of a fully bounded little ferry in a wide shot; documented as
