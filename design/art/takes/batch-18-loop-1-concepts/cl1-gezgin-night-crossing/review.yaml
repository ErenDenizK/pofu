  note: 'Both originals recommend eligible: a full whale-shaped cloud landform carries
    a warm cloud-barnacle village, glowing flank freckles, closed eye and smile, a
    shower-spout with pale rainbow/moonbow, and the tiny tea-drinking Pofu/Mochi duo.
    Periwinkle-peach dusk replaces the home lawn template. Round illuminated windows/portholes
    are named by the brief and are not the home round wooden door. Profile evidence
    excludes diffuse spout water and individual raindrops as motion effects, not landform;
    no hidden whale edge is reconstructed. The owner chooses the eligible minimum-load
    take; no production eight-point gate.'
