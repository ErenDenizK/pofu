      - 1
      evidence: The broad whale head, long body, projecting flipper and raised split
        tail make a whale at native60 without relying on painted eye or windows. Rounded
        cloud-barnacle houses on the back carry warm amber circular glazing; glowing
        freckles run along the flank. Those explicitly requested windows/portholes
        are not copied wooden home-door leaves. The source has a closed eyelid, soft
        smile, visible spout rising into a falling droplet shower and a pale colored
        bow. Tiny hamster and lop bunny sit together with amber tea glasses; Pofu
        alone has the forelock curl, Mochi has long soft hanging ears and no crown
        curl. Peach-periwinkle fog/dusk fills the sky; no lawn oval, soil bowl, hanging
        roots, home pebbles, sunflower or home door is present. The tiny duo occupies
        only a small fraction of the whale width.
