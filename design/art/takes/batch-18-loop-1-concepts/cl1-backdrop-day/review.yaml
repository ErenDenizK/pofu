  note: Independent read-only recommendations. Sole owner selects/publishes. Exploration
    style/rubric advisory. Required satellite remains a semantic constraint.
  recommendation_only: true
  takes:
    '1':
      pass: false
      silhouette_name: Home oval foreground; stepped pool mass with planted bonsai;
        cold conical kiln; bell arch; whale and trailing rock stack
      rubric:
      - 3
      - 2
      - 2
      - 1
      - 1
      evidence: 'The exact home terrain family is retained: broad oval grass rim,
        cream layered soil bowl, round wooden entry and three hanging root groups.
        Sunflowers, a tea kiosk and pond are explicitly named additions. Behind it,
        the left pool cluster, cold unlit/no-smoke fairy-chimney kiln, bell arcade/spire
        and whale with trailing sea stack occupy distinct slots. Warm diffuse sky,
        cloud separation and increasing haze create foreground/mid/far depth. No painted
        letters, digits, logo, watermark, border or UI is visible. The bell arch is
        a real sky gap with a separate suspended bell; it is not filled into a solid
        rectangular proxy. HARD SEMANTIC FAILURE: the named bonsai satellite is not
        visibly separate. The bonsai trunk/base at x145–227,y407–472 joins the top
        pool at x95–270,y466–536. It is a tree planted directly on the main travertine
        island, with no separate boulder/float or visible orbit relation. Hidden separation
        is not inferred. All other islands have independently traced native60 profiles;
        color/detail/style concerns remain advisory, never an 8-point production gate.'
