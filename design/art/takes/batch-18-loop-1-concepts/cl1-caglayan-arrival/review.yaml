      as the arrival state of the same spiralling travertine-fountain landform, with
      milky opaque pools, sparse thin lowest-rim water, morning fog and an otter holding
      an empty glass. This is a fresh concept scene, not a registered edit: the manifest
      attaches home/cloud/R1 but no previous pool take and declares no edit_of. Same
      silhouette is interpreted as retention of the recognisable stepped-column landform
      family, not pixel-identical rim counts or camera framing; exact stage-to-stage
      registration is not claimed. Owner should disclose this manifest/spec ambiguity
      in the PR. No style-only threshold or production score gate is imposed.'
