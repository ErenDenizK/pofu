      - 2
      - 2
      - 1
      evidence: 'Three open basins are visible, each showing a different remote place:
        aurora over ice in the upper pool, whale back in the middle, warm bell-spire
        settlement in the lower. The outside sky has none of those scenes, establishing
        windows rather than ordinary mirrors. Mineral teal water, chalk cream walls
        and warm glints replace the home lawn/soil template. Otter holding an amber
        tea glass and small curled-forelock hamster occupy a rim; the lowest basin
        spills visibly into cloud. The observed in-frame stair-step landform and protruding
