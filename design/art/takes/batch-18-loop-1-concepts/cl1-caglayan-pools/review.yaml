    distant worlds (aurora ice, whale and bell settlement), not reflections of the
    common surrounding sky. Actual observed stepped-travertine profiles remain distinct
    at native60. This is a close concept composition: the upper column is frame-cut
    and the low fall fades into cloud, so a complete uncropped island contour is not
    claimed. The brief does not require a full-view margin; missing edges are not
    reconstructed. No production eight-point gate or style thresholds are imposed.
    The owner alone chooses the eligible lowest-lock-load take.'
