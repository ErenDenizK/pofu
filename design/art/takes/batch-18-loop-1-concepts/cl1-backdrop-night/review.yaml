        teal aurora and far-right snow-covered landform make a soft readable night
        rather than a gloomy scene. Three depth bands remain separated. HARD SEMANTIC
        FAILURES: separate bonsai satellite is absent; the specified cold kiln is
        lit and smoking; the sea stack is fused to the whale back instead of remaining
        a separate far-ring landform. Bonsai base x144–188,y493–516 sits on the top
        pool x76–234,y500–552. Cold kiln flame x329–367,y319–353 and smoke plume x343–409,y192–263
        are visible. Stone spires x668–749,y145–218 sit directly on the whale back
        rather than trailing separately. One small fog light is visible near x746,y357.
