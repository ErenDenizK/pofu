      floe behind establishes Revontuli without duplicating the ring-floe silhouette.
      Native60 proofs are separate for foreground and background; no whole opaque
      alpha rectangle. The water-filled aperture is excluded from solid ice geometry
      as an observed structural opening, not a claim that sky is visible through it.
      Owner chooses the lowest-load eligible take.
