    original_packet:
      batch: batch-39-koke-production
      job: koke-stretch
      worktree: /workspace/art-20261106-koke-repost
      prompt: 'REFERENCES (attached, in this order):

        1. The image to edit (the approved previous level). Edit it; do not redraw
        it.


        Edit the attached moss creature, Koke, into a big waking-up

        stretch. The front legs stretch far forward along the ground with

        the paws spread, the haunches rise and the back arches up in a

        rounded hump, the head lifts and tilts back a little in a huge soft

        yawn: a wide round open mouth with a small pink tongue and no teeth,

        the eyes squeezed shut in happy creases, the ears folded back. The

        moss, the sprout on the crown, the colours, the style and the

        lighting stay exactly as in the attached image; the creature keeps

        the same ground line at 88 percent of the height and stays fully

        inside the canvas.


        KEEP: everything not named above stays exactly the same as in the

        attached image: every existing part, its shape, color, position and size,

        the canvas, the camera, the light and the painting style. Do not zoom out

        or reframe: if a new part does not fit, make the new part smaller, never

        the existing ones. Outside the new parts, the result must line up with

        the attached image pixel for pixel.


        AVOID: teeth, fangs, claws, a roar, an angry or scared look, open eyes, a
        changed art style, a ground, a shadow, text


        LIGHT (hour: day, layer: subject). Bright, clear, toy-like.

        Paint this under the clear daylight cell: key light #FFF6EC from the upper
        left, soft cool fill #BFD6EE, a faint rim #FFE9C9 on the far edge. The game
        relights and grades this sprite for the hour, so keep the light neutral and
        readable. Do NOT paint a cast shadow on the ground or onto a background: only
        soft contact occlusion where forms touch.

        VALUES: haze is depth, not a filter over the whole frame. The subject plane
        uses the full value range: true darks in the deepest recesses (eyes, door,
        soil, gaps between forms) and clean highlights. Contrast falls only with distance
        from the subject. A soft, gentle look means soft local colour and soft edges,
        never lifted blacks, a milky veil or a grey-white wash.

        This is the SUBJECT plane: no atmosphere at all, the strongest contrast and
        the deepest darks in the picture.


        Output: one image, transparent background PNG, square 1024 x 1024.

        '
      refs:
      - /workspace/art-20261106-koke-repost/design/art/masters/koke-asleep/koke-asleep.png
      reference_sha256:
        /workspace/art-20261106-koke-repost/design/art/masters/koke-asleep/koke-asleep.png: 98e6a044f73e75d71c4cfcf38dc7d5d61d96dcbdc7a1d90b4b33b958151a7592
