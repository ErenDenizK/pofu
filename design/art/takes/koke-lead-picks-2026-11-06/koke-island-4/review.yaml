    original_callback_sha256: 5efdce47468440511e585ff2c767daafb69f14d687317e6732c174dc98f280b3
    original_tool_callback: /workspace/art-operator-runtime/run-20261106/koke-repost-2026-11-06/callback-koke-island-4-t1.json
    original_tool_callback_sha256: 2444cf65f4b39c65e8b411812a76c3c0c185f02b534ab5dcf0d07b7e01c6defc
    original_packet:
      batch: batch-39-koke-production
      job: koke-island-4
      worktree: /workspace/art-20261106-koke-repost
      prompt: 'REFERENCES (attached, in this order):

        1. The image to edit (the approved previous level). Edit it; do not redraw
        it.


        Edit the attached island plate from stage 0 to stage 4, healed: the

        signature moment. Koke stands up: the hump has risen onto four

        sturdy stubby legs, standing on the lawn where it slept, its head

        lifted and turned to the viewer, both eyes open, big round and

        warm brown with catchlights, a soft happy smile, its small ears

        perked. It is covered in rich living moss, thick like fur, and its

        whole back is in flower: blossoms in butter yellow, blush pink, lilac

        and white, with a tuft of leaves on its crown. It stands within the

        hump''s footprint and is about a third taller than the hump was, so it

        fits well inside the picture. The island is in full bloom: all five

        flower clusters open and lush, the moss deep and green on every

        boulder, the ferns unfurled, the path of stepping stones bright. A warm

        golden sun from the upper left lights everything, and the whole

        island glows with warm light. The signature image: soft flower petals

        and golden spores drift up in the air from all over the island,

        catching the light. The small dormouse sits on a boulder beside the

        rake, delighted, at the size of a bagel. Full colour (chroma about

        100 percent of a healthy meadow). The island''s size, outline, the

        camera, the boulders, the path and the rake stay exactly where they

        are in the attached image.


        KEEP: everything not named above stays exactly the same as in the

        attached image: every existing part, its shape, color, position and size,

        the canvas, the camera, the light and the painting style. Do not zoom out

        or reframe: if a new part does not fit, make the new part smaller, never

        the existing ones. Outside the new parts, the result must line up with

        the attached image pixel for pixel.


        AVOID: teeth, claws, a roar, a whale shape, glowing eyes, a dark sky, light
        rays, a halo, Koke crossing the island''s edge, new props, moving or resizing
        the island, scary details, text


        LIGHT (hour: day, layer: subject). Bright, clear, toy-like.

        Key light #FFF6EC from the upper left; fill #BFD6EE; rim #FFE9C9 along the
        edge facing away from the key. Shadows are tinted #A99BC4 (never grey or black)
        and fall toward the lower right; paint a contact shadow in that hue under
        every object that touches the ground or another form, firmest in the subject
        plane.

        VALUES: haze is depth, not a filter over the whole frame. The subject plane
        uses the full value range: true darks in the deepest recesses (eyes, door,
        soil, gaps between forms) and clean highlights. Contrast falls only with distance
        from the subject. A soft, gentle look means soft local colour and soft edges,
        never lifted blacks, a milky veil or a grey-white wash.

        This is the SUBJECT plane: no atmosphere at all, the strongest contrast and
        the deepest darks in the picture.


        Output: one image, opaque, full bleed, landscape 1536 x 1024.

        '
      refs:
      - /workspace/art-20261106-koke-repost/design/art/masters/koke-island-0/koke-island-0.png
      reference_sha256:
        /workspace/art-20261106-koke-repost/design/art/masters/koke-island-0/koke-island-0.png: f8f65e0ecc7c03f119c54307349d1c74bc9a143784c52228c1076fa984991231
