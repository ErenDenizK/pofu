prompt:
  text: 'REFERENCES (attached, in this order):

    1. The image to outpaint: the approved plate, kept exactly as it is, placed on a larger canvas. The transparent
    area around it is what you paint; do not redraw the plate.

    2. The mask for the outpaint: white is the area to paint, black is the plate to keep unchanged.

    3. The treatment reference for the sky, the distant floating islands and the deep cloud sea. Match its richness
    and painting style, not its objects.


    Outpaint the attached plate onto a tall phone canvas. The plate stays EXACTLY as

    painted: the same island, the same size, the same pixels, centred horizontally,

    its mass at about the middle of the canvas (the transparent area above and below

    it is yours to paint; the mask is white where you paint). Do not redraw, heal,

    shift or add anything on the plate itself. Above the plate paint a tall, deep

    sky with soft layered clouds and one or two small distant floating islands far

    away, small and hazy, no larger than a thumb. Below the plate paint a deep

    cloud sea that fills the whole bottom of the canvas, sunlit and billowing,

    painted with the same richness as the attached home reference (its sky, distant

    islands and cloud sea are the treatment to match; take the treatment, not the

    objects): layered cloud masses with painted light and shade, never a flat

    gradient, never a haze band, never an empty fog. The seam where the plate meets

    the new sky and cloud sea reads as one continuous painting.

    Light of this plate: night: a deep blue-violet sky with stars and a moon, a moonlit blue-violet cloud sea with
    soft silver edges; lit windows and lamps stay as small warm lights. The new sky and cloud sea carry

    this light and keep the plate''s own colours rich.

    Paint the sky and the cloud sea rich and slightly more vivid than home''s reference

    (a touch more colour in the sky and in the cloud masses), but never louder than this

    island''s own colours: the island band stays as painted.


    KEEP: everything not named above stays exactly the same as in the

    attached image: every existing part, its shape, color, position and size,

    the canvas, the camera, the light and the painting style. Do not zoom out

    or reframe: if a new part does not fit, make the new part smaller, never

    the existing ones. Outside the new parts, the result must line up with

    the attached image pixel for pixel.


    STYLE: a finished painted illustration for a premium cozy mobile game, like

    a page from a beloved picture book: soft painterly 2D with gentle airbrushed

    shading, rounded chunky forms, no outlines, no hard edges, matte surfaces

    with at most one soft highlight per object. COLOUR: vivid, saturated and

    jewel-like, as in the key art of a high-end animated film: intense grass

    greens, glowing sunflower yellow, deep sky blue, warm peach earth, crisp

    white petals; strong contrast between warm lit colour and cool shadow

    colour; every material keeps its own true colour. VALUES: a full range, from

    bright sunlit tops to deep warm shadows under eaves, inside foliage, beneath

    the lawn rim and around doors, so every object separates clearly from what

    is behind it and the picture reads at a glance on a small phone screen.

    Shadows are coloured (warm brown, plum, deep teal), never black or grey.

    Light direction and shadow hue follow the LIGHT block of this prompt.

    Colourful but never neon, never HDR, never glossy. No text, no letters, no

    numbers, no logos, no watermark, no border, no frame.


    AVOID: a flat gradient, a haze or mist band, a flat empty cloud sea, a plain sky, a hard seam, a changed or
    moved island, new objects on the island, large floating islands, characters, text


    LIGHT (hour: night, layer: subject). Safe, cozy.

    Key light #B8A8B1 from the upper right; fill #2A2350; rim #FFB060 along the edge facing away from the key. Shadows
    are tinted #2A2440 (never grey or black), short and soft, falling toward the lower left; every object sits on
    a soft occlusion pad in that hue where it touches the ground or another form.

    VALUES (the reference envelope): a high-key picture inside one envelope of soft, milky air. Every value sits
    between light mid-tone and cream-white; the darkest recesses (door holes, gaps, pond rims) are a mid-value tinted
    with the shadow hue, never black. Form turns in small value steps. Colour lives in the halftones; lights bleach
    to cream. No dark outlines: edges are found by value and hue. The cloud sea below is the brightest large surface
    and lights the island''s underside with a warm bounce.

    NIGHT is a hue change, not a value drop: only the sky is dark (deep indigo); the island and the clouds stay
    light, moonlit lavender, with violet shadows and cream practicals whose glow spreads three to four times the
    lamp''s size.

    This is the SUBJECT plane: the clearest forms and the crispest edges in the picture, still inside the envelope.


    Output: one image, opaque, full bleed, portrait 1024 x 1536.

    '
