  t1: Bright blue daylight and deep sunlit cloud sea. Island inventory and star trail retained, but original moon
    is removed and replaced by a sun higher at the upper left. This changes sky inventory/position beyond a pure
    colour edit; retained as a warned exploration candidate, not an exact-registration pass. No hard seam, flat
    cloud band, characters or text.
  t2: Bright daylight and layered cloud sea; island inventory remains recognizable. Original moon becomes a smaller
    sun at the left and dense sky stars disappear, exceeding pure colour change. Retained as warned exploration
    candidate, not an exact-registration pass. No hard seam or flat cloud band.
