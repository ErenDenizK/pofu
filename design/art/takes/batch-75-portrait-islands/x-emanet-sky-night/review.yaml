prompt:
  text: 'REFERENCES (attached, in this order):

    1. The image to edit (the approved previous level). Edit it; do not redraw it.

    2. The light target: the home island at this time, its sky, light and cloud sea. Match the light, not the objects.


    Edit the attached tall painting into the same scene in this light: a calm, clear night: a soft deep-blue sky
    (blue, never black) with a gentle glow near the clouds, a soft round moon and a few small stars, the cloud sea
    light and lilac-white, shadows blue-violet, no deep blacks. Warm light only from real sources already in the
    picture (windows, lanterns, lamps), each a small soft pool.

    Emanet''s own colours stay rich. The sky, the distant islands and the cloud sea

    stay rich and slightly vivid. Everything stays in its place, the same shapes and

    sizes; only light and colour change.


    KEEP: everything not named above stays exactly the same as in the

    attached image: every existing part, its shape, color, position and size,

    the canvas, the camera, the light and the painting style. Do not zoom out

    or reframe: if a new part does not fit, make the new part smaller, never

    the existing ones. Outside the new parts, the result must line up with

    the attached image pixel for pixel.


    AVOID: a flat gradient, a haze or mist band, a grey veil, a dark scene, orange or red saturation, healing or
    changing the stage, new objects, characters, text, moving anything


    LIGHT (hour: night, layer: subject). Safe, cozy.

    Key light #B8A8B1 from the upper right; fill #2A2350; rim #FFB060 along the edge facing away from the key. Shadows
    are tinted #2A2440 (never grey or black), short and soft, falling toward the lower left; every object sits on
    a soft occlusion pad in that hue where it touches the ground or another form.

    VALUES (the reference envelope): a high-key picture inside one envelope of soft, milky air. Every value sits
    between light mid-tone and cream-white; the darkest recesses (door holes, gaps, pond rims) are a mid-value tinted
    with the shadow hue, never black. Form turns in small value steps. Colour lives in the halftones; lights bleach
    to cream. No dark outlines: edges are found by value and hue. The cloud sea below is the brightest large surface
    and lights the island''s underside with a warm bounce.

    NIGHT is a hue change, not a value drop: only the sky is dark (deep indigo); the island and the clouds stay
    light, moonlit lavender, with violet shadows and cream practicals whose glow spreads three to four times the
    lamp''s size.

    This is the SUBJECT plane: the clearest forms and the crispest edges in the picture, still inside the envelope.


    Output: one image, opaque, full bleed, portrait 1024 x 1536.

    '
