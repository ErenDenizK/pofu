    despite the reference being style only and explicitly excluding a cliff or pool
    scene. Small stone-lip/bank context is allowed; no invented bush counts, pixel
    gates or numerical threshold changes. Native, official512, proper cream/night
    alpha and70px views were inspected; independent ROOT review agrees. All4 official
    reports are WARN-only with no hard failures and remain preserved. Sole unchanged
    retry exhausted; only literal edit_of children are cut. No third round, crop or
    repaint repair.'
