      gates or numerical threshold changes. Native, official512, proper cream/night
      alpha and70px views were inspected; independent ROOT review agrees. All4 official
      reports are WARN-only with no hard failures and remain preserved. Sole unchanged
      retry exhausted; only literal edit_of children are cut. No third round, crop
      or repaint repair.'
