    lead_review: "Lead pick: the spring at the top, the south opening joins the straight without a step."
    note: auto-picked by QA; founder review pending. Both initial takes pass hard
      QA and owner native, actual locked/exported and 70 pt mixed-parent review. Take
      1 ranks first with lock_load 0.3464 versus 0.3662. One small mossy spring in
      the upper half, rounded stone lip, expressly authored soft blue-green water
      and diffuse pale ripples; the pale shallow groove continues to the centered
      south edge. North, east and west remain closed stone. The actual straight-below
      join is visually continuous. No spray, sharp glints, text or unrelated objects.
      Water in the spring is required, so no blanket no-water exclusion was imported.
      Soft painted shoulder and seam differences are advisory; exact512 segmentation
      and completed app integration are not certified. No retry with eligible takes.
      No peer final acceptance is claimed; the owner reviewed actual final outputs.
      Canonical scale0.25 delivery is checked against exact downscaled RGBA, dimensions
      and metadata, preview and raw. Official Harmony measure/check runs on194 current
      BASE sources; UI is outside the authoritative catalog, so no fabricated own
      shard. Existing22 game-family asset links remain byte-stable. All original PNGs,
      callbacks, reference roles and reports are retained.
