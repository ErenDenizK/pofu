    note: 'auto-picked by QA; founder review pending. Both original and official locked
      initial takes pass independent content and parent comparison: two wide rounded
      cloud-white tail-fluke lobes join smoothly only at the far upper-right stock
      tip and stay within the shared1536x1024 canvas. Camera-facing eyes, smile, blush,
      paper-lantern skin scar and body placement visually retain the published body
      root; no fins, patch, pier, clouds, text or unrelated objects. Canonical hard
      QA passes both, edit_stability0.9777/0.9812 and edit_chroma1.0306/1.082 pass.
      No lock_load metric is reported for these char takes, so the equal-load fallback
      selects higher Harmony take2 (49.4 versus47.9). Light/Harmony warnings remain
      advisory. No invented100percent pixel identity or extra geometry threshold,
      and no manual alignment, palette or alpha cleanup. This is an independent whole-whale
      edit of nazli-body, not cumulative with other rig parts. Existing stable consumer
      links preserved. Founder review pending.'
