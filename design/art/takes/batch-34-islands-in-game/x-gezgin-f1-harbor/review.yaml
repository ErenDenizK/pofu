    note: 'auto-picked by QA; founder review pending. Both show the left-third home
      harbor and right-side tired grey-blue/cream whale, a readable moss patch with
      bench, one rope post tied to the pier, empty honey hook and an unlit paper-lantern
      scar outline rather than a bulb. Pofu and curl-free long-eared Mochi wait on
      the pier with a small bag. Whale length reads nearer twice the visible islet
      width in foreground perspective than the approximate three-times prose target;
      record this scale limitation for concept review. No ship deck, water/waves,
      text or scary mouth. Every one of the six listed references is attached: Pofu
      and Mochi share a labelled native-pixel board to fit the tool limit of five
      paths. Earlier six-path calls failed argument validation with zero outputs;
      these are the two actual initial takes. Numeric style/light warnings remain
      advisory; never promoted.'
