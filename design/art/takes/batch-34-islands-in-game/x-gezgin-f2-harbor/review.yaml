    note: 'SKIPPED after one allowed retry pair. All four candidates lose the same-whale
      paper-lantern-outline scar: take1 long wavy gold line, take2 short diagonal
      slash, take3 and take4 floating gold swooshes. The otherwise readable grown
      whale has three trees, young sunflower, two contained pools/short fall, keepsakes,
      lit old lantern and Pofu with curl-free Mochi on the bench, but the identifying
      lantern-shaped scar is not retained. Take1 and take2 additionally face away
      from the islet despite the head-toward-harbor brief; retries improve that direction
      but not the scar. No third round, no rephrasing, no manual image repairs or
      promotion. All four originals and q90 review takes retained, all six references
      attached through a labelled native-pixel board.'
