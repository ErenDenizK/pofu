  prompt: 'REFERENCES (attached, in this order):

    1. The image to edit (the approved previous level). Edit it; do not redraw it.

    2. The night target: the shipped moonlit night plate of the island, level 8. Match its light and colour:
    soft blue sky, quiet moonlit lawn, small warm pools only at real sources. Do not copy its objects
    or layout.


    Edit the attached picture of a wide lily lake with a small roofed pavilion on an islet, an arched
    wooden bridge with

    small lanterns, a deck with a rowing boat and a thin waterfall at the island''s edge, Nilüfer Gölü,
    on its plot of

    lawn, into the same scene on a calm, clear night, lit like the first attached night plate of the island:
    a soft deep-

    blue sky (blue, never black or purple-black) with a gentle glow near the clouds and a few small stars;
    the lawn, stone

    and wood stay readable and fairly light under cool moonlight, their colours soft and quiet but still
    rich, their

    shadows blue-violet, no deep blacks, no grey veil over the picture. Warm light only from sources that
    are already

    painted in the picture, each a small soft pool: the lanterns of the bridge. The station keeps the
    same silhouette, the

    same parts, the same size, in the same place on the same ground. Everything stays where it is; only
    light and colour

    change. The water stays flat and calm: a deep soft blue, at most one small soft moon glint, no ripple
    rings, no

    streaks and no lines of reflected light.


    KEEP: everything not named above stays exactly the same as in the

    attached image: every existing part, its shape, color, position and size,

    the canvas, the camera, the light and the painting style. Do not zoom out

    or reframe: if a new part does not fit, make the new part smaller, never

    the existing ones. Outside the new parts, the result must line up with

    the attached image pixel for pixel.


    STYLE: a finished painted illustration for a premium cozy mobile game, like

    a page from a beloved picture book: soft painterly 2D with gentle airbrushed

    shading, rounded chunky forms, no outlines, no hard edges, matte surfaces

    with at most one soft highlight per object. COLOUR: vivid, saturated and

    jewel-like, as in the key art of a high-end animated film: intense grass

    greens, glowing sunflower yellow, deep sky blue, warm peach earth, crisp

    white petals; strong contrast between warm lit colour and cool shadow

    colour; every material keeps its own true colour. VALUES: a full range, from

    bright sunlit tops to deep warm shadows under eaves, inside foliage, beneath

    the lawn rim and around doors, so every object separates clearly from what

    is behind it and the picture reads at a glance on a small phone screen.

    Shadows are coloured (warm brown, plum, deep teal), never black or grey.

    Light direction and shadow hue follow the LIGHT block of this prompt.

    Colourful but never neon, never HDR, never glossy. No text, no letters, no

    numbers, no logos, no watermark, no border, no frame.


    AVOID: high contrast, black shadows, an indigo-purple festival night, many bright lights, glowing
    everything, a flat grey or blue veil over the picture, saturated warm colour over the lawn, neon,
    a light beam or rays, a new object, lamp or window, a moved, resized or redrawn part, a reframed or
    zoomed picture, text, letters, ripple rings, water streaks, reflection lines, foam


    LIGHT (hour: night, layer: subject). Safe, cozy.

    Key light #B8A8B1 from the upper right; fill #2A2350; rim #FFB060 along the edge facing away from
    the key. Shadows are tinted #2A2440 (never grey or black), short and soft, falling toward the lower
    left; every object sits on a soft occlusion pad in that hue where it touches the ground or another
    form.

    VALUES (the reference envelope): a high-key picture inside one envelope of soft, milky air. Every
    value sits between light mid-tone and cream-white; the darkest recesses (door holes, gaps, pond rims)
    are a mid-value tinted with the shadow hue, never black. Form turns in small value steps. Colour lives
    in the halftones; lights bleach to cream. No dark outlines: edges are found by value and hue. The
    cloud sea below is the brightest large surface and lights the island''s underside with a warm bounce.

    NIGHT is a hue change, not a value drop: only the sky is dark (deep indigo); the island and the clouds
    stay light, moonlit lavender, with violet shadows and cream practicals whose glow spreads three to
    four times the lamp''s size.

    This is the SUBJECT plane: the clearest forms and the crispest edges in the picture, still inside
    the envelope.


    Output: one image, opaque, full bleed, square 1536 x 1536.

    '
