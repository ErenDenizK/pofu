    \ picture book: soft painterly 2D with gentle airbrushed\nshading, rounded chunky forms, no outlines,\
    \ no hard edges, matte surfaces\nwith at most one soft highlight per object. COLOUR: vivid, saturated\
    \ and\njewel-like, as in the key art of a high-end animated film: intense grass\ngreens, glowing sunflower\
    \ yellow, deep sky blue, warm peach earth, crisp\nwhite petals; strong contrast between warm lit colour\
    \ and cool shadow\ncolour; every material keeps its own true colour. VALUES: a full range, from\n\
    bright sunlit tops to deep warm shadows under eaves, inside foliage, beneath\nthe lawn rim and around\
