# Review for batch-01-slice. Edited by people (or by Codex on the founder's word).
# For each job set `pick` to the take number to approve (1, 2, ...),
# `none` to reject every take (regenerate), or leave it null (undecided).
# Never approve a take whose QA is `fail` without writing why in `note`.
# Then run: python3 -I tools/imagegen/run.py promote --manifest tools/imagegen/manifest/batch-01-slice.yaml
batch: batch-01-slice
contact_sheet: build/control/mochi/review/batch-01-slice-contact.jpg
jobs:
  mochi:
    pick: 1
    note: auto-picked by QA; founder review pending
    takes:
      t1:
        qa: pass
        summary: all pass
      t2:
        qa: pass
        summary: all pass
    approved:
      take: 1
      at: '2026-11-01T20:27:50-05:00'
