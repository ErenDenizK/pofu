  historical_generation:
    job: x-b16-icon-c-light
    take: 1
    batch: batch-16-brand-explore
    fingerprint: 461ebb3ba6c1d463
    prompt: 'REFERENCES (attached, in this order):

      1. The home island: the same painting and softness.

      2. Pofu, the hamster: his exact look, fur, colors and eyes.


      PRESET ICON: a painted icon or a family of icons. Fill the fields of the brief
      in this order: PURPOSE (what each icon means), AUDIENCE, SUBJECT (one object
      per icon), LAYOUT (a family sits on an even grid with equal size and spacing,
      nothing touching), STYLE (the attached icons and painting, the same finish for
      every icon of the family), PALETTE (milky pastel with one warm-brown accent
      shape per icon), CONSTRAINTS. Each icon is one centered object of three or four
      large rounded shapes that reads as a silhouette at 24 points; no thin parts,
      no outline, no background shape, no text, no letters, no numbers, no glass,
      no glossy highlight.


      PURPOSE: the Pofu app icon, direction C (island and seed), light appearance
      for iOS 26.

      AUDIENCE: adults who want to open social apps less; calm, not clinical.

      SUBJECT: the small floating home island seen from the front filling the lower
      middle, with one big sunflower sprout rising from its lawn as the focal shape,
      over a pale morning sky and a few clouds.

      LIGHT variant: soft pale sky, warm cream and peach light, the painting as described.

      LAYOUT: square, opaque, edge to edge, the focal shape inside the central 80%
      circle, corners calm background only.

      STYLE: the attached painting. PALETTE: milky pastel. No text.


      APP ICON: a square, fully opaque app icon. The focal shape sits inside

      the central 80% circle; the corners are calm background only, because

      the system masks them. It must read at 60 pixels: one clear shape, big

      and simple, high value contrast between the focal shape and the

      background. No text, no letters, no logo type, no border, no frame, no

      glass, no glossy highlight, no drop shadow.


      AVOID: text, a border, rounded corners, glass, gloss, a crowd of objects, tiny
      details, Pofu''s face


      Output: one image, opaque, full bleed, square 1024 x 1024.

      '
    attachments:
    - path: design/art/masters/island-main-s/island-main-s.png
      role: 'The home island: the same painting and softness.'
    - path: design/art/masters/pofu-hamster-base-v1/pofu-hamster-base.png
