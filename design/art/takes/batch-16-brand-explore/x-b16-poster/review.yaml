    prompt: 'REFERENCES (attached, in this order):

      1. The home island: the same painting and softness.

      2. Pofu, the hamster: his exact look, fur, colors and eyes.


      PRESET POSTER: a portrait poster with one idea. Fill the fields of the brief
      in this order: PURPOSE (what the poster does), AUDIENCE, TEXT HIERARCHY (headline,
      optional subline, nothing else), REQUIRED TEXT (spell it exactly, letter for
      letter, with every accent mark, and paint no other words), LAYOUT (a calm clear
      zone for the headline in the upper third, the picture below, the subline at
      the foot), STYLE (the attached painting, soft and milky), PALETTE (pastel, warm
      light from the upper left). Painted text is large, in one rounded hand-lettered
      face, dark warm brown on the pale sky, and fully legible at thumbnail size.
      No border, no frame, no glass, no buttons, no logo other than the headline.


      PRESET PROMO ITEM: a single social or store promo picture. Fill the fields of
      the brief in this order: PURPOSE (what the viewer does or feels next), AUDIENCE,
      TEXT HIERARCHY (headline, optional subline), REQUIRED TEXT (spelled exactly,
      letter for letter, with every accent mark, and paint no other words), LAYOUT
      (one hero subject, the headline in a calm clear zone), STYLE (the attached painting),
      PALETTE (pastel, warm light from the upper left). Painted text is large, rounded,
      hand-lettered, dark warm brown on a pale area, legible at thumbnail size. No
      border, no frame, no glass, no buttons, no badges, no prices, no store logos.


      PURPOSE: a promo poster for the app, to announce it in a calm, charming way.

      AUDIENCE: Turkish-speaking adults who want to scroll less.

      TEXT HIERARCHY: headline, then subline.

      REQUIRED TEXT, verbatim: headline "Pofu"; subline "Boş ver. Ada büyüsün."

      LAYOUT: headline in the clear upper third, Pofu on the home island lawn below
      it looking up at a lit paper lantern, the subline at the foot on a pale area.

      STYLE: the attached painting. PALETTE: pastel, morning light from the upper
      left.


      AVOID: any other words, a border, a phone, store badges, prices, more than one
      character


      Output: one image, opaque, full bleed, portrait 1024 x 1536.

      '
