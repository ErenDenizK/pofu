  historical_generation:
    job: x-b16-icon-family
    take: 1
    batch: batch-16-brand-explore
    fingerprint: 478058d9107e668c
    prompt: 'REFERENCES (attached, in this order):

      1. The seed icon: the exact finish, size and softness every icon of the family
      must share.

      2. The calm icon: the exact finish, size and softness every icon of the family
      must share.

      3. Pofu, the hamster: his exact look, fur, colors and eyes.


      PRESET ICON: a painted icon or a family of icons. Fill the fields of the brief
      in this order: PURPOSE (what each icon means), AUDIENCE, SUBJECT (one object
      per icon), LAYOUT (a family sits on an even grid with equal size and spacing,
      nothing touching), STYLE (the attached icons and painting, the same finish for
      every icon of the family), PALETTE (milky pastel with one warm-brown accent
      shape per icon), CONSTRAINTS. Each icon is one centered object of three or four
      large rounded shapes that reads as a silhouette at 24 points; no thin parts,
      no outline, no background shape, no text, no letters, no numbers, no glass,
      no glossy highlight.


      PURPOSE: the icon family of the Pofu interface, in the painted style.

      AUDIENCE: the app''s users, who see the icons at 24 to 44 points.

      SUBJECT: six icons in a grid of three columns and two rows, in this order: seed
      (a sunflower seed); lantern (a calm paper lantern); wellbeing (a small heart-shaped
      leaf); breath (a soft cloud with a curl of air); map (a rolled paper map); island
      (a tiny floating island).

      LAYOUT: even grid on a transparent background, equal size and spacing, nothing
      touching, no labels.

      STYLE: exactly the finish of the attached seed and calm icons. PALETTE: milky
      pastel with one warm-brown accent shape each.


      ICON STYLE: a painted icon from the same picture book as the attached

      hamster and island: the same soft airbrushed shading, the same warm

      light from the upper left and the same milky pastel colors, simplified

      for small sizes. One object only, centered, filling about 86% of the

      canvas, built from three or four large, rounded shapes, so it reads as a

      silhouette at 24 points. No thin parts: nothing narrower than a tenth of

      the icon''s width (no stems, strings, whiskers, spikes or tiny dots). A

      clear value structure: the shadow side, or one warm-brown accent shape,

      is dark enough to read on pale frosted glass, and the lit side reads on

      dark glass. Matte, no glints, no texture. No outline, no drop shadow, no

      background shape: no circle, tile, badge or plate behind the object. No

      glass, no frosted panel, no glossy button. No text, no letters, no

      numbers.


      AVOID: text, labels, a background tile, glass, gloss, outlines, thin parts


      Output: one image, transparent background PNG, landscape 1536 x 1024.

      '
    attachments:
    - path: design/art/ui/icon-seed/icon-seed.png
      role: 'The seed icon: the exact finish, size and softness every icon of the
        family must share.'
    - path: design/art/ui/icon-calm/icon-calm.png
      role: 'The calm icon: the exact finish, size and softness every icon of the
        family must share.'
    - path: design/art/masters/pofu-hamster-base-v1/pofu-hamster-base.png
