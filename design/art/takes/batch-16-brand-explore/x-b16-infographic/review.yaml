    fingerprint: b57f19597ceb5b89
    prompt: 'REFERENCES (attached, in this order):

      1. The home island: the same painting and softness.

      2. Pofu, the hamster: his exact look, fur, colors and eyes.


      PRESET INFOGRAPHIC: a portrait picture that explains a loop in a few steps.
      Fill the fields of the brief in this order: PURPOSE (what the viewer should
      understand in five seconds), AUDIENCE, TEXT HIERARCHY (one short label per step,
      nothing else), REQUIRED TEXT (each label spelled exactly, letter for letter,
      with every accent mark, apostrophe and arrow, and paint no other words), LAYOUT
      (steps in reading order from top to bottom, each one a painted picture with
      its label beside or beneath it, soft painted arrows between the steps), STYLE
      (the attached painting), PALETTE (pastel, warm light from the upper left). Labels
      are large, in one rounded hand-lettered face, dark warm brown on a pale ground,
      fully legible on a phone. No chart axes, no numbers other than those required,
      no border, no glass, no buttons.


      PURPOSE: explain the whole Pofu loop in five seconds.

      AUDIENCE: a Turkish-speaking adult scrolling too much; friendly and light.

      TEXT HIERARCHY: four short labels, one per step, same size.

      REQUIRED TEXT, top to bottom, each on its own line, verbatim:

      Instagram''a uzandın

      Pofu

      boş ver

      ada büyür

      LAYOUT: a vertical path of four painted steps joined by soft painted arrows:
      (1) a thumb reaching toward a rounded phone with a camera-like glyph, no real
      logo; (2) Pofu raising a paw in a gentle wait; (3) Pofu shrugging with a relaxed
      smile beside a lowered phone; (4) the floating home island with a new little
      tree grown. Each label sits beside its picture.

      STYLE: the attached painting. PALETTE: pastel.


      AVOID: any other words, real app logos, numbers, a border, a chart


      Output: one image, opaque, full bleed, portrait 1024 x 1536.

      '
