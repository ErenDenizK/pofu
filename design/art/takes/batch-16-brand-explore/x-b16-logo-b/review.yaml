    prompt: 'REFERENCES (attached, in this order):

      1. The home island: the same painting and softness.

      2. Pofu, the hamster: his exact look, fur, colors and eyes.


      PRESET LOGO: a wordmark on a plain pale cream background, shown large and centered,
      with generous empty margin on every side. Fill the fields of the brief in this
      order: PURPOSE, AUDIENCE, REQUIRED TEXT (spell it exactly, letter for letter,
      and paint no other words), LETTERFORM (round, soft, friendly, built from a few
      thick shapes with even stroke weight), COLOR (one or two flat warm colors from
      the attached painting), CONSTRAINTS. It must stay legible at 120 pixels wide:
      no thin hairlines, no gradients inside the letters, no outline, no drop shadow,
      no glow, no 3D, no texture, no frame, no glass. One lockup only, no variations
      on the page.


      PURPOSE: a wordmark for the app Pofu, direction B (hand-brushed).

      AUDIENCE: adults and teens who open social apps by reflex; warm, humorous, never
      preachy.

      REQUIRED TEXT: Pofu

      (exactly four letters: capital P, lowercase o, f, u.)

      LETTERFORM: friendly hand-brushed letters with slightly uneven baseline, in
      warm brown with the first letter in sunflower yellow. Extra mark: no mark.

      COLOR: warm brown and cream from the attached painting on a plain pale cream
      ground.

      LAYOUT: one lockup, centered, wide, with generous margin.


      AVOID: any word other than Pofu, a hamster, a border, 3D, glow, outline, a drop
      shadow


      Output: one image, opaque, full bleed, landscape 1536 x 1024.

      '
