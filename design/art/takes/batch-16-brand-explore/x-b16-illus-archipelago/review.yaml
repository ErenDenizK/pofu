    job: x-b16-illus-archipelago
    take: 1
    batch: batch-16-brand-explore
    fingerprint: 8d48d4076923e3c3
    prompt: 'REFERENCES (attached, in this order):

      1. The home island: the same painting and softness.

      2. Pofu, the hamster: his exact look, fur, colors and eyes.


      PRESET ILLUSTRATION: a storybook picture that tells one moment. Fill the fields
      of the brief in this order: PURPOSE (the feeling or idea), AUDIENCE, SUBJECT
      (who, doing what, where), LAYOUT (camera, focal point, a calm clear zone for
      text added later), STYLE (the attached painting, the same finish, softness and
      fur), PALETTE (pastel, warm light from the upper left), CONSTRAINTS. No text,
      no letters, no border, no frame, no glass, no interface.


      PURPOSE: show that Pofu''s world is a whole archipelago to grow, not one island.

      AUDIENCE: new players, store visitors.

      SUBJECT: Pofu small in the foreground on the home island''s lawn, looking out
      with big eyes at a gentle chain of six floating islands (mossy, snowy, tall
      spire, whale shaped, red clay, a glowing star one) rising into a soft cream
      sky over a sea of clouds.

      LAYOUT: wide, Pofu at lower left, the chain climbing to the upper right, a calm
      clear zone at the top.

      STYLE: the attached painting. PALETTE: pastel, morning light from the upper
      left.


      STYLE: soft painterly 2D illustration from the same picture book as the

      attached hamster: the same gentle airbrushed shading, the same light,

      high-key values and the same milky pastel colors. Simple, rounded, chunky

      shapes with few parts; fewer, larger shapes, because this is seen small on

      a phone. Every material is painted matte, as a soft form with broad,

      smooth value changes: wood without grain, metal without hammering or

      reflections, glass as a soft tinted shape, cloth without weave. At most

      one small, soft highlight per object; no glints, no shine. Colors are

      muted and lifted toward cream; the darkest shadow is a warm mid-brown,

      never near black. Warm diffused key light from the upper left, a faint

      warm rim light along the right edge, soft ambient shadow only where forms

      touch. Clean, calm, uncluttered. No outlines, no hard edges. No text, no

      letters, no numbers, no logos, no watermark, no border, no frame, no

      sticker outline.


      AVOID: text, a border, more than one character, harsh shadows, dark moods


      Output: one image, opaque, full bleed, landscape 1536 x 1024.

      '
