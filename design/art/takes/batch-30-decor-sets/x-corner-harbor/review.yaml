      take3 is manually eligible: a rounded egg-shaped coral-and-cream striped buoy
      lantern with a soft cream glass band sits on its stone, together with rod/clay
      stand, tin bucket, canvas stool, rope coil/slatted crate and bunting between
      two poles. Takes1and4 draw a plain ring-topped buoy with no lamp; take2 draws
      an ordinary cage lantern without a clearly striped buoy-shaped body, so they
      are excluded. The corner prompt describes a combined buoy lantern and does not
      require the separate mast of the independent individual-prop brief; no extra
      mast gate is invented. Likewise this corner asks for a canvas stool, not its
      folded state, and does not specify fish/float inventories or seven flags. Familiar
      low-camera lawn, stepping stones, earth edge and cloud sea remain; no characters
      or text. Its note says dusk but actual prompt/LIGHT day, followed verbatim.
      This is an independent concept, not a registered prop assembly. All four hard
      QA reports pass; take3 is the only manually eligible one. Style/light warnings
      remain advisory. Never promoted.'
