manual_review:
  observed_note: Take 1 contains the smoke curl; take 2 omits it. Both show three saucer pools, three
    leaf boats, the open front pool and an empty seat, with no characters or text. The plate camera/depth
    looks deeper than the authored guide by about one fifth of the island width, and pebbles appear on
    the body despite the home-island reference instructing not to copy pebbles. These are composition
    warnings for lead review; no exact pixel-registration pass is claimed. No take is selected and neither
    is promoted.
  selection: take 1 picked by the lead, 2026-11-10; recovered source promoted with founder authorization
