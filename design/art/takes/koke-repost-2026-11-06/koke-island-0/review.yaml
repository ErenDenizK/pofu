        never lifted blacks, a milky veil or a grey-white wash.

        This is the SUBJECT plane: no atmosphere at all, the strongest contrast and
        the deepest darks in the picture.


        Output: one image, opaque, full bleed, landscape 1536 x 1024.

        '
