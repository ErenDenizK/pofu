  x-shield-icons-night:
    pick: 1
    status: review
    publication: exploration; never promoted
    note: 'Six round medallions in 3x2 retain day-set mood order: curious tilt, proud chest, jealous crossed
      paws/huff, calm eyes-closed breathing, excited paws-up smile, sleepy nightcap/candle. Warm burrow
      lamps and thin amber rims separate the indigo interiors from the proper #1E1A3C night composite;
      180px strips inspected and faces read clearly. Native1254square sources are normalized by official
      post to1024; no claimed exact production6pxrim measurement. Proud sparkle stays larger than a speck
      like day reference; disclosed decorative cue, not a claim that all stars are speck-sized. Transparent
      outside circles verified; tiny low-alpha edge flecks remain, no painted outside background. Auto-pick
      official QA dE load then measured harmony; exploration only.'
