<title>Pofu Atlas</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Pofu's content board: islands, stations, characters, systems, storyboard, progression, ideas and every generated image.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap">
<style>
/* Layout: one pannable world of labelled regions (a studio content wall); fixed glass chrome on top. Tokens from design/tokens/pofu-tokens.json. */
:root {
  --bg: #FFF6EC;            /* cream-100, background.canvas */
  --sunken: #FBEBDD;        /* cream-200 */
  --card: #FFFBF5;          /* cream-50 */
  --raised: #FFFFFF;
  --fg: #2A1F2D;            /* ink-900 */
  --fg2: #66555F;           /* ink-600 */
  --fg3: #8E7D88;           /* ink-400 */
  --line: rgba(42, 31, 45, .12);
  --line2: rgba(42, 31, 45, .22);
  --accent: #6C4FD8;        /* violet-600 */
  --accent-tint: #EEE8FF;   /* violet-100 */
  --on-accent: #FFFFFF;
  --ok: #2F7349;  --ok-tint: #DDF1E3;
  --warn: #8A5A00; --warn-tint: #FCEBC8;
  --crit: #B23A5A; --crit-tint: #FBDDE5;
  --muted-tint: #EFE6EC;
  --glass: rgba(255, 251, 245, .82);
  --shadow: 0 1px 2px rgba(42, 31, 45, .08), 0 6px 18px rgba(42, 31, 45, .07);
  --dot: rgba(42, 31, 45, .09);
  /* region tints */
  --r-arch: #EAF4E4; --r-char: #FCE8E1; --r-sys: #ECE8FB; --r-story: #FFF0D9;
  --r-prog: #E4F0F6; --r-theme: #F6E7F1; --r-idea: #F2EEE4; --r-asset: #EDEAF0;
  /* type hues */
  --t-island: #4F8A5B; --t-station: #C07A2C; --t-character: #C4577A; --t-system: #6C4FD8;
  --t-moment: #B9811A; --t-theme: #A0558E; --t-idea: #6B7A3A; --t-asset: #557089;
  --font: "Nunito", ui-rounded, "SF Pro Rounded", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #15111C; --sunken: #1E1828; --card: #1E1828; --raised: #2A2236;
    --fg: #FFF6EC; --fg2: #B8A8B1; --fg3: #85768A;
    --line: rgba(255, 246, 236, .12); --line2: rgba(255, 246, 236, .22);
    --accent: #B9A2FF; --accent-tint: #2E2547; --on-accent: #15111C;
    --ok: #8FD4A4; --ok-tint: #1D3326; --warn: #F7C873; --warn-tint: #3A2E14;
    --crit: #FF9EB5; --crit-tint: #3E1D28; --muted-tint: #2A2236;
    --glass: rgba(30, 24, 40, .82);
    --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 8px 22px rgba(0, 0, 0, .35);
    --dot: rgba(255, 246, 236, .07);
    --r-arch: #18241C; --r-char: #2A1C22; --r-sys: #211C33; --r-story: #2A2216;
    --r-prog: #172229; --r-theme: #261B26; --r-idea: #22201A; --r-asset: #1F1D25;
    --t-island: #8CC084; --t-station: #ECA96E; --t-character: #FF9EB5; --t-system: #B9A2FF;
    --t-moment: #F7C873; --t-theme: #E1A6D3; --t-idea: #C6D08A; --t-asset: #9DB8CF;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #15111C; --sunken: #1E1828; --card: #1E1828; --raised: #2A2236;
  --fg: #FFF6EC; --fg2: #B8A8B1; --fg3: #85768A;
  --line: rgba(255, 246, 236, .12); --line2: rgba(255, 246, 236, .22);
  --accent: #B9A2FF; --accent-tint: #2E2547; --on-accent: #15111C;
  --ok: #8FD4A4; --ok-tint: #1D3326; --warn: #F7C873; --warn-tint: #3A2E14;
  --crit: #FF9EB5; --crit-tint: #3E1D28; --muted-tint: #2A2236;
  --glass: rgba(30, 24, 40, .82);
  --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 8px 22px rgba(0, 0, 0, .35);
  --dot: rgba(255, 246, 236, .07);
  --r-arch: #18241C; --r-char: #2A1C22; --r-sys: #211C33; --r-story: #2A2216;
  --r-prog: #172229; --r-theme: #261B26; --r-idea: #22201A; --r-asset: #1F1D25;
  --t-island: #8CC084; --t-station: #ECA96E; --t-character: #FF9EB5; --t-system: #B9A2FF;
  --t-moment: #F7C873; --t-theme: #E1A6D3; --t-idea: #C6D08A; --t-asset: #9DB8CF;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { height: 100%; box-sizing: border-box; overflow: hidden; }
body {
  height: 100%; margin: 0; overflow: hidden; background: var(--bg); color: var(--fg);
  font: 15px/1.4 var(--font); -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--glass); }
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2.5px solid var(--accent); outline-offset: 2px; }

/* ---------------------------------------------------------------- chrome */
#app { position: fixed; inset: 0; }
#viewport {
  position: absolute; inset: 0; overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none;
  background-color: var(--bg);
  background-image: radial-gradient(var(--dot) 1.2px, transparent 1.3px);
  background-size: 22px 22px; cursor: grab;
}
#viewport.dragging { cursor: grabbing; }
#world { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
#world.moving { will-change: transform; }

.topbar {
  position: absolute; z-index: 5; left: 0; right: 0; top: 0;
  padding: calc(env(safe-area-inset-top, 0px) + 10px) max(16px, env(safe-area-inset-right, 0px)) 10px max(16px, env(safe-area-inset-left, 0px));
  display: flex; gap: 8px; align-items: center; pointer-events: none;
}
.topbar > * { pointer-events: auto; }
.brand {
  display: flex; align-items: center; gap: 8px; padding: 0 12px 0 6px; height: 44px; border-radius: 22px;
  background: var(--glass); backdrop-filter: blur(14px) saturate(1.4); -webkit-backdrop-filter: blur(14px) saturate(1.4);
  box-shadow: var(--shadow); font-weight: 900; letter-spacing: -.01em; white-space: nowrap; border: 0;
}
.brand .seed { width: 32px; height: 32px; border-radius: 50%; background: var(--accent); display: grid; place-items: center; color: var(--on-accent); }
.brand .seed svg { width: 18px; height: 18px; }
.brand small { font-weight: 700; color: var(--fg3); font-size: 12px; }
.search {
  flex: 1; min-width: 0; position: relative; height: 44px; border-radius: 22px; background: var(--glass);
  backdrop-filter: blur(14px) saturate(1.4); -webkit-backdrop-filter: blur(14px) saturate(1.4); box-shadow: var(--shadow);
  display: flex; align-items: center;
}
.search svg { width: 18px; height: 18px; margin-left: 14px; color: var(--fg3); flex: none; }
.search input { flex: 1; min-width: 0; height: 100%; border: 0; background: transparent; padding: 0 14px 0 8px; font-size: 16px; outline: none; }
.iconbtn {
  flex: none; width: 44px; height: 44px; border-radius: 22px; border: 0; background: var(--glass);
  backdrop-filter: blur(14px) saturate(1.4); -webkit-backdrop-filter: blur(14px) saturate(1.4); box-shadow: var(--shadow);
  display: grid; place-items: center; position: relative;
}
.iconbtn svg { width: 20px; height: 20px; }
.iconbtn .dotbadge { position: absolute; top: 8px; right: 8px; width: 9px; height: 9px; border-radius: 50%; background: var(--accent); border: 2px solid var(--card); }
.results {
  position: absolute; left: 0; right: 0; top: 52px; max-height: min(60vh, 440px); overflow: auto; border-radius: 18px;
  background: var(--raised); box-shadow: var(--shadow); padding: 6px; border: 1px solid var(--line);
}
.results button {
  width: 100%; text-align: left; border: 0; background: transparent; border-radius: 12px; padding: 9px 10px;
  display: grid; grid-template-columns: 10px 1fr auto; gap: 10px; align-items: center; min-height: 44px;
}
.results button:hover, .results button.on { background: var(--accent-tint); }
.results .r-t { font-weight: 800; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.results .r-s { color: var(--fg3); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.results .empty { padding: 14px; color: var(--fg2); }

.regionbar {
  position: absolute; z-index: 4; left: 0; right: 0; bottom: 0;
  padding: 10px max(16px, env(safe-area-inset-right, 0px)) calc(env(safe-area-inset-bottom, 0px) + 10px) max(16px, env(safe-area-inset-left, 0px));
  display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; pointer-events: none;
}
.regionbar::-webkit-scrollbar { display: none; }
.regionbar button {
  pointer-events: auto; flex: none; height: 40px; padding: 0 14px; border-radius: 20px; border: 0; font-weight: 800; font-size: 14px;
  background: var(--glass); backdrop-filter: blur(14px) saturate(1.4); -webkit-backdrop-filter: blur(14px) saturate(1.4);
  box-shadow: var(--shadow); display: flex; align-items: center; gap: 8px; white-space: nowrap;
}
.regionbar button i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }

.zoomctl { position: absolute; z-index: 4; right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(env(safe-area-inset-bottom, 0px) + 62px); display: flex; flex-direction: column; gap: 8px; }

/* filters */
.sheet {
  position: absolute; z-index: 7; right: max(16px, env(safe-area-inset-right, 0px)); top: calc(env(safe-area-inset-top, 0px) + 62px);
  width: min(420px, calc(100vw - 32px)); max-height: calc(100% - 140px); overflow: auto;
  background: var(--raised); border-radius: 22px; box-shadow: var(--shadow); border: 1px solid var(--line); padding: 16px;
}
.sheet h3 { margin: 4px 0 8px; font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--fg3); font-weight: 800; }
.sheet .row { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
.fchip { min-height: 36px; padding: 0 12px; border-radius: 18px; border: 1.5px solid var(--line2); background: transparent; font-weight: 700; font-size: 14px; display: inline-flex; align-items: center; gap: 6px; }
.fchip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.fchip i { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }
.sheet .foot { display: flex; justify-content: space-between; align-items: center; gap: 12px; color: var(--fg2); font-size: 14px; }
.textbtn { border: 0; background: transparent; color: var(--accent); font-weight: 800; min-height: 44px; padding: 0 6px; }

/* overlay labels at far zoom */
#labels { position: absolute; inset: 0; pointer-events: none; z-index: 2; }
.olabel {
  position: absolute; pointer-events: auto; border: 0; transform: translate(0, -100%);
  padding: 6px 12px; border-radius: 14px; font-weight: 900; font-size: 15px; white-space: nowrap;
  background: var(--glass); box-shadow: var(--shadow); color: var(--fg);
}
.olabel span { color: var(--fg3); font-weight: 700; font-size: 12px; margin-left: 6px; }

/* ---------------------------------------------------------------- world */
.region { position: absolute; border-radius: 48px; }
.region > .rhead { position: absolute; left: 48px; top: 36px; right: 48px; }
.rhead h2 { margin: 0; font-size: 64px; line-height: 1; font-weight: 900; letter-spacing: -.02em; text-wrap: balance; }
.rhead p { margin: 10px 0 0; font-size: 22px; color: var(--fg2); max-width: 70ch; }
.far .rhead { visibility: hidden; }

.card {
  position: absolute; display: flex; gap: 10px; padding: 10px; border-radius: 16px; background: var(--card);
  box-shadow: var(--shadow); border: 1px solid var(--line); overflow: hidden;
}
.card .thumb { flex: none; width: 76px; height: 76px; border-radius: 12px; background: var(--sunken); display: grid; place-items: center; overflow: hidden; position: relative; }
.card .thumb img { width: 100%; height: 100%; object-fit: contain; }
.card .thumb.ph { font-weight: 900; font-size: 26px; color: var(--tc); background: color-mix(in srgb, var(--tc) 14%, var(--card)); }
.card .body { min-width: 0; display: flex; flex-direction: column; gap: 6px; flex: 1; }
.card .ttl { font-weight: 800; font-size: 16px; line-height: 1.2; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.card .sub { font-size: 12.5px; color: var(--fg2); line-height: 1.3; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.card .meta { margin-top: auto; display: flex; align-items: center; gap: 6px; flex-wrap: nowrap; min-width: 0; }
.card::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: var(--tc); opacity: .9; }
.card.sel { outline: 3px solid var(--accent); outline-offset: 3px; }
.card.dim, .lvl.dim { opacity: .14; }
.far .card > * { visibility: hidden; }
.far .card { box-shadow: none; background: color-mix(in srgb, var(--tc) 28%, var(--card)); }
.off { display: none !important; }

.chip { display: inline-flex; align-items: center; height: 20px; padding: 0 8px; border-radius: 10px; font-size: 11.5px; font-weight: 800; white-space: nowrap; }
.st-idea { background: var(--muted-tint); color: var(--fg2); }
.st-planned { background: var(--accent-tint); color: var(--accent); }
.st-in-production { background: var(--warn-tint); color: var(--warn); }
.st-in-app { background: var(--ok-tint); color: var(--ok); }
.st-cut { background: var(--crit-tint); color: var(--crit); text-decoration: line-through; }
.chip.hz { background: transparent; border: 1px solid var(--line2); color: var(--fg2); }
.chip.unused { background: var(--crit); color: var(--card); }
.nc { margin-left: auto; display: inline-flex; gap: 6px; align-items: center; font-size: 12px; color: var(--fg3); font-weight: 700; white-space: nowrap; }
.nc .fn { display: inline-flex; align-items: center; gap: 3px; color: var(--on-accent); background: var(--accent); border-radius: 9px; height: 18px; padding: 0 6px; font-weight: 800; }
.nc .fn[hidden] { display: none; }
.nc svg { width: 12px; height: 12px; }

.ty-island { --tc: var(--t-island); } .ty-station { --tc: var(--t-station); } .ty-character { --tc: var(--t-character); }
.ty-system { --tc: var(--t-system); } .ty-moment { --tc: var(--t-moment); } .ty-theme { --tc: var(--t-theme); }
.ty-idea { --tc: var(--t-idea); } .ty-asset { --tc: var(--t-asset); }

/* islands and stations */
.isle { position: absolute; border-radius: 40px; background: color-mix(in srgb, var(--card) 62%, transparent); border: 2px dashed color-mix(in srgb, var(--t-island) 45%, transparent); }
.isle.locked { border-style: dotted; }
.card.island { padding: 14px; gap: 16px; border-radius: 26px; }
.card.island .thumb { width: 220px; height: 146px; border-radius: 18px; background: linear-gradient(180deg, color-mix(in srgb, var(--accent-tint) 70%, var(--card)), var(--card)); }
.card.island .ttl { font-size: 30px; font-weight: 900; }
.card.island .sub { font-size: 14px; -webkit-line-clamp: 3; }
.card.island .rule { font-size: 13px; color: var(--fg2); font-weight: 700; }
.card.island .rule b { color: var(--fg); }
.card.station { flex-direction: column; gap: 10px; border-radius: 20px; }
.card.station .top { display: flex; gap: 10px; min-height: 64px; }
.card.station .top .thumb { width: 64px; height: 64px; }
.lvls { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
.lvl { position: relative; border-radius: 10px; background: var(--sunken); aspect-ratio: 1; display: grid; place-items: center; overflow: hidden; border: 1px solid var(--line); }
.lvl img { width: 100%; height: 100%; object-fit: contain; }
.lvl .n { position: absolute; left: 4px; top: 3px; font-size: 11px; font-weight: 900; color: var(--fg2); }
.lvl .c { position: absolute; right: 4px; bottom: 3px; font-size: 10px; font-weight: 800; color: var(--fg3); font-variant-numeric: tabular-nums; }
.lvl.ph { background: repeating-linear-gradient(135deg, var(--sunken) 0 6px, color-mix(in srgb, var(--sunken) 70%, var(--card)) 6px 12px); }
.lvl.ph .d { font-size: 10px; line-height: 1.15; color: var(--fg3); text-align: center; padding: 14px 4px 12px; font-weight: 700; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.lvl.has { background: var(--card); }
.lvl.cutl { opacity: .5; }

/* systems */
svg.edges { position: absolute; left: 0; top: 0; overflow: visible; pointer-events: none; }
svg.edges path { fill: none; stroke-width: 3; opacity: .55; }
svg.edges path.e-feeds { stroke: var(--ok); }
svg.edges path.e-drains { stroke: var(--crit); stroke-dasharray: 2 7; stroke-linecap: round; }
svg.edges path.e-leads_to { stroke: var(--accent); }
svg.edges path.e-requires { stroke: var(--fg3); stroke-dasharray: 10 8; }
svg.edges path.hot { opacity: 1; stroke-width: 5; }
svg.edges.focus path:not(.hot) { opacity: .12; }
.legend { display: flex; gap: 22px; flex-wrap: wrap; margin-top: 14px; font-size: 20px; font-weight: 800; color: var(--fg2); }
.legend span { display: inline-flex; align-items: center; gap: 10px; }
.legend i { width: 38px; height: 0; border-top: 4px solid; display: inline-block; }
.colhead { position: absolute; font-size: 22px; font-weight: 900; color: var(--fg3); text-transform: uppercase; letter-spacing: .08em; }

/* storyboard and timeline */
.actlabel { position: absolute; font-size: 26px; font-weight: 900; color: var(--fg); width: 220px; line-height: 1.1; }
.actlabel small { display: block; font-size: 15px; color: var(--fg3); font-weight: 700; margin-top: 4px; }
.arrow { position: absolute; height: 0; border-top: 3px solid color-mix(in srgb, var(--t-moment) 60%, transparent); }
.arrow::after { content: ""; position: absolute; right: -2px; top: -8px; border: 6.5px solid transparent; border-left: 10px solid color-mix(in srgb, var(--t-moment) 60%, transparent); }
.axis { position: absolute; height: 0; border-top: 3px solid var(--line2); }
.tick { position: absolute; width: 0; border-left: 2px solid var(--line2); }
.ticklabel { position: absolute; font-size: 20px; font-weight: 900; color: var(--fg2); transform: translateX(-50%); white-space: nowrap; font-variant-numeric: tabular-nums; }
.lane { position: absolute; border-radius: 28px; background: color-mix(in srgb, var(--card) 55%, transparent); }
.lanehead { position: absolute; font-size: 30px; font-weight: 900; }
.lanehead small { font-size: 18px; color: var(--fg3); font-weight: 800; margin-left: 8px; }
.card.mini { padding: 8px 10px 8px 12px; border-radius: 12px; }
.card.mini .ttl { font-size: 14px; -webkit-line-clamp: 2; }
.card.mini .day { font-size: 11.5px; color: var(--fg3); font-weight: 800; font-variant-numeric: tabular-nums; }
.card.asset { flex-direction: column; gap: 8px; padding: 8px; }
.card.asset .thumb { width: 100%; height: 132px; border-radius: 10px; background: repeating-conic-gradient(var(--sunken) 0 25%, var(--card) 0 50%) 0 0 / 16px 16px; }
.card.asset .thumb.ph { background: color-mix(in srgb, var(--tc) 10%, var(--card)); font-size: 14px; color: var(--fg3); }
.card.asset .ttl { font-size: 13.5px; font-family: var(--mono); font-weight: 700; -webkit-line-clamp: 1; }
.card.asset .meta { flex-wrap: wrap; gap: 4px; }
.card.asset .used { font-size: 11.5px; color: var(--fg3); font-weight: 700; }
.card.emo .thumb { width: 56px; height: 56px; }
.card.emo .sub { font-style: italic; }

/* ---------------------------------------------------------------- drawer */
#drawer {
  position: absolute; z-index: 8; background: var(--raised); box-shadow: 0 -8px 40px rgba(0, 0, 0, .18);
  display: flex; flex-direction: column; overflow: hidden;
  left: 0; right: 0; bottom: 0; height: 64%; border-radius: 26px 26px 0 0;
  transition: transform .32s cubic-bezier(.2, .9, .25, 1), height .28s ease;
}
#drawer.tall { height: calc(100% - env(safe-area-inset-top, 0px) - 64px); }
#drawer[hidden] { display: none !important; }
@media (min-width: 900px) {
  #drawer, #drawer.tall { left: auto; top: calc(env(safe-area-inset-top, 0px) + 68px); bottom: 12px; right: 12px; width: 440px; height: auto; border-radius: 24px; }
  #drawer .grab, #drawer .tallbtn { display: none; }
}
#drawer .dh { flex: none; padding: 6px max(16px, env(safe-area-inset-right, 0px)) 0 max(16px, env(safe-area-inset-left, 0px)); }
.grab { width: 44px; height: 5px; border-radius: 3px; background: var(--line2); margin: 4px auto 6px; }
.dtools { display: flex; gap: 8px; align-items: center; justify-content: space-between; }
.dtools .kind { font-size: 12px; font-weight: 800; text-transform: uppercase; letter-spacing: .08em; color: var(--tc); display: flex; align-items: center; gap: 8px; min-width: 0; }
.dtools .kind code { font-family: var(--mono); text-transform: none; letter-spacing: 0; color: var(--fg3); font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dtools .btns { display: flex; gap: 6px; flex: none; }
.dtools button { width: 40px; height: 40px; border-radius: 20px; border: 0; background: var(--sunken); display: grid; place-items: center; }
.dtools button svg { width: 18px; height: 18px; }
#dbody { flex: 1; overflow: auto; overscroll-behavior: contain; padding: 4px max(16px, env(safe-area-inset-right, 0px)) calc(env(safe-area-inset-bottom, 0px) + 24px) max(16px, env(safe-area-inset-left, 0px)); -webkit-user-select: text; user-select: text; }

ent","asset-pofu-rig-clean","asset-pofu-eyes-happy","asset-pofu-eyes-closed","asset-pofu-mouth-pout","asset-pofu-cheeks-puff-2"],"inspired_by":["asset-concept-pofu"],"related":["sys-wellbeing","sys-emotions","sys-face-kit","station-garden"]},"sources":[{"doc":"docs/product/game-design.md","anchor":"#11-pofu-never-dies"},{"doc":"docs/product/game-design.md","anchor":"#12-pofus-emotional-range"},{"doc":"docs/adr/0017-pofu-never-dies.md"},{"doc":"docs/brand/character.md"}],"kind":"resident","unlock":{"day":0,"rule_en":"Arrives with its station or island"},"home":"island-aycicegi","species_en":"Hamster, golden peach","images":[],"thumb":"design/art/masters/pofu-hamster-base-v1/pofu-hamster-base.png"},{"id":"char-simit","type":"character","title_tr":"Simit","title_en":"Simit, the kitten","status":"planned","horizon":"later","summary":"A honey tabby kitten who runs the simit cart and keeps the lighthouse at dusk. Loud, cheerful, sells out by noon.","notes":["The early UX prototype had a kitten neighbor concept (neighbor-kitten)."],"links":{"inspired_by":["asset-concept-kitten"],"related":["station-simit","station-lighthouse"]},"sources":[{"doc":"docs/product/game-design.md","anchor":"#8-residents-neighbors"}],"kind":"resident","unlock":{"day":9,"rule_en":"Arrives with its station or island"},"home":"island-iskele","station":"station-simit","species_en":"Kitten, honey tabby","images":[],"thumb":"design/prototypes/ux/assets/neighbor-kitten.png"},{"id":"idea-app-store","type":"idea","title_tr":"App Store sayfası","title_en":"App Store presence","status":"planned","horizon":"later","summary":"Icon, screenshots, preview video, TR and EN metadata; privacy policy, support page and a domain for universal links. Public release in Türkiye, then global.","sources":[{"doc":"docs/roadmap.md","anchor":"#phase-6-launch"}],"kind":"launch","links":{},"images":[]},{"id":"idea-baloo-font","type":"idea","title_tr":"Baloo 2 yazı tipi","title_en":"Baloo 2 with rewritten metrics","status":"cut","horizon":"maybe","summary":"Postponed: SF Pro Rounded Heavy is the stated fallback and costs nothing.","sources":[{"doc":"docs/product/decision-audit.md","anchor":"#6-what-to-cut-or-postpone"}],"kind":"design","links":{},"images":[]},{"id":"idea-camera-reps","type":"idea","title_tr":"Kamera ile şınav sayma","title_en":"Camera rep counting","status":"cut","horizon":"maybe","summary":"On-device Vision rep counting as a bonus mode; retired with Phase 3.","sources":[{"doc":"docs/roadmap.md","anchor":"#phase-3-earn-for-real-rescoped"}],"kind":"feature","links":{},"images":[]},{"id":"idea-cheek-pouch-seeds","type":"idea","title_tr":"Yanak keseleri çekirdekle dolar","title_en":"Cheek pouches fill with seeds","status":"planned","horizon":"next","summary":"Real hamsters carry sunflower seeds in their cheeks. Pofu's cheek pouches visibly puff as uncollected seeds accumulate (R1, then a little full, then stuffed), and collecting empties them with a little hop: a glanceable \"something to collect\" without a badge.","notes":["Founder, 2026-11-02, while reviewing the reaction set.","Art is two rig parts, pofu-cheeks-puff-1 and pofu-cheeks-puff-2 (batch 06); the blend is code."],"links":{"related":["char-pofu","idea-pofu-layered-rig"],"uses_asset":["asset-pofu-cheeks-puff-1","asset-pofu-cheeks-puff-2"]},"sources":[{"doc":"docs/design/art-production-plan.md","anchor":"#pofus-reactions-are-a-rig"}],"source":"founder","kind":"feature","images":[],"thumb":"design/art/masters/pofu-cheeks-puff-2/pofu-cheeks-puff-2.webp"},{"id":"idea-collapse-targets","type":"idea","title_tr":"Pofu ve PofuLive'ı birleştir","title_en":"Collapse Pofu and PofuLive","status":"planned","horizon":"next","summary":"After membership day 1, collapse the free Pofu target and PofuLive into one app target with the entitlements.","links":{"related":["sys-screen-time"]},"sources":[{"doc":"CLAUDE.md"}],"kind":"engineering","images":[]},{"id":"idea-control-center","type":"idea","title_tr":"Denetim Merkezi ve App Intents","title_en":"Control Center control and App Intents","status":"idea","horizon":"later","summary":"A Control Center control for quiet time and App Intents / Shortcuts actions.","sources":[{"doc":"docs/roadmap.md","anchor":"#phase-4-the-ecosystem"}],"kind":"feature","links":{},"images":[]},{"id":"idea-decor-spots","type":"idea","title_tr":"Serbest dekor alanları","title_en":"Free decor spots","status":"idea","horizon":"next","summary":"Besides fixed stations, islands have free spots where the player places decor from a cozy, multicultural kit. Decor is pure joy, never function.","sources":[{"doc":"docs/product/founder-input.md","anchor":"#game-direction-views-to-discuss"}],"kind":"feature","links":{},"images":[]},{"id":"idea-evening-summary","type":"idea","title_tr":"Akşam özeti bildirimi","title_en":"Evening summary notification (opt-in)","status":"idea","horizon":"later","summary":"Off by default; when on, the notification carries the whole summary and is complete without opening the app.","links":{"part_of":["sys-notifications"]},"sources":[{"doc":"docs/product/app-game-boundary.md","anchor":"#73-notification-policy"}],"kind":"feature","images":[]},{"id":"idea-feature-island-journal","type":"idea","title_tr":"Ada günlüğü","title_en":"The island journal","status":"idea","horizon":"maybe","summary":"A deterministic keepsake: each build, stage and island arrival writes one dated page with a snapshot of the island at that moment. Read in the weekly recap or from the map. The product's thesis as an artifact: \"I quit doomscrolling and built this.\" No sharing pressure, no counts of days in a row.","notes":["Snapshot rendering is code over existing art; no new generation per page."],"links":{"related":["sys-weekly-recap"]},"source":"lead-brainstorm","kind":"feature","images":[]},{"id":"idea-feature-postcard-gift","type":"idea","title_tr":"Kartpostal hediye et","title_en":"Gift a postcard to a friend","status":"idea","horizon":"maybe","summary":"Phase 5: send one of your ferry postcards to a friend through the serverless pairing; it appears on their wall with your Pofu's paw print. Cooperative, finite (one a week), never a comparison.","notes":["Requires İskele and friend pairing."],"links":{"related":["sys-weekly-recap"]},"source":"lead-brainstorm","kind":"feature","images":[]},{"id":"idea-friend-visits","type":"idea","title_tr":"Arkadaş adalarını ziyaret","title_en":"Friends visiting each other's islands","status":"idea","horizon":"later","summary":"Year one: friends visit each other's islands (ADR-0005), never compared (A8).","links":{"requires":["sys-friends"]},"sources":[{"doc":"docs/design/iteration-plan.md","anchor":"#what-it-can-become"}],"kind":"feature","images":[]},{"id":"idea-g4","type":"idea","title_tr":"G4 Ekran Süresi'ni kullanabilir miyiz?","title_en":"G4: Can we use Screen Time?","status":"planned","horizon":"now","summary":"Membership day 1: enroll, request Family Controls distribution for every bundle ID, switch to the live configuration, build to the iPhone. Check: the shield appears on Instagram.","sources":[{"doc":"docs/design/iteration-plan.md","anchor":"#stage-g-the-gate"}],"kind":"milestone","links":{},"images":[]},{"id":"idea-g5","type":"idea","title_tr":"G5 Kapı davranışı değiştiriyor mu?","title_en":"G5: Does the gate change behavior?","status":"planned","horizon":"now","summary":"A 7-day dogfood on the shield with no feature changes and a daily readout. Check: resisted share of reaches against the goal of half.","sources":[{"doc":"docs/design/iteration-plan.md","anchor":"#stage-g-the-gate"}],"kind":"milestone","links":{},"images":[]},{"id":"idea-g6","type":"idea","title_tr":"G6 Veri ne istiyor?","title_en":"G6: What does the data ask for?","status":"planned","horizon":"next","summary":"The smallest ADR-0015 slice the week shows is needed. Check: week 2's resisted share against week 1.","sources":[{"doc":"docs/design/iteration-plan.md","anchor":"#stage-g-the-gate"}],"kind":"milestone","links":{},"images":[]},{"id":"idea-gentle-mode","type":"idea","title_tr":"Nazik kişilik","title_en":"Gentle personality mode","status":"idea","horizon":"later","summary":"Settings → Pofu's personality: Playful (default) or Gentle (no sass, same warmth).","links":{"part_of":["sys-emotions"]},"sources":[{"doc":"docs/product/game-design.md","anchor":"#guardrails"}],"kind":"feature","images":[]},{"id":"idea-healthkit-earning","type":"idea","title_tr":"HealthKit ile kazanma","title_en":"HealthKit passive earning","status":"cut","horizon":"maybe","summary":"Roadmap Phase 3 \"Earn for real\": steps and workouts have no reward left after ADR-0015 (seeds come from time away).","sources":[{"doc":"docs/roadmap.md","anchor":"#phase-3-earn-for-real-rescoped"},{"doc":"docs/product/decision-audit.md","anchor":"#6-what-to-cut-or-postpone"}],"kind":"feature","links":{},"images":[]},{"id":"idea-history","type":"idea","title_tr":"Geçmiş grafikleri","title_en":"History with Swift Charts","status":"idea","horizon":"later","summary":"Today → Week: 7 days free; Plus: all. Native Swift Charts.","links":{"related":["sys-today"]},"sources":[{"doc":"docs/product/app-game-boundary.md","anchor":"#8-where-every-utility-function-lives"}],"kind":"feature","images":[]},{"id":"idea-ia-rewrite","type":"idea","title_tr":"Bilgi mimarisini yeniden yaz","title_en":"Rewrite the room-era IA and flows","status":"planned","horizon":"next","summary":"The IA and user flows are room-era (passes store, \"Fill my cheeks\"). Mark superseded, rewrite after the gate week.","sources":[{"doc":"docs/product/decision-audit.md","anchor":"#6-what-to-cut-or-postpone"},{"doc":"docs/product/app-game-boundary.md","anchor":"#1-what-is-wrong-with-the-current-plan"}],"kind":"docs","links":{},"images":[]},{"id":"idea-ios27-import","type":"idea","title_tr":"iOS 27 tek dokunuşla otomasyon","title_en":"iOS 27 one-tap automation import","status":"idea","horizon":"next","summary":"Spike the iOS 27 one-tap automation import (ADR-0013): the real fix for the Shortcuts setup failure.","sources":[{"doc":"docs/adr/0013-zero-setup-default-gate.md"},{"doc":"docs/roadmap.md","anchor":"#phase-1-the-companion-lives-pre-membership-free-account"}],"kind":"feature","links":{},"images":[]},{"id":"idea-island-ari","type":"idea","title_tr":"Arı Adası","title_en":"Bee island (pine honey)","status":"idea","horizon":"maybe","summary":"A Muğla pine-honey island. The bees visit Ayçiçeği's sunflower garden on calm afternoons, and the honey jar fills a band per calm night. Cosmetic payoff on the home island: bees drift over the garden, the garden's sunflowers turn gold. Links two islands without a second currency.","notes":["Resident idea: Petek, a round bumblebee.","Honey must stay a ritual reward, never a second currency (ADR-0015)."],"links":{"related":["sys-island-arrivals","sys-rituals"]},"source":"lead-brainstorm","kind":"island","images":[]},{"id":"idea-island-comlek","type":"idea","title_tr":"Çömlek Adası","title_en":"Pottery island","status":"idea","horizon":"maybe","summary":"An Avanos-style pottery island whose ritual is slow time made visible: each quiet hour turns the wheel a notch, and after twelve quiet hours a pot is finished and fired. Pots go on Pofu's shelf in a fixed sequence of shapes. Nothing breaks, nothing cools, nothing expires.","notes":["Resident idea: Kil, a mole who only works when it is quiet.","A second answer to \"what does quiet time look like?\" besides seeds."],"links":{"related":["sys-island-arrivals","sys-rituals"]},"source":"lead-brainstorm","kind":"island","images":[]},{"id":"idea-island-leylek","type":"idea","title_tr":"Leylek Adası","title_en":"Stork island (a migration island)","status":"idea","horizon":"maybe","summary":"A seasonal island that returns every spring and autumn with the storks that cross the Bosphorus. Ritual: during migration months a stork rests on the island after each calm night and leaves one feather; feathers line Pofu's nest, in a fixed order. It arrives for everyone, stays all year as a quiet nesting island, and the storks come back every season (A7: nothing is missed).","notes":["Resident idea: Lale, an old stork who has seen every city and tells one line about it.","Ties the archipelago to a real Turkish sky; postcards and feathers could share one wall."],"links":{"related":["sys-island-arrivals","sys-rituals"]},"source":"lead-brainstorm","kind":"island","images":[]},{"id":"idea-leagues","type":"idea","title_tr":"Ortak seriler ve haftalık ligler","title_en":"Shared streaks and weekly leagues","status":"cut","horizon":"maybe","summary":"Roadmap Phase 5 lists shared streaks and weekly leagues; they contradict A8 (no comparison) and A19.","sources":[{"doc":"docs/roadmap.md","anchor":"#phase-5-together"},{"doc":"docs/product/app-game-boundary.md","anchor":"#76-streak-ethics"}],"kind":"feature","links":{},"images":[]},{"id":"idea-living-diorama-ui","type":"idea","title_tr":"Yaşayan diorama arayüzü","title_en":"Living Diorama game screen","status":"idea","horizon":"next","summary":"UI critique 01's recommended direction for Home: state lives in the world (a seed jar for the balance, a calm lantern for the multiplier, a sunflower bed for today's skips), glass is only for actions, and one peeking native glance carries the exact numbers. Needs an ADR-0018 amendment (three world indicators, jar and lantern at W4).","notes":["Direction A (Quiet Glass) is the fallback and its structural fixes ship first.","Direction C (Cozy HUD) was rejected against game design A4, A8 and A18."],"sources":[{"doc":"docs/design/ui-critique-01.md","anchor":"#3-three-directions-for-the-game-screen"}],"kind":"design","links":{},"images":[]},{"id":"idea-milestones","type":"idea","title_tr":"Birikimli kilometre taşları","title_en":"Cumulative milestones","status":"idea","horizon":"later","summary":"Replace \"streaks and first milestones\" with milestones that only count up: 100 skips, 30 calm nights, the first island arrival.","links":{"related":["sys-guardrails"]},"sources":[{"doc":"docs/roadmap.md","anchor":"#phase-1-the-companion-lives-pre-membership-free-account"},{"doc":"docs/product/app-game-boundary.md","anchor":"#76-streak-ethics"}],"kind":"feature","images":[]},{"id":"idea-open-breath","type":"idea","title_tr":"Açık soru: 5 saniye yeter mi","title_en":"Open question: is 5 s a real pause?","status":"idea","horizon":"now","summary":"Does a 5 s breath feel like a real pause on the founder's phone, or too easy to tap through?","links":{"related":["sys-breathing-break"]},"sources":[{"doc":"docs/product/game-design.md","anchor":"#16-open-questions-for-the-founder"}],"kind":"question","images":[]},{"id":"idea-open-daily-hour","type":"idea","title_tr":"Açık soru: günlük saat","title_en":"Open question: the daily hour","status":"idea","horizon":"now","summary":"60 guarded minutes before the breathing break, for everyone by default? Recommended: yes, settable, shown as \"n / 60 min\".","links":{"related":["sys-daily-hour"]},"sources":[{"doc":"docs/product/game-design.md","anchor":"#16-open-questions-for-the-founder"}],"kind":"question","images":[]},{"id":"idea-open-game-first","type":"idea","title_tr":"Daha çok oyun, adalarda mini oyunlar","title_en":"More game, playable islands","status":"idea","horizon":"next","summary":"The founder wants Pofu to become more of a game: each island playable with its own small loop, mini-game or toy, and 5–10 minute play sessions accepted. Conflicts with the median-visit guardrail; a revised guardrail is proposed in the archipelago system doc.","sources":[{"doc":"docs/product/founder-input.md","anchor":"#game-direction-views-to-discuss"}],"kind":"question","links":{},"images":[]},{"id":"idea-open-global-markets","type":"idea","title_tr":"Türkiye önce, ama yalnız Türkiye değil","title_en":"Türkiye first, not Türkiye only","status":"idea","horizon":"later","summary":"Launch in Türkiye, then compete in Europe and the Nordics with fitting prices; the concept must let each culture find something of its own. Open question: why cute idle games do well in Asia and whether that applies to Pofu.","sources":[{"doc":"docs/product/founder-input.md","anchor":"#market"}],"kind":"question","links":{},"images":[]},{"id":"idea-open-names","type":"idea","title_tr":"Açık soru: ada ve komşu adları","title_en":"Open question: island and resident names","status":"idea","horizon":"now","summary":"Keep Ayçiçeği, İskele, Yıldız, Kaplıca, Kitap and Simit, Nane, Pamuk, Bulut?","sources":[{"doc":"docs/product/game-design.md","anchor":"#16-open-questions-for-the-founder"}],"kind":"question","links":{},"images":[]},{"id":"idea-open-quick-check","type":"idea","title_tr":"Açık soru: hızlı bakış adil mi","title_en":"Open question: is halving fair?","status":"idea","horizon":"now","summary":"3 minutes, halving and the 20-minute chain: does halving feel fair when you really did just reply to a message?","links":{"related":["sys-quick-check"]},"sources":[{"doc":"docs/product/game-design.md","anchor":"#16-open-questions-for-the-founder"}],"kind":"question","images":[]},{"id":"idea-pip-guide","type":"idea","title_tr":"PiP video kurulum rehberi","title_en":"Picture-in-picture setup video","status":"cut","horizon":"maybe","summary":"The PiP video setup guide is postponed: the iOS 27 import replaces most of it, and a better text guide covers iOS 26.","sources":[{"doc":"docs/product/decision-audit.md","anchor":"#6-what-to-cut-or-postpone"}],"kind":"feature","links":{},"images":[]},{"id":"idea-pofu-layered-rig","type":"idea","title_tr":"Katmanlı Pofu","title_en":"Pofu as a layered rig","status":"in-production","horizon":"now","summary":"Pofu's reactions are part swaps plus code motion, not full-frame painted poses: a clean plate without ears and front paws, and region edits of R1 (eyes, mouths, cheek pouches, paws, ears, matted fur) that the app composites with soft masks, so he breathes, blinks, squashes and flicks his ears between expressions.","notes":["Founder, 2026-11-02 - full-frame poses cannot be tweened and swapping them reads as a slideshow.","Pilot batch-06-pofu-rig-pilot (clean plate, happy, sleepy, sulky, full pouches), then batch-06-pofu-rig (the rest)."],"links":{"related":["char-pofu"],"uses_asset":["asset-pofu-rig-clean","asset-pofu-eyes-happy","asset-pofu-eyes-closed","asset-pofu-mouth-pout","asset-pofu-eyes-side","asset-pofu-eyes-matte","asset-pofu-mouth-open","asset-pofu-mouth-o","asset-pofu-mouth-smirk","asset-pofu-mouth-worried","asset-pofu-mouth-chew","asset-pofu-paws-seed","asset-pofu-paws-wave","asset-pofu-paws-up","asset-pofu-paws-belly","asset-pofu-ears-droop","asset-pofu-fur-matted"]},"sources":[{"doc":"docs/design/art-production-plan.md","anchor":"#pofus-reactions-are-a-rig"},{"doc":"docs/design/companion-motion.md"}],"source":"founder","kind":"design","images":[],"thumb":"design/art/masters/pofu-rig-clean/pofu-rig-clean.webp"},{"id":"idea-pofus-room","type":"idea","title_tr":"Pofu'nun odası","title_en":"Pofu's room (superseded)","status":"cut","horizon":"maybe","summary":"Pofu's room v1: animated companion, seeds, today's beads and an honor focus timer. Superseded by the island direction (ADR-0016). Its two painted room plates are still in the repo.","links":{"uses_asset":["asset-room-plate-a","asset-room-plate-b"]},"sources":[{"doc":"docs/roadmap.md","anchor":"#phase-1-the-companion-lives-pre-membership-free-account"},{"doc":"docs/adr/0016-pre-planned-idle-archipelago.md"}],"kind":"design","images":[],"thumb":"design/art/plates/room-v1/room-plate-a.png"},{"id":"idea-quiet-live-activity","type":"idea","title_tr":"Sessiz zaman için Canlı Etkinlik","title_en":"Live Activity for quiet time","status":"idea","horizon":"later","summary":"A Live Activity only while quiet time runs; year-one horizon.","sources":[{"doc":"docs/design/iteration-plan.md","anchor":"#what-it-can-become"}],"kind":"feature","links":{},"images":[]},{"id":"idea-route-regional-islands","type":"idea","title_tr":"Pazara özel adalar","title_en":"An island for each launch market","status":"idea","horizon":"maybe","summary":"When Pofu launches beyond Türkiye, each market gets one island written natively by someone from there (a Kyoto teahouse, a Lisbon tram stop), as Ayçiçeği and İskele are for Türkiye. It arrives for everyone, everywhere; the postcards already point the way.","notes":["Same rule as the Turkish lines: native, never translated."],"links":{"related":["sys-guardrails"]},"source":"lead-brainstorm","kind":"route","images":[]},{"id":"idea-route-standby","type":"idea","title_tr":"Komodinde Pofu (StandBy)","title_en":"Pofu at the bedside (StandBy)","status":"idea","horizon":"maybe","summary":"A StandBy widget that shows the sleeping island at the bedside while the phone charges: a glance that answers and never asks, and a gentle cue that the phone is down for the night. Supports A21 and the calm-night loop.","links":{"related":["sys-guardrails"]},"source":"lead-brainstorm","kind":"route","images":[]},{"id":"idea-route-watch","type":"idea","title_tr":"Bilekte nefes","title_en":"The breath on Apple Watch","status":"idea","horizon":"maybe","summary":"The breathing break and the skip on Apple Watch: when a shield appears, the watch offers \"Pofu'yla nefes al\" with a haptic breath. The watch never shows the island or seeds; it only helps say no.","notes":["Needs research on whether a shield event can reach the watch; otherwise a manual quiet-time start."],"links":{"related":["sys-guardrails"]},"source":"lead-brainstorm","kind":"route","images":[]},{"id":"idea-soundscape","type":"idea","title_tr":"Ada ses manzarası","title_en":"An ambient soundscape per island","status":"idea","horizon":"later","summary":"A soft ambient soundscape per island, off by default and offered once on the island (Mochi's radio). Specified in the sound identity: each island's mode and progression, calm opening the voicing, stems plus a runtime note composer.","links":{"part_of":["sys-sound"]},"sources":[{"doc":"docs/design/sound-identity.md","anchor":"#4-music-one-key-many-moods"},{"doc":"docs/design/iteration-plan.md","anchor":"#what-it-can-become"},{"doc":"docs/design/interaction-spec.md","anchor":"#62-sound-palette-optional-off-when-the-sounds-toggle-is-off"}],"kind":"feature","images":[]},{"id":"idea-streak-themes","type":"idea","title_tr":"Seriyle açılan temalar","title_en":"Themes unlocked by streaks","status":"cut","horizon":"maybe","summary":"Roadmap Phase 4 lists themes unlocked by streaks; it contradicts A4 and A19 (no consecutive-day counts). Rewrite as cumulative milestones or drop.","sources":[{"doc":"docs/roadmap.md","anchor":"#phase-4-the-ecosystem"},{"doc":"docs/product/app-game-boundary.md","anchor":"#76-streak-ethics"}],"kind":"feature","links":{},"images":[]},{"id":"idea-structure-bridges","type":"idea","title_tr":"Sakin gece köprüleri","title_en":"Bridges built by calm nights","status":"idea","horizon":"maybe","summary":"A structure that connects the archipelago: every 5 cumulative calm nights add one plank to a rope bridge between two islands, until the archipelago is visibly walkable. Cosmetic, cumulative, never lost (A4), and it makes the map itself a record of good nights.","notes":["Uses batch 03's bridge-east as the style seed."],"links":{"related":["island-aycicegi"]},"source":"lead-brainstorm","kind":"structure","images":[]},{"id":"idea-structure-lanterns","type":"idea","title_tr":"Yarısı fener yolu","title_en":"The half-resisted lantern path","status":"idea","horizon":"maybe","summary":"A lantern path along Ayçiçeği's edge: each week the founder's own goal is met (half of reflexive opens resisted), one lantern is lit for good. Weeks count cumulatively, never in a row; a missed week is invisible. The north-star metric becomes a place.","notes":["Must never show an unlit gap for a missed week (A19)."],"links":{"related":["island-aycicegi"]},"source":"lead-brainstorm","kind":"structure","images":[]},{"id":"idea-testflight","type":"idea","title_tr":"TestFlight arkadaş betası","title_en":"TestFlight friends beta","status":"planned","horizon":"next","summary":"Requires Apple's distribution entitlement. Unlocks Glass++ production and W7's island test.","links":{"unlocks":["sys-glass-plus"]},"sources":[{"doc":"docs/roadmap.md","anchor":"#phase-6-launch"},{"doc":"docs/design/iteration-plan.md","anchor":"#what-it-can-become"}],"kind":"launch","images":[]},{"id":"idea-trademark","type":"idea","title_tr":"Pofu marka araştırması","title_en":"Trademark search for \"Pofu\"","status":"idea","horizon":"now","summary":"Run the trademark search in TÜRKPATENT and EUIPO before the bundle IDs are used for a distribution request.","sources":[{"doc":"docs/product/decision-audit.md","anchor":"#7-top-10-actions-in-order"}],"kind":"launch","links":{},"images":[]},{"id":"idea-verified-focus","type":"idea","title_tr":"Doğrulanmış odak","title_en":"Verified focus as a calm boost","status":"idea","horizon":"later","summary":"Keep verified focus only as a calm boost (1.5× faster) and only if the founder uses focus sessions at all.","links":{"feeds":["sys-calm"]},"sources":[{"doc":"docs/product/decision-audit.md","anchor":"#6-what-to-cut-or-postpone"},{"doc":"docs/product/game-design.md","anchor":"#the-calm-multiplier-tr-huzur"}],"kind":"feature","images":[]},{"id":"idea-w1","type":"idea","title_tr":"W1 Kendi hesabımızla stil","title_en":"W1: On-style art","status":"in-production","horizon":"now","summary":"Batch 01: the first 8 images. Check: pipeline QA passes; the founder judges the phone composite \"not AI-looking\".","sources":[{"doc":"docs/design/iteration-plan.md","anchor":"#stage-w-the-world-after-two-weeks-of-daily-use"}],"kind":"milestone","links":{},"images":[]},{"id":"idea-w4","type":"idea","title_tr":"W4 Ana ekran canlı ve kısa mı?","title_en":"W4: Does Home feel alive, and stay short?","status":"planned","horizon":"next","summary":"Home with batch 01 art, native glass, Hop! landing per opening intent. Check: 60 fps idle; Pofu opens a day stay below reaches; median visit under 90 s.","sources":[{"doc":"docs/design/iteration-plan.md","anchor":"#stage-w-the-world-after-two-weeks-of-daily-use"}],"kind":"milestone","links":{},"images":[]},{"id":"idea-w5","type":"idea","title_tr":"W5 Anlar elde iyi hissettiriyor mu?","title_en":"W5: Do the key moments feel good in the hand?","status":"planned","horizon":"next","summary":"Camera springs, seed collection, level-up, haptics. Check: the founder repeats one without being asked; the visit guardrail holds.","sources":[{"doc":"docs/design/iteration-plan.md","anchor":"#stage-w-the-world-after-two-weeks-of-daily-use"}],"kind":"milestone","links":{},"images":[]},{"id":"idea-w6","type":"idea","title_tr":"W6 Tek bir ürün gibi mi?","title_en":"W6: Does the product look like one thing?","status":"planned","horizon":"later","summary":"Glass++ production: icon family with vector twins, jar and lantern, widgets, layered app icon. Check: icons named correctly at 30 pt by a stranger.","links":{"part_of":["sys-glass-plus"]},"sources":[{"doc":"docs/design/iteration-plan.md","anchor":"#stage-w-the-world-after-two-weeks-of-daily-use"}],"kind":"milestone","images":[]},{"id":"idea-w7","type":"idea","title_tr":"W7 Yeni adalar emeğe değer mi?","title_en":"W7: Do new islands earn their cost?","status":"planned","horizon":"later","summary":"Island 2 and the map, only if friends still use the gate after two weeks. Check: friends' D7 and resisted share.","links":{"unlocks":["island-iskele"]},"sources":[{"doc":"docs/design/iteration-plan.md","anchor":"#stage-w-the-world-after-two-weeks-of-daily-use"}],"kind":"milestone","images":[]},{"id":"island-aycicegi","type":"island","title_tr":"Ayçiçeği","title_en":"Sunflower (home island)","status":"in-app","horizon":"now","summary":"Pofu's sunflower home island and the calm island: seeds × calm, five stages of growth by tended days. Five stations (sunflower garden, çay ocağı, lily pond, workshop, windmill) and the residents Pofu, Mochi, Fındık and the frogs. Home shows
