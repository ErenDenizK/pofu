s art chain lives with the home island batches (batch 01 simit-1, batch 03 simit-2 to simit-5) so the chain stays in one place, although the island is postponed."],"links":{"part_of":["island-iskele"],"related":["char-simit","sys-station-production","sys-build"],"uses_asset":["asset-simit-1","asset-simit-2","asset-simit-3","asset-simit-4","asset-simit-5"]},"sources":[{"doc":"docs/product/game-design.md","anchor":"#idle-production-and-stations"},{"doc":"tools/sim/island_economy.py"},{"doc":"docs/product/game-design.md","anchor":"#7-the-archipelago"}],"unlock":{"day":9,"rule_en":"With İskele (0 days after arrival) (days ≈ tended days for a daily user)"},"levels":[{"level":1,"title_tr":"Simit dolu araba","title_en":"Cart with a pile of simit","cost":300,"rate":8.0,"asset":"asset-simit-1"},{"level":2,"title_tr":"Güneş şemsiyesi","title_en":"Sun umbrella","cost":660,"rate":12.4,"asset":"asset-simit-2"},{"level":3,"title_tr":"Simit direği","title_en":"A simit pole stacked high","cost":1452,"rate":16.8,"asset":"asset-simit-3"},{"level":4,"title_tr":"Müdavim bankı","title_en":"A bench for regulars","cost":3194,"rate":21.2,"asset":"asset-simit-4"},{"level":5,"title_tr":"Bayraklı küçük büfe","title_en":"A little kiosk with a flag","cost":7028,"rate":25.6,"asset":"asset-simit-5"}],"resident":"char-simit","opens_en":"With İskele (0 days after arrival)","images":[],"thumb":"design/art/stations/simit-2/simit-2.png"},{"id":"station-spring","type":"station","title_tr":"Kaplıca","title_en":"Hot spring","status":"planned","horizon":"later","summary":"Pamuk's hot spring, filled a ladle per quiet hour.","notes":["Opens: With Kaplıca. Level costs 1→5: 3,600 · 7,920 · 17,424 · 38,333 · 84,332 (total 151,609). Rate L1→L5: 13 → 41.6 seeds/hour before calm.","Level art and names are not designed yet; the ladder follows the same pattern (costs ×2.2, rates +55 % of base per level) and lives in the simulation."],"links":{"part_of":["island-kaplica"],"related":["char-pamuk","sys-station-production","sys-build"]},"sources":[{"doc":"docs/product/game-design.md","anchor":"#idle-production-and-stations"},{"doc":"tools/sim/island_economy.py"},{"doc":"docs/product/game-design.md","anchor":"#7-the-archipelago"}],"unlock":{"day":36,"rule_en":"With Kaplıca (days ≈ tended days for a daily user)"},"levels":[{"level":1,"title_tr":"Tasarlanmadı","title_en":"Not designed yet","cost":3600,"rate":13.0},{"level":2,"title_tr":"Tasarlanmadı","title_en":"Not designed yet","cost":7920,"rate":20.2},{"level":3,"title_tr":"Tasarlanmadı","title_en":"Not designed yet","cost":17424,"rate":27.3},{"level":4,"title_tr":"Tasarlanmadı","title_en":"Not designed yet","cost":38333,"rate":34.5},{"level":5,"title_tr":"Tasarlanmadı","title_en":"Not designed yet","cost":84332,"rate":41.6}],"resident":"char-pamuk","opens_en":"With Kaplıca","images":[]},{"id":"station-windmill","type":"station","title_tr":"Yel değirmeni","title_en":"Windmill","status":"in-production","horizon":"later","summary":"A stout windmill that grinds sunflower seeds, run by Pofu and Fındık. Its stage-5 gate and 32,796-seed top level hold the line that nobody finishes the home island before about day 40.","notes":["Opens: Stage 5 (24 tended days; terrace, left). Level costs 1→5: 1,400 · 3,080 · 6,776 · 14,907 · 32,796 (total 58,959). Rate L1→L5: 12 → 38.4 seeds/hour before calm.","Most expensive home station: 1,400 → 32,796 seeds a level."],"links":{"part_of":["island-aycicegi"],"related":["char-pofu","sys-station-production","sys-build"],"uses_asset":["asset-windmill-1","asset-windmill-2","asset-windmill-3","asset-windmill-4","asset-windmill-5"]},"sources":[{"doc":"docs/product/game-design.md","anchor":"#idle-production-and-stations"},{"doc":"tools/sim/island_economy.py"}],"unlock":{"day":24,"rule_en":"Stage 5 (24 tended days; terrace, left) (days ≈ tended days for a daily user)"},"levels":[{"level":1,"title_tr":"Taş değirmen, çıplak kanatlar","title_en":"Stone mill, four bare sails","cost":1400,"rate":12.0,"asset":"asset-windmill-1"},{"level":2,"title_tr":"Krem yelken bezleri","title_en":"Cream sail cloths","cost":3080,"rate":18.6,"asset":"asset-windmill-2"},{"level":3,"title_tr":"Çekirdek çuvalları","title_en":"Sacks of sunflower seeds","cost":6776,"rate":25.2,"asset":"asset-windmill-3"},{"level":4,"title_tr":"Başlıkta fenerler","title_en":"Lanterns along the cap","cost":14907,"rate":31.8,"asset":"asset-windmill-4"},{"level":5,"title_tr":"Bayrak ve pencere saksıları","title_en":"A flag and window boxes","cost":32796,"rate":38.4,"asset":"asset-windmill-5"}],"resident":"char-pofu","opens_en":"Stage 5 (24 tended days; terrace, left)","images":[],"thumb":"design/art/stations/windmill-5/windmill-5.png"},{"id":"station-workshop","type":"station","title_tr":"Atölye","title_en":"Workshop","status":"in-production","horizon":"later","summary":"Fındık's workshop on the back terrace. Fındık tinkers and makes the style variants.","notes":["Opens: Stage 4 (10 tended days; the back terrace). Level costs 1→5: 500 · 1,100 · 2,420 · 5,324 · 11,713 (total 21,057). Rate L1→L5: 9 → 28.8 seeds/hour before calm.","Postponed in-app by the decision audit (levels 4–5, the windmill and workshop wait), but batch 03 paints it now because art has the longest lead time."],"links":{"part_of":["island-aycicegi"],"related":["char-findik","sys-station-production","sys-build"],"uses_asset":["asset-workshop-1","asset-workshop-2","asset-workshop-3","asset-workshop-4","asset-workshop-5"]},"sources":[{"doc":"docs/product/game-design.md","anchor":"#idle-production-and-stations"},{"doc":"tools/sim/island_economy.py"}],"unlock":{"day":10,"rule_en":"Stage 4 (10 tended days; the back terrace) (days ≈ tended days for a daily user)"},"levels":[{"level":1,"title_tr":"Kulübe ve tezgâh","title_en":"Shed and workbench","cost":500,"rate":9.0,"asset":"asset-workshop-1"},{"level":2,"title_tr":"Alet duvarı","title_en":"Wall of tools","cost":1100,"rate":14.0,"asset":"asset-workshop-2"},{"level":3,"title_tr":"Dönen rüzgâr gülü","title_en":"Spinning wind vane","cost":2420,"rate":18.9,"asset":"asset-workshop-3"},{"level":4,"title_tr":"Baca","title_en":"Chimney","cost":5324,"rate":23.9,"asset":"asset-workshop-4"},{"level":5,"title_tr":"Büyük çark tabela","title_en":"Big gear sign","cost":11713,"rate":28.8,"asset":"asset-workshop-5"}],"resident":"char-findik","opens_en":"Stage 4 (10 tended days; the back terrace)","images":[],"thumb":"design/art/stations/workshop-2/workshop-2.png"},{"id":"sys-asset-harmony","type":"system","title_tr":"Görsel uyum ölçümü","title_en":"Asset harmony","status":"in-app","horizon":"now","summary":"Every world master is measured on one footing (black and white point, chroma, white balance, edge softness, detail, named materials) against the approved island, Pofu for characters, and each station level against its chain's first level. Outliers get a 0-100 score and, where colour can fix them, a correction that the art pipeline bakes into the app's sprites; edges and detail are reported for the next generation. QA scores every new take the same way at promote time.","notes":["Tool: tools/assets/harmony.py; config and manifest in design/art/harmony/; CI fails a stale manifest.","First run (2026-11-02): the çaydanlık copper turned from hue 54 to 59; station chains lost ~30 % chroma per level (cay-5 median chroma 10.9 vs L1 43.6) and are restored toward L1.","Batch 03/04 masters were baked with soft-lock and measure paler than the lock-light island; re-lock them from their raws where kept."],"links":{"related":["sys-depth-lens"]},"sources":[{"doc":"docs/design/look-dev.md"}],"group":"visual","board":{"col":9,"row":5},"images":[]},{"id":"sys-bedtime","type":"system","title_tr":"Gece","title_en":"Bedtime and the sleeping islands","status":"planned","horizon":"next","summary":"23:00–06:00: you can look, not build; calm holds unless an app opens; a calm night adds +0.2 calm, +10 wellbeing and +10 seeds. Opening Pofu shows the sleeping island and nothing new (A5, A21).","notes":["The substitute at night is sleep: Hop!'s night variant offers no minute; \"İyi geceler, Pofu\" is the primary."],"links":{"feeds":["sys-calm","sys-wellbeing"]},"sources":[{"doc":"docs/product/game-design.md","anchor":"#4-anti-addiction-rules-acceptance-criteria"},{"doc":"docs/product/app-game-boundary.md","anchor":"#95-bedtime-and-morning"}],"group":"care","board":{"col":6,"row":1},"images":[]},{"id":"sys-breathing-break","type":"system","title_tr":"Nefes molası","title_en":"The breathing break","status":"in-production","horizon":"now","summary":"The hard limit (ADR-0015). Past the daily hour, every open waits for one short breath with Pofu, started by the user's tap: 5 s (in 2, out 3), 10 s from the 4th over-limit open, never more than 10 s. \"Not now\" is always there and counts as a skip.","notes":["Copy never says \"limit\", \"blocked\" or \"penalty\": \"We've had our hour today. Breathe with me first?\"","A soft lavender room, Pofu inside a calm orb; one word at a time, no numbers, no countdown.","Never costs or earns seeds, never locks out, never applies to the emergency pass (A13, A14).","BreathRules implemented in PofuCore; the shield and Hop! still read ScreenTimeGateRules.","Simulation: the heavy scroller meets 17 breaks a day in week 1 (159 s of breathing), almost none by week 13. The breath's effect (20 % of over-limit opens end after it) is an assumption.","Risk: a 5-second tap-through that becomes muscle memory. Watch the share of over-limit opens ending in \"I'm good, skip it\" by week 2."],"links":{"requires":["sys-daily-hour"],"feeds":["sys-skip-gift"]},"sources":[{"doc":"docs/product/game-design.md","anchor":"#the-breathing-break-the-hard-limit"},{"doc":"docs/product/ux/gate-v2.md","anchor":"#65-the-breathing-break-v2-past-60-guarded-minutes"},{"doc":"docs/adr/0015-care-over-currency.md"}],"group":"gate","board":{"col":2,"row":0},"images":[]},{"id":"sys-build","type":"system","title_tr":"İnşa","title_en":"Build a level","status":"in-production","horizon":"now","summary":"Spend seeds on the next designed level of a station; the vignette pops into its new art. Five designed levels per station, each an edit of the one before; costs grow ×2.2, rates +55 % of base per level.","notes":["The build moment: the model commits on the tap; squash, swap at the deepest point, dust puffs, sparkles, \"Seviye 3!\", Pofu hops, the resident hops, .success.","Usually 0–1 builds a visit, at most about 3; the next-build card suggests the cheapest level on the island in view."],"links":{"feeds":["sys-island-arrivals"],"leads_to":["moment-build"]},"sources":[{"doc":"docs/product/game-design.md","anchor":"#idle-production-and-stations"},{"doc":"docs/design/interaction-spec.md","anchor":"#24-the-build-moment"}],"group":"economy","board":{"col":7,"row":0},"images":[]},{"id":"sys-calm","type":"system","title_tr":"Huzur","title_en":"Calm multiplier","status":"in-app","horizon":"now","summary":"×1.0 → ×2.0: +0.1 per 20 continuous calm waking minutes (×2.0 after 3 h 20 min). A quick check halves the bonus, any other open resets it, a calm night adds +0.2. Shown on the shield and Hop!'s skip screen.","notes":["Not a reset: a resisted reach, a breath that ends in \"not now\", opening Pofu, bedtime.","Verified focus would grow calm 1.5× faster (ADR-0004's bonus, re-homed); not implemented.","The chip shows a ring filling toward the next +0.1 and \"büyüyor\"; at ×2.0 it glows and says \"full\".","Week-1 → week-13 calm average (sim): heavy 1.17× → 1.51×, moderate 1.36× → 1.45×, disciplined 1.88× → 1.87×."],"links":{"feeds":["sys-station-production"],"uses_asset":["asset-icon-calm","asset-lantern-off","asset-lantern-on"]},"sources":[{"doc":"docs/product/game-design.md","anchor":"#the-calm-multiplier-tr-huzur"}],"group":"economy","board":{"col":4,"row":0},"images":[]},{"id":"sys-camera","type":"system","title_tr":"Sürekli kamera","title_en":"One continuous camera","status":"in-app","horizon":"now","summary":"Home, an island and the map are three framings of one world; a detented camera: pinch scrubs a rail 1:1 and snaps on release. The cloud pass is reserved for a new island's arrival. Reduce Motion cross-fades.","notes":["Built in PofuWorld (#49) with velocity projection and a rubber band at the ends."],"sources":[{"doc":"docs/adr/0018-visual-system-v1.md"},{"doc":"docs/design/interaction-spec.md","anchor":"#1-zoom-and-camera"}],"group":"visual","board":{"col":7,"row":4},"links":{},"images":[]},{"id":"sys-cheek-pouch","type":"system","title_tr":"Yanak keseleri","title_en":"Pofu's cheek pouches (the uncollected balance)","status":"idea","horizon":"next","summary":"Uncollected seeds live in Pofu's cheek pouches and puff them out in four steps (0, 1-7, 8-19, 20+ on Scale A); \"Topla\" empties them into the jar while Pofu presses his paws to his cheeks. At step 3 he may say \"Yanaklarım kocaman oldu!\" once a day. Island game rounds pay into the pouch too.","notes":["Founder idea, 2026-11-02: \"yanaklarım kocaman oldu\".","Pouch shader for in-betweens; painted edits 3e (cheeks full) and new 3h (cheeks huge) anchor the ends.","Never on the shield, in a notification or on a small widget; cap the visible step at 2 outside visits if it drives opens."],"links":{"related":["sys-seeds","sys-face-kit","sys-ui-hybrid"]},"sources":[{"doc":"docs/design/ui-system-v2.md","anchor":"#521-the-cheek-pouch-the-founders-yanaklarım-kocaman-oldu"}],"source":"founder","group":"character","board":{"col":5,"row":4},"images":[]},{"id":"sys-daily-hour","type":"system","title_tr":"Günlük saat","title_en":"The daily hour","status":"in-production","horizon":"now","summary":"60 guarded minutes a day (settable 15–180) before the breathing break. Pre-membership it sums granted pass minutes; with Screen Time a DeviceActivity event at 60 minutes. Resets at local midnight.","notes":["Shown on Home and the shield as \"n / 60 dk\"; Settings shows the count so it is never a surprise."],"links":{"leads_to":["sys-breathing-break"]},"sources":[{"doc":"docs/product/game-design.md","anchor":"#the-breathing-break-the-hard-limit"},{"doc":"docs/product/game-design.md","anchor":"#6-measuring-usage-honestly"}],"group":"gate","board":{"col":2,"row":1},"images":[]},{"id":"sys-depth-lens","type":"system","title_tr":"Derinlik merceği","title_en":"The depth lens","status":"in-app","horizon":"now","summary":"Every object has a depth; blur grows with the distance from the focus plane, by cross-fading pre-blurred variants. Shallow at Home on Pofu, a rack focus to whatever you touch. Contact shadows, baked haze, parallax.","sources":[{"doc":"docs/design/interaction-spec.md","anchor":"#121-the-lens"}],"group":"visual","board":{"col":8,"row":4},"links":{},"images":[]},{"id":"sys-emergency-pass","type":"system","title_tr":"Acil geçiş","title_en":"Emergency pass","status":"in-app","horizon":"now","summary":"A 3-minute pass on the friend rung that always works: never breathed, unchanged by every redesign, and it always resets calm.","notes":["Never an over-limit open; never breathed."],"links":{"drains":["sys-calm"]},"sources":[{"doc":"docs/product/game-design.md","anchor":"#13-mapping-to-pofucore"},{"doc":"docs/product/economy.md","anchor":"#the-emergency-pass"}],"group":"gate","board":{"col":2,"row":2},"images":[]},{"id":"sys-emotions","type":"system","title_tr":"Pofu'nun duyguları","title_en":"Pofu's emotional range","status":"planned","horizon":"next","summary":"20 emotions, each with a trigger in the loop, a line in English and one written natively in Turkish, a face recipe and a body motion. Aimed at the reach, never at the person.","notes":["Rationed: one sassy line per Hop!; never the same line twice in 7 days; at most 3 jealous or pouting moments a day; after two pouts the next reaction is kind.","No tears, no sickness props (art bible §9).","A Gentle mode: no sass, same warmth.","Respect a stated reason and a short pass: no jealousy."],"links":{"requires":["sys-face-kit"]},"sources":[{"doc":"docs/product/game-design.md","anchor":"#12-pofus-emotional-range"},{"doc":"docs/product/game-design.md","anchor":"#guardrails"}],"group":"character","board":{"col":5,"row":3},"images":[]},{"id":"sys-face-kit","type":"system","title_tr":"Yüz kiti","title_en":"The face kit","status":"planned","horizon":"next","summary":"11 pixel-aligned edits of R1 (eyes closed, eyes happy, mouth open, mouth \"o\", cheeks full, matted, half-lid, side-eye, pout mouth, worried mouth, smirk) composited by region with soft masks, so 11 images cover all 20 emotions.","notes":["The decision audit ships 5 of the 11 first."],"links":{"uses_asset":["asset-pofu-base-v1"]},"sources":[{"doc":"docs/product/game-design.md","anchor":"#the-face-kit-11-edits-of-r1"}],"group":"character","board":{"col":4,"row":3},"images":[],"thumb":"design/art/masters/pofu-hamster-base-v1/pofu-hamster-base.png"},{"id":"sys-friends","type":"system","title_tr":"Arkadaşlar","title_en":"Friends","status":"planned","horizon":"later","summary":"Serverless friend approval (ADR-0005) as a rung on the fourth rapid reach, Phase 5. Until it ships, the fourth rapid reach falls back to the breath, never to a lockout.","notes":["Friends visiting each other's islands is a year-one idea; no comparison (A8)."],"links":{"uses_asset":["asset-icon-friend"]},"sources":[{"doc":"docs/adr/0005-serverless-friend-approval.md"},{"doc":"docs/product/decision-audit.md","anchor":"#6-what-to-cut-or-postpone"}],"group":"meta","board":{"col":8,"row":2},"images":[]},{"id":"sys-glass-plus","type":"system","title_tr":"Glass++","title_en":"Glass++ visual system","status":"planned","horizon":"later","summary":"Native glass for every control; painted art only as content: a painted domain icon family (28 pt or larger, vector twins below), the seed jar and the calm lantern as world indicators, painted widgets, a layered painted app icon.","notes":["Production waits for the friends beta (ADR-0018 amendment); now native glass and SF Symbols only.","Painted icons must pass a legibility check at 24, 30 and 60 pt."],"links":{"uses_asset":["asset-icon-island","asset-icon-cay","asset-appicon-draft"]},"sources":[{"doc":"docs/adr/0018-visual-system-v1.md","anchor":"#decision"},{"doc":"docs/adr/0018-visual-system-v1.md","anchor":"#amendment-2026-11-01-timing-after-the-decision-audit"}],"group":"visual","board":{"col":9,"row":4},"images":[]},{"id":"sys-guardrails","type":"system","title_tr":"Bağımlılık karşıtı kurallar","title_en":"Anti-compulsion guardrails (A1–A22)","status":"in-production","horizon":"now","summary":"The acceptance criteria that keep the game from becoming a new feed: finite visits, no timers or caps, no game notifications, no streak loss, sleeping islands, no paid acceleration, no FOMO, no comparison, looking earns nothing, session budget, capped skips, kind emotions, seeds never touch the gate, a bounded breath, visits end, notifications serve the user, deterministic rewards, glances never ask, no consecutive-day counts, Pofu is not away, dead-end nights, Hop! opens the world only through the minute.","notes":["A1 Finite visits.","A2 No storage cap, no timers.","A3 No game notifications.","A4 No streak loss: cumulative counts only.","A5 The islands sleep 23:00–06:00.","A6 No paid acceleration, gacha or loot boxes.","A7 No FOMO: seasonal content stays.","A8 No comparison or leaderboards.","A9 Opening Pofu does nothing for production; bored on the 4th open in an hour.","A10 Session budget: median visit ≤ 90 s, p90 ≤ 3 min.","A11 Skips are barely farmable.","A12 Tease the app, never the user.","A13 Seeds never touch the gate.","A14 The breath is bounded and owned.","A15 Visits and minutes end.","A16 Notifications serve the user's own action or a real person.","A17 Every reward is deterministic.","A18 Glance surfaces answer, never ask.","A19 No consecutive-day counts anywhere.","A20 Pofu is not \"away\".","A21 Nights are a dead end.","A22 Hop! shows the world and opens it only through the minute.","Metrics computed on device, never uploaded: time in Pofu ≤ 5 min/day, visits 1–3/day, check-back rate ≤ 10 %, displacement ≤ 10 %."],"sources":[{"doc":"docs/product/game-design.md","anchor":"#4-anti-addiction-rules-acceptance-criteria"},{"doc":"docs/product/app-game-boundary.md","anchor":"#7-anti-compulsion-guardrails"}],"group":"meta","board":{"col":8,"row":3},"links":{},"images":[]},{"id":"sys-honest-measurement","type":"system","title_tr":"Dürüst ölçüm","title_en":"Honest measurement","status":"in-app","horizon":"now","summary":"The rules depend only on what we can measure, and the copy never claims more. After a pass expires under the soft gate, time is unobserved until the next sign of life; nothing that rewards absence accrues across it. The 72-hour observation window holds seeds when unobserved.","notes":["Done in G2 (#32): pass-expiry notification, post-expiry time unobserved.","With Screen Time, usage is measured at thresholds; exact per-session minutes are never visible."],"links":{"feeds":["sys-quiet-time","sys-calm","sys-station-production"]},"sources":[{"doc":"docs/product/game-design.md","anchor":"#6-measuring-usage-honestly"},{"doc":"docs/adr/0014-quiet-time-earning.md"}],"group":"care","board":{"col":0,"row":3},"images":[]},{"id":"sys-hop","type":"system","title_tr":"Hop!","title_en":"Hop!","status":"in-app","horizon":"now","summary":"Pofu's full-screen cover on the open path. Since gate v2 it lands directly on the care rung: each open row says what it does to calm and to Pofu, \"Boş ver\" is primary, and optional reason chips only change Pofu's tone.","notes":["The backdrop is the world at the Home framing, blurred and dimmed: the stake, shown and not explained.","A22: Hop! shows the world and opens it only through the minute.","Timing: notification tap to first frame ≤ 800 ms warm, ≤ 1.5 s cold; skip path ≤ 3 s.","The ladder: pause → intent → care → ask a friend on the fourth rapid reach, which falls back to the breath until friends ship."],"links":{"leads_to":["sys-the-minute","sys-quick-check","sys-breathing-break","sys-pass"],"feeds":["sys-skip-gift"],"drains":["sys-calm","sys-wellbeing"]},"sources":[{"doc":"docs/product/ux/gate-v2.md","anchor":"#61-the-landing"},{"doc":"docs/product/app-game-boundary.md","anchor":"#91-hop-while-the-user-is-in-another-app"}],"group":"gate","board":{"col":1,"row":0},"images":[]},{"id":"sys-island-arrivals","type":"system","title_tr":"Ada gelişi","title_en":"Island arrivals","status":"in-production","horizon":"later","summary":"Islands drift close with tended days, calm nights and station levels, and later with seasons. Cumulative and monotonic: every archetype gets İskele on day 9 and Yıldız on day 22. Behavior changes what you can build there, not whether the island comes.","notes":["Gating islands on calm was rejected: a heavy scroller locked out of the new island is a churn risk.","Before arrival: misty desaturated silhouettes with plain progress bars (tended days 19 / 21), no dates, no countdowns.","Arrival uses the cloud pass (ADR-0018), the only cinematic camera move."],"links":{"leads_to":["sys-rituals"]},"sources":[{"doc":"docs/product/game-design.md","anchor":"#7-the-archipelago"},{"doc":"docs/product/game-design.md","anchor":"#14-economy-simulation"}],"group":"world","board":{"col":8,"row":0},"images":[]},{"id":"sys-notifications","type":"system","title_tr":"Bildirim politikası","title_en":"Notification policy","status":"in-app","horizon":"now","summary":"Pofu may push only for the user's own action or a real person (A16): the \"Açmam lazım\" open request, a friend, one reminder after a skipped setup, an opt-in evening summary. Never seeds, builds, islands, rituals, mood or re-engagement. No badge, ever.","sources":[{"doc":"docs/product/app-game-boundary.md","anchor":"#73-notification-policy"}],"group":"app","board":{"col":7,"row":3},"links":{},"images":[]},{"id":"sys-opening-intents","type":"system","title_tr":"Açılış niyetleri","title_en":"Opening intents","status":"planned","horizon":"next","summary":"Every open of Pofu has an intent (gate, the minute, glance, visit, settled reopen, setup or repair), each with its own landing, length and exit. A glance or a repair is never forced through a visit.","notes":["Landing rules: the gate opens Hop!, a widget tap the Today sheet, the icon builds the visit queue; night opens night Home."],"links":{"leads_to":["sys-visit-queue","sys-today","sys-setup-repair"]},"sources":[{"doc":"docs/product/app-game-boundary.md","anchor":"#2-opening-intents"},{"doc":"docs/product/app-game-boundary.md","anchor":"#61-landing-rules"}],"group":"app","board":{"col":3,"row":2},"images":[]},{"id":"sys-pass","type":"system","title_tr":"Geçiş ve Canlı Etkinlik","title_en":"Pass and Live Activity","status":"in-app","horizon":"now","summary":"An open grants a pass (3 or 15 minutes). The Live Activity counts down with the vector Pofu and an \"End now\" button; when it ends the shield returns with \"Süre doldu.\" There is no pass-expiry push in the live build.","notes":["Colors never turn red and the last minute does not change color (no countdown anxiety).","Quick checks started on the shield have no Live Activity (Apple)."],"links":{"feeds":["sys-daily-hour"],"drains":["sys-station-production","sys-calm"]},"sources":[{"doc":"docs/product/ux/gate-v2.md","anchor":"#7-pass-life"}],"group":"gate","board":{"col":1,"row":2},"images":[]},{"id":"sys-plus","type":"system","title_tr":"Plus","title_en":"Plus: variety, never progress","status":"planned","horizon":"later","summary":"Plus sells extra style variants, extra residents with cosmetic stalls that produce nothing, seasonal station skins and island themes. Never seeds, calm, wellbeing, speed, time or islands.","notes":["A Plus member and a free member who behave the same have the same seeds, calm, islands and levels.","Monetization ADR and StoreKit 2 in Phase 6."],"sources":[{"doc":"docs/product/game-design.md","anchor":"#10-free-vs-plus"},{"doc":"docs/roadmap.md","anchor":"#phase-6-launch"}],"group":"meta","board":{"col":9,"row":3},"links":{},"images":[]},{"id":"sys-quick-check","type":"system","title_tr":"Hızlı bakış","title_en":"Quick check","status":"in-production","horizon":"now","summary":"A pass of 3 minutes or less. Halves the calm bonus instead of resetting it (×1.6 → ×1.3), and Pofu is not jealous. Defined by pass length, which we control, not by intent, which we cannot see.","notes":["Chained: a quick check that starts within 20 minutes of the previous one's end counts as a full open.","On the shield: \"Açmam lazım → 3 dakika bakacağım\" lifts the shield for 3 minutes, no app launch; the shield's return is its ending.","Known loophole: a determined user can live on 3-minute passes at half the calm cost; watch quick checks per day against full opens."],"links":{"drains":["sys-calm"],"feeds":["sys-daily-hour"]},"sources":[{"doc":"docs/product/game-design.md","anchor":"#the-calm-multiplier-tr-huzur"},{"doc":"docs/product/ux/gate-v2.md","anchor":"#64-the-hand-off"}],"group":"gate","board":{"col":1,"row":1},"images":[]},{"id":"sys-quiet-time","type":"system","title_tr":"Sessiz zaman","title_en":"Quiet time (Pofu's gathering)","status":"in-production","horizon":"now","summary":"Pofu gathers seeds while the phone is down: 1 seed per 10 continuous quiet waking minutes, at most 48 a day, +10 for a calm night (ADR-0014). 3–9 % of week-1 seeds.","notes":["Accrues by itself since ADR-0014; the old \"Quiet time with Pofu\" hero button is gone from Home."],"links":{"feeds":["sys-calm","sys-seeds"]},"sources":[{"doc":"docs/product/game-design.md","anchor":"#seeds-tr-çekirdek"},{"doc":"docs/adr/0014-quiet-time-earning.md"}],"group":"economy","board":{"col":3,"row":0},"images":[]},{"id":"sys-reactions","type":"system","title_tr":"Tepkiler","title_en":"Touch reactions","status":"planned","horizon":"next","summary":"Poking, petting, residents, stations and the lawn. The first touch gets the biggest response, repeats get smaller; the world gets quieter the longer you watch. No counters, combos or random rewards.","notes":["A run is touches < 2.5 s apart; response rises for 3, stays playful for 3, then calms.","Petting: long press, then stroke; 8 strokes and Pofu dozes."],"sources":[{"doc":"docs/design/interaction-spec.md","anchor":"#4-reactions"}],"group":"character","board":{"col":6,"row":4},"links":{},"images":[]},{"id":"sys-rituals","type":"system","title_tr":"Ada ritüelleri","title_en":"Island rituals","status":"planned","horizon":"later","summary":"Each island has one small ritual that uses a behavior Pofu already measures: postcards (İskele), stars (Yıldız), the warm spring (Kaplıca), Bulut's story (Kitap). At most once a day, earned by calm, never on a timer, deterministic.","notes":["Risk named in the self-critique: \"small\" may read as \"thin\". Prototype the postcard set and the constellation next."],"sources":[{"doc":"docs/product/game-design.md","anchor":"#7-the-archipelago"},{"doc":"docs/product/app-game-boundary.md","anchor":"#74-no-infinite-content-no-variable-ratio-rewards"}],"group":"world","board":{"col":9,"row":0},"links":{},"images":[]},{"id":"sys-screen-time","type":"system","title_tr":"Ekran Süresi","title_en":"Screen Time access","status":"in-app","horizon":"now","summary":"Family Controls authorization, the FamilyActivityPicker, DeviceActivity thresholds, and the shield, action and monitor extensions in the separate PofuLive target. Zero-setup onboarding (ADR-0013).","notes":["Needs the paid Apple Developer membership (expected after 2026-11-24) and Family Controls (Distribution) for each bundle ID.","After membership day 1, Pofu and PofuLive collapse into one app target with the entitlements.","Measured guarded minutes come from DeviceActivity threshold events (for example 15, 30, 45, 60)."],"links":{"feeds":["sys-honest-measurement","sys-daily-hour"]},"sources":[{"doc":"docs/product/ux/gate-v2.md","anchor":"#1-apples-constraints-researched"},{"doc":"docs/adr/0013-zero-setup-default-gate.md"},{"doc":"docs/roadmap.md","anchor":"#day-1-of-the-paid-membership"}],"group":"gate","board":{"col":0,"row":1},"images":[]},{"id":"sys-seeds","type":"system","title_tr":"Çekirdek","title_en":"Seeds","status":"in-production","horizon":"now","summary":"World material, never a currency for screen time (ADR-0015). Sunflower seeds in Pofu's cheeks and a jar by his door; a seed pill on the island and map views only, never on Home. Spent by hand on the next designed level of a station.","notes":["Sources, week 1 (sim): stations ~90 %, Pofu's gathering 3–9 %, skips 1–2 %.","Seeds/day in week 1: heavy 721, moderate 1,194, disciplined 1,778, never-opens 1,887.","A13: seeds never touch the gate; SeedsNeverBuyTimeTests on every rung.","Whole archipelago: 1,944,103 seeds, a season-long horizon.","Risk: a visible number invites optimizing; that is why the seed pill is off Home."],"links":{"feeds":["sys-build"],"uses_asset":["asset-icon-seed","asset-jar-0","asset-jar-1"]},"sources":[{"doc":"docs/product/game-design.md","anchor":"#seeds-tr-çekirdek"},{"doc":"docs/adr/0015-care-over-currency.md"}],"group":"economy","board":{"col":6,"row":0},"images":[]},{"id":"sys-setup-repair","type":"system","title_tr":"Kurulum ve onarım","title_en":"Setup and repair","status":"in-app","horizon":"now","summary":"Setup health is computed on every foreground and shown natively first: Screen Time access revoked, nothing picked, notifications off, Focus filtering, a silent shield. A native banner on Home's top band, never a push.","notes":["In the world, Pofu sits at his door looking out: an indicator, never the path."],"sources":[{"doc":"docs/product/ux/gate-v2.md","anchor":"#9-setup-health-and-repair"},{"doc":"docs/product/app-game-boundary.md","anchor":"#10-setup-and-repair-a-rule-in-the-users-words"}],"group":"app","board":{"col":6,"row":3},"links":{},"images":[]},{"id":"sys-shield","type":"system","title_tr":"Konuşan kalkan","title_en":"The speaking shield","status":"in-app","horizon":"now","summary":"With Screen Time, the gate is Apple's shield, not the app. Resisting is one tap (\"Boş ver\") with no app launch and no notification. The shield speaks: Pofu's current mood as the icon, a copy ladder by reach count, time of day, pass expiry, bedtime and the daily hour, and today's tally (\"Bugün 5 / 7 boş verdin\").","notes":["Every reach is counted, including a shield left without a tap (gate v2 decision 4).","Honest secondary button \"Açmam lazım\": \"3 dakika bakacağım\" lifts the shield on the spot; \"Pofu'yla aç\" goes to Hop! through a notification. Past the daily hour the only way through is \"Pofu'yla nefes al\".","Apple constraints: the shield cannot open Pofu; its layout and font are fixed (title, subtitle, two buttons); a Live Activity cannot start from an extension.","Built in PofuLive with three extensions (#34, gate v2 #41). Runs on device from membership day 1 (after 2026-11-24).","Title ≤ 26 chars TR; subtitle line 1 context ≤ 60 chars; line 2 the tally ≤ 32 chars."],"links":{"leads_to":["sys-hop","sys-quick-check","sys-breathing-break"],"feeds":["sys-skip-gift"],"requires":["sys-screen-time"]},"sources":[{"doc":"docs/product/ux/gate-v2.md","anchor":"#0-the-answer-in-one-page"},{"doc":"docs/product/ux/gate-v2.md","anchor":"#5-the-shield"}],"group":"gate","board":{"col":0,"row":0},"images":[]},{"id":"sys-skip-gift","type":"system","title_tr":"Vazgeçme hediyesi","title_en":"Skip gift","status":"in-production","horizon":"now","summary":"A resisted reach gives +3 seeds (at most 5 a day) and +1 wellbeing (at most 6 a day): a thank-you, never a reason to trigger the gate (A11).","notes":["1–2 % of a player's week-1 seeds.","Open question: louder (+5) or quieter?"],"links":{"feeds":["sys-seeds","sys-wellbeing"]},"sources":[{"doc":"docs/product/game-design.md","anchor":"#4-anti-addiction-rules-acceptance-criteria"},{"doc":"docs/product/game-design.md","anchor":"#16-open-questions-for-the-founder"}],"group":"care","board":{"col":3,"row":1},"images":[]},{"id":"sys-soft-gate","type":"system","title_tr":"Kısayollar kapısı","title_en":"Shortcuts soft gate","status":"in-app","horizon":"now","summary":"The pre-membership gate: a Shortcuts automation runs CheckInIntent when a guarded app opens and Pofu comes forward with Hop!. Merged as soft gate v1 (#14).","notes":["The automation never fired on the founder's phone: he searched Shortcuts for the app instead of opening the Automation tab (decision audit).","Build for the membership (founder, 2026-11-02): the free Pofu target and the Shortcuts path get no new features.","Kept for Live Pofu (ADR-0013); setup guide v2 speaks the user's rule: \"if Instagram opens, Pofu hops in\"."],"links":{"leads_to":["sys-hop"]},"sources":[{"doc":"docs/product/decision-audit.md","anchor":"#first-hand-evidence-how-the-setup-failed-founder-2026-11-01"},{"doc":"docs/product/app-game-boundary.md","anchor":"#10-setup-and-repair-a-rule-in-the-users-words"}],"group":"gate","board":{"col":0,"row":2},"images":[]},{"id":"sys-sound","type":"system","title_tr":"Ses kimliği","title_en":"Sound identity","status":"planned","horizon":"later","summary":"Sound B (founder, 2026-11-02): Pofu's tiny sounds on, island music optional. The shield and notifications are silent; AVAudioSession ambient obeys the Silent switch and mixes under the user's music. About 22 micro-sounds (synthesized, foley, and a pitched-up human performer for the vocal ones). Music in one key: every island's mode contains D major pentatonic; calm opens the voicing, wellbeing changes only density, never the harmony.","notes":["Islands: Ayçiçeği D Ionian, İskele D Mixolydian, Yıldız D Lydian, Kaplıca B Dorian, Kitap B Aeolian.","iOS path: pre-rendered stems plus a runtime note composer on AVAudioEngine; about 5 days, about 6 MB.","Proof: tools/sound/render.py renders 9 sounds and 4 seamless 30 s loops into design/sound/proof/, measured (≤ −1 dBTP, loops −20 LUFS).","Sad states, resets and errors are silent; arrival cues play once per island, ever.","Micro-sounds land with the touch reactions in stage W; the ambience follows the friends beta.","Open: who performs the vocal sounds (recommendation: the founder, in Voice Memos)."],"links":{"related":["sys-reactions","sys-island-arrivals","sys-calm","sys-wellbeing","sys-voice","idea-soundscape"]},"sources":[{"doc":"docs/design/sound-identity.md"},{"doc":"docs/design/design-language.md","anchor":"#11-haptics-and-sound"},{"doc":"docs/design/interaction-spec.md","anchor":"#62-sound-palette-optional-off-when-the-sounds-toggle-is-off"}],"group":"character","board":{"col":8,"row":1},"images":[]},{"id":"sys-station-production","type":"system","title_tr":"İstasyon üretimi","title_en":"Station production","status":"in-production","horizon":"now","summary":"Each built station makes seeds every minute while no guarded app is open (nights included), at its level's rate × calm, × 0.6 while Pofu is unwell. No cap, no deadline. About 90 % of seeds.","notes":["Why stations pause during a pass: the island visibly stops while you scroll, so the morning number is bigger because the phone was down.","A20: past 2 minutes in Pofu's foreground the world is paused too.","Rates in hundredths of a seed an hour, fractions carried (StationLedger.produceMinute)."],"links":{"feeds":["sys-seeds"]},"sources":[{"doc":"docs/product/game-design.md","anchor":"#seeds-tr-çekirdek"},{"doc":"docs/product/game-design.md","anchor":"#idle-production-and-stations"}],"group":"economy","board":{"col":5,"row":0},"images":[]},{"id":"sys-the-minute","type":"system","title_tr":"Pofu'yla bir dakika","title_en":"A minute with Pofu","status":"planned","horizon":"next","summary":"After a skip, a finite substitute for the reflex: at most 3 a day, ≤ 60 s shown by a filling ring, the visit queue or a fur-brushing care moment, and Pofu ends it: \"Bu kadar. Telefonu bırakalım mı?\" Earns nothing.","notes":["Never at night, never in a notification, never chained.","Success metric: ≥ 80 % of minutes not followed by a guarded app within 10 minutes."],"links":{"requires":["sys-visit-queue"]},"sources":[{"doc":"docs/product/app-game-boundary.md","anchor":"#33-a-minute-with-pofu-pofuyla-bir-dakika-the-substitute"}],"group":"app","board":{"col":2,"row":3},"images":[]},{"id":"sys-today","type":"system","title_tr":"Bugün","title_en":"Today card and sheet","status":"in-app","horizon":"now","summary":"Home's Today card (\"Bugün 8 / 11 boş verdin\", beads, \"en az 30 / 60 dk\") and the Today sheet: beads, guarded time in honest 15-minute steps, calm, \"Pofu'da bugün: 3 dk\", from day 3 the hardest hour.","notes":["Footer: \"Bu sayılar iPhone'dan çıkmaz.\""],"sources":[{"doc":"docs/product/ux/gate-v2.md","anchor":"#8-today-and-glance"}],"group":"glance","board":{"col":5,"row":2},"links":{},"images":[]},{"id":"sys-ui-hybrid","type":"system","title_tr":"Karma arayüz (cam + el işi)","title_en":"Hybrid UI system (glass and craft)","status":"idea","horizon":"next","summary":"Every component is Native (system Liquid Glass, SF Symbols, sheets, lists), Crafted (painted art with live text: the island game HUD, rewards, world objects, domain icons) or Drawn (code: twins, meters, the pouch shader, motion). One switch, PofuSkin (glass / crafted), changes only the material of four over-world roles (action, icon button, world tag, glance) so glass and craft can be A/B tested on the founder's iPhone and in the friends beta.","notes":["Behaviour is always native, material may be crafted, numbers are always live.","Glass legibility rules L1-L12 for the pastel world; the crafted skin doubles as the Reduce Transparency fallback.","Art list: 46 items (12 already in batch-02-ui, 34 new); pilot 14 for the Home A/B and the cheek pouch.","Needs an ADR-0018 amendment (nine points in the doc, section 7). Builds on UI critique 01's Living Diorama (idea-living-diorama-ui, PR","Prediction to falsify: crafted wins the tag and the primary, glass wins the gear, the map and the glance."],"links":{"related":["sys-glass-plus","sys-today","sys-cheek-pouch"]},"sources":[{"doc":"docs/design/ui-system-v2.md","anchor":"#2-the-principle-three-layers-and-a-switch"},{"doc":"docs/design/ui-system-v2.md","anchor":"#6-art-list-feeds-the-codex-production-queue"}],"group":"visual","board":{"col":9,"row":5},"images":[]},{"id":"sys-visit-queue","type":"system","title_tr":"Ziyaret kuyruğu","title_en":"The visit queue","status":"planned","horizon":"next","summary":"At most three beats per visit, by priority: guard broken, Pofu needs care, the away delta and collect, one piece of news, one affordable build, the weekly recap. Then the world settles: Pofu turns back to his garden and the primary button disappears.","notes":["A15: visits and minutes end. Median visit ≤ 60 s, p90 ≤ 150 s.","The settled line: \"Ada sensiz de çalışıyor.\""],"links":{"leads_to":["moment-away-delta","moment-settled"]},"sources":[{"doc":"docs/product/app-game-boundary.md","anchor":"#62-the-visit-queue"},{"doc":"docs/product/app-game-boundary.md","anchor":"#71-session-budget"}],"group":"app","board":{"col":4,"row":2},"images":[]},{"id":"sys-voice","type":"system","title_tr":"Pofu'nun sesi (replikler)","title_en":"Pofu's voice and line bank","status":"planned","horizon":"next","summary":"Personality B (founder, 2026-11-02): sweet and lightly jealous, teasing the app, never the person. A tagged line bank of 157 Turkish lines across the shield, Hop!, the minute, the island and arrivals; comedy rationed per day and decaying with the reach count; cooldowns so big jokes never repeat within 14 days; dated memes in an expiring remote line pack.","notes":["Five devices: the parenthetical self-correction, melodrama at the app, internet formats, hamster physics, Turkish daily ritual.","Budgets per day: big jokes 2 on the shield, 1 in Hop!, 1 on the island; kanka/aga 1; the parenthetical tic 3.","From the 6th reach of a day, no big jokes on the shield; first three days are a gentle introduction.","Remote pack: static, anonymous, fetched by the app (never an extension), every line expires (default 90 days).","Never-say list becomes a CI test over the bank: shame, guilt verbs, body, health claims, politics, religion, teams, exes, death, gate vocabulary.","Open: a 10-person Turkish panel rates every big joke before the friends beta (voice doc Q1)."],"links":{"related":["sys-shield","sys-hop","sys-emotions","sys-guardrails","sys-the-minute","sys-island-arrivals","sys-sound"]},"sources":[{"doc":"docs/brand/pofu-voice.md"},{"doc":"docs/product/game-design.md","anchor":"#12-pofus-emotional-range"},{"doc":"docs/product/ux/gate-v2.md","anchor":"#56-the-copy-system"}],"group":"character","board":{"col":7,"row":1},"images":[]},{"id":"sys-weekly-recap","type":"system","title_tr":"Haftalık özet","title_en":"Weekly recap","status":"planned","horizon":"next","summary":"The first visit after Sunday 18:00: skips against the goal of half, guarded minutes, Pofu's own minutes, minutes taken; a quiet Plus row at the end.","sources":[{"doc":"docs/product/app-game-boundary.md","anchor":"#94-the-first-seven-days"}],"group":"app","board":{"col":7,"row":2},"links":{},"images":[]},{"id":"sys-wellbeing","type":"system","title_tr":"Keyif","title_en":"Pofu's wellbeing","status":"in-production","horizon":"now","summary":"0–100 with a floor of 5. Drains while a guarded app is open (0.35/min, ×2 at bedtime, ×1.25 per earlier open in 3 h) and 1.5 per open; heals 5/hour while calm; a calm night +10. Bands: cozy ≥ 75, content ≥ 50, tired ≥ 25, unwell ≥ 12, curled up < 12. Shown as a soft bar and a mood word, never a number.","notes":["Sleeps it off: each night, wellbeing below 60 moves 30 % of the way back to 60.","One quiet hour lifts Pofu out of the two lowest bands (each calm minute heals 1/60 of the band's width).","Below 25 the residents stop to look after Pofu: production × 0.6.","Heavy scroller's Pofu: unwell 3 of 90 days with the band healing.","CareLedger implemented; VitalityLedger still drives the app."],"links":{"drains":["sys-station-production"]   inspired_by: "İlham verdikleri", feeds: "Besleyenler", drains: "Azaltanlar", leads_to: "Buraya götürenler", supersedes: "Yerini alanlar", related: "İlgili (gelen)" };
const ACTS = [["first-run", "İlk açılış", "Onboarding, 55 sn"], ["gate", "Kapı", "Kalkan ve Hop!"], ["visit", "Ziyaret", "En fazla üç vuruş"],
  ["day", "Gün içinde", "Bakışlar ve tepkiler"], ["night", "Gece ve sabah", "Adalar uyur"], ["arc", "Haftalar", "İlk yedi gün ve ötesi"], ["repair", "Onarım", "Kurulum sağlığı"]];
const GROUPS = { gate: "Kapı", care: "Bakım", economy: "Ekonomi", world: "Dünya", app: "Uygulama", glance: "Bakış", character: "Karakter", visual: "Görsel dil", meta: "Kurallar" };

// ------------------------------------------------------------------ helpers
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const fmt = n => Number(n).toLocaleString("tr-TR");
const thumbOf = path => THUMBS[path];
const inbound = new Map();
for (const n of DATA.nodes) for (const [e, ts] of Object.entries(n.links || {})) for (const t of ts) {
  if (!inbound.has(t)) inbound.set(t, []);
  inbound.get(t).push({ edge: e, from: n.id });
}
const usedBy = id => (inbound.get(id) || []).filter(l => l.edge === "uses_asset" || l.edge === "inspired_by" || (l.edge === "variant_of" && NODES.get(l.from)?.type === "asset"));
const isUnused = n => n.type === "asset" && n.images.length > 0 && usedBy(n.id).length === 0;

// ------------------------------------------------------------------ world building
const items = [];      // {el?, id, x, y, w, h, primary, img}
const primaryOf = new Map();
const regions = [];
let html = "";

function thumbHTML(path, cls, letter) {
  const t = path && thumbOf(path);
  if (t) return `<div class="${cls}"><img alt="" decoding="async" data-src="${esc(t.s)}"></div>`;
  return `<div class="${cls} ph" aria-hidden="true">${esc(letter || "")}</div>`;
}
function noteCount(n) {
  const k = (n.notes || []).length;
  return `<span class="nc" data-nc="${esc(n.id)}">${k ? `<span title="Doküman notları">${k} not</span>` : ""}<span class="fn" hidden><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M4 5h16v11H9l-5 4z"/></svg><b></b></span></span>`;
}
function chip(n) { return `<span class="chip st-${n.status}">${STATUS[n.status]}</span>`; }

function addItem(id, x, y, w, h, inner, cls, primary = true) {
  const k = items.length;
  items.push({ id, x, y, w, h, primary });
  if (primary && !primaryOf.has(id)) primaryOf.set(id, k);
  const n = NODES.get(id);
  html += `<div class="card ty-${n ? n.type : "asset"} ${cls || ""}" data-k="${k}" data-id="${esc(id)}" style="left:${x}px;top:${y}px;width:${w}px;height:${h}px">${inner}</div>`;
}
function genericCard(n, x, y, w = 260, h = 100, primary = true, sub) {
  const letter = (n.title_tr || "?").replace(/^Pofu: /, "").trim()[0];
  const inner = thumbHTML(n.thumb, "thumb", letter) +
    `<div class="body"><div class="ttl">${esc(n.title_tr)}</div>${sub ? `<div class="sub">${esc(sub)}</div>` : ""}<div class="meta">${chip(n)}${noteCount(n)}</div></div>`;
  addItem(n.id, x, y, w, h, inner, "", primary);
}
function region(id, label, sub, color, w, h, build) {
  regions.push({ id, label, sub, color, w, h, build });
}
const byType = t => DATA.nodes.filter(n => n.type === t);

// --- Archipelago
const ISLAND_ORDER = ["island-aycicegi", "island-iskele", "island-yildiz", "island-kaplica", "island-kitap"];
const stationsOf = isl => byType("station").filter(s => (s.links.part_of || []).includes(isl)).sort((a, b) => (a.unlock?.day ?? 0) - (b.unlock?.day ?? 0));
const ST_W = 400, ST_H = 178, GAP = 28;
function stationCard(s, x, y) {
  const lv = (s.levels || []).map(l => {
    const a = l.asset && NODES.get(l.asset);
    const p = a && a.images[0];
    const t = p && thumbOf(p);
    const cls = `lvl${t ? " has" : " ph"}${a && a.status === "cut" ? " cutl" : ""}`;
    const k = items.length;
    const body = t ? `<img alt="" decoding="async" data-src="${esc(t.s)}">` : `<span class="d">${esc(l.title_tr)}</span>`;
    return `<div class="${cls}" ${a ? `data-id="${esc(a.id)}"` : ""} title="${esc(`L${l.level} · ${l.title_tr}`)}"><span class="n">L${l.level}</span>${body}<span class="c">${fmt(l.cost)}</span></div>`;
  }).join("");
  const inner = `<div class="top">${thumbHTML(s.thumb, "thumb", s.title_tr[0])}<div class="body"><div class="ttl">${esc(s.title_tr)}</div>` +
    `<div class="sub">${esc(NODES.get(s.resident)?.title_tr || "")} · ${esc(s.opens_en || "")}</div><div class="meta">${chip(s)}${noteCount(s)}</div></div></div><div class="lvls">${lv}</div>`;
  addItem(s.id, x, y, ST_W, ST_H, inner, "station");
}
function buildArchipelago(ox, oy) {
  let x = ox + 48, y0 = oy + 190, maxH = 0;
  for (const id of ISLAND_ORDER) {
    const isl = NODES.get(id); if (!isl) continue;
    const sts = stationsOf(id);
    const cols = sts.length > 3 ? 2 : 1;
    const innerW = cols * ST_W + (cols - 1) * GAP;
    const fw = Math.max(innerW, 400) + 56;
    const rows = Math.ceil(sts.length / cols);
    const headH = 210;
    const fh = headH + 40 + rows * (ST_H + GAP) + 20;
    html += `<div class="isle${isl.status === "planned" ? " locked" : ""}" style="left:${x}px;top:${y0}px;width:${fw}px;height:${fh}px"></div>`;
    const rule = isl.unlock ? `<div class="rule">Gün <b>${isl.unlock.day}</b> · ${esc(isl.unlock.rule_en || "")}</div>` : "";
    const inner = thumbHTML(isl.thumb, "thumb", isl.title_tr[0]) +
      `<div class="body"><div class="ttl">${esc(isl.title_tr)}</div><div class="sub">${esc(isl.ritual_en || isl.summary)}</div>${rule}<div class="meta">${chip(isl)}${noteCount(isl)}</div></div>`;
    addItem(id, x + 28, y0 + 28, fw - 56, headH - 20, inner, "island");
    sts.forEach((s, i) => stationCard(s, x + 28 + (i % cols) * (ST_W + GAP), y0 + headH + 30 + Math.floor(i / cols) * (ST_H + GAP)));
    x += fw + 48; maxH = Math.max(maxH, fh);
  }
  return { w: x - ox, h: y0 - oy + maxH + 60 };
}

// --- Characters
function buildCharacters(ox, oy) {
  const res = byType("character").filter(c => c.kind !== "emotion").sort((a, b) => (a.unlock?.day ?? 99) - (b.unlock?.day ?? 99));
  const emo = byType("character").filter(c => c.kind === "emotion");
  const cols = 4, w = 300, h = 112, g = 22;
  let y = oy + 190;
  html += `<div class="colhead" style="left:${ox + 48}px;top:${y - 40}px">Komşular</div>`;
  res.forEach((c, i) => genericCard(c, ox + 48 + (i % cols) * (w + g), y + Math.floor(i / cols) * (h + g), w, h, true, c.species_en));
  y += Math.ceil(res.length / cols) * (h + g) + 70;
  html += `<div class="colhead" style="left:${ox + 48}px;top:${y - 40}px">Pofu'nun duyguları</div>`;
  emo.forEach((c, i) => {
    const inner = `<div class="body"><div class="ttl">${esc(c.title_tr.replace(/^Pofu: /, ""))}</div><div class="sub">“${esc(c.line_tr || "")}”</div><div class="meta">${chip(c)}<span class="chip hz">${HORIZON[c.horizon]}</span>${noteCount(c)}</div></div>`;
    addItem(c.id, ox + 48 + (i % cols) * (w + g), y + Math.floor(i / cols) * (h + g), w, h, inner, "emo");
  });
  y += Math.ceil(emo.length / cols) * (h + g);
  return { w: 48 * 2 + cols * w + (cols - 1) * g, h: y - oy + 40 };
}

// --- Systems map
const SYS_W = 270, SYS_H = 104, SYS_CX = 330, SYS_CY = 170;
const sysEdges = [];
function buildSystems(ox, oy) {
  const sys = byType("system");
  let maxC = 0, maxR = 0;
  const pos = new Map();
  for (const s of sys) {
    const c = s.board?.col ?? 0, r = s.board?.row ?? 0;
    const x = ox + 48 + c * SYS_CX, y = oy + 250 + r * SYS_CY;
    pos.set(s.id, { x, y });
    maxC = Math.max(maxC, c); maxR = Math.max(maxR, r);
    genericCard(s, x, y, SYS_W, SYS_H, true, GROUPS[s.group] || "");
  }
  const W = 48 * 2 + maxC * SYS_CX + SYS_W, H = 250 + maxR * SYS_CY + SYS_H + 60;
  let paths = "";
  for (const s of sys) for (const e of ["feeds", "drains", "leads_to", "requires"]) for (const t of (s.links[e] || [])) {
    if (!pos.has(t)) continue;
    const a = pos.get(s.id), b = pos.get(t);
    let x1, y1, x2, y2, d;
    if (b.x > a.x + 10) { x1 = a.x + SYS_W; y1 = a.y + SYS_H / 2; x2 = b.x; y2 = b.y + SYS_H / 2; const m = (x2 - x1) * .5; d = `M${x1},${y1} C${x1 + m},${y1} ${x2 - m},${y2} ${x2},${y2}`; }
    else if (b.x < a.x - 10) { x1 = a.x; y1 = a.y + SYS_H / 2; x2 = b.x + SYS_W; y2 = b.y + SYS_H / 2; const m = Math.max(80, (x1 - x2) * .5); d = `M${x1},${y1} C${x1 - m},${y1 - 60} ${x2 + m},${y2 - 60} ${x2},${y2}`; }
    else { const down = b.y > a.y; x1 = a.x + SYS_W / 2 + 30; y1 = down ? a.y + SYS_H : a.y; x2 = b.x + SYS_W / 2 + 30; y2 = down ? b.y : b.y + SYS_H; d = `M${x1},${y1} C${x1 + 40},${(y1 + y2) / 2} ${x2 + 40},${(y1 + y2) / 2} ${x2},${y2}`; }
    paths += `<path class="e-${e}" data-from="${esc(s.id)}" data-to="${esc(t)}" d="${d}" marker-end="url(#ah-${e})"/>`;
  }
  const marker = e => `<marker id="ah-${e}" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="e-${e}" style="fill:currentColor;stroke:none"/></marker>`;
  html += `<svg class="edges" id="sysedges" width="1" height="1"><defs>${["feeds", "drains", "leads_to", "requires"].map(marker).join("")}</defs>${paths}</svg>`;
  return { w: W, h: H };
}

// --- Storyboard
function buildStory(ox, oy) {
  const w = 270, h = 116, gx = 56, gy = 40;
  let y = oy + 190, maxX = 0;
  for (const [act, label, sub] of ACTS) {
    const ms = byType("moment").filter(m => m.act === act).sort((a, b) => a.sequence - b.sequence);
    if (!ms.length) continue;
    html += `<div class="actlabel" style="left:${ox + 48}px;top:${y + 18}px">${esc(label)}<small>${esc(sub)}</small></div>`;
    ms.forEach((m, i) => {
      const x = ox + 290 + i * (w + gx);
      genericCard(m, x, y, w, h, true, m.title_en);
      if (i) html += `<div class="arrow" style="left:${x - gx + 8}px;top:${y + h / 2}px;width:${gx - 18}px"></div>`;
      maxX = Math.max(maxX, x + w);
    });
    y += h + gy;
  }
  return { w: maxX - ox + 48, h: y - oy + 30 };
}

// --- Progression timeline
const DAYPX = 64;
function buildTimeline(ox, oy) {
  const lanes = [["island", "Adalar"], ["station", "İstasyonlar"], ["character", "Komşular"], ["moment", "Anlar"]];
  const maxDay = Math.max(...DATA.nodes.filter(n => n.unlock).map(n => n.unlock.day)) + 4;
  const x0 = ox + 290, w = 200, h = 64;
  let y = oy + 230;
  const axisY = y - 30;
  html += `<div class="axis" style="left:${x0}px;top:${axisY}px;width:${maxDay * DAYPX}px"></div>`;
  for (let d = 0; d <= maxDay; d += 7) {
    html += `<div class="ticklabel" style="left:${x0 + d * DAYPX}px;top:${axisY - 36}px">${d === 0 ? "1. gün" : d + ". gün"}</div>`;
  }
  // home island stages as a band
  const home = NODES.get("island-aycicegi");
  const tickTop = axisY;
  let tickBottom = y;
  const laneStarts = [];
  for (const [t, label] of lanes) {
    const ns = DATA.nodes.filter(n => n.type === t && n.unlock && n.kind !== "emotion").sort((a, b) => a.unlock.day - b.unlock.day);
    const rowsEnd = [];
    const placed = [];
    for (const n of ns) {
      const x = x0 + n.unlock.day * DAYPX;
      let r = rowsEnd.findIndex(e => e <= x - 8);
      if (r < 0) { r = rowsEnd.length; rowsEnd.push(0); }
      rowsEnd[r] = x + w;
      placed.push([n, x, r]);
    }
    const laneH = Math.max(1, rowsEnd.length) * (h + 12) + 24;
    html += `<div class="lane" style="left:${ox + 40}px;top:${y - 12}px;width:${x0 - ox + maxDay * DAYPX + w - 40}px;height:${laneH}px"></div>`;
    html += `<div class="actlabel" style="left:${ox + 64}px;top:${y + 8}px">${esc(label)}<small>${ns.length} öğe</small></div>`;
    for (const [n, x, r] of placed) {
      const inner = `<div class="body"><div class="day">${n.unlock.day === 0 ? "1. gün" : n.unlock.day + ". gün"}</div><div class="ttl">${esc(n.title_tr)}</div></div>`;
      addItem(n.id, x, y + r * (h + 12), w, h, inner, "mini", false);
    }
    y += laneH + 18;
  }
  // stage markers of the home island
  if (home && home.stages) {
    html += `<div class="actlabel" style="left:${ox + 64}px;top:${y + 8}px">Ayçiçeği aşamaları<small>bakılan günlerle</small></div>`;
    home.stages.forEach((s, i) => {
      const x = x0 + s.tended_days * DAYPX;
      html += `<div class="card ty-island mini" style="left:${x}px;top:${y + (i % 2) * 96}px;width:${w}px;height:84px"><div class="body"><div class="day">Aşama ${s.stage} · ${s.tended_days} gün</div><div class="sub">${esc(s.adds_en || "")}</div></div></div>`;
    });
    y += 206;
  }
  for (let d = 0; d <= maxDay; d += 7) html += `<div class="tick" style="left:${x0 + d * DAYPX}px;top:${tickTop}px;height:${y - tickTop}px;opacity:.5"></div>`;
  return { w: x0 - ox + maxDay * DAYPX + w + 60, h: y - oy + 30 };
}

// --- Themes
function buildThemes(ox, oy) {
  const ts = byType("theme");
  const cols = 3, w = 300, h = 112, g = 22;
  ts.forEach((t, i) => genericCard(t, ox + 48 + (i % cols) * (w + g), oy + 190 + Math.floor(i / cols) * (h + g), w, h, true, t.title_en));
  return { w: 96 + cols * w + (cols - 1) * g, h: 190 + Math.ceil(ts.length / cols) * (h + g) + 40 };
}

// --- Ideas board
function buildIdeas(ox, oy) {
  const ideas = byType("idea");
  const cols = 2, w = 280, h = 112, g = 18, laneW = cols * w + (cols - 1) * g + 48, lg = 36;
  let maxY = 0;
  Object.entries(HORIZON).forEach(([hz, label], li) => {
    const ns = ideas.filter(n => n.horizon === hz).sort((a, b) => (a.status === "cut") - (b.status === "cut") || (a.source ? 1 : 0) - (b.source ? 1 : 0));
    const lx = ox + 48 + li * (laneW + lg), ly = oy + 190;
    const lh = 90 + Math.ceil(ns.length / cols) * (h + g) + 20;
    html += `<div class="lane" style="left:${lx}px;top:${ly}px;width:${laneW}px;height:${lh}px"></div>`;
    html += `<div class="lanehead" style="left:${lx + 24}px;top:${ly + 24}px">${label}<small>${ns.length}</small></div>`;
    ns.forEach((n, i) => genericCard(n, lx + 24 + (i % cols) * (w + g), ly + 84 + Math.floor(i / cols) * (h + g), w, h, true,
      n.source === "lead-brainstorm" ? "Ekip önerisi · " + n.title_en : n.title_en));
    maxY = Math.max(maxY, ly + lh);
  });
  return { w: 96 + 4 * laneW + 3 * lg, h: maxY - oy + 50 };
}

// --- Asset library
function buildAssets(ox, oy) {
  const assets = byType("asset");
  const groups = new Map();
  for (const a of assets) { const b = a.batch || "unbatched"; if (!groups.has(b)) groups.set(b, []); groups.get(b).push(a); }
  const order = ["unbatched", ...[...groups.keys()].filter(k => k !== "unbatched").sort()];
  const cols = 10, w = 190, h = 230, g = 18;
  let y = oy + 200;
  for (const b of order) {
    const as = groups.get(b) || [];
    const gen = as.filter(a => a.images.length).length;
    html += `<div class="colhead" style="left:${ox + 48}px;top:${y}px">${b === "unbatched" ? "Ana görseller, testler, konseptler" : esc(b)} · ${gen}/${as.length} üretildi</div>`;
    y += 44;
    as.sort((p, q) => (q.images.length > 0) - (p.images.length > 0));
    as.forEach((a, i) => {
      const ub = usedBy(a.id);
      const flag = isUnused(a) ? `<span class="chip unused">kullanılmıyor</span>` : "";
      const inner = thumbHTML(a.images[0], "thumb", a.kind || "") +
        `<div class="body"><div class="ttl">${esc(a.title_tr)}</div><div class="meta">${chip(a)}${flag}</div><div class="used">${ub.length ? ub.length + " yerde kullanılıyor" : (a.images.length ? "" : "Henüz üretilmedi")}</div></div>`;
      addItem(a.id, ox + 48 + (i % cols) * (w + g), y + Math.floor(i / cols) * (h + g), w, h, inner, "asset");
    });
    y += Math.ceil(as.length / cols) * (h + g) + 40;
  }
  return { w: 96 + cols * w + (cols - 1) * g, h: y - oy + 20 };
}

region("arch", "Takımada", "Adalar, istasyonlar ve her istasyonun beş seviyesi. Seviye kutusuna dokun: o seviyenin görseli.", "--r-arch", 0, 0, buildArchipelago);
region("chars", "Karakterler", "Komşular ve Pofu'nun 20 duygusu.", "--r-char", 0, 0, buildCharacters);
region("systems", "Sistem haritası", "Sessiz zaman → huzur → istasyon üretimi → çekirdek → inşa. Kenarlar: besler, azaltır, götürür, gerektirir.", "--r-sys", 0, 0, buildSystems);
region("story", "Hikâye akışı", "Anlar soldan sağa: ilk açılıştan haftalara.", "--r-story", 0, 0, buildStory);
region("prog", "İlerleme", "Simülasyonun medyan günleriyle adalar, istasyonlar, komşular ve anlar.", "--r-prog", 0, 0, buildTimeline);
region("themes", "Temalar ve mevsimler", "Herkese açık mevsimler, Plus görünümleri, renk tonları.", "--r-theme", 0, 0, buildThemes);
region("ideas", "Fikir panosu", "Şimdi, Sonra, İleride, Belki. Ekip önerileri Belki şeridinde.", "--r-idea", 0, 0, buildIdeas);
region("assets", "Görsel kütüphanesi", "Üretilen her görsel ve sıradaki her iş. Kırmızı: hiçbir yerde kullanılmıyor.", "--r-asset", 0, 0, buildAssets);

// Pack regions in rows.
const LAYOUT = [["arch", "chars"], ["systems", "story"], ["prog", "themes"], ["ideas", "assets"]];
const RG = 200;
let wy = 0, worldW = 0;
for (const row of LAYOUT) {
  let wx = 0, rowH = 0;
  for (const id of row) {
    const r = regions.find(q => q.id === id);
    const start = html.length;
    const size = r.build(wx, wy);
    r.x = wx; r.y = wy; r.w = size.w; r.h = size.h;
    const frame = `<div class="region" style="left:${wx}px;top:${wy}px;width:${size.w}px;height:${size.h}px;background:var(${r.color})"><div class="rhead"><h2>${esc(r.label)}</h2><p>${esc(r.sub)}</p>${id === "systems" ? `<div class="legend"><span><i style="color:var(--ok)"></i>besler</span><span><i style="color:var(--crit);border-top-style:dotted"></i>azaltır</span><span><i style="color:var(--accent)"></i>götürür</span><span><i style="color:var(--fg3);border-top-style:dashed"></i>gerektirir</span></div>` : ""}</div></div>`;
    html = html.slice(0, start) + frame + html.slice(start);
    wx += size.w + RG; rowH = Math.max(rowH, size.h);
  }
  worldW = Math.max(worldW, wx - RG);
  wy += rowH + RG;
}
const worldH = wy - RG;
const world = $("#world");
world.style.width = worldW + "px"; world.style.height = worldH + "px";
world.innerHTML = html;
const sysSvg = document.getElementById("sysedges");
if (sysSvg) { sysSvg.setAttribute("width", worldW); sysSvg.setAttribute("height", worldH); }
const cardEls = [...world.querySelectorAll(".card[data-k]")];
for (const el of cardEls) items[+el.dataset.k].el = el;
const imgEls = [...world.querySelectorAll("img[data-src]")];
const imgPos = imgEls.map(img => { const c = img.closest(".card[data-k]"); return c ? items[+c.dataset.k] : null; });

// Region bar and far labels
const rb = $("#regionbar"), labels = $("#labels");
for (const r of regions) {
  const b = document.createElement("button");
  b.type = "button"; b.innerHTML = `<i style="background:var(${r.color});box-shadow:inset 0 0 0 1.5px var(--line2)"></i>${esc(r.label)}`;
  b.addEventListener("click", () => flyToRect(r.x, r.y, r.w, r.h));

  const th = document.getElementById("thread"); if (!th) return;

    loading: `<p class="hint">Notlar yükleniyor…</p>`,
    slow: `<p class="hint">Notlara şu an ulaşılamıyor. Bağlantı gelince kendiliğinden yenilenir.</p>`,
    error: `<p class="hint">Notlar yüklenemedi. Sayfayı yeniden açınca tekrar denenir.</p>`,
  };
  const list = noteDocs.map(d => `<div class="note${d.authorId && d.authorId === RT.me ? " mine" : ""}"><div class="who">${whoLabel(d.authorId)} · ${esc(fmtDate(d.createdAt))}</div><div class="txt">${esc(d.text)}</div></div>`).join("");
  th.innerHTML = list || (noteState === "live" ? `<p class="hint">Henüz not yok. İlk notu sen ekle.</p>` : "") + (msg[noteState] || "");
  if (list && msg[noteState] && noteState !== "loading") th.insertAdjacentHTML("beforeend", msg[noteState]);
}
function composeUI(id) {
  const wrap = document.getElementById("composeWrap"); if (!wrap) return;
  if (!RT.ready) { wrap.innerHTML = `<p class="hint">Notlar bağlanıyor…</p>`; return; }
  if (!RT.db) {
    wrap.innerHTML = `<p class="hint">Kurucu notları yalnızca Claude'da yayımlanan sayfada açılır. Bu kopyada atlası gezebilirsin.</p>`;
    return;
  }
  const readOnly = RT.canWrite === false || writeBlocked;
  wrap.innerHTML = readOnly ? `<p class="hint">Bu sayfada not yazma iznin yok; notları okuyabilirsin.</p>` :
    `<div class="compose"><label class="hint" for="ntext">Not ekle</label><textarea id="ntext" maxlength="4000" placeholder="Bu düğüm hakkında ne düşünüyorsun?"></textarea>
     <div class="acts"><button class="btn" id="nadd" type="button">Ekle</button>${RT.comments ? `<button class="btn ghost" id="ncomment" type="button">Yorum</button>` : ""}<span class="hint" id="nmsg" role="status"></span></div></div>`;
  if (readOnly && RT.comments) wrap.insertAdjacentHTML("beforeend", `<div class="compose"><div class="acts"><button class="btn ghost" id="ncomment" type="button">Yorum</button></div></div>`);
  const add = document.getElementById("nadd");
  if (add) add.addEventListener("click", async () => {
    const ta = document.getElementById("ntext"), m = document.getElementById("nmsg");
    const text = ta.value.trim(); if (!text) { m.textContent = "Önce bir şey yaz."; return; }
    add.disabled = true; m.textContent = "Kaydediliyor…";
    try {
      await RT.db.collection("notes").add({ nodeId: id, text, createdAt: new Date().toISOString(), authorId: RT.me || null });
      ta.value = ""; m.textContent = "Eklendi.";
    } catch (err) {
      if (err && err.code === "invalid_argument") { writeBlocked = true; composeUI(id); return; }
      m.textContent = err && err.code === "quota_exceeded" ? "Not kotası doldu; eski notlardan birkaçını sil." : "Kaydedilemedi. Notun burada duruyor; tekrar dene.";
    } finally { add.disabled = false; }
  });
  const cb = document.getElementById("ncomment");
  if (cb) cb.addEventListener("click", async () => {
    try { await RT.comments.openComposer({ element: drawer }); } catch {}
  });
}
function notesUI(id) {
  composeUI(id);
  if (!RT.ready) { noteState = "loading"; noteDocs = []; paintThread(); return; }
  if (!RT.db) { const th = document.getElementById("thread"); if (th) th.innerHTML = ""; return; }
  if (noteFor === id) { paintThread(); return; }
  detachNotes();
  noteFor = id; noteDocs = []; noteState = "loading"; paintThread();
  noteTimer = setTimeout(() => { if (noteState === "loading") { noteState = "slow"; paintThread(); } }, 10000);
  try {
    noteSub = RT.db.collection("notes").where("nodeId", "==", id).orderBy("createdAt", "asc").onSnapshot(snap => {
      if (noteFor !== id) return;
      noteDocs = snap.docs.map(d => d.data()).filter(Boolean);
      if (!snap.metadata.fromCache) { noteState = "live"; clearTimeout(noteTimer); }
      paintThread();
    }, () => { if (noteFor !== id) return; noteState = "error"; clearTimeout(noteTimer); paintThread(); });
  } catch { noteState = "error"; paintThread(); }
}
function paintCounts() {
  const counts = new Map();
  for (const d of RT.all.values()) if (d && d.nodeId) counts.set(d.nodeId, (counts.get(d.nodeId) || 0) + 1);
  world.querySelectorAll(".nc[data-nc]").forEach(el => {
    const c = counts.get(el.dataset.nc) || 0, fn = el.querySelector(".fn");
    fn.hidden = !c; fn.querySelector("b").textContent = c || "";
  });
}
(async () => {
  const [db, user, comments] = await Promise.all([useCap("db"), useCap("user"), useCap("comments")]);
  RT.db = db; RT.user = user; RT.comments = comments;
  if (user) {
    try { RT.me = await user.id(); } catch { RT.me = null; }
    try { RT.canWrite = await user.can("data.write"); } catch { RT.canWrite = null; }
  }
  RT.ready = true;
  if (db) {
    try {
      db.collection("notes").limit(1000).onSnapshot(snap => {
        RT.all = new Map(snap.docs.map(d => [d.id, d.data()]));
        paintCounts();
      }, () => {});
    } catch {}
  }
  if (current) notesUI(current);
})();

// ------------------------------------------------------------------ start
const startId = decodeURIComponent(location.hash.slice(1));
const r0 = regions[0];
// Start on the archipelago (the most characteristic view), not on a dot field.
(function start() {
  // The home island's frame: big enough to read on a phone, the whole archipelago on a desktop.
  const isle = world.querySelector(".isle");
  const t = innerWidth < 900 && isle ? { x: isle.offsetLeft, y: r0.y + 20, w: isle.offsetWidth, h: isle.offsetTop + isle.offsetHeight - r0.y - 20 } : r0;
  const a = visibleArea();
  const s = clampS(Math.min(a.w / (t.w + 40), a.h / (t.h + 40)));
  cam.s = s; cam.x = a.x + a.w / 2 - (t.x + t.w / 2) * s; cam.y = a.y + 12 - (t.y) * s;
  apply(); settle();
})();
if (NODES.has(startId)) openNode(startId, true);
window.__atlas = { openNode, fit, flyToRect, regions, cam, closeDrawer };
})();
